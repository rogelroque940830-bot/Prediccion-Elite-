name: Validate P0 Step 12V28 F5 Total Baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/p0-step12v28-f5-total-baseline-contract.json'
      - 'scripts/p0-step12v28-f5-total-baseline.py'
      - '.github/workflows/validate-p0-step12v28-f5-total-baseline.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scipy==1.18.0' 'scikit-learn==1.8.0'

      - name: Validate frozen V28 F5 Total contract and market boundary
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v28-f5-total-baseline-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v28-f5-total-baseline-contract.v1'
          assert c['parentEvidence']['mainBaseSha']=='7bb890b1ff7a50be1dfeb37fbd89f1d8e036cc3c'
          assert c['outcomeAcquisition']['source']=='MLB_STATS_API_SCHEDULE_HYDRATE_LINESCORE'
          assert c['outcomeAcquisition']['requiredInnings']==[1,2,3,4,5]
          assert c['outcomeAcquisition']['playByPlayFallbackAllowed'] is False
          assert c['outcomeAcquisition']['currentMetadataFallbackAllowed'] is False
          assert c['outcomeAcquisition']['maximumPerGameLinescoreFallbacks']==50
          assert c['outcomeAcquisition']['minimumOutcomeCoverageShare']==0.995
          assert c['dataBoundary']['modelFitSeason']=='2022'
          assert c['dataBoundary']['validationSeason']=='2023'
          assert c['dataBoundary']['retrospectiveEvaluationSeasons']==['2024','2025','2026_YTD']
          assert c['dataBoundary']['historicalF5PricesUsed'] is False
          f=c['features']
          assert f['featureCount']==13 and len(f['exactly'])==13 and len(set(f['exactly']))==13
          assert f['featureSearchAllowed'] is False
          assert f['postResultFeatureAdditionAllowed'] is False
          assert f['postResultFeatureRemovalAllowed'] is False
          m=c['model']
          assert m['providerMarketKey']=='totals_1st_5_innings'
          assert m['canonicalMarketType']=='F5_TOTAL'
          assert m['poissonAlpha']==1.0
          assert m['maxIter']==1000
          assert m['nb2DispersionFitOn2022Only'] is True
          assert m['fixedHalfRunLines']==[2.5,3.5,4.5,5.5,6.5]
          assert m['lineSearchAllowed'] is False
          assert m['modelSelectionAllowed'] is False
          assert m['hyperparameterSearchAllowed'] is False
          assert c['statistics']['thresholdSearchAllowed'] is False
          assert c['statistics']['postResultRuleChangeAllowed'] is False
          assert c['policy']['betEliteAllowed'] is False
          assert c['policy']['realFinancialExposure']==0
          registry=open('server/mlb-market-universe-registry.ts',encoding='utf-8').read()
          assert 'totals_1st_5_innings' in registry
          assert '["F5_TOTAL"]' in registry
          assert 'HARD_ROCK_F5_TOTAL_ML_20260701' in registry
          print('STEP12V28_F5_TOTAL_CONTRACT_LOCKED')
          PY

      - name: Syntax check V28 scorer
        run: python -m py_compile scripts/p0-step12v28-f5-total-baseline.py

      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Run V28 official F5 outcome acquisition and frozen total model
        run: |
          mkdir -p artifacts/p0-step12v28
          python scripts/p0-step12v28-f5-total-baseline.py \
            --root artifacts/p0-step12v3 \
            --contract research/p0-step12v28-f5-total-baseline-contract.json \
            --outcomes-out artifacts/p0-step12v28/f5-outcomes.json \
            --out artifacts/p0-step12v28/f5-total-baseline-report.json

      - name: Validate F5 custody, partitions, metrics, and safety boundary
        run: |
          python - <<'PY'
          import json
          o=json.load(open('artifacts/p0-step12v28/f5-outcomes.json'))
          r=json.load(open('artifacts/p0-step12v28/f5-total-baseline-report.json'))
          assert o['schemaVersion']=='courtedge-p0-step12v28-f5-outcomes.v1'
          assert o['source']=='MLB_STATS_API_SCHEDULE_HYDRATE_LINESCORE'
          assert o['policy']['labelsOnly'] is True
          assert o['policy']['sameDateOutcomeUsedAsFeature'] is False
          assert o['policy']['futureGameDataUsedAsFeature'] is False
          assert o['policy']['playByPlayFallbackUsed'] is False
          assert r['schemaVersion']=='courtedge-p0-step12v28-f5-total-baseline.v1'
          assert r['data']['canonicalSeasonRows']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          a=r['data']['outcomeAcquisition']
          assert a['canonicalGames']==11407
          assert a['coverageShare']>=0.995
          assert a['perGameLinescoreFallbackRequests']<=50
          assert a['conflictingDuplicateApiObservations']==0
          assert r['data']['featureCount']==13
          assert r['model']['providerMarketKey']=='totals_1st_5_innings'
          assert r['model']['canonicalMarketType']=='F5_TOTAL'
          assert r['model']['trainingSeason']=='2022'
          assert r['model']['fixedHalfRunLines']==[2.5,3.5,4.5,5.5,6.5]
          assert r['model']['featureSearchUsed'] is False
          assert r['model']['modelSearchUsed'] is False
          assert r['model']['hyperparameterSearchUsed'] is False
          assert r['model']['lineSearchUsed'] is False
          assert r['validation2023']['rows']>2300
          assert r['evaluation2024_2026Ytd']['rows']>6400
          assert set(r['bySeasonDescriptiveOnly'])=={'2023','2024','2025','2026_YTD'}
          mb=r['marketBoundary']
          assert mb['historicalF5PricesUsed'] is False
          assert mb['positiveEvEstablished'] is False
          assert mb['shadowPriceCaptureAuthorized'] is False
          assert mb['productionPromotionAuthorized'] is False
          p=r['policy']
          assert p['sameDateOutcomeLeakageAllowed'] is False
          assert p['futureGameDataAllowed'] is False
          assert p['featureSearchUsed'] is False
          assert p['modelSearchUsed'] is False
          assert p['hyperparameterSearchUsed'] is False
          assert p['lineSearchUsed'] is False
          assert p['thresholdSearchUsed'] is False
          assert p['postResultRuleChangeUsed'] is False
          assert p['liveLookupAuthorizationChanged'] is False
          assert p['liveMarketDiscoveryChanged'] is False
          assert p['rankingChanged'] is False
          assert p['stakeChanged'] is False
          assert p['betEliteAllowed'] is False
          assert p['automaticBetPlacementAllowed'] is False
          assert p['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'candidateRubricPassed':r['candidateRubricPassed'],
            'outcomeAcquisition':a,
            'validation2023':r['validation2023'],
            'evaluation2024_2026Ytd':r['evaluation2024_2026Ytd'],
            'bySeason':r['bySeasonDescriptiveOnly'],
            'candidateRubricChecks':r['candidateRubricChecks'],
            'volumeDiagnostics':r['volumeDiagnostics'],
          },indent=2))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Preserve F5 market and certified FULL13 regressions
        run: |
          npm ci
          npx tsx --test \
            server/mlb-full13-live-feature-builder.test.ts \
            server/mlb-market-universe-registry.test.ts \
            server/mlb-market-odds-normalizer.test.ts
          npm run build:backend

      - name: Upload V28 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v28-f5-total-baseline
          path: artifacts/p0-step12v28/
          if-no-files-found: error
          retention-days: 30
