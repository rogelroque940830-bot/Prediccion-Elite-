name: Validate P1-M6A3B2C1 Historical Pregame Lineups

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-market-pregame-lineup-history.ts'
      - 'server/mlb-market-pregame-lineup-history.test.ts'
      - 'docs/P1_M6A3B2C1_MLB_HISTORICAL_PREGAME_LINEUPS.md'
      - 'tsconfig.p1-m6a3b2c1-pregame-lineups.json'
      - '.github/workflows/validate-p1-m6a3b2c1-historical-pregame-lineups.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-m6a3b2c1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned B2C1 source surface
        run: npx tsc -p tsconfig.p1-m6a3b2c1-pregame-lineups.json
      - name: Run historical pregame lineup falsification tests
        run: npx tsx --test server/mlb-market-pregame-lineup-history.test.ts
      - name: Preserve upstream historical and readiness contracts
        run: |
          npx tsx --test \
            server/mlb-market-historical-source.test.ts \
            server/mlb-market-historical-dataset.test.ts \
            server/mlb-p1-pregame-readiness.test.ts
      - name: Preserve ledger, backend and shadow regressions
        run: |
          npm run test:mlb-ledger
          npm run test:s3-modularization
          npm run build:backend
          npm run test:s5a-e2e
          npm run test:s5b-shadow
      - name: Verify no-lookahead, rescheduled and suspended identity boundaries
        shell: bash
        run: |
          set -euo pipefail
          source='server/mlb-market-pregame-lineup-history.ts'
          docs='docs/P1_M6A3B2C1_MLB_HISTORICAL_PREGAME_LINEUPS.md'
          grep -F 'statsapi.mlb.com-v1.1-timecode-pregame-lineup.v4' "$source"
          grep -F 'MLB_P1_M6A3B2C1_DEFAULT_CUTOFF_SECONDS = 300' "$source"
          grep -F 'feed/live?timecode=' "$source"
          grep -F 'Date.parse(cutoffAt) < startMs' "$source"
          grep -F 'sourceTimecodeAtOrBeforeRequested' "$source"
          grep -F 'sourceMetadataTimecode <= requestedTimecode' "$source"
          grep -F 'TIMECODE_NOT_AT_OR_BEFORE_CUTOFF' "$source" "$docs"
          grep -F '["I", "F", "O"].includes(coded)' "$source"
          grep -F 'order.length === 9' "$source"
          grep -F 'RESCHEDULED_FINAL_SELECTED' "$source" "$docs"
          grep -F 'SUSPENDED_ORIGINAL_START_SELECTED' "$source" "$docs"
          grep -F 'resolveSuspendedOriginalCandidate' "$source"
          grep -F 'original.resumeDate !== continuation.scheduledStart' "$source"
          grep -F 'continuation.resumedFrom !== original.scheduledStart' "$source"
          grep -F 'resumeDate: validIsoInstant(game?.resumeDate)' "$source"
          grep -F 'resumedFrom: validIsoInstant(game?.resumedFrom)' "$source"
          grep -F 'isPlayedFinalScheduleCandidate' "$source"
          grep -F 'isExplicitlyObsoleteScheduleCandidate' "$source"
          grep -F 'P1_M6A3B2C1_SCHEDULE_IDENTITY_CONFLICT' "$source" "$docs"
          grep -F 'scheduleResolutionCounts' "$source"
          grep -F 'IDENTITY_CONFLICT' "$source"
          grep -F 'NOT_PREGAME_AT_CUTOFF' "$source"
          grep -F 'lineupHistoryDigest' "$source"
          grep -F 'sourceProvenanceDigest' "$source"
          grep -Fi 'never replaced with a final lineup' "$docs"
          grep -Fi 'original first-pitch start' "$docs"
          grep -F 'actionabilityAllowed: false' "$source"
          grep -F 'automaticModelSelectionAllowed: false' "$source"
          grep -F 'automaticPromotionAllowed: false' "$source"
          ! grep -E 'appendPrediction\(|appendSettlement\(|automaticBetPlacement:[[:space:]]*true|actionabilityAllowed:[[:space:]]*true|automaticModelSelectionAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]|register[A-Za-z]*Routes\(' "$source"
      - name: Verify bounded B2C1 maintenance scope from PR base to PR head
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ -z "$base" || -z "$head" ]]; then
            git fetch origin integration/p0-staging-secure --depth=1
            base='origin/integration/p0-staging-secure'
            head='HEAD'
          fi
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          [[ -n "$changed" ]]
          allowed=$(printf '%s\n' \
            '.github/workflows/validate-p1-m6a3b2c1-historical-pregame-lineups.yml' \
            'docs/P1_M6A3B2C1_MLB_HISTORICAL_PREGAME_LINEUPS.md' \
            'server/mlb-market-pregame-lineup-history.test.ts' \
            'server/mlb-market-pregame-lineup-history.ts' \
            'tsconfig.p1-m6a3b2c1-pregame-lineups.json' | sort)
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            grep -Fxq "$file" <<< "$allowed"
          done <<< "$changed"
          source_changed=$(grep -Fx 'server/mlb-market-pregame-lineup-history.ts' <<< "$changed" || true)
          test_changed=$(grep -Fx 'server/mlb-market-pregame-lineup-history.test.ts' <<< "$changed" || true)
          if [[ -n "$source_changed" && -z "$test_changed" ]] || [[ -z "$source_changed" && -n "$test_changed" ]]; then
            echo 'B2C1 source and falsification test must change together' >&2
            exit 1
          fi
