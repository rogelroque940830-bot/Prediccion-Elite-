name: Validate P0 Step 12R 2021 Loss Invalidator Preflight

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'research/p0-step12r-loss-invalidators-frozen.json'
      - 'scripts/p0-step12h-t5-starter-identity-audit.mjs'
      - '.github/workflows/validate-p0-step12r-2021-loss-invalidator-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-2021-loss-invalidators:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Validate Step 12R freeze before 2021 access
        run: |
          python - <<'PY'
          import json
          p='research/p0-step12r-loss-invalidators-frozen.json'
          with open(p,encoding='utf-8') as f:m=json.load(f)
          assert m['schemaVersion']=='courtedge-p0-step12r-loss-invalidators-frozen.v1'
          assert len(m['invalidatorHypotheses'])==3
          assert m['externalReplicationPolicy']['reservedSeason']==2021
          assert m['externalReplicationPolicy']['preflightMustNotEvaluateInvalidatorOutcomes'] is True
          assert m['externalReplicationPolicy']['thresholdRetuningAfterFreezeAllowed'] is False
          assert m['externalReplicationPolicy']['newInvalidatorSearchIn2021Allowed'] is False
          assert m['externalReplicationPolicy']['liveFilterChangeAllowed'] is False
          assert m['externalReplicationPolicy']['betEliteAllowed'] is False
          print('STEP12R_2021_INVALIDATOR_FREEZE_OK')
          PY
      - name: Syntax-check T-5 audit surface
        run: node --check scripts/p0-step12h-t5-starter-identity-audit.mjs
      - name: Audit untouched 2021 T-5 data availability only
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2021-03-01 --end 2021-10-04 --concurrency 6
          --out artifacts/p0-step12r/2021-preflight
      - name: Validate 2021 preflight without invalidator scoring
        run: |
          python - <<'PY'
          import json
          p='artifacts/p0-step12r/2021-preflight/t5-starter-identity-audit.json'
          with open(p,encoding='utf-8') as f:r=json.load(f)
          assert r['schemaVersion']=='courtedge-p0-step12h-t5-starter-identity-audit.v1'
          assert r['evidenceStatus']=='DIAGNOSTIC_ONLY_NO_PROMOTION'
          assert r['interpretation']['thresholdRetuningAllowed'] is False
          assert r['interpretation']['canProduceBetElite'] is False
          assert r['counts']['validPregameSnapshots']>0
          assert r['counts']['bothProbableCoveragePct']>=95.0
          assert r['counts']['completeLineupAndBothProbablesPct']>=95.0
          print({'ok':True,'counts':r['counts'],'invalidatorOutcomesEvaluated':False})
          PY
      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload 2021 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12r-2021-loss-invalidator-preflight
          path: artifacts/p0-step12r/
          if-no-files-found: error
          retention-days: 30
