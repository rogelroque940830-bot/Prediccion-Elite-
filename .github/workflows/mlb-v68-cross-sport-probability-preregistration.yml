name: MLB V68 Cross-Sport Probability Preregistration

on:
  push:
    branches:
      - research/mlb-v68-cross-sport-probability-contract-v1
    paths:
      - "research/MLB_V68_CROSS_SPORT_PROBABILITY_QUALIFICATION_CONTRACT.json"
      - "research/mlb/mlb_v68_cross_sport_probability_qualification.py"
      - ".github/workflows/mlb-v68-cross-sport-probability-preregistration.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: research/MLB_V68_CROSS_SPORT_PROBABILITY_QUALIFICATION_CONTRACT.json
  EVALUATOR: research/mlb/mlb_v68_cross_sport_probability_qualification.py
  PARENT_CONTRACT: research/p0-step12v68-fg-winner-prospective-confirmation-contract.json
  PARENT_EVALUATOR: scripts/p0-step12v68-fg-winner-prospective-evaluate.py

jobs:
  validate-preregistration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout preregistration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.4.2" "scipy==1.17.0"

      - name: Prove cross-sport contract predates evaluator
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- "$CONTRACT" | tail -1)"
          EVALUATOR_ADD="$(git log --diff-filter=A --format=%H -- "$EVALUATOR" | tail -1)"
          test "$CONTRACT_ADD" = "6e0eda9de334c1a46a668b69fbe53d66afd8cb1f"
          test "$EVALUATOR_ADD" = "3a7b09cfc2be89236ff70aca2d2a5c4fb9218bf6"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$EVALUATOR_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/MLB_V68_CROSS_SPORT_PROBABILITY_QUALIFICATION_CONTRACT.json'))
          assert c['schemaVersion']=='courtedge-mlb-v68-cross-sport-probability-qualification-contract.v1'
          assert c['frozenBeforeAnyV68ProspectiveOutcomeScoring'] is True
          assert c['frozenBeforeCrossSportQualificationEvaluator'] is True
          assert c['crossSportSemantic']['marketConcept']=='FULL_GAME_WINNER_ONLY'
          assert c['crossSportSemantic']['first5Excluded'] is True
          assert c['frozenProbabilityMapping']['freeParameters']==0
          assert c['originalV68ProspectivePassPrerequisite']['required'] is True
          assert c['absoluteCrossSportProbabilityGates']['minimumEvidence']['canonicalGames']==500
          assert c['absoluteCrossSportProbabilityGates']['minimumEvidence']['distinctOfficialDates']==30
          assert c['absoluteCrossSportProbabilityGates']['calibrationInTheLarge']['twoSidedCriticalAbsZ']==1.959963984540054
          assert c['absoluteCrossSportProbabilityGates']['identityAffineLikelihoodRatio']['rejectIdentityIfPValueBelow']==0.05
          assert c['absoluteCrossSportProbabilityGates']['preExistingV68CalibrationGates']['combinedEce10Max']==0.02
          assert c['absoluteCrossSportProbabilityGates']['preExistingV68CalibrationGates']['combinedAbsoluteMeanProbabilityGapMax']==0.02
          assert c['safety']['prospectiveOutcomesRead'] is False
          print('MLB_V68_CROSS_SPORT_PREREGISTRATION_FREEZE_PROVED')
          PY

      - name: Syntax check future evaluator
        run: python -m py_compile "$EVALUATOR"

      - name: Prove absent final V68 evaluation blocks before capture or outcomes are opened
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work && mkdir -p work
          test ! -e work/DO_NOT_OPEN_CAPTURE.json
          test ! -e work/DO_NOT_OPEN_OUTCOMES.json
          test ! -e work/ABSENT_FINAL_EVALUATION.json
          python "$EVALUATOR" \
            --contract "$CONTRACT" \
            --parent-contract "$PARENT_CONTRACT" \
            --parent-evaluator "$PARENT_EVALUATOR" \
            --capture work/DO_NOT_OPEN_CAPTURE.json \
            --outcomes work/DO_NOT_OPEN_OUTCOMES.json \
            --v68-final-evaluation work/ABSENT_FINAL_EVALUATION.json \
            --out work/blocked.json
          python - <<'PY'
          import json
          x=json.load(open('work/blocked.json'))
          assert x['classification']=='MLB_V68_CROSS_SPORT_QUALIFICATION_BLOCKED_BY_PROSPECTIVE_EMBARGO'
          assert x['outcomesReadByCrossSportEvaluator'] is False
          assert x['crossSportMlbFullGameCandidateAuthorized'] is False
          assert x['globalEliteRankerStillBlocked'] is True
          print('MLB_V68_ABSENT_FINAL_EVAL_EMBARGO_BOUNDARY_PROVED')
          PY

      - name: Prove failed original V68 prerequisite returns before capture or outcomes are opened
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x={
            'schemaVersion':'courtedge-p0-step12v68-fg-winner-prospective-evaluation.v1',
            'classification':'V68_FULL_GAME_WINNER_NOT_PROSPECTIVELY_CONFIRMED',
            'scientificStatus':'SINGLE_PROSPECTIVE_EVALUATION_COMPLETED_AFTER_FROZEN_EMBARGO',
            'passed':False,
            'captureMaturity':{'canonicalGames':500,'distinctOfficialDates':30},
            'promotionChecks':{
              'prospectiveLogLossImprovementPositive':False,
              'prospectiveBrierImprovementPositive':False,
              'bootstrapLogLoss95CiLowerBoundPositive':False,
              'bootstrapBrier95CiLowerBoundPositive':False,
              'v68Ece10Le002':True,
              'v68AbsoluteMeanProbabilityGapLe002':True,
              'noCaptureChronologyViolations':True,
              'noModelOrFeatureDriftFromFrozenSnapshot':True
            }
          }
          json.dump(x,open('work/synthetic-failed-parent.json','w'))
          PY
          python "$EVALUATOR" \
            --contract "$CONTRACT" \
            --parent-contract "$PARENT_CONTRACT" \
            --parent-evaluator "$PARENT_EVALUATOR" \
            --capture work/DO_NOT_OPEN_CAPTURE.json \
            --outcomes work/DO_NOT_OPEN_OUTCOMES.json \
            --v68-final-evaluation work/synthetic-failed-parent.json \
            --out work/prerequisite-fail.json
          python - <<'PY'
          import json
          x=json.load(open('work/prerequisite-fail.json'))
          assert x['classification']=='MLB_V68_FULL_GAME_SELECTED_SIDE_PROBABILITY_NOT_QUALIFIED_FOR_CROSS_SPORT_USE'
          assert x['scientificStatus']=='ORIGINAL_V68_PROSPECTIVE_PREREQUISITE_FAILED_NO_SECOND_OUTCOME_PASS_PERFORMED'
          assert x['outcomesReadByCrossSportEvaluator'] is False
          assert x['crossSportMlbFullGameCandidateAuthorized'] is False
          assert x['globalEliteRankerStillBlocked'] is True
          print('MLB_V68_FAILED_PARENT_NO_SECOND_OUTCOME_PASS_PROVED')
          PY

      - name: Prove no hidden execution path was added
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          c=Path('research/MLB_V68_CROSS_SPORT_PROBABILITY_QUALIFICATION_CONTRACT.json').read_text()
          t=Path('research/mlb/mlb_v68_cross_sport_probability_qualification.py').read_text()
          assert 'automaticBetPlacement": false' in c
          assert 'realFinancialExposure": 0' in c
          assert 'historicalHitRateMayReplaceProbability": false' in c
          assert 'newCalibrationTransformAllowed": false' in c
          assert 'diagnosticAffineAlternativeUsedForPrediction": False' in t
          assert 'historicalHitRateUsedAsProbability": False' in t
          assert 'realFinancialExposure": 0' in t
          forbidden=['requests','urllib.request','statsapi.mlb.com','the-odds-api','THE_ODDS_API']
          found=[x for x in forbidden if x in t]
          assert not found, found
          print('MLB_V68_FUTURE_EVALUATOR_OFFLINE_READ_ONLY_BOUNDARY_PROVED')
          PY

      - name: Upload preregistration validation receipt
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v68-cross-sport-probability-preregistration
          path: |
            work/blocked.json
            work/prerequisite-fail.json
          if-no-files-found: error
          retention-days: 90
