name: Temporary P1-M4C Frontend Patcher

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/scripts/tmp_p1_m4c_frontend_patch.py'
      - '.github/workflows/tmp-p1-m4c-frontend-patcher.yml'
      - 'frontend/client/src/lib/mlb-economic-decision.ts'
      - 'frontend/client/src/components/mlb-economic-decision-card.tsx'
      - 'docs/P1_M4C_MLB_ECONOMIC_DECISION_CARD.md'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/p1-m4c-frontend-economic-card'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic frontend patch
        run: python .github/scripts/tmp_p1_m4c_frontend_patch.py
      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/mlb-scientific-capture-status.tsx' \
            'frontend/client/src/lib/mlb-scientific-capture.ts' | sort)
          [[ "$changed" == "$expected" ]]
          grep -F 'parseMlbEconomicAdapterResult' frontend/client/src/lib/mlb-scientific-capture.ts
          grep -F 'MlbEconomicDecisionCard decision={state.economicDecision}' frontend/client/src/components/mlb-scientific-capture-status.tsx
          grep -F 'MLB_P1_M4C_FRONTEND_RELEASE' frontend/client/src/App.tsx
      - name: Commit patched product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/App.tsx frontend/client/src/components/mlb-scientific-capture-status.tsx frontend/client/src/lib/mlb-scientific-capture.ts
          git commit -m 'P1-M4C: render authenticated MLB economic decision'
          git push origin HEAD:${GITHUB_HEAD_REF}
