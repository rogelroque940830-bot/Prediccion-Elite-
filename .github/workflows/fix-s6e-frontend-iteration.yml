name: Fix S6E Frontend Iteration

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - scripts/fix-s6e-frontend-iteration.mjs
      - .github/workflows/fix-s6e-frontend-iteration.yml

permissions:
  contents: write

jobs:
  fix-s6e-frontend:
    if: github.head_ref == 'feature/s6e-wnba-evaluation-emission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: node scripts/fix-s6e-frontend-iteration.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/lib/wnba-shadow-emission.ts
          git commit -m "S6E: support frontend NodeList target"
          git push origin HEAD:${{ github.head_ref }}
