name: Validate P0 Step 12V71 Operational Start Window TOP1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v71-operational-start-window-top1-contract.json'
      - 'scripts/p0-step12v71-operational-start-window-top1.py'
      - '.github/workflows/validate-p0-step12v71-operational-start-window-top1.yml'

permissions:
  contents: read
  actions: read

jobs:
  operational-start-window-top1:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis dependency
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6'

      - name: Prove V71 contract predates scorer
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- research/p0-step12v71-operational-start-window-top1-contract.json | tail -1)"
          SCORER_ADD="$(git log --diff-filter=A --format=%H -- scripts/p0-step12v71-operational-start-window-top1.py | tail -1)"
          test -n "$CONTRACT_ADD"
          test -n "$SCORER_ADD"
          test "$CONTRACT_ADD" != "$SCORER_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SCORER_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v71-operational-start-window-top1-contract.json'))
          assert c['scientificStatus']=='FROZEN_OPERATIONAL_START_WINDOW_TOP1_AUDIT_BEFORE_ANY_V71_SCORER_EXISTS'
          assert c['frozenPortfolioExactly']=='CONFLUENCE_LEDGER_TOP1_T0.550'
          assert c['frozenConsensusThreshold']==0.55
          assert [w['id'] for w in c['operationalStartWindowsExactly']]==['MAY01','MAY15']
          assert c['windowSelectionPolicy']['bothWindowsMustBeReported'] is True
          assert c['windowSelectionPolicy']['choosingTheBetterHistoricalWindowForPromotionAllowed'] is False
          assert c['windowSelectionPolicy']['newDateCutoffSearchAllowed'] is False
          assert c['windowSelectionPolicy']['forcedPlayAllowed'] is False
          assert c['decisionBoundary']['positiveEvEstablished'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V71_CONTRACT_PRE_SCORER_FREEZE_PROVED')
          PY

      - name: Syntax check V71 scorer
        run: python -m py_compile scripts/p0-step12v71-operational-start-window-top1.py

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793

      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"; done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY"
          test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Execute frozen V71 operational start-window audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p0-step12v71-operational-start-window-top1.py \
            --root inputs/step12v3 \
            --custody '${{ steps.paths.outputs.custody }}' \
            --v16-manifest '${{ steps.paths.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --contract research/p0-step12v71-operational-start-window-top1-contract.json \
            --out work/v71-operational-start-window-top1.json

      - name: Validate exact parent parity and frozen windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v71-operational-start-window-top1.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v71-operational-start-window-top1.v1'
          assert r['classification']=='V71_OPERATIONAL_START_WINDOW_TOP1_RETROSPECTIVE_AUDIT_COMPLETE'
          assert r['fullSeasonTop1Parity']=={'opportunities':492,'decisiveRows':488,'wins':311,'losses':177,'pushes':4}
          assert set(r['operationalStartWindows'])=={'MAY01','MAY15'}
          a=r['operationalStartWindows']['MAY01']; b=r['operationalStartWindows']['MAY15']
          assert b['eligibleSlateDays'] <= a['eligibleSlateDays']
          assert b['activeTop1PickDays'] <= a['activeTop1PickDays']
          assert a['activeTop1PickDays'] == a['wins']+a['losses']+a['pushes']
          assert b['activeTop1PickDays'] == b['wins']+b['losses']+b['pushes']
          assert 0 <= a['decisiveHitRate'] <= 1
          assert 0 <= b['decisiveHitRate'] <= 1
          g=r['interpretationGuardrails']
          assert g['bothFrozenWindowsReported'] is True
          assert g['historicalBestWindowChosenForPromotion'] is False
          assert g['newDateCutoffSearchPerformed'] is False
          assert g['v69PortfolioChanged'] is False
          assert g['v69ThresholdChanged'] is False
          assert g['forcedPlayAllowed'] is False
          assert g['historicalPricesUsed'] is False
          assert g['positiveEvEstablished'] is False
          assert g['prospectiveV68Changed'] is False
          assert g['productionChanged'] is False
          assert g['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'fullSeasonTop1Parity':r['fullSeasonTop1Parity'],
            'operationalStartWindows':r['operationalStartWindows'],
          },indent=2))
          PY

      - name: Upload V71 report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v71-operational-start-window-top1
          path: work/v71-operational-start-window-top1.json
          if-no-files-found: error
          retention-days: 90
