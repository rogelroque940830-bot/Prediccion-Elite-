name: Validate P0 Step 12F Independent Replication

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12f-acquire-2024-replication.mjs'
      - 'scripts/p0-step12f-independent-replication.py'
      - 'scripts/p0-step12d-freeze-candidates.mjs'
      - 'scripts/p0-step12-pocket-pilot.py'
      - 'evidence/p0-step12/2025-pocket-pilot.json'
      - 'server/mlb-market-historical-source.ts'
      - 'server/mlb-market-historical-dataset.ts'
      - 'server/mlb-market-starting-pitcher-history.ts'
      - 'server/mlb-market-pregame-lineup-history.ts'
      - '.github/workflows/validate-p0-step12f-independent-replication.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-step12f-independent-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Freeze exact candidate family and Step 12F leader before 2024 inspection
        shell: bash
        run: |
          set -euo pipefail
          expected_blob='3988b0214284b7338be8aeb8102c57d98f88d7a1'
          actual_blob="$(git hash-object evidence/p0-step12/2025-pocket-pilot.json)"
          test "$actual_blob" = "$expected_blob"
          node scripts/p0-step12d-freeze-candidates.mjs \
            --input evidence/p0-step12/2025-pocket-pilot.json \
            --out artifacts/p0-step12f/frozen-candidates.json
          grep -F "LEADER_HYPOTHESIS_KEY = 'FIRST_5:46a7cbb6ff5c2458'" scripts/p0-step12f-independent-replication.py
          grep -F "MIN_DECISIVE_ROWS = 80" scripts/p0-step12f-independent-replication.py
          grep -F "MIN_DECISIVE_DATES = 30" scripts/p0-step12f-independent-replication.py
          grep -F "MAX_ABSOLUTE_2026_TO_2024_DRIFT = 0.15" scripts/p0-step12f-independent-replication.py
          grep -F "ALPHA = 0.05" scripts/p0-step12f-independent-replication.py

      - name: Syntax-check Step 12F research surface
        run: |
          node --check scripts/p0-step12f-acquire-2024-replication.mjs
          python -m py_compile scripts/p0-step12-pocket-pilot.py scripts/p0-step12f-independent-replication.py
          npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution bundler --types node \
            server/mlb-market-historical-source.ts \
            server/mlb-market-historical-dataset.ts \
            server/mlb-market-starting-pitcher-history.ts \
            server/mlb-market-pregame-lineup-history.ts

      - name: Acquire untouched 2024 replication cohort from official MLB sources
        run: >-
          node --import tsx scripts/p0-step12f-acquire-2024-replication.mjs
          --start 2024-03-01
          --end 2024-09-30
          --concurrency 6
          --out artifacts/p0-step12f/cohort-2024-replication

      - name: Validate exact official-final cohort identity before leader scoring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          root='artifacts/p0-step12f/cohort-2024-replication'
          with open(f'{root}/cohort-manifest.json', encoding='utf-8') as f: m=json.load(f)
          with open(f'{root}/pregame-lineup-history.json', encoding='utf-8') as f: l=json.load(f)
          assert m['schemaVersion']=='courtedge-p0-step12f-2024-replication-cohort.v1'
          assert m['temporalRole']=='UNTOUCHED_SECONDARY_SEASON_REPLICATION'
          assert m['cohort']['regularSeasonFinalGames']==m['cohort']['starterGames']==m['cohort']['lineupSnapshotsFetched']
          assert l['schemaVersion']=='courtedge-p0-step12f-cohort-pregame-lineups.v1'
          assert l['cohortDefinition']=='OFFICIAL_FINAL_GAME_PK_INTERSECTION'
          assert l['officialFinalGames']==l['snapshotsFetched']==m['cohort']['regularSeasonFinalGames']
          assert m['policy']['usedFor2025CandidateDiscovery'] is False
          assert m['policy']['usedFor2026LeaderSelection'] is False
          assert m['policy']['inspectedBeforeLeaderAndCriteriaFreeze'] is False
          print(json.dumps(m['cohort'], indent=2))
          PY

      - name: Apply single frozen leader without retuning
        run: >-
          python scripts/p0-step12f-independent-replication.py
          --candidates artifacts/p0-step12f/frozen-candidates.json
          --dataset artifacts/p0-step12f/cohort-2024-replication/dataset.json
          --starter-history artifacts/p0-step12f/cohort-2024-replication/starting-pitcher-history.json
          --lineup-history artifacts/p0-step12f/cohort-2024-replication/pregame-lineup-history.json
          --cohort-manifest artifacts/p0-step12f/cohort-2024-replication/cohort-manifest.json
          --out artifacts/p0-step12f/independent-replication-report.json

      - name: Validate Step 12F replication contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='artifacts/p0-step12f/independent-replication-report.json'
          with open(p, encoding='utf-8') as f: r=json.load(f)
          assert r['schemaVersion']=='courtedge-p0-step12f-independent-2024-replication.v1'
          assert r['evidenceStatus']=='STEP12F_INDEPENDENT_REPLICATION_RESEARCH_ONLY_NOT_BET_ELITE'
          assert r['leader']['hypothesisKey']=='FIRST_5:46a7cbb6ff5c2458'
          assert r['design']['singlePrespecifiedHypothesis'] is True
          assert r['design']['replicationCohortInspectedBeforeFreeze'] is False
          assert r['design']['thresholdRetuningAllowed'] is False
          assert r['design']['leaderReplacementAllowed'] is False
          assert r['supportCriteria']['minimumDecisiveRows']==80
          assert r['supportCriteria']['minimumDecisiveDates']==30
          assert r['supportCriteria']['exactOneSidedBinomialPValueMax']==0.05
          assert r['supportCriteria']['maximumAbsolute2026To2024Drift']==0.15
          assert r['promotionBoundary']['canProduceBetElite'] is False
          assert r['promotionBoundary']['canChangeLiveFilters'] is False
          assert r['promotionBoundary']['canTuneAtomsOrThresholds'] is False
          assert r['policy']['historicalPricesUsed'] is False
          assert r['policy']['historicalEvClaimProduced'] is False
          assert r['policy']['livePickFiltersChanged'] is False
          assert r['policy']['step11cCapturePopulationChanged'] is False
          assert r['policy']['betEliteProduced'] is False
          assert r['policy']['stakeCalculated'] is False
          assert r['policy']['automaticBetPlacement'] is False
          print(json.dumps({'classification':r['classification'],'replication':r['replication']}, indent=2))
          PY

      - name: Preserve live-model and evidence-ledger regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend

      - name: Freeze Step 12F no-retuning and no-live-mutation boundary
        shell: bash
        run: |
          set -euo pipefail
          acquire='scripts/p0-step12f-acquire-2024-replication.mjs'
          replicate='scripts/p0-step12f-independent-replication.py'
          grep -F 'FROZEN_START_DATE = "2024-03-01"' "$acquire"
          grep -F 'FROZEN_END_DATE = "2024-09-30"' "$acquire"
          grep -F 'usedFor2025CandidateDiscovery: false' "$acquire"
          grep -F 'usedFor2026LeaderSelection: false' "$acquire"
          grep -F 'inspectedBeforeLeaderAndCriteriaFreeze: false' "$acquire"
          grep -F "LEADER_HYPOTHESIS_KEY = 'FIRST_5:46a7cbb6ff5c2458'" "$replicate"
          grep -F "EXPECTED_SIDE = 'HOME'" "$replicate"
          grep -F "EXPECTED_HORIZON = 'FIRST_5'" "$replicate"
          grep -F "MIN_DECISIVE_ROWS = 80" "$replicate"
          grep -F "MIN_DECISIVE_DATES = 30" "$replicate"
          grep -F "MAX_ABSOLUTE_2026_TO_2024_DRIFT = 0.15" "$replicate"
          grep -F "ALPHA = 0.05" "$replicate"
          ! grep -E 'betElite(Label)?Produced:[[:space:]]*true|betEliteProduced[[:space:]]*=[[:space:]]*True|stakeCalculated:[[:space:]]*true|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' "$acquire" "$replicate"
          git diff --check

      - name: Upload Step 12F independent replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12f-independent-replication
          path: artifacts/p0-step12f/
          if-no-files-found: error
          retention-days: 30
