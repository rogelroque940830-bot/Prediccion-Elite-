name: Apply S3B MLB route modules

on:
  pull_request:
    branches:
      - feature/s3-backend-modularization

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Extract MLB route modules
        run: python scripts/s3b_extract_mlb_routes.py
      - run: npm ci
      - name: S3 route contract
        run: npm run test:s3-modularization
      - name: S3 typecheck
        run: npm run typecheck:s3-modularization
      - name: S1 regression
        run: npm run test:s1-auth
      - name: S2 regression
        run: npm run test:s2-multiuser
      - name: MLB regression
        run: npm run test:mlb-ledger
      - name: Backend build
        run: npm run build:backend
      - name: Commit validated S3B extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts server/mlb-early-routes.ts server/mlb-core-routes.ts server/legacy-picks-v2-routes.ts server/routes-modularization.test.ts tsconfig.s3-modularization.json
          git commit -m "S3B: extract MLB route modules"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
