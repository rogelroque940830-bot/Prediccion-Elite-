name: Validate P0 Step 12V77 General Consensus Loss Threat Geometry

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v77-general-consensus-loss-threat-geometry-contract.json'
      - 'scripts/p0-step12v77-general-consensus-loss-threat-geometry.py'
      - '.github/workflows/validate-p0-step12v77-general-consensus-loss-threat-geometry.yml'

permissions:
  contents: read
  actions: read

jobs:
  general-consensus-loss-threat-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Prove V77 contract predates scorer
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- research/p0-step12v77-general-consensus-loss-threat-geometry-contract.json | tail -1)"
          SCORER_ADD="$(git log --diff-filter=A --format=%H -- scripts/p0-step12v77-general-consensus-loss-threat-geometry.py | tail -1)"
          test -n "$CONTRACT_ADD"; test -n "$SCORER_ADD"; test "$CONTRACT_ADD" != "$SCORER_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SCORER_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v77-general-consensus-loss-threat-geometry-contract.json'))
          assert c['scientificStatus']=='FROZEN_GENERAL_CONSENSUS_LOSS_THREAT_GEOMETRY_BEFORE_ANY_V77_SCORER_EXISTS'
          assert c['primaryRoute']['id']=='V16_V68_CONSENSUS_T0.550'
          assert c['primaryRoute']['expectedWins']==128 and c['primaryRoute']['expectedLosses']==95
          assert len(c['directionalOpponentWarningSignalsExactly'])==16
          assert c['threatGeometry']['noCutpointSearch'] is True
          assert c['statisticsBoundary']['liveVetoCreatedByV77'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V77_CONTRACT_PRE_SCORER_FREEZE_PROVED')
          PY
      - name: Syntax check V77 scorer
        run: python -m py_compile scripts/p0-step12v77-general-consensus-loss-threat-geometry.py
      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793
      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189
      - name: Resolve immutable inputs
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"; done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY"; test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"
      - name: Execute frozen V77 threat geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/p0-step12v77-general-consensus-loss-threat-geometry.py \
            --root inputs/step12v3 \
            --custody '${{ steps.paths.outputs.custody }}' \
            --v16-manifest '${{ steps.paths.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v72-scorer scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py \
            --v72-summary research/p0-step12v72-top1-loss-opponent-signal-anatomy-result-summary.json \
            --contract research/p0-step12v77-general-consensus-loss-threat-geometry-contract.json \
            --out work/v77-general-consensus-loss-threat-geometry.json
      - name: Validate parity and research boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v77-general-consensus-loss-threat-geometry.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v77-general-consensus-loss-threat-geometry.v1'
          assert r['classification']=='V77_GENERAL_CONSENSUS_LOSS_THREAT_GEOMETRY_RETROSPECTIVE_COMPLETE'
          assert r['parentParity']=={'pickDays':395,'decisiveRows':392,'wins':254,'losses':138,'pushes':3}
          p=r['primaryRoute']
          assert p['id']=='V16_V68_CONSENSUS_T0.550' and p['decisiveRows']==223 and p['wins']==128 and p['losses']==95
          assert len(p['directionalOpponentWarningSignalAnalysis'])==16 and len(p['domainThreatIndexAnalysis'])==5
          assert set(p['lineupWarningByConsensusScoreMatrix']['cells'])=={'LOW','MID','HIGH'}
          g=r['guardrails']
          assert g['strictlyPregameSignalsOnly'] is True and g['associationNotCausation'] is True
          assert g['outcomeOptimizedThresholdSearchPerformed'] is False and g['outcomeWeightedCompositePerformed'] is False
          assert g['liveVetoCreated'] is False and g['historicalPricesUsed'] is False
          assert g['productionChanged'] is False and g['prospectiveV68Changed'] is False
          assert g['positiveEvEstablished'] is False and g['realFinancialExposure']==0
          print(json.dumps({'strongSignals':p['predeclaredStrongAssociationSignals'],'topSignals':p['signalRankingByHolmThenAuc'][:8],'redCorner':p['lineupWarningByConsensusScoreMatrix']['redCorner'],'comparisonCorner':p['lineupWarningByConsensusScoreMatrix']['comparisonCorner'],'riskRatio':p['lineupWarningByConsensusScoreMatrix']['riskRatioRedVsComparison'],'domainTertiles':{k:v['buckets'] for k,v in p['domainThreatIndexTertiles'].items()},'allSignalTertiles':p['allSignalThreatIndexTertiles']['buckets']},indent=2))
          PY
      - name: Upload V77 report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v77-general-consensus-loss-threat-geometry
          path: work/v77-general-consensus-loss-threat-geometry.json
          if-no-files-found: error
          retention-days: 90
