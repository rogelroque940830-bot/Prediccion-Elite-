name: Apply S6Q Certification Evidence Test

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6q-certification-evidence-test.mjs'
      - '.github/workflows/apply-s6q-certification-evidence-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/patch-s6q-certification-evidence-test.mjs
      - name: Commit focused test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-s6q-fifty-settlement-human-review.test.ts
          git commit -m 'Correct S6Q certification evidence assertion'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
