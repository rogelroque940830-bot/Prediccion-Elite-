name: WNBA R1A.4D1 Season Venue Registry Probe

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4D1_SEASON_VENUE_REGISTRY_PROBE.json'
      - 'research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_CERTIFICATION.json'
      - 'research/wnba/WNBA_R1A4C2_SPECIAL_EVENT_EXCLUSION_AND_PREFIX_CUSTODY.json'
      - 'scripts/wnba-r1a4d1-season-venue-registry-probe.py'
      - '.github/workflows/wnba-r1a4d1-season-venue-registry-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet pyarrow
      - name: Probe season venue registry without outcomes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4d1-season-venue-registry-probe.py
      - name: Upload venue registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4d1-venue-registry-${{ github.run_id }}
          path: wnba-r1a4d1-season-venue-registry-evidence.json
          if-no-files-found: error
          retention-days: 90
