name: WNBA R1A.5 Neutral Availability Candidate Freeze

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A5_NEUTRAL_AVAILABILITY_CANDIDATE_FREEZE.json'
      - 'research/wnba/WNBA_R1A4D3_TRAVEL_ENRICHED_PREFIX_CERTIFICATION.json'
      - 'research/wnba/WNBA_R1A1_INJURY_SOURCE_CERTIFICATION.json'
      - 'scripts/wnba-r1a4d3-travel-enriched-prefix.py'
      - 'scripts/wnba-r1a5-neutral-availability-candidate.py'
      - '.github/workflows/wnba-r1a5-neutral-availability-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet pyarrow
      - name: Freeze neutral availability candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a5-neutral-availability-candidate.py
      - name: Upload R1A.5 evidence and candidate rowset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a5-neutral-availability-${{ github.run_id }}
          path: |
            wnba-r1a5-neutral-availability-evidence.json
            wnba-r1a5-neutral-availability-candidate-rowset.jsonl
            wnba-r1a4d3-travel-enriched-prefix-rowset.jsonl
          if-no-files-found: error
          retention-days: 90
