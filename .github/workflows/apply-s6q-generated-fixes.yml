name: Apply S6Q Generated Fixes

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6q-generated-implementation.mjs'
      - '.github/workflows/apply-s6q-generated-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize patch assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-s6q-generated-implementation.mjs')
          source = path.read_text()
          source = source.replace('  "ARMED_AND_WAITING_FOR_5",\n', '')
          path.write_text(source)
          PY
      - name: Patch generated S6Q implementation
        run: node scripts/patch-s6q-generated-implementation.mjs
      - name: Commit permanent fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/mlb-s6q-fifty-settlement-human-review.ts \
            server/mlb-s6q-fifty-settlement-human-review.test.ts
          if git diff --cached --quiet; then
            echo 'No S6Q fixes required.'
            exit 0
          fi
          git commit -m 'Fix S6Q human-review gating and focused tests'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
