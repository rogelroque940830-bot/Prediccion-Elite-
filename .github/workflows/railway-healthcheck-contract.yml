name: Validate Railway Healthcheck Contract

on:
  push:
    branches:
      - "ops/railway-healthcheck-v1"
      - "ops/railway-config-schema-v1"
      - "ops/railway-railpack-v1"
    paths:
      - "railway.toml"
      - "server/index.ts"
      - ".github/workflows/railway-healthcheck-contract.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "railway.toml"
      - "server/index.ts"
      - ".github/workflows/railway-healthcheck-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify Railway deployment contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^builder = "RAILPACK"$' railway.toml
          grep -q '^buildCommand = "npm run build:backend"$' railway.toml
          grep -q '^healthcheckPath = "/health"$' railway.toml
          grep -q '^healthcheckTimeout = 300$' railway.toml
          grep -q 'app.get("/health"' server/index.ts
          grep -q 'process.env.PORT' server/index.ts
          grep -q 'host: "0.0.0.0"' server/index.ts
          ! grep -q '^builder = "NIXPACKS"$' railway.toml
          ! grep -q '^healthcheckPath = "/api/mlb/all"$' railway.toml
          ! grep -q '^\[deploy\.healthcheck\]$' railway.toml
      - name: Install backend dependencies
        run: npm ci
      - name: Build backend exactly as Railway will
        run: npm run build:backend
      - name: Verify backend artifact exists
        run: test -s dist/index.cjs
