name: NFL R5H21 Frozen 2026 Late Down Runtime Export

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/nfl_r5h21_2026_late_down_runtime_export.py'
      - '.github/workflows/nfl-r5h21-2026-late-down-runtime-export.yml'

permissions:
  contents: read

jobs:
  nfl-r5h21-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests

      - name: Validate frozen research/export chain
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py
          python -m py_compile research/nfl/nfl_r5h3_rival_matchup_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h4_elite_selection_gate.py
          python -m py_compile research/nfl/nfl_r5h6_confidence_stratified_residual_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h8_interaction_contradiction_engine.py
          python -m py_compile research/nfl/nfl_r5h10_marginal_geometry_expansion.py
          python -m py_compile research/nfl/nfl_r5h15_independent_signal_family_discovery.py
          python -m py_compile research/nfl/nfl_r5h15_runner.py
          python -m py_compile research/nfl/nfl_r5h19_2026_frozen_inference_export.py
          python -m py_compile research/nfl/nfl_r5h21_2026_late_down_runtime_export.py

      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 --end-season 2025 --test-start 2018 \
            --out-dir nfl-r5-output --cache-dir .cache/nflverse

      - name: Rebuild QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 --end-season 2025 --test-start 2018 \
            --out-dir nfl-r5b-output --cache-dir .cache/nflverse

      - name: Rebuild frozen hybrid feature matrix
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 --end-season 2025

      - name: Reproduce frozen H15 signal chain
        run: |
          python research/nfl/nfl_r5h15_runner.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h15-output \
            --cache-dir .cache/nflverse \
            --start-season 2012 --expert-oos-start 2013 \
            --test-start 2018 --end-season 2025

      - name: Export frozen 2026 Late Down runtime contract
        run: |
          python research/nfl/nfl_r5h21_2026_late_down_runtime_export.py \
            --hybrid-dir nfl-r5b-hybrid-output \
            --h15-dir nfl-r5h15-output \
            --cache-dir .cache/nflverse \
            --out-dir nfl-r5h21-output \
            --start-season 2012 --end-season 2025

      - name: Enforce R5H21 custody and prospective boundary
        run: |
          python - <<'PY'
          import json
          s=json.load(open('nfl-r5h21-output/nfl_r5h21_summary.json'))
          a=json.load(open('nfl-r5h21-output/nfl_r5h21_audit.json'))
          r=json.load(open('nfl-r5h21-output/nfl_r5h21_2026_late_down_runtime_artifact.json'))
          assert s['targetSeason'] == 2026
          assert s['trainedThroughSeason'] == 2025
          assert s['family'] == 'LATE_DOWN_CONVERSION'
          assert s['featureCount'] == 4
          assert s['frozen2026ValidationSeasons'] == [2024, 2025]
          assert s['frozen2026ThresholdGate'] is True
          assert s['productionPolicy'] == 'THRESHOLD_ONLY_NO_TARGET_SEASON_RANKING'
          assert s['targetSeasonRankingOrCapUsed'] is False
          assert s['r5h18Custody']['games'] == 53
          assert s['r5h18Custody']['wins'] == 46
          assert s['r5h18Custody']['losses'] == 7
          assert s['r5h18CombinedCustody']['games'] == 211
          assert s['r5h18CombinedCustody']['wins'] == 171
          assert s['r5h18CombinedCustody']['losses'] == 40
          assert s['parity2025']['thresholdOnlySelections'] == 34
          assert s['parity2025']['selectionMismatches'] == 0
          assert s['parity2025']['pass'] is True
          assert s['marketDataUsedAsFeature'] is False
          assert s['sameGameOutcomeAllowed'] is False
          assert s['postKickoffEvidenceAllowed'] is False
          assert s['target2026OutcomesUsed'] is False
          assert a['2026FutureCandidateRanking'] == 'NONE'
          assert a['2026TargetOutcomeUsage'] == 'NONE'
          assert r['targetSeasonRankingOrCapUsed'] is False
          assert r['safety']['marketDataUsedAsFeatures'] is False
          assert r['safety']['target2026OutcomesUsed'] is False
          assert r['safety']['future2026FeatureRankingUsed'] is False
          assert r['safety']['automaticProductionPromotion'] is False
          assert len(r['semanticDigest']) == 64
          print('NFL_R5H21_CUSTODY_VERIFIED')
          PY

      - name: Show R5H21 evidence
        run: |
          cat nfl-r5h21-output/nfl_r5h21_summary.json
          echo
          head -30 nfl-r5h21-output/nfl_r5h21_2026_threshold_search.csv

      - name: Upload R5H21 runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h21-2026-late-down-runtime-evidence
          path: nfl-r5h21-output/
          if-no-files-found: error
          retention-days: 30
