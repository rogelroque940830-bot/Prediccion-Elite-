name: Research P1 ULTRAPREMIUM Economic Forensic

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p1-ultrapremium-economic-forensic.yml'
      - 'scripts/p1-ultrapremium-economic-forensic.mjs'
      - 'scripts/p1-ultrapremium-cohort-integrity.mjs'

permissions:
  contents: read

jobs:
  research-ultrapremium-economic-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: a56374d3b9bdd345c5b8c993119e406e2efbfb76
      COURTEDGE_WRITE_TOKEN: ${{ secrets.COURTEDGE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'

      - name: Export immutable owner ledger privately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit private
          chmod 700 private

          if [[ -z "${COURTEDGE_WRITE_TOKEN:-}" ]]; then
            echo 'ULTRAPREMIUM_SERVICE_TOKEN_UNAVAILABLE' >&2
            exit 42
          fi

          health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health")
          status_code=$(curl -sS -o audit/ledger-status.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status")
          export_code=$(curl -sS -o private/owner-ledger.jsonl -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${COURTEDGE_WRITE_TOKEN}" \
            "${BACKEND_URL}/api/mlb/ledger/v1/export?format=jsonl&limit=10000")

          [[ "${health_code}" == "200" ]]
          [[ "${status_code}" == "200" ]]
          [[ "${export_code}" == "200" ]]
          test -s private/owner-ledger.jsonl
          chmod 600 private/owner-ledger.jsonl

      - name: Run preregistered ULTRAPREMIUM economic analysis
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p1-ultrapremium-economic-forensic.mjs \
            private/owner-ledger.jsonl \
            audit/health.json \
            audit/ledger-status.json \
            audit/result.json
          test -s audit/result.json

      - name: Audit cohort independence and July-August regime shift
        shell: bash
        run: |
          set -euo pipefail
          node scripts/p1-ultrapremium-cohort-integrity.mjs \
            private/owner-ledger.jsonl \
            audit/cohort-integrity.json
          test -s audit/cohort-integrity.json

      - name: Destroy private owner export before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          rm -f private/owner-ledger.jsonl
          rmdir private
          test ! -d private
          ! find audit -type f \( -name '*.jsonl' -o -name '*.ndjson' -o -name '*.sqlite' -o -name '*.db' \) | grep -q .

      - name: Validate aggregate artifact safety and invariants
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('audit/result.json', 'utf8'));
          const integrity = JSON.parse(fs.readFileSync('audit/cohort-integrity.json', 'utf8'));
          const fail = (message) => { throw new Error(message); };
          if (result.schemaVersion !== 'p1-ultrapremium-economic-forensic.v1') fail('schema');
          if (integrity.schemaVersion !== 'p1-ultrapremium-cohort-integrity.v1') fail('integrity schema');
          if (result.backend.commit !== process.env.EXPECTED_BACKEND_COMMIT) fail(`backend=${result.backend.commit}`);
          if (!result.sourceIntegrity.immutableLedger) fail('ledger not immutable');
          if (result.sourceIntegrity.exportedRecords !== result.sourceIntegrity.publicPredictionCount) fail('incomplete export');
          if (result.sourceIntegrity.rawExportSha256 !== integrity.source.rawExportSha256) fail('source digest mismatch');
          if (result.sourceIntegrity.rawExportUploaded !== false || integrity.source.rawUploaded !== false) fail('raw upload flag');
          if (result.safety.rawOwnerLedgerPersistedInArtifact !== false || integrity.safety.rawOwnerLedgerPersistedInArtifact !== false) fail('raw persistence');
          if (result.safety.predictionsCreated !== 0 || result.safety.settlementsCreated !== 0 || result.safety.betsPlaced !== 0) fail('write detected');
          if (integrity.safety.predictionsCreated !== 0 || integrity.safety.settlementsCreated !== 0 || integrity.safety.betsPlaced !== 0) fail('integrity write detected');
          if (result.safety.realFinancialExposure !== 0 || integrity.safety.realFinancialExposure !== 0) fail('financial exposure');
          if (result.interpretationGuards.rankingProbabilityFloorsAreNotCalibratedProbabilities !== true) fail('calibration guard');
          if (result.interpretationGuards.ultraCommitReportedCombinedTwoPlusBoostHitRate !== false) fail('ultra evidence guard');
          if (integrity.integrityFlags.economicCertificationAllowed !== false) fail('premature economic certification');
          console.log(JSON.stringify({
            decision: result.decision,
            prospectiveUltra: result.economicGroups.explicitUltraF5ProspectiveApp,
            duplicateProfile: integrity.independence.duplicateProfile,
            earliestUltraPerGame: integrity.independence.earliestUltraPerGame,
            latestUltraPerGame: integrity.independence.latestUltraPerGame,
            terminalUltra: integrity.independence.terminalF5PerGameThatIsUltra,
            modelProvenance: integrity.provenance.allProspectiveUltra,
            monthContrast: integrity.monthContrast,
          }, null, 2));
          NODE

      - name: Prove research branch remains read only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code

      - name: Upload aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-ultrapremium-economic-forensic-aggregate
          path: |
            audit/result.json
            audit/cohort-integrity.json
          if-no-files-found: warn
          retention-days: 30
