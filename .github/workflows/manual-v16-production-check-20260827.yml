name: Manual V16 Production Check 2026-08-27

on:
  push:
    branches:
      - ops/manual-v16-prod-check-20260827

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FRONTEND_URL: https://fearless-illumination-production-6d16.up.railway.app
      TARGET_DATE: '2026-08-27'
    steps:
      - name: Verify public frontend and discover deployed API base
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --max-time 30 -sS -L -o /tmp/frontend.html -w '%{http_code}' "$FRONTEND_URL/")
          echo "frontend_http=$code"
          test "$code" = "200"
          test -s /tmp/frontend.html
          asset=$(grep -oE 'src="[^\"]+\.js"' /tmp/frontend.html | head -1 | cut -d'"' -f2)
          test -n "$asset"
          case "$asset" in
            http*) bundle_url="$asset" ;;
            /*) bundle_url="$FRONTEND_URL$asset" ;;
            *) bundle_url="$FRONTEND_URL/${asset#./}" ;;
          esac
          echo "bundle_url=$bundle_url"
          curl --max-time 30 -sS -L "$bundle_url" -o /tmp/bundle.js
          test -s /tmp/bundle.js
          grep -oE 'https://[A-Za-z0-9.-]+\.up\.railway\.app' /tmp/bundle.js | sort -u | tee /tmp/railway-domains.txt
          test -s /tmp/railway-domains.txt

          : > /tmp/backend_url
          while IFS= read -r base; do
            [ "$base" = "$FRONTEND_URL" ] && continue
            hcode=$(curl --max-time 20 -sS -L -o /tmp/candidate-health.json -w '%{http_code}' "$base/health" || true)
            echo "candidate=$base health_http=$hcode"
            if [ "$hcode" = "200" ] && jq -e '.status == "healthy"' /tmp/candidate-health.json >/dev/null 2>&1; then
              echo "$base" > /tmp/backend_url
              cp /tmp/candidate-health.json /tmp/backend-health.json
              break
            fi
          done < /tmp/railway-domains.txt

          test -s /tmp/backend_url
          echo "backend_url=$(cat /tmp/backend_url)"
          jq . /tmp/backend-health.json

      - name: Execute same V16 priced daily-opportunity route as UI
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_URL=$(cat /tmp/backend_url)
          code=$(curl --max-time 240 -sS -L \
            -H 'Content-Type: application/json' \
            -X POST \
            --data "{\"date\":\"$TARGET_DATE\"}" \
            -o /tmp/v16.json \
            -w '%{http_code}' \
            "$BACKEND_URL/api/mlb/unified-v16/daily-opportunity/run-priced")
          echo "v16_http=$code"
          if [ "$code" != "200" ]; then
            head -c 3000 /tmp/v16.json || true
            echo
            exit 1
          fi
          jq -e . /tmp/v16.json >/dev/null
          jq '{schemaVersion,status,date,generatedAt,slate,dailyOpportunity:{action:.dailyOpportunity.action,decisionReason:.dailyOpportunity.decisionReason,summary:.dailyOpportunity.summary},priceConsultationShortlist:{summary:.priceConsultationShortlist.summary},decision,summary,policy}' /tmp/v16.json

      - name: Assert response consistency
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg date "$TARGET_DATE" '.date == $date' /tmp/v16.json >/dev/null
          jq -e '.slate.total >= 0 and .slate.finalReady >= 0 and .slate.provisional >= 0 and .slate.waitingForPitchers >= 0' /tmp/v16.json >/dev/null
          jq -e '(.decision.action == "PLAY" or .decision.action == "WAIT" or .decision.action == "NO_PLAY")' /tmp/v16.json >/dev/null
          jq -e '(.summary.gamesExposedToOddsService // 0) <= 3' /tmp/v16.json >/dev/null
          jq -e '(.policy.realFinancialExposure // 0) == 0' /tmp/v16.json >/dev/null
          echo MANUAL_V16_PRODUCTION_CHECK_OK
