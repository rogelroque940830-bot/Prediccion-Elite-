name: Validate MLB R1B V16 Final Baseline Adapter

on:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - server/mlb-r1b-v16-final-baseline-adapter.ts
      - server/mlb-r1b-v16-final-baseline-adapter.test.ts
      - server/mlb-r1b-v16-historical-target-bridge.ts
      - server/mlb-r1b-v16-historical-target-bridge.test.ts
      - server/mlb-c4-certified-materializer.ts
      - server/mlb-pure-settlement-scorer.ts
      - .github/workflows/validate-mlb-r1b-v16-final-baseline-adapter.yml
  pull_request:
    paths:
      - server/mlb-r1b-v16-final-baseline-adapter.ts
      - server/mlb-r1b-v16-final-baseline-adapter.test.ts
      - server/mlb-r1b-v16-historical-target-bridge.ts
      - server/mlb-r1b-v16-historical-target-bridge.test.ts
      - server/mlb-c4-certified-materializer.ts
      - server/mlb-pure-settlement-scorer.ts
      - .github/workflows/validate-mlb-r1b-v16-final-baseline-adapter.yml

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Run V16 final-baseline and historical-bridge falsification tests
        run: |
          npx tsx --test \
            server/mlb-r1b-v16-final-baseline-adapter.test.ts \
            server/mlb-r1b-v16-historical-target-bridge.test.ts \
            server/mlb-c4-certified-materializer.test.ts \
            server/mlb-pure-settlement-scorer.test.ts
      - name: Compile V16 historical bridge
        run: npx esbuild server/mlb-r1b-v16-historical-target-bridge.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-r1b-v16-historical-target-bridge.cjs
      - name: Verify research boundary
        shell: bash
        run: |
          set -euo pipefail
          adapter='server/mlb-r1b-v16-final-baseline-adapter.ts'
          bridge='server/mlb-r1b-v16-historical-target-bridge.ts'
          grep -F 'MLB_R1B_V16_PROVISIONAL_NOT_CERTIFIED_BY_FINAL_ADAPTER' "$adapter"
          grep -F 'FROZEN_SYNTHETIC_IDENTITY_ONLY' "$bridge"
          grep -F 'externalTargetFeedRead: false' "$bridge"
          grep -F 'outcomeFieldsRead: false' "$adapter" "$bridge"
          grep -F 'marketPricesRead: false' "$adapter" "$bridge"
          grep -F 'newWeightsCreated: false' "$adapter" "$bridge"
          grep -F 'productionChanged: false' "$bridge"
          ! grep -Ei 'sportsbook|stake|placeBet|automaticBetPlacement: true|realFinancialExposure: [1-9]' "$adapter" "$bridge"
