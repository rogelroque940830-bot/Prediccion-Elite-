name: Validate MLB R1B V16 Final Baseline Adapter

on:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - server/mlb-r1b-v16-final-baseline-adapter.ts
      - server/mlb-r1b-v16-final-baseline-adapter.test.ts
      - server/mlb-pure-settlement-scorer.ts
      - .github/workflows/validate-mlb-r1b-v16-final-baseline-adapter.yml
  pull_request:
    paths:
      - server/mlb-r1b-v16-final-baseline-adapter.ts
      - server/mlb-r1b-v16-final-baseline-adapter.test.ts
      - server/mlb-pure-settlement-scorer.ts
      - .github/workflows/validate-mlb-r1b-v16-final-baseline-adapter.yml

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - name: Run V16 final-baseline falsification tests
        run: npx tsx --test server/mlb-r1b-v16-final-baseline-adapter.test.ts server/mlb-pure-settlement-scorer.test.ts
      - name: Verify research boundary
        shell: bash
        run: |
          set -euo pipefail
          source='server/mlb-r1b-v16-final-baseline-adapter.ts'
          grep -F 'MLB_R1B_V16_PROVISIONAL_NOT_CERTIFIED_BY_FINAL_ADAPTER' "$source"
          grep -F 'outcomeFieldsRead: false' "$source"
          grep -F 'marketPricesRead: false' "$source"
          grep -F 'newWeightsCreated: false' "$source"
          ! grep -Ei 'odds|sportsbook|stake|placeBet|automaticBetPlacement: true|realFinancialExposure: [1-9]' "$source"
