name: P0 Step 12V80 One-Shot Catchup 2026-08-20

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-step12v80-catchup-2026-08-20.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: p0-step12v80-catchup-2026-08-20
  cancel-in-progress: false

jobs:
  catchup:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repaired V80 code from main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout V68 immutable prospective source ledger
        uses: actions/checkout@v4
        with:
          ref: data/p0-step12v68-prospective
          path: v68-ledger
          fetch-depth: 1

      - name: Checkout V80 immutable prospective ledger
        uses: actions/checkout@v4
        with:
          ref: data/p0-step12v80-general-strength-prospective
          path: v80-ledger
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact custody boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s v68-ledger/v68/gap/ledger-manifest.json
          test -s v68-ledger/v68/states/2026-08-20.json
          python - <<'PY'
          import json
          m=json.load(open('v68-ledger/v68/gap/ledger-manifest.json'))
          if m.get('lastOfficialDate') != '2026-08-19':
              raise SystemExit(f"V80_CATCHUP_FAIL_CLOSED_V68_GAP:{m.get('lastOfficialDate')}:2026-08-19")
          print('V80_CATCHUP_V68_CUSTODY_OK')
          PY

      - name: Check whether immutable V80 state already exists
        id: existing
        shell: bash
        run: |
          if test -s v80-ledger/v80/states/2026-08-20.json; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify existing state if another valid run won the race
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          x=json.load(open('v80-ledger/v80/states/2026-08-20.json'))
          assert x['schemaVersion']=='courtedge-p0-step12v80-general-strength-live-state.v1'
          assert x['targetOfficialDate']=='2026-08-20'
          assert x['chronology']['wholeOfficialDatePriorStateOnly'] is True
          assert x['chronology']['sameDateCompletedGamesUsed'] is False
          assert x['policy']['containsCurrentGameOutcome'] is False
          assert x['policy']['containsMarketPrice'] is False
          assert x['policy']['realFinancialExposure']==0
          print('V80_CATCHUP_ALREADY_PRESENT_AND_VALID')
          PY

      - name: Install Node dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm ci --ignore-scripts

      - name: Download frozen V68 source base
        if: steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v68-frozen-prospective-source-base
          path: frozen
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31967561655

      - name: Expand frozen 2026 source base
        if: steps.existing.outputs.exists != 'true'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/base
          tar -xzf frozen/step12v3/2026_YTD.tgz -C work/base
          TABLE="$(find work/base -type f -name game-anatomy-feature-table.json -print -quit)"
          test -n "$TABLE"
          ROOT="$(dirname "$TABLE")"
          test -s "$ROOT/cohort/official-acquisition.json"
          test -s "$ROOT/cohort/starting-pitcher-history.json"
          test -s "$ROOT/cohort/pregame-lineup-history.json"
          test -s "$ROOT/t5-audit/t5-starter-identity-audit.json"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build exact immutable V80 state
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/p0-step12v80-general-strength-live-context.ts \
            --mode prepare \
            --base-root '${{ steps.base.outputs.root }}' \
            --gap-root v68-ledger/v68/gap \
            --target-date '2026-08-20' \
            --out work/v80-state.json
          python - <<'PY'
          import json
          x=json.load(open('work/v80-state.json'))
          assert x['schemaVersion']=='courtedge-p0-step12v80-general-strength-live-state.v1'
          assert x['targetOfficialDate']=='2026-08-20'
          assert x['chronology']['wholeOfficialDatePriorStateOnly'] is True
          assert x['chronology']['sameDateCompletedGamesUsed'] is False
          assert x['diagnostics']['historicalOfficialGames']==1910
          assert x['diagnostics']['historicalStarterGames']==1910
          assert x['diagnostics']['historicalLineupSnapshots']==1910
          assert x['diagnostics']['rankedTeams']==30
          assert x['diagnostics']['bullpen']['priorDate']=='2026-08-19'
          assert x['diagnostics']['bullpen']['gamesConsidered']==15
          assert x['diagnostics']['bullpen']['identityCompleteGames']==15
          assert x['policy']['containsCurrentGameOutcome'] is False
          assert x['policy']['containsMarketPrice'] is False
          assert x['policy']['realFinancialExposure']==0
          print('V80_CATCHUP_BUILD_VERIFIED')
          PY

      - name: First-write immutable state
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v80-ledger/v80/states
          test ! -e v80-ledger/v80/states/2026-08-20.json
          cp work/v80-state.json v80-ledger/v80/states/2026-08-20.json

      - name: Commit immutable V80 state
        if: steps.existing.outputs.exists != 'true'
        working-directory: v80-ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'court-edge-v80-research-bot'
          git config user.email 'v80-research-bot@users.noreply.github.com'
          git add v80/states/2026-08-20.json
          git diff --cached --quiet && exit 0
          git commit -m 'V80 state 2026-08-20: freeze prior-date strength context'
          git pull --rebase origin data/p0-step12v80-general-strength-prospective
          git push origin HEAD:data/p0-step12v80-general-strength-prospective
          echo 'V80_CATCHUP_STATE_COMMITTED'
