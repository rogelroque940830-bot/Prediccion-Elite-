name: Apply S6P Refreshed Artifact Presence

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6p-refreshed-artifact-presence.mjs'
      - '.github/workflows/apply-s6p-refreshed-artifact-presence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply refreshed artifact presence propagation
        run: node scripts/patch-s6p-refreshed-artifact-presence.mjs
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/mlb-s6p-first-twenty-settlements-certification.ts \
            server/mlb-s6p-first-twenty-settlements-certification.test.ts
          if git diff --cached --quiet; then
            echo 'No refreshed presence changes required.'
            exit 0
          fi
          git commit -m 'Preserve refreshed S6P artifact presence'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
