name: Smoke deployed MLB injury Phase B

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway and verify Phase B plus ledger integrity
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 25478347bbcfb3fd562ce8d443e755e91566604a
          GAME_PK: '822868'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/ledger-before.json
          echo 'LEDGER BEFORE'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/ledger-before.json

          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json; then
              served=$(jq -r '.commit // ""' /tmp/health.json)
              echo "Attempt $attempt: served commit $served"
              if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            else
              echo "Attempt $attempt: Railway temporarily unavailable"
            fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/all?date=2026-07-27" > /tmp/mlb.json
          jq --argjson gamePk "$GAME_PK" '.games[] | select((.gamePk // .gameId) == $gamePk) | {
            gamePk:(.gamePk // .gameId),
            home:.homeTeam.name,
            away:.awayTeam.name,
            homePhaseB:.homeInjuryData.phaseB,
            awayPhaseB:.awayInjuryData.phaseB,
            homeCandidates:[.homeInjuries[] | select(.shadow.decision == "APPLY_CANDIDATE") | {name,isPitcher,reasonCode:.shadow.reasonCode}],
            awayCandidates:[.awayInjuries[] | select(.shadow.decision == "APPLY_CANDIDATE") | {name,isPitcher,reasonCode:.shadow.reasonCode}]
          }' /tmp/mlb.json

          jq -e --argjson gamePk "$GAME_PK" '
            .games[] | select((.gamePk // .gameId) == $gamePk)
            | .homeInjuryData.phaseB.enabled == true
              and .awayInjuryData.phaseB.enabled == true
              and .homeInjuryData.phaseB.mode == "AUTO_CONSERVATIVE"
              and .awayInjuryData.phaseB.mode == "AUTO_CONSERVATIVE"
              and .homeInjuryData.phaseB.maxAbsRuns <= 0.5
              and .awayInjuryData.phaseB.maxAbsRuns <= 0.5
              and (.homeInjuryData.phaseB.eligiblePlayerNames | all(. != "Josh Jung"))
              and (.homeInjuryData.phaseB.withheldCandidateNames | index("Josh Jung") != null)
          ' /tmp/mlb.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/ledger-after.json
          echo 'LEDGER AFTER'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/ledger-after.json
          jq -e --slurpfile before /tmp/ledger-before.json '
            .success == true
            and .data.immutable == true
            and .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
          ' /tmp/ledger-after.json >/dev/null
