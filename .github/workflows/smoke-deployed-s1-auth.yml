name: Smoke deployed S1 auth

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed S1 auth and ledger integrity
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 716a925144a53b3c9f75791de4b009ef6aaffaf1
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            curl --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done

          jq -e --arg commit "$EXPECTED_COMMIT" '
            .status == "healthy"
            and .commit == $commit
            and .authPersistence == true
            and .authSessionStore == "sqlite"
            and .privateReadProtection == true
            and (.authRoles | sort) == (["admin", "analyst", "viewer"] | sort)
          ' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/status.json
          jq -e '
            .success == true
            and .data.immutable == true
            and .data.predictions >= 4
            and .data.settlementEvents >= 4
          ' /tmp/status.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/auth/session" > /tmp/session.json
          jq -e '
            .success == true
            and .authenticated == false
            and .user == null
            and .role == null
            and .csrfToken == null
          ' /tmp/session.json >/dev/null

          private_code=$(curl --silent --show-error --output /tmp/private.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/mlb/ledger/v1/history?limit=1")
          test "$private_code" = "401"
          jq -e '.success == false and .error == "Authentication required for private data"' /tmp/private.json >/dev/null

          sharp_code=$(curl --silent --show-error --output /tmp/sharp.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/sharp/mlb/s1-smoke-nonexistent")
          test "$sharp_code" != "401"

          jq '{health: ., ledger: input.data | {predictions, settlementEvents, immutable}}' \
            /tmp/health.json /tmp/status.json
