name: Generate S6R integration

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - "scripts/generate-s6r-integration.mjs"
      - ".github/workflows/generate-s6r-integration.yml"

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Generate integration changes
        run: node scripts/generate-s6r-integration.mjs
      - name: Remove temporary generator
        run: |
          rm scripts/generate-s6r-integration.mjs
          rm .github/workflows/generate-s6r-integration.yml
      - name: Commit generated integration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(s6r): integrate human review dossier runtime"
          git push origin "HEAD:${HEAD_BRANCH}"
