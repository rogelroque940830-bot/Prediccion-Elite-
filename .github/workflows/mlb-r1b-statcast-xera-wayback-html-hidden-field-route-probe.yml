name: MLB R1B Statcast xERA Wayback HTML Hidden-Field Route Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe.mjs
      - .github/workflows/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Inspect archived Savant hidden fields and primary routes
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe
          node scripts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe.mjs \
            --out=artifacts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe/evidence.json
      - name: Enforce fail-closed scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          p=artifacts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe/evidence.json
          test -s "$p"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e=JSON.parse(fs.readFileSync('artifacts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe/evidence.json','utf8'));
          if(e.status!=='PRIMARY_SAVANT_WAYBACK_HTML_HIDDEN_FIELD_ROUTE_PROBE_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.scientificPolicy?.primaryPublisherOnly!==true||e.scientificPolicy?.noThirdPartyDataAuthority!==true||e.scientificPolicy?.noInterpolation!==true||e.scientificPolicy?.noEmpiricalFit!==true||e.scientificPolicy?.approximationForbidden!==true) throw new Error('policy');
          if(e.summary?.exactHistoricalActualWobaRecoveredAtSufficientPrecision!==false) throw new Error('premature wOBA');
          if(e.summary?.exactHiddenXwobaRecovered!==false) throw new Error('premature xwOBA');
          if(e.summary?.exactSavantProductionConversionProven!==false) throw new Error('premature conversion');
          if(e.summary?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('boundary');
          NODE
      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe.mjs
          ! grep -E 'appendPrediction\(|appendSettlement\(|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'noEmpiricalFit:true' "$src"
          grep -F 'approximationForbidden:true' "$src"
          grep -F 'familyPromotionAuthorized:false' "$src"
      - name: Backend build regression
        run: npm run build:backend
      - name: Upload hidden-field route evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe
          path: artifacts/mlb-r1b-statcast-xera-wayback-html-hidden-field-route-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
