name: One-time staging credential cleanup

on:
  push:
    branches:
      - p0-staging
    paths:
      - .github/workflows/staging-secret-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: staging-secret-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove hardcoded credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout p0-staging
        uses: actions/checkout@v4
        with:
          ref: p0-staging
          fetch-depth: 0

      - name: Clean credentials and add safeguards
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const read = (file) => fs.readFileSync(file, 'utf8');
          const write = (file, content) => fs.writeFileSync(file, content, 'utf8');

          // 1) README: keep only safe examples.
          {
            const file = 'README.md';
            let text = read(file);
            text = text.replace(/^BDL_API_KEY\s*=\s*[^\r\n]+$/gm, 'BDL_API_KEY=your_bdl_api_key');
            text = text.replace(/^ODDS_API_KEY\s*=\s*[^\r\n]+$/gm, 'ODDS_API_KEY=your_odds_api_key');
            if (!text.includes('Nunca guardes claves reales en GitHub')) {
              text = text.replace(
                'ODDS_API_KEY=your_odds_api_key\n```',
                'ODDS_API_KEY=your_odds_api_key\n```\n\n> Configura las claves reales solamente en Railway Variables. Nunca guardes claves reales en GitHub.'
              );
            }
            write(file, text);
          }

          // 2) Source: remove every literal fallback for the two API variables.
          {
            const file = 'server/routes.ts';
            let text = read(file);
            text = text.replace(
              /process\.env\.(BDL_API_KEY|ODDS_API_KEY)\s*\|\|\s*["'][^"']{16,}["']/g,
              (_match, key) => `process.env.${key}`
            );

            // Explicit and value-free diagnostics for Odds API configuration.
            if (!text.includes('[odds-poll] ODDS_API_KEY no configurada')) {
              text = text.replace(
                /async function pollOddsForSport\(sport: string\) \{\s*try \{/,
                `async function pollOddsForSport(sport: string) {\n    try {\n      if (!ODDS_API_KEY_BG) {\n        console.warn("[odds-poll] ODDS_API_KEY no configurada; consulta omitida.");\n        return 0;\n      }`
              );
            }

            if (!text.includes('ODDS_API_KEY no configurada en el entorno')) {
              text = text.replace(
                /app\.get\("\/api\/odds\/:sport", async \(req, res\) => \{\s*try \{/,
                `app.get("/api/odds/:sport", async (req, res) => {\n    if (!ODDS_API_KEY) {\n      return res.status(503).json({\n        success: false,\n        error: "ODDS_API_KEY no configurada en el entorno",\n      });\n    }\n    try {`
              );
            }

            write(file, text);
          }

          // 3) Startup diagnostics without exposing values.
          {
            const file = 'server/index.ts';
            let text = read(file);
            if (!text.includes('[config] Variables API faltantes:')) {
              text = text.replace(
                'const httpServer = createServer(app);',
                `const httpServer = createServer(app);\n\nconst missingApiVariables = ["BDL_API_KEY", "ODDS_API_KEY"].filter(\n  (name) => !process.env[name],\n);\nif (missingApiVariables.length > 0) {\n  console.warn(\n    \`[config] Variables API faltantes: \${missingApiVariables.join(", ")}\`,\n  );\n}`
              );
            }
            write(file, text);
          }

          // 4) Ignore local secrets, generated files and runtime state.
          write('.gitignore', `# Dependencies and builds\nnode_modules/\ndist/\ncoverage/\n.tmp/\n\n# Environment and credentials\n.env\n.env.*\n!.env.example\n*.pem\n*.key\n\n# Runtime data\ndata/picks.json\ndata/*.db\ndata/*.sqlite\ndata/*.sqlite3\n*.db\n*.sqlite\n*.sqlite3\n\n# Logs and OS files\n*.log\nnpm-debug.log*\nyarn-debug.log*\npnpm-debug.log*\n.DS_Store\nThumbs.db\n`);

          // 5) Permanent repository scanner.
          fs.mkdirSync('scripts', { recursive: true });
          write('scripts/secret-scan.mjs', `import { execFileSync } from "node:child_process";\nimport fs from "node:fs";\n\nconst files = execFileSync("git", ["ls-files", "-z"], { encoding: "utf8" })\n  .split("\\0")\n  .filter(Boolean);\n\nconst checks = [\n  {\n    name: "literal fallback after process.env",\n    regex: /process\\.env\\.(?:BDL_API_KEY|ODDS_API_KEY)\\s*\\|\\|\\s*["'][A-Za-z0-9_-]{16,}["']/g,\n  },\n  {\n    name: "hardcoded env assignment",\n    regex: /^\\s*(?:BDL_API_KEY|ODDS_API_KEY)\\s*=\\s*(?!your_|<|\\$\\{)[A-Za-z0-9_-]{20,}\\s*$/gm,\n  },\n  {\n    name: "hardcoded JSON or YAML credential",\n    regex: /["']?(?:BDL_API_KEY|ODDS_API_KEY)["']?\\s*:\\s*["'][A-Za-z0-9_-]{20,}["']/g,\n  },\n  {\n    name: "literal Odds API query key",\n    regex: /apiKey=[A-Za-z0-9_-]{20,}/g,\n  },\n];\n\nconst findings = [];\nfor (const file of files) {\n  let content;\n  try {\n    const buffer = fs.readFileSync(file);\n    if (buffer.includes(0)) continue;\n    content = buffer.toString("utf8");\n  } catch {\n    continue;\n  }\n\n  for (const check of checks) {\n    check.regex.lastIndex = 0;\n    for (const match of content.matchAll(check.regex)) {\n      const line = content.slice(0, match.index).split("\\n").length;\n      findings.push(\`${file}:\${line} — \${check.name}\`);\n    }\n  }\n}\n\nif (findings.length > 0) {\n  console.error("Se detectaron posibles credenciales hardcodeadas:\\n" + findings.join("\\n"));\n  process.exit(1);\n}\n\nconsole.log("PASS secret-scan — no hay credenciales API literales en archivos rastreados.");\n`);

          // 6) Run the secret scanner before committing.
          execFileSync('node', ['scripts/secret-scan.mjs'], { stdio: 'inherit' });

          // 7) Add the scanner to the permanent staging regression workflow.
          {
            const file = '.github/workflows/staging-mlb-smoke.yml';
            let text = read(file);
            if (!text.includes('Scan repository for hardcoded API credentials')) {
              text = text.replace(
                '      - name: Wait for Railway and run MLB regression suite',
                `      - name: Scan repository for hardcoded API credentials\n        run: node scripts/secret-scan.mjs\n\n      - name: Wait for Railway and run MLB regression suite`
              );
            }
            write(file, text);
          }
          NODE

      - name: Commit cleanup to p0-staging
        shell: bash
        run: |
          git config user.name "rogelroque940830-bot"
          git config user.email "272644701+rogelroque940830-bot@users.noreply.github.com"

          git rm --cached --ignore-unmatch data/picks.json data/*.db data/*.sqlite data/*.sqlite3 || true
          rm -f .github/workflows/staging-secret-cleanup-once.yml

          git add README.md .gitignore server/routes.ts server/index.ts scripts/secret-scan.mjs .github/workflows/staging-mlb-smoke.yml
          git add -u .github/workflows/staging-secret-cleanup-once.yml data || true

          if git diff --cached --quiet; then
            echo "No cleanup changes were needed."
            exit 0
          fi

          git commit -m "security(staging): remove hardcoded API credentials"
          git push origin HEAD:p0-staging
