name: WNBA R1A.3 ESPN Prior-Game Probe

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'scripts/wnba-r1a3-espn-prior-game-probe.py'
      - '.github/workflows/wnba-r1a3-espn-prior-game-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe credential-free ESPN prior-game source
        run: python scripts/wnba-r1a3-espn-prior-game-probe.py
      - name: Upload R1A.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a3-espn-prior-game-probe-${{ github.run_id }}
          path: wnba-r1a3-espn-prior-game-probe.json
          if-no-files-found: error
