name: Research P0 Local Backend Boot Smoke

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p0-local-backend-boot-smoke.yml'

permissions:
  contents: read

jobs:
  local-backend-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Verify exact one-file research scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          [[ "$changed" == '.github/workflows/research-p0-local-backend-boot-smoke.yml' ]]

      - name: Install and build exact backend bundle
        run: |
          npm ci
          npm run build:backend

      - name: Start bundle and prove localhost health
        shell: bash
        env:
          NODE_ENV: test
          PORT: '5055'
          BDL_API_KEY: local-smoke-placeholder
          ODDS_API_KEY: local-smoke-placeholder
          COURTEDGE_WRITE_TOKEN: local-smoke-write-token
          COURTEDGE_SESSION_SECRET: local-smoke-session-secret
          COURTEDGE_ADMIN_USERNAME: admin
          RAILWAY_GIT_COMMIT_SHA: local-boot-smoke
          MLB_LEDGER_AUTO_SETTLE: 'false'
          MLB_CLOSING_LINE_CAPTURE: 'false'
        run: |
          set -euo pipefail
          mkdir -p audit
          node dist/index.cjs > audit/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          code='000'
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 5 http://127.0.0.1:5055/health || true)
            [[ "$code" == '200' ]] && break
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          running=false
          kill -0 "$pid" 2>/dev/null && running=true
          node -e "const fs=require('fs');let h=null;try{h=JSON.parse(fs.readFileSync('audit/health.json','utf8'))}catch{};fs.writeFileSync('audit/result.json',JSON.stringify({schemaVersion:'p0-local-backend-boot-smoke.v1',httpStatus:'${code}',processRunning:${running},healthStatus:h?.status||null,commit:h?.commit||null,bootSucceeded:'${code}'==='200'&&${running}},null,2));"
          if [[ "$code" != '200' ]]; then
            echo '--- server log ---'
            cat audit/server.log
            exit 1
          fi

      - name: Upload local boot evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-local-backend-boot-smoke
          path: |
            audit/result.json
            audit/server.log
          if-no-files-found: error
          retention-days: 14
