name: Validate P1-M6A2 MLB Market Odds Universe

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-odds-normalizer.test.ts'
      - 'server/mlb-market-universe-odds-routes.ts'
      - 'server/mlb-market-universe-odds-routes.test.ts'
      - 'server/routes.ts'
      - 'tsconfig.p1-m6a2-market-odds.json'
      - 'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md'
      - '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-verified-florida-book-key:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact Florida execution-book corrections idempotently
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          normalizer = Path('server/mlb-market-odds-normalizer.ts')
          text = normalizer.read_text()
          before = '''export const MLB_EXECUTION_BOOK_PRIORITY = [
            "hardrockbet_fl",
            "hardrockbet",
            "hardrockbet_az",
          ] as const;'''.replace('          ', '')
          after = '''export const MLB_EXECUTION_BOOK_PRIORITY = [
            "hardrockbet_fl",
          ] as const;'''.replace('          ', '')
          if before in text:
              text = text.replace(before, after)
          elif after not in text:
              raise SystemExit('unexpected execution-book block')
          normalizer.write_text(text)

          tests = Path('server/mlb-market-odds-normalizer.test.ts')
          text = tests.read_text().replace('book("hardrockbet",', 'book("hardrockbet_fl",')
          tests.write_text(text)

          route_tests = Path('server/mlb-market-universe-odds-routes.test.ts')
          text = route_tests.read_text()
          marker = '  assert.equal(url.searchParams.get("bookmakers"), MLB_P1_M6A2_BOOKMAKERS.join(","));\n'
          addition = '  assert.deepEqual([...MLB_P1_M6A2_BOOKMAKERS], ["hardrockbet_fl", "draftkings", "fanduel", "betmgm"]);\n  assert.equal(MLB_P1_M6A2_BOOKMAKERS.includes("hardrockbet" as any), false);\n  assert.equal(MLB_P1_M6A2_BOOKMAKERS.includes("hardrockbet_az" as any), false);\n'
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('bookmaker assertion marker missing')
              text = text.replace(marker, marker + addition)
          route_tests.write_text(text)

          docs = Path('docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md')
          text = docs.read_text()
          before_docs = '''Execution-book priority:

1. `hardrockbet_fl`
2. `hardrockbet`
3. `hardrockbet_az`
'''
          after_docs = '''Execution book:

- `hardrockbet_fl` — the verified Florida-specific Hard Rock Bet bookmaker key.

Arizona and Ohio Hard Rock books are different jurisdiction-specific execution venues and are not substitutes for the Florida price. No generic `hardrockbet` key is requested because it is not part of the verified provider bookmaker catalog used by this phase.
'''
          if before_docs in text:
              text = text.replace(before_docs, after_docs)
          elif after_docs not in text:
              raise SystemExit('unexpected docs execution-book block')
          text = text.replace('P1-M6A2 requests six explicit bookmakers.', 'P1-M6A2 requests four explicit bookmakers.')
          docs.write_text(text)
          PY
          git diff --check
      - name: Push source-only correction when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rogelroque940830-bot'
          git config user.email '272644701+rogelroque940830-bot@users.noreply.github.com'
          git add server/mlb-market-odds-normalizer.ts server/mlb-market-odds-normalizer.test.ts server/mlb-market-universe-odds-routes.test.ts docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Florida bookmaker key already verified on branch.'
            exit 0
          fi
          git commit -m 'P1-M6A2: restrict executable odds to verified Hard Rock Florida key'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate-p1-m6a2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck P1-M6A2 market-odds surface
        run: npx tsc -p tsconfig.p1-m6a2-market-odds.json
      - name: Run P1-M6A2 normalization and provider-request tests
        run: |
          npx tsx --test \
            server/mlb-market-odds-normalizer.test.ts \
            server/mlb-market-universe-odds-routes.test.ts \
            server/mlb-f5-odds-routes.test.ts
      - name: Preserve P1-M6A1 ledger and settlement contracts
        run: npm run test:mlb-ledger
      - name: Preserve modular route contract and production backend build
        run: |
          npm run test:s3-modularization
          npm run build:backend
      - name: Preserve real-save and shadow scientific gates
        run: |
          npm run test:s5a-e2e
          npm run test:s5b-shadow
      - name: Verify P1-M6A2 fail-closed safety invariants
        shell: bash
        run: |
          set -euo pipefail
          normalizer='server/mlb-market-odds-normalizer.ts'
          route='server/mlb-market-universe-odds-routes.ts'
          docs='docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md'
          grep -F 'courtedge-p1-m6a2-mlb-market-odds-universe.v1' "$normalizer"
          grep -F 'hardrockbet_fl' "$normalizer"
          grep -F 'reference_consensus' "$normalizer"
          grep -F 'F5_TEAM_TOTAL_NOT_DOCUMENTED_BY_PROVIDER' "$normalizer"
          grep -F 'F3_TEAM_TOTAL_NOT_DOCUMENTED_BY_PROVIDER' "$normalizer"
          grep -F 'pair[0].line !== 0.5' "$normalizer"
          grep -F 'h2h_3_way_1st_3_innings' "$normalizer"
          grep -F 'FRESH_EXECUTION_BOOK_QUOTE_REQUIRED' "$normalizer"
          grep -F 'referenceQuotesExecutable: false' "$route"
          grep -F 'undocumentedMarketsInvented: false' "$route"
          grep -F 'threeWayCoercedToTwoWay: false' "$route"
          grep -F 'partialSlateCached: false' "$route"
          grep -F 'x-requests-last' "$route"
          grep -F 'if (complete)' "$route"
          grep -Fi 'reference consensus is analytical price evidence only' "$docs"
          grep -Fi 'never caches partial coverage' "$docs"
          grep -F 'registerMlbP1M6a2MarketUniverseOddsRoutes(app)' server/routes.ts
          ! grep -E 'appendPrediction\(|appendSettlement\(|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' "$normalizer" "$route"
      - name: Verify P1-M6A2 route precedes legacy market support
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('server/routes.ts', 'utf8');
          const universe = source.indexOf('registerMlbP1M6a2MarketUniverseOddsRoutes(app)');
          const legacy = source.indexOf('registerMarketSupportRoutes(app)');
          if (universe < 0 || legacy < 0 || universe >= legacy) {
            throw new Error('P1-M6A2 market-universe route must be registered before legacy market support');
          }
          NODE
          grep -F 'courtedge-p1-m6a2-mlb-market-odds-universe.v1' dist/index.cjs
          grep -F '/api/mlb/p1/v1/market-universe-odds' dist/index.cjs
      - name: Verify exact P1-M6A2 scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-staging-secure --depth=1
          git diff --check origin/integration/p0-staging-secure...HEAD
          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml' \
            'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md' \
            'server/mlb-market-odds-normalizer.test.ts' \
            'server/mlb-market-odds-normalizer.ts' \
            'server/mlb-market-universe-odds-routes.test.ts' \
            'server/mlb-market-universe-odds-routes.ts' \
            'server/routes.ts' \
            'tsconfig.p1-m6a2-market-odds.json' | sort)
          [[ "$changed" == "$expected" ]]
