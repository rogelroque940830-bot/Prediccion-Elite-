name: Validate P0 Step 12V79 Dynamic Team Strength Route Threat Regimes

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json'
      - 'scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py'
      - 'scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes-runner.py'
      - '.github/workflows/validate-p0-step12v79-dynamic-team-strength-route-threat-regimes.yml'

permissions:
  contents: read
  actions: read

jobs:
  dynamic-team-strength-route-threat-regimes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'
      - name: Prove V79 contract predates scorer
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json | tail -1)"
          SCORER_ADD="$(git log --diff-filter=A --format=%H -- scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py | tail -1)"
          test -n "$CONTRACT_ADD"; test -n "$SCORER_ADD"; test "$CONTRACT_ADD" != "$SCORER_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SCORER_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json'))
          assert c['scientificStatus']=='FROZEN_DYNAMIC_TEAM_STRENGTH_ROUTE_THREAT_REGIMES_BEFORE_ANY_V79_SCORER_EXISTS'
          assert c['pregameStrengthDefinition']['minimumPriorGamesPerTeam']==20
          assert c['pregameStrengthDefinition']['primaryStrengthScore'].startswith('Equal-weight')
          assert c['pregameStrengthDefinition']['extremeOpponentGapNaturalBoundary'].startswith('strengthGap >= 1/3')
          assert len(c['predeclaredContextPolicies'])==8
          assert c['statisticsBoundary']['tierBoundarySearchAllowed'] is False
          assert c['statisticsBoundary']['liveCounterSideSwitchCreatedByV79'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V79_CONTRACT_PRE_SCORER_FREEZE_PROVED')
          PY
      - name: Syntax check V79 scorer and repair runner
        run: |
          python -m py_compile scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py
          python -m py_compile scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes-runner.py
      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793
      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189
      - name: Resolve immutable inputs
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do
            test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"
            test -s "inputs/step12v3/$S/cohort/official-acquisition.json"
          done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY"; test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"
      - name: Execute frozen V79 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes-runner.py \
            --root inputs/step12v3 \
            --custody '${{ steps.paths.outputs.custody }}' \
            --v16-manifest '${{ steps.paths.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v72-scorer scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py \
            --v77-scorer scripts/p0-step12v77-general-consensus-loss-threat-geometry.py \
            --v78-scorer scripts/p0-step12v78-route-aware-warning-veto-flip-audit.py \
            --v78-summary research/p0-step12v78-route-aware-warning-veto-flip-audit-result-summary.json \
            --contract research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json \
            --out work/v79-dynamic-team-strength-route-threat-regimes.json
      - name: Validate V79 parity and boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v79-dynamic-team-strength-route-threat-regimes.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v79-dynamic-team-strength-route-threat-regimes.v1'
          assert r['classification']=='V79_DYNAMIC_TEAM_STRENGTH_ROUTE_THREAT_REGIMES_RETROSPECTIVE_COMPLETE'
          assert r['parentParity']=={'pickDays':395,'decisiveRows':392,'wins':254,'losses':138,'pushes':3}
          assert len(r['all138LossContextLedger'])==138
          assert set(r['predeclaredContextPolicyResults'])=={
            'ALL_SELECTED_WEAKER_TIER','V78_WARNING_AND_SELECTED_WEAKER_TIER','V78_WARNING_AND_POSITIVE_STRENGTH_GAP',
            'V78_WARNING_AND_EXTREME_OPPONENT_STRENGTH_GAP_GE_ONE_THIRD','V78_WARNING_AND_SELECTED_NOT_TOP_VS_OPPONENT_TOP',
            'V78_WARNING_AND_SELECTED_WEAKER_AND_OPPONENT_ADVANTAGE_MAJORITY','SELECTED_WEAKER_AND_OPPONENT_ADVANTAGE_MAJORITY',
            'SELECTED_NOT_TOP_VS_OPPONENT_TOP_AND_OPPONENT_ADVANTAGE_MAJORITY'
          }
          for route,grid in r['primaryRouteSelectedTierByOpponentTierMatrix'].items():
            assert set(grid)=={'BOTTOM','MID','TOP'}
            for st in grid: assert set(grid[st])=={'BOTTOM','MID','TOP'}
          g=r['guardrails']
          assert g['strictPregameStrengthOnly'] is True and g['sameDateGamesExcludedFromStrengthSnapshot'] is True
          assert g['fixedThirdsTierBoundaries'] is True and g['allNineCellsReportedNoSelection'] is True
          assert g['thresholdSearchPerformed'] is False and g['liveCounterSideSwitchCreated'] is False
          assert g['productionChanged'] is False and g['prospectiveV68Changed'] is False
          assert g['realFinancialExposure']==0
          print(json.dumps({
            'relation':r['primaryRouteTierRelation'],
            'strongRiskCells':r['predeclaredStrongRiskCells'],
            'contexts':{k:{'n':v['flaggedDecisiveRows'],'origW':v['originalWins'],'origL':v['originalLosses'],'oppPrecision':v['counterSidePrecision'],'netFlip':v['netCorrectDecisionChangeIfFlipped'],'vetoHit':v['vetoPortfolio']['hitRate'],'vetoCoverage':v['vetoPortfolio']['coverageVsBaselinePickDays']} for k,v in r['predeclaredContextPolicyResults'].items()},
            'gapAuc':{k:v['lossWarningAuc'] for k,v in r['strengthGapLossAssociation'].items()}
          },indent=2))
          PY
      - name: Upload V79 report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v79-dynamic-team-strength-route-threat-regimes
          path: work/v79-dynamic-team-strength-route-threat-regimes.json
          if-no-files-found: error
          retention-days: 90
