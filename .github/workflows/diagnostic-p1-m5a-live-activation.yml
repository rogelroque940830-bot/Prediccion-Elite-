name: Diagnostic P1-M5A Live Activation

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-p1-m5a-live-activation.yml'

permissions:
  contents: read

jobs:
  verify-live-p1-m5a:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_FRONTEND_RELEASE: p1-m5a-real-cohort-activation-ui-2026-08-06
      EXPECTED_BACKEND_COMMIT: 9bdd5a888745a0a9879d5a079c73103577ace39b
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact P1-M5A release and verify read-only safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit

          for attempt in $(seq 1 100); do
            index_code=$(curl -sS -L -o audit/index.html -w '%{http_code}' --max-time 25 "${FRONTEND_URL}/" || true)
            health_code=$(curl -sS -o audit/backend-health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            ledger_before_code=$(curl -sS -o audit/ledger-before.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            review_code=$(curl -sS -o audit/anonymous-review.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/p1/v1/economic-review" || true)
            ledger_after_code=$(curl -sS -o audit/ledger-after.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)

            rm -f audit/bundle.js audit/script-sources.txt
            if [[ "${index_code}" == "200" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('audit/index.html', 'utf8');
          const sources = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((match) => match[1]);
          fs.writeFileSync('audit/script-sources.txt', `${sources.join('\n')}\n`);
          NODE
              : > audit/bundle.js
              while IFS= read -r source || [[ -n "${source}" ]]; do
                [[ -n "${source}" ]] || continue
                if [[ "${source}" =~ ^https?:// ]]; then
                  asset_url="${source}"
                else
                  clean="${source#./}"
                  clean="${clean#/}"
                  asset_url="${FRONTEND_URL}/${clean}"
                fi
                curl -sS -L --max-time 30 "${asset_url}" >> audit/bundle.js || true
                printf '\n' >> audit/bundle.js
              done < audit/script-sources.txt
            fi

            release_ok=false
            markers_ok=false
            backend_ok=false
            if [[ -s audit/bundle.js ]] && grep -Fq "${EXPECTED_FRONTEND_RELEASE}" audit/bundle.js; then
              release_ok=true
            fi
            if [[ -s audit/bundle.js ]] \
              && grep -Fq 'Activación de la cohorte interactiva real' audit/bundle.js \
              && grep -Fq 'Esperando primera predicción real' audit/bundle.js \
              && grep -Fq 'Captura real registrada' audit/bundle.js \
              && grep -Fq 'Decisión económica registrada' audit/bundle.js \
              && grep -Fq 'Cohorte real certificada de extremo a extremo' audit/bundle.js \
              && grep -Fq 'Certificación bloqueada por integridad' audit/bundle.js \
              && grep -Fq 'Checklist certificado por el backend' audit/bundle.js \
              && grep -Fq 'SHADOW · exposición 0' audit/bundle.js; then
              markers_ok=true
            fi
            if [[ "${health_code}" == "200" ]] && node -e '
              const fs=require("fs");
              const h=JSON.parse(fs.readFileSync("audit/backend-health.json","utf8"));
              process.exit(h.commit===process.env.EXPECTED_BACKEND_COMMIT ? 0 : 1);
            '; then
              backend_ok=true
            fi

            echo "Attempt ${attempt}/100: index=${index_code} health=${health_code} ledgerBefore=${ledger_before_code} review=${review_code} ledgerAfter=${ledger_after_code} release=${release_ok} markers=${markers_ok} backend=${backend_ok}"

            if [[ "${index_code}" == "200" \
              && "${health_code}" == "200" \
              && "${ledger_before_code}" == "200" \
              && "${review_code}" == "401" \
              && "${ledger_after_code}" == "200" \
              && "${release_ok}" == "true" \
              && "${markers_ok}" == "true" \
              && "${backend_ok}" == "true" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(name, 'utf8'));
          const health = read('audit/backend-health.json');
          const before = read('audit/ledger-before.json');
          const after = read('audit/ledger-after.json');
          const anonymous = read('audit/anonymous-review.json');
          const bundle = fs.readFileSync('audit/bundle.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const markers = [
            process.env.EXPECTED_FRONTEND_RELEASE,
            'Activación de la cohorte interactiva real',
            'Esperando primera predicción real',
            'Captura real registrada',
            'Decisión económica registrada',
            'Cohorte real certificada de extremo a extremo',
            'Certificación bloqueada por integridad',
            'Checklist certificado por el backend',
            'SHADOW · exposición 0',
          ];

          assert(health.status === 'healthy', `backend health=${health.status}`);
          assert(health.commit === process.env.EXPECTED_BACKEND_COMMIT, `backend commit=${health.commit}`);
          assert(before.success === true && after.success === true, 'ledger status failed');
          assert(before.data?.schemaVersion === 'mlb-ledger.v1', `ledger schema=${before.data?.schemaVersion}`);
          assert(before.data?.immutable === true && after.data?.immutable === true, 'ledger immutable=false');
          assert(JSON.stringify(before.data) === JSON.stringify(after.data), 'ledger changed after anonymous read');
          assert(anonymous.success === false, 'anonymous review unexpectedly succeeded');
          assert(/Authentication|session required/i.test(String(anonymous.error || '')), `review error=${anonymous.error}`);
          for (const marker of markers) assert(bundle.includes(marker), `missing bundle marker: ${marker}`);

          const evidence = {
            frontendRelease: process.env.EXPECTED_FRONTEND_RELEASE,
            frontendMerge: 'f2d96076c3a1fffd266f635a7fd4ece0f2602ee7',
            backendCommit: health.commit,
            environment: health.environment,
            endpoint: '/api/mlb/p1/v1/economic-review',
            anonymousGetStatus: 401,
            anonymousReadProtected: true,
            visibleStates: [
              'WAITING_FOR_REAL_CAPTURE',
              'CAPTURE_REGISTERED',
              'ECONOMIC_DECISION_REGISTERED',
              'END_TO_END_CERTIFIED',
              'BLOCKED_INTEGRITY',
            ],
            ledger: {
              schemaVersion: before.data.schemaVersion,
              immutable: before.data.immutable,
              predictions: before.data.predictions,
              settlementEvents: before.data.settlementEvents,
              unchangedAfterRequest: true,
            },
            authenticatedPrivateMetricsReadByDiagnostic: false,
            syntheticCapturesCreatedByDiagnostic: 0,
            picksCreatedByDiagnostic: 0,
            settlementWritesByDiagnostic: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
              exit 0
            fi

            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact P1-M5A live deployment' >&2
              for file in backend-health.json ledger-before.json anonymous-review.json ledger-after.json script-sources.txt; do
                echo "--- ${file}"
                cat "audit/${file}" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 10
          done
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m5a-live-activation-evidence
          path: audit
          if-no-files-found: warn
