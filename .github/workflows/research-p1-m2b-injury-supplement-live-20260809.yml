name: Research P1-M2B Injury Supplement Live 2026-08-09

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p1-m2b-injury-supplement-live-20260809.yml'

permissions:
  contents: read

jobs:
  audit-live-injury-supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      AUDIT_DATE: '2026-08-09'
      EXPECTED_COMMIT: 30affdc625cb6cfec3851be0c4d9c2ba583368f5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact one-file research scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          [[ "$changed" == '.github/workflows/research-p1-m2b-injury-supplement-live-20260809.yml' ]]

      - name: Audit exact deployed backend and sanitized injury reconciliation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit private
          chmod 700 private

          health_code=$(curl -sS -o private/health.json -w '%{http_code}' --max-time 45 "${BACKEND_URL}/health" || true)
          all_code=$(curl -sS -o private/all.json -w '%{http_code}' --max-time 120 "${BACKEND_URL}/api/mlb/all?date=${AUDIT_DATE}" || true)
          health_code=${health_code:-000}
          all_code=${all_code:-000}

          HEALTH_CODE="$health_code" ALL_CODE="$all_code" AUDIT_DATE="$AUDIT_DATE" EXPECTED_COMMIT="$EXPECTED_COMMIT" node <<'NODE'
          const fs=require('fs');
          const code=v=>/^\d{3}$/.test(String(v||''))?String(v):'000';
          const clean=v=>String(v??'').trim().toUpperCase();
          const nonneg=v=>Number.isFinite(Number(v))?Math.max(0,Math.trunc(Number(v))):0;
          const bump=(o,k)=>{o[k]=(o[k]||0)+1;};
          const endpointStatus={health:code(process.env.HEALTH_CODE),all:code(process.env.ALL_CODE)};
          const expected=String(process.env.EXPECTED_COMMIT||'').trim().toLowerCase();
          const result={
            schemaVersion:'p1-m2b-injury-supplement-live.v1',
            generatedAt:new Date().toISOString(),
            auditDate:process.env.AUDIT_DATE,
            endpointStatus,
            expectedCommit:expected,
            deployedCommit:null,
            deployedCommitMatchesExpected:false,
            aggregate:{
              measuredGames:0,measuredSides:0,
              statusCounts:{},phaseBCoverageCounts:{},coverageModeCounts:{},
              verifiedSides:0,partialSides:0,
              officiallySupplementedSides:0,officiallySupplementedPlayers:0,
              coverageReconciledSides:0,evidenceOnlySupplementSides:0,
              partialWithRejectedIdentity:0,partialWithOfficialOnlyGapNoRejects:0,
              partialWithSourceHealthProblem:0,partialOther:0,
              rejectedIdentityTotal:0,remainingOfficialOnlyTotal:0,sourceErrorTotal:0,
              phaseBFullSides:0,phaseBPartialSides:0,phaseBBlockedSides:0
            },
            samples:[],
            safety:{writesPerformed:0,predictionsCreated:0,settlementsCreated:0,betsPlaced:0,rawIdentityUploaded:false,phaseBMutatedByAudit:false,modelFormulaChanged:false}
          };
          if(endpointStatus.health==='200'){
            try{
              const h=JSON.parse(fs.readFileSync('private/health.json','utf8'));
              const commit=String(h?.commit||'').trim().toLowerCase();
              result.deployedCommit=/^[0-9a-f]{7,40}$/.test(commit)?commit:null;
              result.deployedCommitMatchesExpected=Boolean(result.deployedCommit)
                && (expected===result.deployedCommit || expected.startsWith(result.deployedCommit) || result.deployedCommit.startsWith(expected));
            }catch{}
          }
          const custody=endpointStatus.health==='200'&&endpointStatus.all==='200'&&result.deployedCommitMatchesExpected;
          if(custody){
            let payload=null;
            try{payload=JSON.parse(fs.readFileSync('private/all.json','utf8'));}catch{}
            const games=Array.isArray(payload?.games)?payload.games:Array.isArray(payload?.data?.games)?payload.data.games:[];
            for(let i=0;i<games.length;i++){
              const game=games[i];
              const sample={gameOrdinal:i+1,sides:{}};
              let valid=0;
              for(const side of ['home','away']){
                const meta=game?.[`${side}InjuryData`];
                if(!meta){sample.sides[side]={status:'MISSING'};continue;}
                valid++;
                const status=clean(meta.status)||'MISSING';
                const phaseBCoverage=clean(meta?.phaseB?.coverage)||'MISSING';
                const coverageMode=clean(meta?.coverageMode)||'LEGACY';
                const rejected=nonneg(meta.rejectedCount);
                const officialOnly=nonneg(meta?.shadowSummary?.officialOnly);
                const supplemented=nonneg(meta.officialSupplementedCount ?? meta?.shadowSummary?.officialSupplemented);
                const unresolved=nonneg(meta.unresolvedOfficialOnlyCount ?? meta?.shadowSummary?.unresolvedOfficialOnly ?? officialOnly);
                const sourceErrors=Array.isArray(meta.sourceErrors)?meta.sourceErrors.length:0;
                const sourceHealthy=clean(meta.officialValidationStatus)==='VERIFIED'&&meta.stale!==true&&sourceErrors===0;
                const reconciled=meta.coverageReconciled===true;
                const evidenceOnly=meta.supplementEvidenceOnly===true;
                bump(result.aggregate.statusCounts,status);
                bump(result.aggregate.phaseBCoverageCounts,phaseBCoverage);
                bump(result.aggregate.coverageModeCounts,coverageMode);
                result.aggregate.measuredSides++;
                if(status==='VERIFIED') result.aggregate.verifiedSides++;
                if(status==='PARTIAL') result.aggregate.partialSides++;
                if(phaseBCoverage==='FULL') result.aggregate.phaseBFullSides++;
                if(phaseBCoverage==='PARTIAL') result.aggregate.phaseBPartialSides++;
                if(phaseBCoverage==='BLOCKED') result.aggregate.phaseBBlockedSides++;
                if(supplemented>0){result.aggregate.officiallySupplementedSides++;result.aggregate.officiallySupplementedPlayers+=supplemented;}
                if(reconciled) result.aggregate.coverageReconciledSides++;
                if(evidenceOnly) result.aggregate.evidenceOnlySupplementSides++;
                result.aggregate.rejectedIdentityTotal+=rejected;
                result.aggregate.remainingOfficialOnlyTotal+=unresolved;
                result.aggregate.sourceErrorTotal+=sourceErrors;
                if(status==='PARTIAL'){
                  if(rejected>0) result.aggregate.partialWithRejectedIdentity++;
                  else if(!sourceHealthy) result.aggregate.partialWithSourceHealthProblem++;
                  else if(unresolved>0 || officialOnly>0) result.aggregate.partialWithOfficialOnlyGapNoRejects++;
                  else result.aggregate.partialOther++;
                }
                sample.sides[side]={status,phaseBCoverage,coverageMode,rejectedCount:rejected,officialOnly,supplementedCount:supplemented,unresolvedOfficialOnly:unresolved,coverageReconciled:reconciled,supplementEvidenceOnly:evidenceOnly,sourceHealthy};
              }
              if(valid>0){result.aggregate.measuredGames++;result.samples.push(sample);}
            }
          }
          result.conclusion={
            chainOfCustodyOk:custody,
            backendUsable:custody&&result.aggregate.measuredGames>0,
            supplementObserved:result.aggregate.officiallySupplementedSides>0,
            safeOfficialOnlyGapRecovered:result.aggregate.officiallySupplementedSides,
            rejectedIdentitySidesRemainFailClosed:result.aggregate.partialWithRejectedIdentity,
            unresolvedSafeOfficialOnlySides:result.aggregate.partialWithOfficialOnlyGapNoRejects,
            phaseBUnchangedBySupplementDesign:true,
            safeToIgnoreRejectedExternalRecords:false,
            nextStep:!custody?'WAIT_FOR_EXACT_DEPLOY':(result.aggregate.partialWithOfficialOnlyGapNoRejects>0?'INVESTIGATE_UNRESOLVED_SAFE_GAPS':(result.aggregate.partialWithRejectedIdentity>0?'INVESTIGATE_REJECTED_IDENTITIES':'RUN_M2B_READINESS_AUDIT'))
          };
          fs.writeFileSync('audit/result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify({endpointStatus:result.endpointStatus,deployedCommit:result.deployedCommit,deployedCommitMatchesExpected:result.deployedCommitMatchesExpected,aggregate:result.aggregate,conclusion:result.conclusion},null,2));
          NODE

          rm -rf private
          test -f audit/result.json

      - name: Prove accepted artifact is identity-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E '"gamePk"|"teamId"|"playerId"|"name"|"homeTeam"|"awayTeam"|/api/mlb/[A-Za-z0-9_-]+/[0-9]+' audit/result.json

      - name: Upload sanitized injury supplement evidence
        uses: actions/upload-artifact@v4
        with:
          name: p1-m2b-injury-supplement-live-20260809
          path: audit/result.json
          if-no-files-found: error
          retention-days: 30
