name: Apply S2 route param type fixes

on:
  pull_request:
    branches:
      - feature/s2-multiuser-picks-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply mechanical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacement = 'decodeURIComponent(Array.isArray(req.params.id) ? req.params.id[0] || "" : req.params.id || "")'
          for filename in [
              'server/mlb-ledger-multiuser.ts',
              'server/picks-v2-multiuser.ts',
          ]:
              path = Path(filename)
              text = path.read_text()
              old = 'decodeURIComponent(req.params.id || "")'
              count = text.count(old)
              if count == 0:
                  print(f'{filename}: already patched')
              else:
                  path.write_text(text.replace(old, replacement))
                  print(f'{filename}: patched {count} occurrence(s)')

          config = Path('tsconfig.s2-multiuser.json')
          text = config.read_text()
          text = text.replace('    "server/user-data-context.test.ts",\n    "server/index.ts"', '    "server/user-data-context.test.ts"')
          config.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-ledger-multiuser.ts server/picks-v2-multiuser.ts tsconfig.s2-multiuser.json
          git commit -m "S2: normalize Express route params for typecheck"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
