name: MLB PP Horizon Frozen Live Scorer V1

on:
  workflow_dispatch:
  push:
    branches:
      - production/mlb-unified-elite-live-v1
    paths:
      - "server/mlb-unified-elite-frozen-authority-v1.ts"
      - "server/mlb-full-modular-frozen-live-scorer-v1.ts"
      - "server/mlb-pp-horizon-frozen-live-scorer-v1.ts"
      - "scripts/mlb-full-modular-frozen-live-reference-v1.py"
      - "scripts/mlb-pp-horizon-frozen-live-reference-v1.py"
      - "scripts/mlb-pp-horizon-frozen-live-scorer-v1.test.ts"
      - "scripts/mlb-frozen-classifier-authority-v1.test.ts"
      - "research/mlb-unified-elite-live-authority-v1.json"
      - "research/mlb-full-modular-pp-horizon-model-snapshot-v1.json"
      - "research/mlb-frozen-classifier-authority-v1.json"
      - ".github/workflows/mlb-pp-horizon-frozen-live-scorer-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/mlb-unified-elite-frozen-authority-v1.ts"
      - "server/mlb-full-modular-frozen-live-scorer-v1.ts"
      - "server/mlb-pp-horizon-frozen-live-scorer-v1.ts"
      - "scripts/mlb-full-modular-frozen-live-reference-v1.py"
      - "scripts/mlb-pp-horizon-frozen-live-reference-v1.py"
      - "scripts/mlb-pp-horizon-frozen-live-scorer-v1.test.ts"
      - "scripts/mlb-frozen-classifier-authority-v1.test.ts"
      - "research/mlb-unified-elite-live-authority-v1.json"
      - "research/mlb-full-modular-pp-horizon-model-snapshot-v1.json"
      - "research/mlb-frozen-classifier-authority-v1.json"
      - ".github/workflows/mlb-pp-horizon-frozen-live-scorer-v1.yml"

permissions:
  contents: read

jobs:
  differential-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove immutable snapshots and reference blobs
        shell: bash
        run: |
          set -euo pipefail
          test "sha256:$(sha256sum research/mlb-full-modular-pp-horizon-model-snapshot-v1.json | awk '{print $1}')" = 'sha256:bf51bb1d40f8b8f7f5e18686686c916457d1f9246be928191b8803c5884cc5f9'
          test "$(git rev-parse 37b6b0e63e58ff4a1a10bb5d8acc495724c269fc:scripts/mlb-full-modular-aplus-premium-cross-anatomy-v1.py)" = 'c957ff88d320a3a87c56e7e0bd70074b1a22b8ef'
          test "$(git rev-parse e352e25c131a53536745323bcd3268dcec75a66d:scripts/mlb-market-state-matchup-modular-router-v1.py)" = '791d7f5a1d499d78a4606e5c77e22a7da5ae2ca6'
          echo MLB_PP_HORIZON_FROZEN_AUTHORITIES_PINNED

      - name: Materialize pinned historical reference implementations
        shell: bash
        run: |
          set -euo pipefail
          git show 236a6af9db8b5d03699abb402333a6fff8b44484:scripts/mlb-multi-market-coverage-expansion-v1.py > /tmp/mlb-multi-market-coverage-expansion-v1.py
          git show b2cd717f49d3063c6b7ed679674661961679d2a2:scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py > /tmp/mlb-modular-team-structure-nrfi-yrfi-v1.py
          git show e352e25c131a53536745323bcd3268dcec75a66d:scripts/mlb-market-state-matchup-modular-router-v1.py > /tmp/mlb-market-state-matchup-modular-router-v1.py
          git show 37b6b0e63e58ff4a1a10bb5d8acc495724c269fc:scripts/mlb-full-modular-aplus-premium-cross-anatomy-v1.py > /tmp/mlb-full-modular-aplus-premium-cross-anatomy-v1.py
          test "$(git hash-object /tmp/mlb-full-modular-aplus-premium-cross-anatomy-v1.py)" = 'c957ff88d320a3a87c56e7e0bd70074b1a22b8ef'
          echo MLB_PP_HORIZON_PINNED_REFERENCE_IMPLEMENTATIONS_MATERIALIZED

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scientific reference dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy scikit-learn

      - name: Generate exact historical Full Modular reference fixtures
        run: |
          python scripts/mlb-full-modular-frozen-live-reference-v1.py \
            --authority research/mlb-unified-elite-live-authority-v1.json \
            --multi /tmp/mlb-multi-market-coverage-expansion-v1.py \
            --modular /tmp/mlb-modular-team-structure-nrfi-yrfi-v1.py \
            --full /tmp/mlb-market-state-matchup-modular-router-v1.py \
            --out /tmp/mlb-full-modular-reference-v1.json

      - name: Generate persisted PP Horizon Python reference
        run: |
          python scripts/mlb-pp-horizon-frozen-live-reference-v1.py \
            --full-reference /tmp/mlb-full-modular-reference-v1.json \
            --full-authority research/mlb-unified-elite-live-authority-v1.json \
            --classifier-authority research/mlb-frozen-classifier-authority-v1.json \
            --pp-snapshot research/mlb-full-modular-pp-horizon-model-snapshot-v1.json \
            --cross-source /tmp/mlb-full-modular-aplus-premium-cross-anatomy-v1.py \
            --out /tmp/mlb-pp-horizon-reference-v1.json

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Prove classifier authority exact parity with certified live source
        run: npx tsx scripts/mlb-frozen-classifier-authority-v1.test.ts

      - name: Type-check frozen PP scorer surface
        run: |
          npx tsc --noEmit \
            --module ESNext \
            --moduleResolution bundler \
            --target ES2022 \
            --esModuleInterop \
            --skipLibCheck \
            --types node \
            server/mlb-unified-elite-frozen-authority-v1.ts \
            server/mlb-full-modular-frozen-live-scorer-v1.ts \
            server/mlb-pp-horizon-frozen-live-scorer-v1.ts \
            scripts/mlb-pp-horizon-frozen-live-scorer-v1.test.ts

      - name: Differential parity versus persisted Python semantics
        env:
          MLB_PP_HORIZON_REFERENCE_JSON: /tmp/mlb-pp-horizon-reference-v1.json
        run: npx tsx scripts/mlb-pp-horizon-frozen-live-scorer-v1.test.ts

      - name: Prove PP scorer bundles frozen authorities
        run: npx esbuild server/mlb-pp-horizon-frozen-live-scorer-v1.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-pp-horizon-frozen-live-scorer-v1.mjs

      - name: Prove no optimizer refit, outcomes, prices, or betting surface
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('server/mlb-pp-horizon-frozen-live-scorer-v1.ts').read_text().lower()
          forbidden=['logisticregression','lbfgs','sklearn','scipy','model.fit','fit_and_score','theoddsapi','executionodds','targetoutcome','target_outcome','stakeamount','placebet']
          found=[x for x in forbidden if x in text]
          assert not found, found
          assert 'persistedsnapshotonly: true' in text
          assert 'runtimerefit: false' in text
          assert 'preprocessingrefit: false' in text
          assert 'outcomesread: false' in text
          assert 'sportsbookpricesread: false' in text
          print('MLB_PP_HORIZON_FROZEN_LIVE_SCORER_NO_REFIT_OUTCOME_PRICE_OR_BETTING_SURFACE')
          PY
