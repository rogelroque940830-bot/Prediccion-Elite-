name: NFL R5H2 Contextual Override Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/**'
      - '.github/workflows/nfl-r5h2-contextual-override.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-r5h2:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests
      - name: Validate scripts
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py
          python -m py_compile research/nfl/nfl_r5h2_contextual_override_gate.py
      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5-output \
            --cache-dir .cache/nflverse
      - name: Rebuild R5B QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5b-output \
            --cache-dir .cache/nflverse
      - name: Rebuild R5B2 frozen feature dataset
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output \
            --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 \
            --end-season 2025
      - name: Run NFL-R5H2 contextual override search
        run: |
          python research/nfl/nfl_r5h2_contextual_override_gate.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h2-output \
            --expert-oos-start 2013 \
            --test-start 2018 \
            --end-season 2025
      - name: Enforce R5H2 boundary
        run: |
          python - <<'PY'
          import json
          a=json.load(open('nfl-r5h2-output/nfl_r5h2_audit.json'))
          v=json.load(open('nfl-r5h2-output/nfl_r5h2_verdict.json'))
          m=json.load(open('nfl-r5h2-output/nfl_r5h2_manifest.json'))
          assert a['marketBoundary']=='PASS_MARKET_FREE'
          assert a['targetSeasonUsedForGateSelection']=='NO'
          assert a['targetSeasonUsedForMetaFit']=='NO'
          assert a['gameSpecificRuleWeighting']=='PASS'
          assert a['defaultReferenceFallback']=='PASS'
          assert a['productionCodeTouched'] is False
          assert v['researchOnly'] is True
          assert v['marketDataUsed'] is False
          assert v['productionChanged'] is False
          assert v['ruleWeightsGameSpecific'] is True
          assert v['automaticProductionPromotion'] is False
          assert m['researchOnly'] is True
          assert m['marketDataUsedAsFeatures'] is False
          assert m['frozenFeatureCount']==32
          print('NFL_R5H2_BOUNDARY_VERIFIED')
          PY
      - name: Show R5H2 results
        run: |
          cat nfl-r5h2-output/nfl_r5h2_model_summary.csv
          echo
          cat nfl-r5h2-output/nfl_r5h2_by_season.csv
          echo
          cat nfl-r5h2-output/nfl_r5h2_config_by_season.csv
          echo
          cat nfl-r5h2-output/nfl_r5h2_verdict.json
      - name: Upload NFL-R5H2 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h2-contextual-override-evidence
          path: nfl-r5h2-output/
          if-no-files-found: error
          retention-days: 30
