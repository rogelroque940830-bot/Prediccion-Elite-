name: Apply S6Q Worker Log Label

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6q-worker-log-label.mjs'
      - '.github/workflows/apply-s6q-worker-log-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/patch-s6q-worker-log-label.mjs
      - name: Commit permanent patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-s6q-fifty-settlement-human-review.ts
          if git diff --cached --quiet; then
            echo 'No log label change required.'
            exit 0
          fi
          git commit -m 'Correct S6Q worker failure label'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
