name: Apply S6I Excluded Lineage Hotfix

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6i-excluded-lineage.mjs'
      - '.github/workflows/apply-s6i-excluded-lineage-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply deterministic patch
        run: node scripts/patch-s6i-excluded-lineage.mjs
      - name: Commit patch to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git add server/mlb-s6i-postfix-certification.ts server/mlb-s6i-postfix-certification.test.ts
          git commit -m 'Fix S6I readiness scoring for excluded transition lineage'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
