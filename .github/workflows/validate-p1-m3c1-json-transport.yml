name: Validate P1-M3C.1 JSON Transport Hotfix

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/client/src/App.tsx'
      - 'frontend/client/src/components/mlb-economic-decision-card.tsx'
      - 'frontend/client/src/components/mlb-scientific-capture-status.tsx'
      - 'frontend/client/src/lib/mlb-economic-decision.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture-transport.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture-transport.test.ts'
      - 'frontend/client/src/lib/queryClient.ts'
      - 'docs/P1_M3C1_JSON_TRANSPORT_HOTFIX.md'
      - '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml'
      - '.github/workflows/validate-p1-m3c1-json-transport.yml'
      - '.github/workflows/validate-p1-m4c-frontend-economic-card.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3c1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies reproducibly
        run: npm --prefix frontend ci
      - name: Run focused P1-M3C.1 and P1 regressions
        run: |
          cd frontend
          npx tsx --test \
            client/src/lib/mlb-scientific-capture-transport.test.ts \
            client/src/lib/mlb-scientific-capture.test.ts \
            client/src/lib/mlb-pregame-readiness.test.ts \
            client/src/lib/mlb-daily-flow.test.ts \
            client/src/lib/mlb-daily-slate.test.ts \
            client/src/lib/mlb-review-priority.test.ts
      - name: Run production-equivalent frontend verification
        env:
          COURTEDGE_STANDALONE_DOCKER_BUILD: 'true'
        run: npm --prefix frontend run verify
      - name: Verify exact JSON transport and safety contract
        shell: bash
        run: |
          set -euo pipefail
          app='frontend/client/src/App.tsx'
          capture='frontend/client/src/lib/mlb-scientific-capture.ts'
          transport='frontend/client/src/lib/mlb-scientific-capture-transport.ts'
          query='frontend/client/src/lib/queryClient.ts'
          legacy_workflow='.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml'

          grep -E 'MLB_P1_M3C_FRONTEND_RELEASE|MLB_P1_M4C_FRONTEND_RELEASE' "$capture"
          grep -E 'MLB_P1_M3C_FRONTEND_RELEASE|MLB_P1_M4C_FRONTEND_RELEASE' "$app"
          grep -F 'prepareMlbP1M3cSnapshotForTransport(input.scientificSnapshot)' "$capture"
          grep -F 'mlbP1M3cSha256(preparedSnapshot.payload)' "$capture"
          grep -F 'payload: preparedSnapshot.payload as unknown as Record<string, unknown>' "$capture"
          grep -F 'MLB_P1_M3A_MAX_SNAPSHOT_BYTES = 280_000' "$transport"
          grep -F 'SENSITIVE_KEY' "$transport"
          grep -F 'P1_M3C_SNAPSHOT_TOO_LARGE' "$transport"
          grep -F 'contractErrors' "$query"
          grep -F 'parsed?.details?.errors' "$query"
          grep -F 'MLB_P1_M4C_FRONTEND_RELEASE' "$legacy_workflow"
          grep -F 'mlb-scientific-capture-transport.test.ts' "$legacy_workflow"
          grep -F 'realFinancialExposure: 0 as const' "$capture"
          grep -F 'automaticBetPlacement: false as const' "$capture"

          node <<'NODE'
          const fs = require('node:fs');
          const app = fs.readFileSync('frontend/client/src/App.tsx', 'utf8');
          const capture = fs.readFileSync('frontend/client/src/lib/mlb-scientific-capture.ts', 'utf8');
          const transport = fs.readFileSync('frontend/client/src/lib/mlb-scientific-capture-transport.ts', 'utf8');
          const query = fs.readFileSync('frontend/client/src/lib/queryClient.ts', 'utf8');
          const legacy = fs.readFileSync('.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const prepare = capture.indexOf('prepareMlbP1M3cSnapshotForTransport(input.scientificSnapshot)');
          const digest = capture.indexOf('mlbP1M3cSha256(preparedSnapshot.payload)', prepare);
          const payload = capture.indexOf('payload: preparedSnapshot.payload', digest);
          assert(prepare >= 0 && digest > prepare && payload > digest, 'transport/digest/payload order is invalid');
          assert(!capture.includes('mlbP1M3cSha256(input.scientificSnapshot)'), 'in-memory snapshot is still hashed directly');
          assert(transport.includes('JSON.stringify(snapshot'), 'native JSON transport normalization missing');
          assert(transport.includes('JSON.parse(json)'), 'wire payload reconstruction missing');
          assert(query.includes('details?.errors'), 'server contract details are not surfaced');
          assert(!capture.includes('automaticBetPlacement: true'), 'automatic betting enabled');
          assert(!capture.includes('realFinancialExposure: 1'), 'non-zero exposure found');
          assert(
            app.includes('MLB_P1_M3C_FRONTEND_RELEASE') || app.includes('MLB_P1_M4C_FRONTEND_RELEASE'),
            'frontend release lineage no longer includes P1-M3C.1 or a validated successor',
          );
          assert(legacy.includes('MLB_P1_M4C_FRONTEND_RELEASE'), 'legacy scientific-emission gate does not recognize P1-M4C');
          assert(legacy.includes('Diff hygiene and protected extension scope'), 'legacy scientific-emission scope is not extension-safe');
          NODE

          cat frontend/dist/assets/*.js > /tmp/p1-m3c1-bundle.js
          grep -E 'p1-m3c1-json-digest-transport-2026-08-05|p1-m4c-mlb-economic-decision-card-2026-08-06' /tmp/p1-m3c1-bundle.js
          grep -F 'P1_M3C_SNAPSHOT_TOO_LARGE' /tmp/p1-m3c1-bundle.js
      - name: Diff hygiene and protected extension scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-frontend-session --depth=1
          git diff --check origin/integration/p0-frontend-session...HEAD
          changed=$(git diff --name-only origin/integration/p0-frontend-session...HEAD | sort)
          allowed=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            'docs/P1_M4C_MLB_ECONOMIC_DECISION_CARD.md' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/mlb-economic-decision-card.tsx' \
            'frontend/client/src/components/mlb-scientific-capture-status.tsx' \
            'frontend/client/src/lib/mlb-economic-decision.test.ts' \
            'frontend/client/src/lib/mlb-economic-decision.ts' \
            'frontend/client/src/lib/mlb-scientific-capture.ts' | sort)
          unexpected=$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))
          [[ -z "$unexpected" ]]
          grep -Fxq 'frontend/client/src/lib/mlb-scientific-capture.ts' <<< "$changed"
          ! grep -E 'sportsbook|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' \
            frontend/client/src/lib/mlb-scientific-capture-transport.ts \
            frontend/client/src/lib/mlb-scientific-capture.ts
