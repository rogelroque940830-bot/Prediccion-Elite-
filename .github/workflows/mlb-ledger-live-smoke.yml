name: MLB Ledger Live Smoke

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/mlb-ledger-live-smoke.yml'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Verify deployed S5C ingestion
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            health_code=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$API_BASE/health" || true)
            status_code=$(curl -sS -o ledger-status.json -w '%{http_code}' --max-time 15 "$API_BASE/api/mlb/ledger/v1/status" || true)
            report_code=$(curl -sS -o ledger-report.json -w '%{http_code}' --max-time 15 "$API_BASE/api/mlb/ledger/v1/report" || true)
            shadow_code=$(curl -sS -o shadow-health.json -w '%{http_code}' --max-time 15 "$API_BASE/health/shadow-collection" || true)
            s5c_code=$(curl -sS -o s5c-health.json -w '%{http_code}' --max-time 15 "$API_BASE/health/s5c-ingestion" || true)

            if [[ "$health_code" == "200" && "$status_code" == "200" && "$report_code" == "401" && "$shadow_code" == "200" && "$s5c_code" == "200" ]]; then
              if node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('ledger-status.json', 'utf8'));
          const privateReport = JSON.parse(fs.readFileSync('ledger-report.json', 'utf8'));
          const shadow = JSON.parse(fs.readFileSync('shadow-health.json', 'utf8'));
          const s5c = JSON.parse(fs.readFileSync('s5c-health.json', 'utf8'));
          const expected = String(process.env.EXPECTED_COMMIT || '').trim();

          if (health.status !== 'healthy' || health.commit !== expected) throw new Error(`deployed commit ${health.commit} != ${expected}`);
          if (!status.success || status.data?.schemaVersion !== 'mlb-ledger.v1' || status.data?.immutable !== true) throw new Error('ledger is not healthy and immutable');
          if (privateReport.success !== false || !/Authentication required/i.test(String(privateReport.error || ''))) throw new Error('private report is not protected');
          if (shadow.status !== 'healthy' || shadow.commit !== expected || shadow.safety?.realFinancialExposure !== 0) throw new Error('S5B shadow collection is not healthy');
          if (s5c.status !== 'healthy' || s5c.commit !== expected) throw new Error('S5C is not serving the expected commit');
          if (s5c.schemaVersion !== 'mlb-s5c-shadow-ingestion.v1' || s5c.enabled !== true || !s5c.lastSuccessAt || !s5c.latest) throw new Error('first S5C run did not complete');
          if (s5c.lastError != null) throw new Error(`S5C error: ${s5c.lastError}`);
          if (s5c.safety?.mode !== 'SHADOW'
            || s5c.safety?.realFinancialExposure !== 0
            || s5c.safety?.sportsbookIntegration !== false
            || s5c.safety?.automaticBetPlacement !== false
            || s5c.safety?.productionWrites !== false
            || s5c.safety?.syntheticOdds !== false) throw new Error('S5C safety invariants failed');

          console.log(JSON.stringify({
            commit: health.commit,
            environment: health.environment,
            ledger: { predictions: status.data.predictions, settlementEvents: status.data.settlementEvents, immutable: status.data.immutable },
            privateReportProtected: true,
            shadowCollection: { lastSuccessAt: shadow.lastSuccessAt, snapshots: shadow.snapshots, exposure: shadow.safety.realFinancialExposure },
            s5cIngestion: {
              lastSuccessAt: s5c.lastSuccessAt,
              intervalMs: s5c.intervalMs,
              latest: s5c.latest,
              exposure: s5c.safety.realFinancialExposure,
              syntheticOdds: s5c.safety.syntheticOdds,
            },
          }, null, 2));
          NODE
              then
                exit 0
              fi
            fi

            echo "Attempt $attempt/36: health=$health_code status=$status_code report=$report_code shadow=$shadow_code s5c=$s5c_code"
            sleep 10
          done

          echo 'S5C live verification failed.'
          echo '--- health'; cat health.json 2>/dev/null || true
          echo '--- ledger'; cat ledger-status.json 2>/dev/null || true
          echo '--- shadow'; cat shadow-health.json 2>/dev/null || true
          echo '--- s5c'; cat s5c-health.json 2>/dev/null || true
          exit 1
