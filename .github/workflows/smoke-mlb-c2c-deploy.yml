name: Smoke deployed MLB C2C

on:
  push:
    branches:
      - test/smoke-mlb-c2c-deploy
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed C2C endpoint and ledger integrity
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 91cd986bbb71f94b181e701a585aa233e0658ff3
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/before.json
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-decisions?limit=10000" > /tmp/c2c.json
          jq '{schemaVersion:.data.schemaVersion, global:.data.global, policy:.data.policy, markets:.data.markets}' /tmp/c2c.json
          jq -e '
            .success == true
            and .data.schemaVersion == "mlb-injury-decision-report.v1"
            and .data.policy.formulasChanged == false
            and .data.policy.automaticRuleChanges == false
            and .data.global.verdict == "MANTENER"
            and .data.global.sampleStatus == "INSUFFICIENT"
            and .data.global.metrics.settled == 0
            and .data.global.metrics.pending == 3
          ' /tmp/c2c.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/after.json
          jq -e --slurpfile before /tmp/before.json '
            .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
            and .data.immutable == true
          ' /tmp/after.json >/dev/null
