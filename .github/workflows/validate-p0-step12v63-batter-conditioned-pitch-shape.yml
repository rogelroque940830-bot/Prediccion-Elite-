name: Validate P0 Step 12V63 Batter Conditioned Pitch Shape

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/p0-step12v63-batter-conditioned-pitch-shape-contract.json'
      - 'scripts/p0-step12v63-acquire-pitch-shape.py'
      - 'scripts/p0-step12v63-batter-conditioned-pitch-shape.py'
      - '.github/workflows/validate-p0-step12v63-batter-conditioned-pitch-shape.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify final V63 hypothesis was frozen before outcome scorer
        run: |
          set -euo pipefail
          FREEZE=6aebfa82e219a310a0b043ca6db4326158fc9c4a
          git merge-base --is-ancestor "$FREEZE" HEAD
          git cat-file -e "$FREEZE:research/p0-step12v63-batter-conditioned-pitch-shape-contract.json"
          ! git cat-file -e "$FREEZE:scripts/p0-step12v63-batter-conditioned-pitch-shape.py"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v63-batter-conditioned-pitch-shape-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v63-batter-conditioned-pitch-shape-contract.v1'
          assert c['contractRevision']==3
          assert c['scientificStatus']=='FROZEN_FINAL_BATTER_CONDITIONED_PITCH_SHAPE_WINNER_HYPOTHESIS_BEFORE_OUTCOME_SCORER'
          assert c['preOutcomeCorrections'][-1]['performedBeforeV63WinnerOutcomeScorerExisted'] is True
          assert c['preOutcomeCorrections'][-1]['custodyRunContainsWinnerTarget'] is False
          assert c['sportingTarget']['primaryTarget']=='FULL_GAME_HOME_WIN'
          assert c['dataBoundary']['sameDateHistoryAllowed'] is False
          assert c['historicalPitchShapeCustody']['horizontalMovementSource']=='playEvents[].pitchData.breaks.breakHorizontal'
          assert c['historicalPitchShapeCustody']['verticalMovementSource']=='playEvents[].pitchData.breaks.breakVerticalInduced'
          assert c['shapeCellEngineering']['dimensionsExactly']==['velocityMph','horizontalMovementInches','verticalMovementInches','spinRpm']
          assert c['shapeCellEngineering']['bucketWidth']=={'velocityMph':2.0,'horizontalMovementInches':2.0,'verticalMovementInches':2.0,'spinRpm':250.0}
          assert c['shapeCellEngineering']['neighborRadiusCellsEachDimension']==1
          assert c['shapeMatchupLayer']['featureCount']==6
          assert c['challenger']['featureCount']==10
          assert c['statistics']['featureSearchAllowed'] is False
          assert c['statistics']['postResultBucketOrBandwidthChangeAllowed'] is False
          assert c['policy']['v16ProductionChanged'] is False
          assert c['policy']['betEliteAllowed'] is False
          assert c['policy']['realFinancialExposure']==0
          print('V63_FINAL_PRE_OUTCOME_CONTRACT_FROZEN')
          PY
      - name: Syntax check
        run: |
          python -m py_compile scripts/p0-step12v63-acquire-pitch-shape.py
          python -m py_compile scripts/p0-step12v63-batter-conditioned-pitch-shape.py

  acquire-pitch-shape:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        season: [2021, 2022, 2023, 2024, 2025, 2026_YTD]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Step 12V3 target evidence
        if: matrix.season != '2021'
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Acquire direct historical batter-conditioned pitch-shape custody
        env:
          SEASON: ${{ matrix.season }}
        run: |
          set -euo pipefail
          mkdir -p "artifacts/p0-step12v63-${SEASON}"
          if [ "$SEASON" = "2021" ]; then
            python scripts/p0-step12v63-acquire-pitch-shape.py \
              --season "$SEASON" \
              --contract research/p0-step12v63-batter-conditioned-pitch-shape-contract.json \
              --out "artifacts/p0-step12v63-${SEASON}/pitch-shape-${SEASON}.json" \
              --workers 6
          else
            python scripts/p0-step12v63-acquire-pitch-shape.py \
              --season "$SEASON" \
              --table "artifacts/p0-step12v3/${SEASON}/game-anatomy-feature-table.json" \
              --contract research/p0-step12v63-batter-conditioned-pitch-shape-contract.json \
              --out "artifacts/p0-step12v63-${SEASON}/pitch-shape-${SEASON}.json" \
              --workers 6
          fi
      - name: Upload V63 pitch-shape custody
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v63-pitch-shape-${{ matrix.season }}
          path: artifacts/p0-step12v63-${{ matrix.season }}/pitch-shape-${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 30

  score-winner:
    needs: acquire-pitch-shape
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.17.0'
      - name: Download frozen winner-anatomy control source
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v-winner-anatomy-walkforward
          path: artifacts/p0-step12v-control
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31649438822
      - name: Download frozen T-minus-5 lineup lineage
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download certified batter outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v41-batter-historical-custody
          path: artifacts/p0-step12v41
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31905076013
      - name: Download certified V16 pure winner model
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: artifacts/p0-step12v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189
      - name: Download frozen V60 T-minus-5 starter and split custody
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v60-matchup-custody-*
          path: artifacts/p0-step12v60-custody
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31919873754
      - name: Download frozen V62 evidence for diagnostic comparison only
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v62-pitch-quality-winner
          path: artifacts/p0-step12v62
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31925270654
      - name: Download all current-run V63 pitch-shape custody packs
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v63-pitch-shape-*
          path: artifacts/p0-step12v63-shape
          merge-multiple: true
      - name: Verify immutable parent and V63 custody before scoring
        run: |
          set -euo pipefail
          test -s artifacts/p0-step12v16/pure-settlement-probability-report.json
          test -s artifacts/p0-step12v16/pure-settlement-model-manifest.json
          test -s artifacts/p0-step12v62/pitch-quality-winner-report.json
          for s in 2022 2023 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v3/${s}/game-anatomy-feature-table.json"
            test -s "artifacts/p0-step12v3/${s}/cohort/pregame-lineup-history.json"
            test -s "artifacts/p0-step12v41/${s}/batter-history.json"
            test -s "artifacts/p0-step12v60-custody/pregame-hands-${s}.json"
            test -s "artifacts/p0-step12v60-custody/batter-hand-${s}.json"
            test -s "artifacts/p0-step12v63-shape/pitch-shape-${s}.json"
          done
          test -s artifacts/p0-step12v63-shape/pitch-shape-2021.json
      - name: Run frozen V63 batter-conditioned pitch-shape winner experiment
        run: |
          mkdir -p artifacts/p0-step12v63
          python scripts/p0-step12v63-batter-conditioned-pitch-shape.py \
            --control-root artifacts/p0-step12v-control \
            --lineup-root artifacts/p0-step12v3 \
            --batter-root artifacts/p0-step12v41 \
            --hands-root artifacts/p0-step12v60-custody \
            --shape-root artifacts/p0-step12v63-shape \
            --v16-report artifacts/p0-step12v16/pure-settlement-probability-report.json \
            --v16-manifest artifacts/p0-step12v16/pure-settlement-model-manifest.json \
            --v62-report artifacts/p0-step12v62/pitch-quality-winner-report.json \
            --contract research/p0-step12v63-batter-conditioned-pitch-shape-contract.json \
            --out artifacts/p0-step12v63/batter-conditioned-pitch-shape-report.json
      - name: Validate evidence without requiring favorable result
        run: |
          python - <<'PY'
          import json
          p='artifacts/p0-step12v63/batter-conditioned-pitch-shape-report.json'
          r=json.load(open(p))
          assert r['schemaVersion']=='courtedge-p0-step12v63-batter-conditioned-pitch-shape.v1'
          assert r['classification'] in {
            'BATTER_CONDITIONED_PITCH_SHAPE_VALUE_CERTIFIED_FOR_NEXT_WINNER_MODEL_RESEARCH',
            'BATTER_CONDITIONED_PITCH_SHAPE_VALUE_NOT_ROBUST_ENOUGH_TO_ADVANCE',
            'BATTER_CONDITIONED_PITCH_SHAPE_CUSTODY_INSUFFICIENT'
          }
          assert isinstance(r['candidateRubricPassed'],bool)
          assert isinstance(r['coverageGatePassed'],bool)
          assert r['target']=='FULL_GAME_HOME_WIN'
          assert r['data']['seasonRows']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert r['features']['controlCount']==4
          assert r['features']['shapeMatchupCount']==6
          assert r['features']['challengerCount']==10
          b=r['pairedDateBootstrapVsControl2024_2026Ytd']
          assert b['unit']=='OFFICIAL_DATE_CLUSTER' and b['resamples']==5000 and b['distinctDates']>400
          assert r['diagnostics']['frozenV62IsDiagnosticOnlyNotPromotionControl'] is True
          q=r['policy']
          for k in ['sameDateOutcomeLeakageAllowed','futureGameDataAllowed','historicalPricesUsed','marketOddsUsedAsFeatures','featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','subsetMiningUsed','homeAwaySubsetMiningUsed','seasonExclusionAfterResultsUsed','postResultRuleChangeAllowed','postResultShrinkageChangeAllowed','postResultShapeGeometryChangeAllowed','v16ProductionChanged','productionMarketRegistryChanged','rankingChanged','stakeChanged','betEliteAllowed','finalRecommendationChanged','automaticBetPlacementAllowed','positiveEvEstablished']:
            assert q[k] is False,k
          assert q['realFinancialExposure']==0
          print(json.dumps({'classification':r['classification'],'candidateRubricPassed':r['candidateRubricPassed'],'coverageGatePassed':r['coverageGatePassed'],'combined':r['combinedEvaluation2024_2026Ytd']['challengerImprovementVsControl'],'bootstrap':r['pairedDateBootstrapVsControl2024_2026Ytd'],'bySeason':{s:v['challengerImprovementVsControl'] for s,v in r['evaluationBySeason'].items()},'vsV62':r['diagnostics']['improvementVsFrozenV62Combined'],'checks':r['candidateRubricChecks']},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Verify exact research-only scope
        run: |
          set -euo pipefail
          grep -F "'historicalPricesUsed':False" scripts/p0-step12v63-batter-conditioned-pitch-shape.py
          grep -F "'betEliteAllowed':False" scripts/p0-step12v63-batter-conditioned-pitch-shape.py
          grep -F "'realFinancialExposure':0" scripts/p0-step12v63-batter-conditioned-pitch-shape.py
          ! grep -E "automaticBetPlacementAllowed[^\n]*True|betEliteAllowed[^\n]*True|realFinancialExposure[^\n]*[1-9]" scripts/p0-step12v63-batter-conditioned-pitch-shape.py
          git diff --check
      - name: Upload V63 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v63-batter-conditioned-pitch-shape
          path: artifacts/p0-step12v63/
          if-no-files-found: error
          retention-days: 30
