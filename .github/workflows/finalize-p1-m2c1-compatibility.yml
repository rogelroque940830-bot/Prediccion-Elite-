name: Finalize P1-M2C.1 compatibility

on:
  pull_request:
    branches:
      - integration/p0-frontend-session

permissions:
  contents: write

concurrency:
  group: p1-m2c1-compatibility-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/p1-m2c1-mlb-visual-consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-m2c1-mlb-visual-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply exact compatibility replacements
        run: node scripts/finalize-p1-m2c1-compatibility.mjs
      - name: Verify exact product scope
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/mlb-pregame-readiness-gate.tsx' \
            'frontend/client/src/pages/mlb-predictor.tsx' | sort)
          [[ "${changed}" == "${expected}" ]]
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/App.tsx frontend/client/src/components/mlb-pregame-readiness-gate.tsx frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'P1-M2C.1: preserve P1 compatibility markers'
          git push origin HEAD:feature/p1-m2c1-mlb-visual-consolidation
