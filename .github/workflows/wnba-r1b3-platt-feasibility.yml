name: WNBA R1B3 Frozen Platt Feasibility

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1B3_FAILURE_CLOSURE_AND_PLATT_FEASIBILITY.json'
      - 'scripts/wnba-r1b3-platt-feasibility.mjs'
      - '.github/workflows/wnba-r1b3-platt-feasibility.yml'
      - 'research/wnba/WNBA_R1B3_EXECUTION_MARKER.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout WNBA R1 branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install historical constructor dependency
        run: python -m pip install --quiet pyarrow

      - name: Reproduce frozen R1A.5 candidate input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a5-neutral-availability-candidate.py

      - name: Verify frozen production import graph custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object frontend/client/src/lib/wnba-model.ts)" = "095527160535655d28e989c0cfe9638fc6681b4c"
          test "$(git hash-object frontend/client/src/lib/wnba-shadow-emission.ts)" = "7dde8303ac0bac50ea0ed60cd5d7f78b091a5131"
          test "$(git hash-object frontend/client/src/lib/queryClient.ts)" = "3f4176d17e660103db9784885400eadc54dd549c"
          test "$(git hash-object frontend/package-lock.json)" = "f104d741b427df2a7cd73ccc3bbe66207b8cbb15"

      - name: Install lockfile-frozen frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts

      - name: Compile verified production WNBA source for replay
        shell: bash
        run: |
          set -euo pipefail
          frontend/node_modules/.bin/esbuild frontend/client/src/lib/wnba-model.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --outfile=/tmp/wnba-r1a6-model.bundle.mjs \
            '--define:import.meta.env.VITE_API_BASE_URL=""' \
            --define:import.meta.env.DEV=false

      - name: Reproduce frozen R1A.6 probability rowset
        env:
          WNBA_MODEL_MODULE: /tmp/wnba-r1a6-model.bundle.mjs
          WNBA_MODEL_EXECUTION: ESBUILD_LOCKFILE_COMPILED_FROZEN_PRODUCTION_SOURCE_NODE22
        run: node scripts/wnba-r1a6-direct-model-replay.mjs

      - name: Reproduce frozen R1B1 labeled rowset
        run: |
          set -euo pipefail
          python scripts/wnba-r1b1-label-linkage.py
          test "$(sha256sum wnba-r1b1-labeled-rowset.jsonl | cut -d' ' -f1)" = "4b4dc3086d9f6a322f01089a7bd828d6cc4095ff793d343e0c25eb1b147dbe4a"

      - name: Reproduce frozen failed R1B2 scored rowset
        run: |
          set -euo pipefail
          python scripts/wnba-r1b2-metrics.py
          test "$(sha256sum wnba-r1b2-scored-rowset.jsonl | cut -d' ' -f1)" = "786d674b53cf7027ab9e5030bb11ff906cbbd3bba65fd4c9fdceea1dad1c8319"

      - name: Fetch and verify exact frozen cross-sport Platt engine from PR 671
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/rogelroque940830-bot/Prediccion-Elite-/feat/cross-sport-calibration-v1/server/cross-sport-calibration.ts \
            -o /tmp/cross-sport-calibration.ts
          actual=$(git hash-object /tmp/cross-sport-calibration.ts)
          echo "platt_engine_git_blob=$actual"
          test "$actual" = "9099ed5182d64b6e20768b6d305e7867ed2b69ce"

      - name: Compile exact frozen cross-sport Platt engine
        shell: bash
        run: |
          set -euo pipefail
          frontend/node_modules/.bin/esbuild /tmp/cross-sport-calibration.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --target=node22 \
            --outfile=/tmp/cross-sport-calibration.mjs

      - name: Execute preregistered rolling-origin Platt feasibility
        env:
          WNBA_PLATT_ENGINE_MODULE: /tmp/cross-sport-calibration.mjs
        run: node scripts/wnba-r1b3-platt-feasibility.mjs

      - name: Assert feasibility-only safety boundary
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.inputCustody.match == true' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.engine.exactWalkForwardFunctionParityAllFolds == true' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.targetFolds == [2022,2023,2024,2025]' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.targetFoldCount == 4' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.fiveTargetSeasonRequirementMet == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.sportEliteGatePassed == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.crossSportObservationCertified == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.certificationEligible == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.coefficientRetunePerformed == false and .thresholdSearchPerformed == false and .eliteGateDiscoveryPerformed == false and .targetSeasonRankingOrCapUsed == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null
          jq -e '.globalRankerPromotionAuthorized == false and .productionChangeAuthorized == false' wnba-r1b3-platt-feasibility-evidence.json >/dev/null

      - name: Upload R1B3 feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1b3-platt-feasibility-${{ github.run_id }}
          path: |
            wnba-r1b3-platt-feasibility-evidence.json
            wnba-r1b3-platt-oos-rowset.jsonl
            wnba-r1b2-metrics-evidence.json
            wnba-r1b2-scored-rowset.jsonl
            wnba-r1b1-label-linkage-evidence.json
            wnba-r1b1-labeled-rowset.jsonl
            wnba-r1a6-model-replay-evidence.json
            wnba-r1a6-sports-only-probability-rowset.jsonl
          if-no-files-found: warn
          retention-days: 90
