name: Fix S6Q Anchor Option Duplication

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/fix-s6q-anchor-option-duplication.mjs'
      - '.github/workflows/fix-s6q-anchor-option-duplication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/fix-s6q-anchor-option-duplication.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-s6q-fifty-settlement-human-review.ts
          git commit -m 'Fix duplicate S6Q anchor option'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
