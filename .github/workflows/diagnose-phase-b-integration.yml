name: Diagnose Phase B integration anchors

on:
  push:
    branches:
      - feature/mlb-injury-phase-b-auto
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-phase-b-auto
      - name: Locate injury and bullpen integration points
        shell: bash
        run: |
          set -euo pipefail
          echo '=== bullpen route ==='
          grep -n -A150 -B20 'bullpen-status' server/routes.ts | head -n 260
          echo '=== frontend bullpen fetch/use ==='
          grep -n -A100 -B20 'setBullpenStatus' frontend/client/src/pages/mlb-predictor.tsx | head -n 260
          echo '=== injury auto apply ==='
          grep -n -A100 -B20 'homeAutoApply' frontend/client/src/pages/mlb-predictor.tsx | head -n 220
