name: Run S2 review fix script

on:
  pull_request:
    branches:
      - feature/s2-multiuser-picks-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - run: python .github/scripts/apply_s2_review_fixes.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-ledger-multiuser.ts server/mlb-ledger-ownership-store.ts server/mlb-ledger-ownership-store.test.ts
          git commit -m "S2: address ownership migration and response review"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
