name: O3.1 Fix Frontend Icon Compatibility

on:
  push:
    branches:
      - feature/o3-1-mlb-evidence-repair-frontend
    paths:
      - '.github/workflows/o31-fix-frontend-icon.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/o3-1-mlb-evidence-repair-frontend
          fetch-depth: 0
      - name: Replace unsupported icon and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ClipboardSearch/FileSearch/g' frontend/client/src/pages/operations-evidence-repair.tsx
          rm .github/workflows/o31-fix-frontend-icon.yml
          git diff --check
      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/pages/operations-evidence-repair.tsx .github/workflows/o31-fix-frontend-icon.yml
          git commit -m 'O3.1 frontend: use supported FileSearch icon'
          git push origin HEAD:feature/o3-1-mlb-evidence-repair-frontend
