name: Fix MLB ledger client request collision

on:
  push:
    branches:
      - fix/mlb-ledger-client-request-collision
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mlb-ledger-client-request-collision
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic collision fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('server/mlb-scientific-snapshot.ts')
          text = source_path.read_text()
          text = text.replace(
              '  MLB_LEDGER_SCHEMA_VERSION,\n  mlbPredictionInputSchema,',
              '  MLB_LEDGER_SCHEMA_VERSION,\n  canonicalJson,\n  mlbPredictionInputSchema,',
              1,
          )

          start = text.index('function fullSnapshotPrediction(')
          end = text.index('\nfunction provisionalMirrorPrediction(', start)
          replacement = '''function fullSnapshotPrediction(pick: SavedMlbPickLike): MlbPredictionInput {
            const snapshot = sanitizeSnapshot(mlbScientificSnapshotSchema.parse(pick.scientificSnapshot));
            assertSnapshotMatchesPick(pick, snapshot);

            const basePrediction = mlbPredictionInputSchema.parse({
              schemaVersion: MLB_LEDGER_SCHEMA_VERSION,
              source: "app",
              model: {
                ...snapshot.model,
                gitCommit: snapshot.model.gitCommit
                  || process.env.RAILWAY_GIT_COMMIT_SHA
                  || process.env.GIT_COMMIT_SHA
                  || undefined,
                environment: snapshot.model.environment
                  || process.env.RAILWAY_ENVIRONMENT_NAME
                  || process.env.NODE_ENV
                  || undefined,
              },
              game: snapshot.game,
              market: snapshot.market,
              probabilities: snapshot.probabilities,
              decision: snapshot.decision,
              analysis: snapshot.analysis,
            });

            // Numeric UI ids can be reused after a failed/removed history entry. They are
            // therefore unsafe as immutable-ledger idempotency keys by themselves. Bind the
            // request id to the final canonical payload so exact retries remain idempotent,
            // while a different snapshot using the same legacy UI id receives a new key.
            const safePickId = pick.id.replace(/[^A-Za-z0-9._:-]/g, "_").slice(0, 90) || "pick";
            const payloadDigest = crypto
              .createHash("sha256")
              .update(canonicalJson(basePrediction))
              .digest("hex")
              .slice(0, 32);

            return mlbPredictionInputSchema.parse({
              ...basePrediction,
              clientRequestId: `picks-v2:${safePickId}:${payloadDigest}`,
            });
          }
          '''
          text = text[:start] + replacement + text[end:]
          old_filter = '      && sameOptionalNumber(next.market.line, prediction.market.line)\n      && prediction.source === "app";'
          new_filter = '      && sameOptionalNumber(next.market.line, prediction.market.line)\n      && prediction.source === "app"\n      && prediction.clientRequestId !== next.clientRequestId;'
          if old_filter not in text:
              raise SystemExit('supersedes filter anchor not found')
          text = text.replace(old_filter, new_filter, 1)
          source_path.write_text(text)

          test_path = Path('server/mlb-scientific-snapshot.test.ts')
          tests = test_path.read_text()
          tests = tests.replace(
              '  assert.equal(prediction.clientRequestId, "picks-v2:ui-mlb-42");\n  assert.equal(prediction.analysis.stage, "FINAL");',
              '  assert.match(prediction.clientRequestId || "", /^picks-v2:ui-mlb-42:[a-f0-9]{32}$/);\n  assert.equal(prediction.analysis.stage, "FINAL");',
              1,
          )
          insert_anchor = 'test("orientation mismatch is rejected before the immutable append", () => {'
          new_tests = '''test("full snapshot request ids are stable for exact retries and unique for changed payloads", () => {
            const firstSnapshot = fullSnapshot();
            const exactRetry = structuredClone(firstSnapshot);
            const changedSnapshot = structuredClone(firstSnapshot);
            (changedSnapshot.analysis.rawOutput as any).selectedMarket = "ML_RECALCULATED";

            const first = buildMlbLedgerPredictionFromPick({ ...basePick(), scientificSnapshot: firstSnapshot });
            const retry = buildMlbLedgerPredictionFromPick({ ...basePick(), scientificSnapshot: exactRetry });
            const changed = buildMlbLedgerPredictionFromPick({ ...basePick(), scientificSnapshot: changedSnapshot });

            assert.equal(first.clientRequestId, retry.clientRequestId);
            assert.notEqual(first.clientRequestId, changed.clientRequestId);
          });

          '''
          if insert_anchor not in tests:
              raise SystemExit('test insertion anchor not found')
          tests = tests.replace(insert_anchor, new_tests + insert_anchor, 1)

          tests = tests.replace(
              '  const record = (id: string, recordedAtMs: number, model: number) => ({',
              '  const record = (id: string, recordedAtMs: number, model: number, clientRequestId = `picks-v2:${id}`) => ({',
              1,
          )
          tests = tests.replace(
              '      clientRequestId: `picks-v2:${id}`,',
              '      clientRequestId,',
              1,
          )
          tests = tests.replace(
              '  const records = [record("mlb-pred-old", 1_000, 0.58), record("mlb-pred-newer", 2_000, 0.60)];\n  assert.equal(findMlbSupersedesId(records as any, next), "mlb-pred-newer");',
              '  const records = [\n    record("mlb-pred-old", 1_000, 0.58),\n    record("mlb-pred-newer", 2_000, 0.60),\n    record("mlb-pred-retry", 3_000, 0.612, next.clientRequestId),\n  ];\n  assert.equal(findMlbSupersedesId(records as any, next), "mlb-pred-newer");',
              1,
          )
          test_path.write_text(tests)
          PY

      - name: Install backend dependencies
        run: npm ci

      - name: Run MLB regression suite
        run: npm run test:mlb-ledger

      - name: Type-check backend
        run: npm run typecheck:mlb-ledger

      - name: Build backend
        run: npm run build:backend

      - name: Commit validated fix without temporary workflow
        run: |
          rm .github/workflows/fix-mlb-ledger-client-request-collision.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-scientific-snapshot.ts server/mlb-scientific-snapshot.test.ts .github/workflows/fix-mlb-ledger-client-request-collision.yml
          git commit -m "fix: derive MLB ledger request ids from canonical payload"
          git push origin HEAD:fix/mlb-ledger-client-request-collision
