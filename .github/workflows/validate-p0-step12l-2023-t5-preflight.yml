name: Validate P0 Step 12L 2023 T5 Preflight

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12h-t5-starter-identity-audit.mjs'
      - 'server/mlb-market-pregame-lineup-history.ts'
      - 'server/mlb-market-starting-pitcher-history.ts'
      - '.github/workflows/validate-p0-step12l-2023-t5-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight-2023-t5:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Syntax-check preflight surface
        run: node --check scripts/p0-step12h-t5-starter-identity-audit.mjs
      - name: Audit untouched 2023 season T-5 starter identities
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2023-03-01 --end 2023-10-01 --concurrency 6
          --out artifacts/p0-step12l/2023
      - name: Validate preflight gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='artifacts/p0-step12l/2023/t5-starter-identity-audit.json'
          with open(p,encoding='utf-8') as f:r=json.load(f)
          assert r['schemaVersion']=='courtedge-p0-step12h-t5-starter-identity-audit.v1'
          assert r['evidenceStatus']=='DIAGNOSTIC_ONLY_NO_PROMOTION'
          assert r['interpretation']['t5ProbableIdentityIsRequiredForPregameStarterFeatures'] is True
          assert r['interpretation']['thresholdRetuningAllowed'] is False
          assert r['interpretation']['canProduceBetElite'] is False
          assert r['counts']['validPregameSnapshots']>0
          coverage=r['counts']['completeLineupAndBothProbablesPct']
          assert coverage >= 95.0, f'STEP12L_2023_T5_COVERAGE_TOO_LOW:{coverage}'
          print(json.dumps({'ok':True,'counts':r['counts'],'validationUseAuthorized':coverage>=95.0},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload 2023 T-5 preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12l-2023-t5-preflight
          path: artifacts/p0-step12l/
          if-no-files-found: error
          retention-days: 30
