name: WNBA R3A Signal Custody Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/wnba-r3-elite-signal-discovery
    paths:
      - "research/wnba/WNBA_R3_ELITE_SIGNAL_DISCOVERY_CONTRACT.json"
      - "research/wnba/WNBA_R3A_SIGNAL_CUSTODY_AUDIT_CONTRACT.json"
      - "research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_CERTIFICATION.json"
      - "scripts/wnba-r3a-signal-custody-audit.py"
      - ".github/workflows/wnba-r3a-signal-custody-audit.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check "pyarrow==21.0.0"

      - name: Run R3A frozen signal custody audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r3a-signal-custody-audit.py

      - name: Upload R3A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r3a-signal-custody-${{ github.run_id }}
          path: wnba-r3a-signal-custody-evidence.json
          if-no-files-found: error
          retention-days: 30
