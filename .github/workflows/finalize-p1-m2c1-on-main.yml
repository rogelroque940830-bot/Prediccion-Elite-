name: Finalize P1-M2C.1 from main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-p1-m2c1-on-main.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted implementation
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          fetch-depth: 1
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/p1-m2c1-mlb-visual-consolidation
          path: work
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply trusted compatibility replacements
        working-directory: work
        run: node ../trusted/scripts/finalize-p1-m2c1-compatibility-trusted.mjs
      - name: Verify exact product scope
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/mlb-pregame-readiness-gate.tsx' \
            'frontend/client/src/pages/mlb-predictor.tsx' | sort)
          [[ "${changed}" == "${expected}" ]]
          git diff --check
      - name: Commit and push exact fix
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/App.tsx frontend/client/src/components/mlb-pregame-readiness-gate.tsx frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'P1-M2C.1: preserve P1 compatibility markers'
          git push origin HEAD:feature/p1-m2c1-mlb-visual-consolidation
