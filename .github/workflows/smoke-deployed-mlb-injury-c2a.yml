name: Smoke deployed MLB injury C2A report

on:
  push:
    branches:
      - test/smoke-deployed-mlb-injury-c2a
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed report and ledger immutability
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 10db8f2bdb4a49dd3f99d0699a20fa59eed796e2
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/before.json
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json; then
              served=$(jq -r '.commit // ""' /tmp/health.json)
              echo "Attempt $attempt: served commit $served"
              if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-report?targetSettled=20" > /tmp/report.json
          echo 'C2A REPORT'
          jq '.data | {
            schemaVersion,
            readiness,
            sample,
            coverage,
            decisions:{detected,candidates,backendEligible,autoApplied,retained,rejected,officialOnly,manualOverrideTeams,bullpenBlockedTeams},
            adjustments,
            cohorts,
            recent
          }' /tmp/report.json
          jq -e '
            .success == true
            and .data.schemaVersion == "mlb-injury-calibration-report.v1"
            and .data.sample.auditedPredictions >= 3
            and .data.sample.uniqueAuditContexts >= 1
            and .data.sample.duplicateMarketSnapshotsExcluded >= 2
            and .data.readiness.targetSettledAuditedPicks == 20
          ' /tmp/report.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/after.json
          echo 'LEDGER BEFORE/AFTER'
          jq -n --slurpfile before /tmp/before.json --slurpfile after /tmp/after.json '{before:$before[0].data,after:$after[0].data}'
          jq -e --slurpfile before /tmp/before.json '
            .success == true
            and .data.immutable == true
            and .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
          ' /tmp/after.json >/dev/null
