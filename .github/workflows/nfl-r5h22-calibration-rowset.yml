name: NFL R5H22 Calibration Rowset Certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/nfl_r5h22_calibration_rowset_export.py'
      - '.github/workflows/nfl-r5h22-calibration-rowset.yml'

permissions:
  contents: read

jobs:
  nfl-r5h22-rowset:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests

      - name: Validate frozen research and rowset chain
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py
          python -m py_compile research/nfl/nfl_r5h3_rival_matchup_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h4_elite_selection_gate.py
          python -m py_compile research/nfl/nfl_r5h6_confidence_stratified_residual_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h8_interaction_contradiction_engine.py
          python -m py_compile research/nfl/nfl_r5h10_marginal_geometry_expansion.py
          python -m py_compile research/nfl/nfl_r5h15_independent_signal_family_discovery.py
          python -m py_compile research/nfl/nfl_r5h15_runner.py
          python -m py_compile research/nfl/nfl_r5h16_late_down_final_certification.py
          python -m py_compile research/nfl/nfl_r5h18_prospective_deployability_audit.py
          python -m py_compile research/nfl/nfl_r5h22_calibration_rowset_export.py

      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 --end-season 2025 --test-start 2018 \
            --out-dir nfl-r5-output --cache-dir .cache/nflverse

      - name: Rebuild QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 --end-season 2025 --test-start 2018 \
            --out-dir nfl-r5b-output --cache-dir .cache/nflverse

      - name: Rebuild frozen hybrid feature matrix
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 --end-season 2025

      - name: Reproduce frozen H15 signal chain
        run: |
          python research/nfl/nfl_r5h15_runner.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h15-output \
            --cache-dir .cache/nflverse \
            --start-season 2012 --expert-oos-start 2013 \
            --test-start 2018 --end-season 2025

      - name: Export certified 211-row calibration set
        run: |
          python research/nfl/nfl_r5h22_calibration_rowset_export.py \
            --h15-dir nfl-r5h15-output \
            --out-dir nfl-r5h22-output

      - name: Enforce R5H22 row-level custody
        run: |
          python - <<'PY'
          import json
          import pandas as pd

          s = json.load(open('nfl-r5h22-output/nfl_r5h22_summary.json'))
          a = json.load(open('nfl-r5h22-output/nfl_r5h22_audit.json'))
          m = json.load(open('nfl-r5h22-output/nfl_r5h22_manifest.json'))
          r = pd.read_csv('nfl-r5h22-output/nfl_r5h22_calibration_rowset.csv')

          assert s['combined']['games'] == 211
          assert s['combined']['wins'] == 171
          assert s['combined']['losses'] == 40
          assert s['routes']['R5H8_CORE']['games'] == 158
          assert s['routes']['R5H8_CORE']['wins'] == 125
          assert s['routes']['R5H8_CORE']['losses'] == 33
          assert s['routes']['R5H21_LATE_DOWN']['games'] == 53
          assert s['routes']['R5H21_LATE_DOWN']['wins'] == 46
          assert s['routes']['R5H21_LATE_DOWN']['losses'] == 7
          assert s['allCustodyAssertionsPass'] is True
          assert s['crossSportCalibrationStillBlocked'] is True
          assert s['globalEliteRankerStillBlocked'] is True

          assert len(r) == 211
          assert r['game_id'].nunique() == 211
          assert set(r['route']) == {'R5H8_CORE', 'R5H21_LATE_DOWN'}
          assert set(r['selected_win'].astype(int)) <= {0, 1}
          assert int(r['selected_win'].sum()) == 171
          assert int((r['route'] == 'R5H8_CORE').sum()) == 158
          assert int((r['route'] == 'R5H21_LATE_DOWN').sum()) == 53

          assert a['combinedCustody'] == 'PASS_211_GAMES_171_40'
          assert a['routeOverlap'] == 'PASS_ZERO'
          assert a['uniqueGameIds'] == 'PASS_211'
          assert a['calibrationFit'] == 'NOT_RUN_BY_R5H22_ROWSET_EXPORT'
          assert m['safety']['sameGameOutcomeUsedToSelectRows'] is False
          assert m['safety']['targetOutcomeUsedOnlyAsCalibrationLabel'] is True
          assert m['safety']['crossSportPoolingPerformed'] is False
          assert m['safety']['calibrationModelFitPerformed'] is False
          assert m['safety']['productionCodeTouched'] is False
          assert len(m['outputCustody']['rowsetSha256']) == 64
          print('NFL_R5H22_ROWSET_CUSTODY_VERIFIED')
          PY

      - name: Show R5H22 evidence
        run: |
          cat nfl-r5h22-output/nfl_r5h22_summary.json
          echo
          cat nfl-r5h22-output/nfl_r5h22_audit.json
          echo
          head -25 nfl-r5h22-output/nfl_r5h22_calibration_by_season.csv

      - name: Upload R5H22 calibration rowset evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h22-calibration-rowset-evidence
          path: nfl-r5h22-output/
          if-no-files-found: error
          retention-days: 30
