name: MLB R1B Bullpen Full-Universe Smoke Probe

on:
  push:
    branches: [research/mlb-unified-sporting-authority-r1]
    paths:
      - '.github/workflows/mlb-r1b-statsapi-transport-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  bullpen-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Download immutable Step12V3 T-5 custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Build one-game midseason canonical smoke subset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/mlb-r1b-bullpen-smoke/input artifacts/mlb-r1b-bullpen-smoke/out
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lineupPath='artifacts/p0-step12v3/2022/cohort/pregame-lineup-history.json';
          const v16Path='research/mlb-r1b-v16-baseline-historical/v16-baseline-2022.jsonl';
          const lineup=JSON.parse(fs.readFileSync(lineupPath,'utf8'));
          const rows=fs.readFileSync(v16Path,'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byPk=new Map();
          for(const row of rows){const list=byPk.get(Number(row.gamePk))??[];list.push(row);byPk.set(Number(row.gamePk),list);}
          const snapshots=(lineup.snapshots??[])
            .filter((s)=>s?.complete===true&&s?.availability==='COMPLETE'&&String(s.officialDate)>='2022-06-15')
            .filter((s)=>(byPk.get(Number(s.gamePk))??[]).length===4)
            .sort((a,b)=>String(a.officialDate).localeCompare(String(b.officialDate))||Number(a.gamePk)-Number(b.gamePk));
          const snapshot=snapshots[0];
          if(!snapshot) throw new Error('SMOKE_NO_CANONICAL_GAME');
          const gameRows=byPk.get(Number(snapshot.gamePk));
          fs.writeFileSync('artifacts/mlb-r1b-bullpen-smoke/input/lineup.json',JSON.stringify({snapshots:[snapshot]},null,2)+'\n');
          fs.writeFileSync('artifacts/mlb-r1b-bullpen-smoke/input/v16.jsonl',gameRows.map(JSON.stringify).join('\n')+'\n');
          console.log(JSON.stringify({gamePk:snapshot.gamePk,officialDate:snapshot.officialDate,requestedTimecode:snapshot.requestedTimecode,rowCount:gameRows.length},null,2));
          NODE
      - name: Run canonical materializer on smoke subset
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/mlb-r1b-bullpen-full-universe-materialize.ts \
            --season '2022_SMOKE' \
            --lineup-history artifacts/mlb-r1b-bullpen-smoke/input/lineup.json \
            --v16-rowset artifacts/mlb-r1b-bullpen-smoke/input/v16.jsonl \
            --contract research/mlb-r1b-bullpen-full-universe-contract.json \
            --out-dir artifacts/mlb-r1b-bullpen-smoke/out \
            --concurrency 1
      - name: Validate smoke result without promoting family
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-bullpen-smoke/out/bullpen-manifest-2022_SMOKE.json';
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(m.status!=='FULL_UNIVERSE_MATERIALIZED_PENDING_INDEPENDENT_VERIFICATION') throw new Error('smoke status');
          if(m.gameCount!==1||m.rowCount!==4||m.fullGameRows!==2||m.earlyWindowRows!==2) throw new Error('smoke identity counts');
          if(m.policy?.researchOnly!==true||m.policy?.productionChanged!==false||m.policy?.r1b2Authorized!==false) throw new Error('smoke policy boundary');
          console.log(JSON.stringify({status:m.status,gameCount:m.gameCount,rowCount:m.rowCount,eligibleFullGameRows:m.eligibleFullGameRows,missingFullGameRows:m.missingFullGameRows,networkUniqueRequestCount:m.networkUniqueRequestCount,priorFinalFeedUniqueRequestCount:m.priorFinalFeedUniqueRequestCount,t5FeedUniqueRequestCount:m.t5FeedUniqueRequestCount,missingnessReasonCounts:m.missingnessReasonCounts},null,2));
          NODE
          echo 'SMOKE_ONLY_NO_FAMILY_PROMOTION'
