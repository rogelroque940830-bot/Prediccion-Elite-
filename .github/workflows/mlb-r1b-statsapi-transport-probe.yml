name: MLB R1B StatsAPI Transport Probe

on:
  push:
    branches: [research/mlb-unified-sporting-authority-r1]
    paths:
      - '.github/workflows/mlb-r1b-statsapi-transport-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
      - name: Reproduce materializer transport exactly
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const url='https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=2026-03-01&endDate=2026-08-09';
          const variants=[
            ['materializer_exact', {'Accept':'application/json','User-Agent':'CourtEdge-R1B-Bullpen-Full/1.0'}],
            ['historical_probe', {'Accept':'application/json','User-Agent':'CourtEdge-MLB-R1B-Bullpen-Probe/2.0'}],
            ['transport_probe', {'Accept':'application/json','User-Agent':'CourtEdge-R1B-Transport-Probe/1.0'}],
          ];
          for (const [label,headers] of variants) {
            try {
              const response=await fetch(url,{headers,signal:AbortSignal.timeout(25000)});
              const text=await response.text();
              console.log(`${label} HTTP=${response.status} bytes=${Buffer.byteLength(text)} bodyPrefix=${JSON.stringify(text.slice(0,80))}`);
            } catch (error) {
              console.log(`${label} ERROR=${error instanceof Error ? error.message : String(error)}`);
            }
          }
          NODE

      - name: Reproduce retry wrapper exactly
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          class TransportError extends Error {}
          const url='https://statsapi.mlb.com/api/v1/schedule?sportId=1&startDate=2026-03-01&endDate=2026-08-09';
          async function exactFetchJson(url) {
            let last=null;
            for (let attempt=1; attempt<=4; attempt+=1) {
              try {
                const response=await fetch(url,{
                  headers:{Accept:'application/json','User-Agent':'CourtEdge-R1B-Bullpen-Full/1.0'},
                  signal:AbortSignal.timeout(25000),
                });
                console.log(`exact_wrapper attempt=${attempt} HTTP=${response.status}`);
                if(response.ok) return await response.json();
                const error=new TransportError(`BULLPEN_FULL_HTTP_${response.status}:${url}`);
                if(![408,425,429].includes(response.status) && response.status < 500) throw error;
                last=error;
              } catch(error) {
                last=error;
              }
              if(attempt<4) await new Promise((resolve)=>setTimeout(resolve,350*2**(attempt-1)));
            }
            throw last instanceof Error ? last : new TransportError(`BULLPEN_FULL_FETCH_FAILED:${url}`);
          }
          try {
            const payload=await exactFetchJson(url);
            console.log(`exact_wrapper SUCCESS dates=${Array.isArray(payload?.dates)?payload.dates.length:'invalid'}`);
          } catch(error) {
            console.log(`exact_wrapper FAILURE=${error instanceof Error ? error.message : String(error)}`);
            process.exitCode=1;
          }
          NODE
          echo 'Exact transport reproduction completed; diagnostic only. No model, weights, routing, staking, or production behavior changed.'
