name: Validate S6N First Real Settlement

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-s6n-first-real-settlement-monitor.ts'
      - 'server/mlb-s6n-first-real-settlement-monitor.test.ts'
      - 'server/s5b-staging-entry.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.s6n-first-real-settlement.json'
      - 'tsconfig.s5b-shadow.json'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/S6N_PHASE5C3_FIRST_REAL_SETTLEMENT_MONITOR.md'
      - '.github/workflows/validate-s6n-first-real-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-s6n:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused Phase 5C-3 tests
        run: npm run test:s6n-first-real-settlement
      - name: Type-check Phase 5C-3 surface
        run: npm run typecheck:s6n-first-real-settlement
      - name: Type-check complete shadow surface
        run: npm run typecheck:s5b-shadow
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify monitor and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ARMED_AND_WAITING' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'OBSERVING_CERTIFICATE_STABILITY' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'FIRST_REAL_SETTLEMENT_CERTIFIED' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'ACTION_REQUIRED' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'certificateStableAcrossRuns: true' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'realFinancialExposure: 0' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'automaticBetPlacement: false' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'historicalLedgerMutation: false' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q 'automaticModelChangesAllowed: false' server/mlb-s6n-first-real-settlement-monitor.ts
          grep -q '/health/s6n-first-real-settlement' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6n-first-real-settlement/status' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6n-first-real-settlement/evidence' server/s5b-staging-entry.ts
