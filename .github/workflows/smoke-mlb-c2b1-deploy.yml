name: Smoke deployed MLB C2B.1

on:
  push:
    branches:
      - test/smoke-mlb-c2b1-deploy
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed C2B.1 and ledger integrity
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 4d6fa096b22665383d52b532824ec3ca0b2fc31a
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/before.json
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-outcomes?limit=10000" > /tmp/outcomes.json
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-decisions?limit=10000" > /tmp/decisions.json
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/history?limit=10000" > /tmp/history.json

          echo 'C2B.1 OUTCOMES'
          jq '{deduplication:.data.deduplication,summary:.data.summary}' /tmp/outcomes.json
          echo 'C2C SAMPLE'
          jq '{deduplication:.data.deduplication,global:.data.global}' /tmp/decisions.json
          echo 'HISTORY ANALYTICAL STATUS'
          jq '{summary:.data.summary,analyticalCalibration:.data.analyticalCalibration,duplicates:[.data.picks[] | select(.analyticalDuplicate == true) | {id,selection,marketType,analyticalDuplicateOfPredictionId}]}' /tmp/history.json

          jq -e '
            .success == true
            and .data.deduplication.ledgerAuditedPicks == 3
            and .data.deduplication.uniqueAnalyticalDecisions == 2
            and .data.deduplication.duplicatesExcluded == 1
            and .data.deduplication.settledDuplicatesExcluded == 1
            and .data.summary.total == 2
            and .data.summary.settled == 2
            and .data.summary.wins == 2
            and (.data.summary.brierScore >= 0 and .data.summary.brierScore <= 1)
            and (.data.summary.logLoss >= 0)
          ' /tmp/outcomes.json >/dev/null

          jq -e '
            .success == true
            and .data.deduplication.uniqueAnalyticalDecisions == 2
            and .data.deduplication.duplicatesExcluded == 1
            and .data.global.metrics.total == 2
            and .data.global.metrics.settled == 2
            and .data.global.sampleStatus == "INSUFFICIENT"
            and .data.global.verdict == "MANTENER"
          ' /tmp/decisions.json >/dev/null

          jq -e '
            .success == true
            and .data.summary.total == 4
            and .data.analyticalCalibration.auditedLedgerRecords == 3
            and .data.analyticalCalibration.uniqueDecisions == 2
            and .data.analyticalCalibration.duplicatesExcluded == 1
            and ([.data.picks[] | select(.analyticalDuplicate == true)] | length) == 1
          ' /tmp/history.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/after.json
          jq -e --slurpfile before /tmp/before.json '
            .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
            and .data.immutable == true
          ' /tmp/after.json >/dev/null
