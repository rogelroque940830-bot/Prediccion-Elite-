name: Validate S6H Backend Market Integrity

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/american-odds.ts'
      - 'server/mlb-f5-odds-routes.ts'
      - 'server/mlb-f5-odds-routes.test.ts'
      - 'server/mlb-s5c-shadow-ingestion.ts'
      - 'server/mlb-s5c-shadow-ingestion.test.ts'
      - 'server/mlb-ledger-history-view.ts'
      - 'server/mlb-ledger-history-view.test.ts'
      - 'server/routes.ts'
      - 'tsconfig.s6h-market-integrity.json'
      - 'docs/S6H_PHASE3_BACKEND_MARKET_PROVENANCE.md'
      - '.github/workflows/validate-s6h-backend-market-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-p1-m6a2-florida-book-key:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact Florida execution-book correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          normalizer = Path('server/mlb-market-odds-normalizer.ts')
          text = normalizer.read_text()
          before = '''export const MLB_EXECUTION_BOOK_PRIORITY = [
          "hardrockbet_fl",
          "hardrockbet",
          "hardrockbet_az",
          ] as const;'''
          after = '''export const MLB_EXECUTION_BOOK_PRIORITY = [
          "hardrockbet_fl",
          ] as const;'''
          if before in text:
              text = text.replace(before, after)
          elif after not in text:
              raise SystemExit('unexpected execution-book block')
          normalizer.write_text(text)

          tests = Path('server/mlb-market-odds-normalizer.test.ts')
          tests.write_text(tests.read_text().replace('book("hardrockbet",', 'book("hardrockbet_fl",'))

          route_tests = Path('server/mlb-market-universe-odds-routes.test.ts')
          text = route_tests.read_text()
          marker = '  assert.equal(url.searchParams.get("bookmakers"), MLB_P1_M6A2_BOOKMAKERS.join(","));\n'
          addition = '  assert.deepEqual([...MLB_P1_M6A2_BOOKMAKERS], ["hardrockbet_fl", "draftkings", "fanduel", "betmgm"]);\n  assert.equal(MLB_P1_M6A2_BOOKMAKERS.includes("hardrockbet" as any), false);\n  assert.equal(MLB_P1_M6A2_BOOKMAKERS.includes("hardrockbet_az" as any), false);\n'
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit('bookmaker assertion marker missing')
              text = text.replace(marker, marker + addition)
          route_tests.write_text(text)

          docs = Path('docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md')
          text = docs.read_text()
          before_docs = '''Execution-book priority:

1. `hardrockbet_fl`
2. `hardrockbet`
3. `hardrockbet_az`
'''
          after_docs = '''Execution book:

- `hardrockbet_fl` — the verified Florida-specific Hard Rock Bet bookmaker key.

Arizona and Ohio Hard Rock books are different jurisdiction-specific execution venues and are not substitutes for the Florida price. No generic `hardrockbet` key is requested because it is not part of the verified provider bookmaker catalog used by this phase.
'''
          if before_docs in text:
              text = text.replace(before_docs, after_docs)
          elif after_docs not in text:
              raise SystemExit('unexpected docs execution-book block')
          text = text.replace('P1-M6A2 requests six explicit bookmakers.', 'P1-M6A2 requests four explicit bookmakers.')
          docs.write_text(text)
          PY
          git diff --check
      - name: Push source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'rogelroque940830-bot'
          git config user.email '272644701+rogelroque940830-bot@users.noreply.github.com'
          git add server/mlb-market-odds-normalizer.ts server/mlb-market-odds-normalizer.test.ts server/mlb-market-universe-odds-routes.test.ts docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Already corrected.'
            exit 0
          fi
          git commit -m 'P1-M6A2: restrict executable odds to verified Hard Rock Florida key'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install backend dependencies reproducibly
        run: npm ci
      - name: Run S6H market-integrity tests
        run: |
          npx tsx --test \
            server/mlb-f5-odds-routes.test.ts \
            server/mlb-s5c-shadow-ingestion.test.ts \
            server/mlb-ledger-history-view.test.ts
      - name: Type-check S6H backend surface
        run: npx tsc -p tsconfig.s6h-market-integrity.json
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify market-integrity safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'median_implied_probability' server/mlb-f5-odds-routes.ts
          grep -F 'consensusAmericanOdds' server/mlb-f5-odds-routes.ts
          grep -F 'selectConsensusLine' server/mlb-f5-odds-routes.ts
          grep -F 'normalizeStandardAmericanOdds' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'Rejected invalid American odds' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'marketProvenance' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'priceCapturedAt' server/mlb-ledger-history-view.ts
          grep -F 'registerMlbF5OddsProtectionRoutes(app)' server/routes.ts
          node - <<'NODE'
          const fs = require('node:fs');
          const routes = fs.readFileSync('server/routes.ts', 'utf8');
          const protectedIndex = routes.indexOf('registerMlbF5OddsProtectionRoutes(app)');
          const legacyIndex = routes.indexOf('registerMarketSupportRoutes(app)');
          if (protectedIndex < 0 || legacyIndex < 0 || protectedIndex >= legacyIndex) {
            throw new Error('Protected F5 route must be registered before legacy market-support routes');
          }
          NODE
          grep -F 'mlb-f5-odds-consensus.v2' dist/index.cjs
          grep -F 'median_implied_probability' dist/index.cjs
