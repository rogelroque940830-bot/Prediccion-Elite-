name: One-shot P1-M3A identity refinement

on:
  push:
    branches:
      - agent/p1-m3a-mlb-scientific-capture-contract
    paths:
      - 'scripts/p1-m3a-one-shot-refine.mjs'
      - '.github/workflows/p1-m3a-one-shot-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.repository == 'rogelroque940830-bot/Prediccion-Elite-'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-m3a-mlb-scientific-capture-contract
          fetch-depth: 0
      - name: Apply deterministic refinement
        run: node scripts/p1-m3a-one-shot-refine.mjs
      - name: Remove one-shot infrastructure and commit exact product change
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/p1-m3a-one-shot-refine.mjs
          rm .github/workflows/p1-m3a-one-shot-refine.yml
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/p1-m3a-one-shot-refine.yml' \
            'scripts/p1-m3a-one-shot-refine.mjs' \
            'server/mlb-p1-scientific-capture-contract.test.ts' \
            'server/mlb-p1-scientific-capture-contract.ts' | sort)
          [[ "${changed}" == "${expected}" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P1-M3A: keep deployment metadata outside sports identity'
          git push origin HEAD:agent/p1-m3a-mlb-scientific-capture-contract
