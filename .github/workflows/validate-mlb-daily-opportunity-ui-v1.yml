name: Validate MLB Daily Opportunity UI V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/mlb-daily-opportunity-context-v1.ts'
      - 'server/mlb-daily-opportunity-context-v1.test.ts'
      - 'server/mlb-daily-opportunity-live-v1.ts'
      - 'server/mlb-daily-opportunity-price-shortlist-v1.ts'
      - 'server/mlb-daily-opportunity-price-shortlist-v1.test.ts'
      - 'server/mlb-daily-opportunity-ui-route-v1.ts'
      - 'server/mlb-daily-opportunity-ui-route-v1.test.ts'
      - 'server/mlb-unified-v16-live-input-assembler.ts'
      - 'server/mlb-unified-elite-shared-live-provider-bundle.ts'
      - 'server/routes.ts'
      - '.github/workflows/validate-mlb-daily-opportunity-ui-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check Daily Opportunity live/UI boundary
        run: |
          npx tsc --noEmit \
            --module ESNext \
            --moduleResolution bundler \
            --target ES2022 \
            --esModuleInterop \
            --skipLibCheck \
            --types node \
            server/mlb-daily-opportunity-context-v1.ts \
            server/mlb-daily-opportunity-context-v1.test.ts \
            server/mlb-daily-opportunity-price-shortlist-v1.ts \
            server/mlb-daily-opportunity-price-shortlist-v1.test.ts \
            server/mlb-daily-opportunity-live-v1.ts \
            server/mlb-daily-opportunity-ui-route-v1.ts \
            server/mlb-daily-opportunity-ui-route-v1.test.ts \
            server/mlb-unified-v16-live-input-assembler.ts

      - name: Bundle-check shared provider wiring
        run: npx esbuild server/mlb-unified-elite-shared-live-provider-bundle.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-daily-opportunity-shared-provider.mjs

      - name: Execute context falsification suite
        run: npx tsx --test server/mlb-daily-opportunity-context-v1.test.ts

      - name: Execute price-shortlist falsification suite
        run: npx tsx --test server/mlb-daily-opportunity-price-shortlist-v1.test.ts

      - name: Execute UI boundary suite
        run: npx tsx --test server/mlb-daily-opportunity-ui-route-v1.test.ts

      - name: Prove full-slate analysis and max-three economic boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'rankMlbIntrinsicGames(input.intrinsic.games)' server/mlb-daily-opportunity-context-v1.ts
          grep -F 'wholeQualifiedIntrinsicPopulationRanked: true' server/mlb-daily-opportunity-context-v1.ts
          grep -F 'marketDiscoveryCapMayHideDailyOpportunity: false' server/mlb-daily-opportunity-context-v1.ts
          grep -F 'provisionalGamesMayLeadDailyOpportunity: true' server/mlb-daily-opportunity-context-v1.ts
          grep -F 'MLB_DAILY_OPPORTUNITY_MAX_PRICE_CONSULTATIONS = 3' server/mlb-daily-opportunity-price-shortlist-v1.ts
          grep -F 'wholeSlateAnalysisDoesNotExpandPriceQuota: true' server/mlb-daily-opportunity-price-shortlist-v1.ts
          grep -F 'provisionalCandidateCannotBeMarkedPriceReady: true' server/mlb-daily-opportunity-price-shortlist-v1.ts
          grep -F 'requireCompleteProvisionalBullpenEvidence: true' server/mlb-daily-opportunity-ui-route-v1.ts
          grep -F 'requireCompleteProvisionalBullpenEvidence: input.requireCompleteProvisionalBullpenEvidence === true' server/mlb-unified-v16-live-input-assembler.ts
          grep -F 'priceConsultationShortlist: live.priceConsultationShortlist' server/mlb-daily-opportunity-ui-route-v1.ts
          grep -F 'provisionalV16Provider: mlbUnifiedLive.dailyOpportunityProvisionalV16Provider' server/routes.ts
          grep -F 'certifiedMaterializer: sharedClassifierMaterializer' server/mlb-unified-elite-shared-live-provider-bundle.ts
          grep -F 'paidOddsBoundaryCrossed: false' server/mlb-daily-opportunity-live-v1.ts
          grep -F 'paidOddsCalled: false' server/mlb-daily-opportunity-ui-route-v1.ts
          grep -F 'theOddsApiCreditsConsumed: 0' server/mlb-daily-opportunity-ui-route-v1.ts
          grep -F 'v68Changed: false' server/mlb-daily-opportunity-live-v1.ts
          grep -F 'v80Changed: false' server/mlb-daily-opportunity-live-v1.ts
          ! grep -nE 'apiKey|providerAccountScopeKey|stakeAmount|placeBet|BET_ELITE' server/mlb-daily-opportunity-live-v1.ts server/mlb-daily-opportunity-price-shortlist-v1.ts server/mlb-daily-opportunity-ui-route-v1.ts
          git diff --check

      - name: Build production backend with Daily Opportunity route
        run: npm run build:backend
