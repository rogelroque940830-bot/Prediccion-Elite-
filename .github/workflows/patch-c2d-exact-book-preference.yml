name: Patch C2D exact-book preference

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Prefer latest exact-book observation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "server/mlb-closing-line-store.ts",
              '      WHERE prediction_id = ? AND quote_at_ms <= ?\n      ORDER BY quote_at_ms DESC, recorded_at_ms DESC, event_id DESC LIMIT 1\n',
              '      WHERE prediction_id = ? AND quote_at_ms <= ?\n'
              '      ORDER BY CASE WHEN match_mode = \'EXACT_BOOK\' THEN 0 ELSE 1 END,\n'
              '        quote_at_ms DESC, recorded_at_ms DESC, event_id DESC LIMIT 1\n',
          )
          replace_once(
              "server/mlb-closing-line-store.test.ts",
              'test("proxy observations remain visible but are not injected as exact CLV", () => {\n',
              'test("a later proxy never replaces the last exact-book close", () => {\n'
              '  const dir = fs.mkdtempSync(path.join(os.tmpdir(), "mlb-closing-preference-"));\n'
              '  const dbPath = path.join(dir, "ledger.sqlite");\n'
              '  const ledger = new MlbLedgerStore(dbPath);\n'
              '  const commenceTime = "2026-08-02T23:10:00.000Z";\n'
              '  const saved = ledger.appendPrediction({ ...prediction(commenceTime), clientRequestId: "closing-store-prediction-preference" }).data;\n'
              '  const closing = new MlbClosingLineStore(dbPath);\n'
              '  closing.appendObservation(saved.id, {\n'
              '    clientRequestId: `close:${saved.id}:T60:hardrockbet_fl`, checkpoint: "T60",\n'
              '    quoteAt: "2026-08-02T22:20:00.000Z", commenceTime, source: "THE_ODDS_API",\n'
              '    sourceEventId: "event-preference", bookmakerKey: "hardrockbet_fl", bookmakerTitle: "Hard Rock Bet",\n'
              '    matchMode: "EXACT_BOOK", marketKey: "h2h", selection: "Detroit Tigers", line: null,\n'
              '    oddsAmerican: -150, ticketOddsAmerican: -140, ticketLine: null, comparable: true,\n'
              '  });\n'
              '  closing.appendObservation(saved.id, {\n'
              '    clientRequestId: `close:${saved.id}:T15:fanduel`, checkpoint: "T15",\n'
              '    quoteAt: "2026-08-02T23:00:00.000Z", commenceTime, source: "THE_ODDS_API",\n'
              '    sourceEventId: "event-preference", bookmakerKey: "fanduel", bookmakerTitle: "FanDuel",\n'
              '    matchMode: "PROXY_BOOK", marketKey: "h2h", selection: "Detroit Tigers", line: null,\n'
              '    oddsAmerican: -165, ticketOddsAmerican: -140, ticketLine: null, comparable: true,\n'
              '  });\n'
              '  const preferred = closing.latestBeforeCommence(saved.id, commenceTime);\n'
              '  assert.equal(preferred?.matchMode, "EXACT_BOOK");\n'
              '  assert.equal(preferred?.bookmakerKey, "hardrockbet_fl");\n'
              '  assert.equal(preferred?.oddsAmerican, -150);\n'
              '  closing.close(); ledger.close(); fs.rmSync(dir, { recursive: true, force: true });\n'
              '});\n\n'
              'test("proxy observations remain visible but are not injected as exact CLV", () => {\n',
          )
          PY
      - run: npm ci
      - run: npm run test:mlb-ledger
      - run: npm run typecheck:mlb-ledger
      - run: npm run build:backend
      - name: Commit validated preference
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-closing-line-store.ts server/mlb-closing-line-store.test.ts
          git commit -m "fix(clv): preserve exact-book close over later proxies"
          git push origin HEAD:${{ github.head_ref }}
