name: NFL R5H11 Local Multi-Prototype Expansion

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/**'
      - '.github/workflows/nfl-r5h11-local-multi-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-r5h11:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests
      - name: Validate scripts
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py
          python -m py_compile research/nfl/nfl_r5h3_rival_matchup_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h4_elite_selection_gate.py
          python -m py_compile research/nfl/nfl_r5h6_confidence_stratified_residual_rule_engine.py
          python -m py_compile research/nfl/nfl_r5h8_interaction_contradiction_engine.py
          python -m py_compile research/nfl/nfl_r5h10_marginal_geometry_expansion.py
          python -m py_compile research/nfl/nfl_r5h11_local_multi_prototype_expansion.py
      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5-output \
            --cache-dir .cache/nflverse
      - name: Rebuild R5B QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5b-output \
            --cache-dir .cache/nflverse
      - name: Rebuild R5B2 hybrid dataset
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output \
            --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 \
            --end-season 2025
      - name: Run NFL-R5H11 local multi-prototype expansion
        run: |
          python research/nfl/nfl_r5h11_local_multi_prototype_expansion.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h11-output \
            --expert-oos-start 2013 \
            --test-start 2018 \
            --end-season 2025
      - name: Enforce R5H11 sports-only boundary
        run: |
          python - <<'PY'
          import json
          a=json.load(open('nfl-r5h11-output/nfl_r5h11_audit.json'))
          m=json.load(open('nfl-r5h11-output/nfl_r5h11_manifest.json'))
          s=json.load(open('nfl-r5h11-output/nfl_r5h11_summary.json'))
          assert a['marketBoundary']=='PASS_MARKET_FREE'
          assert a['targetSeasonUsedForGeometryTemplate']=='NO'
          assert a['targetSeasonUsedForExpansionConfiguration']=='NO'
          assert a['targetSeasonUsedForR5H8CoreConfiguration']=='NO'
          assert a['configurationValidation']=='LATEST_TWO_PRIOR_SEASONS_ONLY'
          assert a['productionCodeTouched'] is False
          assert m['researchOnly'] is True
          assert m['marketDataUsedAsFeatures'] is False
          assert s['researchOnly'] is True
          assert s['marketDataUsed'] is False
          assert s['productionChanged'] is False
          assert s['multiPrototypeGeometryPriorOnly'] is True
          assert s['configurationChosenOnPriorValidationSeasonsOnly'] is True
          assert s['targetSeasonUsedForGeometryTemplate'] is False
          assert s['targetSeasonUsedForExpansionConfiguration'] is False
          assert s['ruleScoreUsesReferenceConfidenceMagnitude'] is False
          assert s['ruleWeightsGameSpecific'] is True
          assert s['automaticProductionPromotion'] is False
          print('NFL_R5H11_BOUNDARY_VERIFIED')
          PY
      - name: Show R5H11 results
        run: |
          cat nfl-r5h11-output/nfl_r5h11_summary.json
          echo
          cat nfl-r5h11-output/nfl_r5h11_by_season.csv
          echo
          cat nfl-r5h11-output/nfl_r5h11_config_by_season.csv
          echo
          cat nfl-r5h11-output/nfl_r5h11_prototypes_by_season.csv
      - name: Upload NFL-R5H11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h11-local-multi-prototype-evidence
          path: nfl-r5h11-output/
          if-no-files-found: error
          retention-days: 30
