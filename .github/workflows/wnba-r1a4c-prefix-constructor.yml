# Corrected R1A.4C2 runner; special-event exclusions frozen outcome-blind before this run.
name: WNBA R1A.4C Corrected Prefix Constructor Custody

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4C2_SPECIAL_EVENT_EXCLUSION_AND_PREFIX_CUSTODY.json'
      - 'research/wnba/WNBA_R1A4C_FULL_PREFIX_CONSTRUCTOR_CUSTODY.json'
      - 'research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_CERTIFICATION.json'
      - 'research/wnba/WNBA_R1A4B1_FALLBACK_ASOF_CERTIFICATION.json'
      - 'scripts/wnba-r1a4c-prefix-constructor.py'
      - 'scripts/wnba-r1a4c2-prefix-constructor.py'
      - '.github/workflows/wnba-r1a4c-prefix-constructor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constructor dependency
        run: python -m pip install --quiet pyarrow
      - name: Build corrected outcome-blind prefix rowset
        id: build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          python scripts/wnba-r1a4c2-prefix-constructor.py 2>&1 | tee wnba-r1a4c2-run.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Upload corrected R1A.4C diagnostics/evidence/rowset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4c2-prefix-${{ github.run_id }}
          path: |
            wnba-r1a4c2-run.log
            wnba-r1a4c-prefix-evidence.json
            wnba-r1a4c-prefix-rowset.jsonl
          if-no-files-found: error
          retention-days: 90
