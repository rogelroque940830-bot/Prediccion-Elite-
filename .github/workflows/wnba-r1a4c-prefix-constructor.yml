# Operational trigger revision 1; no scientific rule changed.
name: WNBA R1A.4C Full Prefix Constructor Custody

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4C_FULL_PREFIX_CONSTRUCTOR_CUSTODY.json'
      - 'research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_CERTIFICATION.json'
      - 'research/wnba/WNBA_R1A4B1_FALLBACK_ASOF_CERTIFICATION.json'
      - 'scripts/wnba-r1a4c-prefix-constructor.py'
      - '.github/workflows/wnba-r1a4c-prefix-constructor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install constructor dependency
        run: python -m pip install --quiet pyarrow
      - name: Build outcome-blind prefix rowset
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4c-prefix-constructor.py
      - name: Upload R1A.4C evidence and rowset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4c-prefix-${{ github.run_id }}
          path: |
            wnba-r1a4c-prefix-evidence.json
            wnba-r1a4c-prefix-rowset.jsonl
          if-no-files-found: error
          retention-days: 90
