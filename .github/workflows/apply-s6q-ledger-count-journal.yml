name: Apply S6Q Ledger Count Journal

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/apply-s6q-ledger-count-journal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Use one append-only file per ledger high-water mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/mlb-s6q-fifty-settlement-human-review.ts')
          source = path.read_text()
          before = '''function ledgerCountAnchorFileName(anchor: S6qLedgerCountAnchor): string {
            return `${String(anchor.ownedLedgerRecords).padStart(12, "0")}-${anchor.anchorDigestSha256.slice(0, 12)}.json`;
          }'''
          after = '''function ledgerCountAnchorFileName(anchor: S6qLedgerCountAnchor): string {
            return `${String(anchor.ownedLedgerRecords).padStart(12, "0")}.json`;
          }'''
          if before not in source:
              raise SystemExit('Expected ledgerCountAnchorFileName implementation not found')
          path.write_text(source.replace(before, after))
          PY
      - name: Commit concurrent-write hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-s6q-fifty-settlement-human-review.ts
          git commit -m 'Harden S6Q ledger journal concurrent writes'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
