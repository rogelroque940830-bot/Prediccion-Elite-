name: One-time secure integration merge

on:
  push:
    branches:
      - integration/p0-staging-secure
    paths:
      - .github/workflows/integration-merge-once.yml

permissions:
  contents: write

jobs:
  merge-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/p0-staging-secure
          fetch-depth: 0

      - name: Merge secure frontend and resolve reviewed conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rogelroque940830-bot"
          git config user.email "272644701+rogelroque940830-bot@users.noreply.github.com"
          git fetch origin integration/p0-frontend-session:refs/remotes/origin/integration/p0-frontend-session

          set +e
          git merge --no-commit --no-ff origin/integration/p0-frontend-session
          MERGE_EXIT=$?
          set -e

          if [ "$MERGE_EXIT" -ne 0 ]; then
            CONFLICTS="$(git diff --name-only --diff-filter=U | sort)"
            EXPECTED=$'README.md\nserver/index.ts\nserver/routes.ts'
            if [ "$CONFLICTS" != "$EXPECTED" ]; then
              echo "Unexpected conflict set:"
              printf '%s\n' "$CONFLICTS"
              exit 1
            fi
          fi

          git checkout --theirs README.md
          git checkout --theirs server/routes.ts

          cat > server/index.ts <<'TS'
          import express, { type Request, Response, NextFunction } from "express";
          import { registerRoutes } from "./routes";
          import { registerStagingAdminAuthObservation } from "./staging-admin-auth";
          import { createServer } from "http";
          import {
            apiRateLimit,
            requireWriteAuth,
            restrictedCors,
            securityHeaders,
          } from "./security";
          import { createSessionMiddleware, registerAuthRoutes } from "./auth";
          import { registerPicksV2Routes } from "./picks-v2";

          export const app = express();
          // Railway terminates TLS and forwards one trusted proxy hop.
          app.set("trust proxy", 1);
          const httpServer = createServer(app);

          const missingApiVariables = ["BDL_API_KEY", "ODDS_API_KEY"].filter(
            (name) => !process.env[name],
          );
          if (missingApiVariables.length > 0) {
            console.warn(
              `[config] Variables API faltantes: ${missingApiVariables.join(", ")}`,
            );
          }

          declare module "http" {
            interface IncomingMessage {
              rawBody: unknown;
            }
          }

          // Security boundary for the independent frontend.
          app.use(securityHeaders);
          app.use(restrictedCors);
          app.use(apiRateLimit);
          app.use(createSessionMiddleware());

          app.use(
            express.json({
              limit: process.env.JSON_BODY_LIMIT || "1mb",
              verify: (req, _res, buf) => {
                req.rawBody = buf;
              },
            }),
          );

          app.use(
            express.urlencoded({
              extended: false,
              limit: process.env.FORM_BODY_LIMIT || "256kb",
            }),
          );

          // Staging-only visibility. This observer never authorizes a request;
          // the real enforcement remains requireWriteAuth below.
          registerStagingAdminAuthObservation(app);
          app.use(requireWriteAuth);

          export function log(message: string, source = "express") {
            const formattedTime = new Date().toLocaleTimeString("en-US", {
              hour: "numeric",
              minute: "2-digit",
              second: "2-digit",
              hour12: true,
            });

            console.log(`${formattedTime} [${source}] ${message}`);
          }

          app.use((req, res, next) => {
            const start = Date.now();
            const path = req.path;

            res.on("finish", () => {
              const duration = Date.now() - start;
              if (path.startsWith("/api")) {
                const logLine = `${req.method} ${path} ${res.statusCode} in ${duration}ms`;
                log(logLine);
              }
            });

            next();
          });

          app.get("/", (_req, res) => {
            res.json({ status: "ok", service: "CourtEdge Backend", version: "1.0.0" });
          });

          app.get("/health", (_req, res) => {
            res.json({ status: "healthy" });
          });

          (async () => {
            registerAuthRoutes(app);
            // Canonical v2 routes must precede historical handlers.
            registerPicksV2Routes(app);
            await registerRoutes(httpServer, app);

            app.use((err: any, _req: Request, res: Response, next: NextFunction) => {
              const status = err.status || err.statusCode || 500;
              const message =
                status >= 500 ? "Internal Server Error" : err.message || "Request failed";

              console.error("Request error:", err);

              if (res.headersSent) {
                return next(err);
              }

              return res.status(status).json({ message });
            });

            const port = parseInt(process.env.PORT || "5000", 10);
            httpServer.listen(
              {
                port,
                host: "0.0.0.0",
              },
              () => {
                log(`CourtEdge Backend serving on port ${port}`);
              },
            );
          })();
          TS

          git add README.md server/index.ts server/routes.ts

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved conflicts remain:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Scan merged repository for credentials
        run: node scripts/secret-scan.mjs

      - name: Install and build merged backend
        run: |
          npm ci
          npm run build:backend

      - name: Install, type-check and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit verified isolated merge
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/integration-merge-once.yml
          git add -A
          git commit -m "integration: combine secure frontend with validated p0 staging"
          git push origin HEAD:integration/p0-staging-secure
