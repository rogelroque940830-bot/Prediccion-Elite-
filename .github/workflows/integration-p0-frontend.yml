name: Court Edge P0 Frontend Integration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/p0-frontend-session
      - integration/p0-staging-secure
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'
  pull_request:
    branches:
      - security/p0-remediation
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'

permissions:
  contents: write

jobs:
  # BEGIN ONE-TIME NHL P0 MIGRATION
  apply-nhl-p0:
    if: github.ref == 'refs/heads/integration/p0-staging-secure' || github.head_ref == 'integration/p0-staging-secure'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/p0-staging-secure
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Apply NHL P0 hardening
        run: python3 scripts/apply-nhl-p0-hardening.py

      - name: Validate backend
        run: |
          npm ci
          npm run build:backend
          npx tsx scripts/p0-security-smoke.ts
          npx tsx scripts/integration-auth-smoke.ts

      - name: Validate frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: |
          npm ci
          npm run audit:static
          npm run check
          npm run build
          npm run check:dist

      - name: Remove one-time migration machinery
        shell: bash
        run: |
          rm scripts/apply-nhl-p0-hardening.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/integration-p0-frontend.yml')
          s = p.read_text()
          s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          start = s.index('  # BEGIN ONE-TIME NHL P0 MIGRATION\n')
          end = s.index('  # END ONE-TIME NHL P0 MIGRATION\n', start) + len('  # END ONE-TIME NHL P0 MIGRATION\n')
          s = s[:start] + s[end:]
          p.write_text(s)
          PY

      - name: Commit verified NHL hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(nhl): harden season and goalie verification"
          git push origin HEAD:integration/p0-staging-secure
  # END ONE-TIME NHL P0 MIGRATION

  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Verify imported frontend types are reconciled
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-integration-frontend-types.py
          git diff --exit-code -- frontend/client/src

  backend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Run P0 middleware smoke test
        run: npx tsx scripts/p0-security-smoke.ts

      - name: Run session and CSRF integration smoke test
        run: npx tsx scripts/integration-auth-smoke.ts

  frontend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Static frontend audit
        id: static_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:static 2>&1 | tee frontend-static-audit.txt

      - name: Upload frontend audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-audit
          path: frontend/frontend-static-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce static audit result
        if: ${{ steps.static_audit.outcome == 'failure' }}
        run: exit 1

      - name: TypeScript type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee frontend-typecheck.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck
          path: frontend/frontend-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TypeScript result
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: npm run build

      - name: Distribution smoke test
        id: dist_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:dist 2>&1 | tee frontend-dist-smoke.txt

      - name: Upload distribution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-smoke
          path: frontend/frontend-dist-smoke.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce distribution smoke result
        if: ${{ steps.dist_smoke.outcome == 'failure' }}
        run: exit 1
