name: Court Edge P0 Frontend Integration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/p0-frontend-session
      - integration/p0-staging-secure
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'
  pull_request:
    branches:
      - security/p0-remediation
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'

permissions:
  contents: write

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Verify imported frontend types are reconciled
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-integration-frontend-types.py
          git diff --exit-code -- frontend/client/src

  backend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Run P0 middleware smoke test
        run: npx tsx scripts/p0-security-smoke.ts

      - name: Run session and CSRF integration smoke test
        run: npx tsx scripts/integration-auth-smoke.ts

  frontend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Static frontend audit
        id: static_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:static 2>&1 | tee frontend-static-audit.txt

      - name: Upload frontend audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-audit
          path: frontend/frontend-static-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce static audit result
        if: ${{ steps.static_audit.outcome == 'failure' }}
        run: exit 1

      - name: TypeScript type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee frontend-typecheck.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck
          path: frontend/frontend-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TypeScript result
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: npm run build

      - name: Distribution smoke test
        id: dist_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:dist 2>&1 | tee frontend-dist-smoke.txt

      - name: Upload distribution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-smoke
          path: frontend/frontend-dist-smoke.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce distribution smoke result
        if: ${{ steps.dist_smoke.outcome == 'failure' }}
        run: exit 1

  # BEGIN ONE-TIME WNBA REPAIR
  repair-wnba:
    if: github.ref == 'refs/heads/integration/p0-staging-secure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/p0-staging-secure
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Patch WNBA endpoint and selector wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          frontend_path = Path('frontend/client/src/pages/wnba-predictor.tsx')
          frontend = frontend_path.read_text(encoding='utf-8')

          old_query = 'const { data: wnbaData, isLoading: wnbaLoading, refetch: refetchWNBA } = useQuery<{ success: boolean; data: any[] }>({' 
          new_query = 'const { data: wnbaData, isLoading: wnbaLoading, isError: wnbaError, refetch: refetchWNBA } = useQuery<{ success: boolean; data: any[] }>({' 
          if old_query in frontend:
              frontend = frontend.replace(old_query, new_query, 1)
          elif new_query not in frontend:
              raise SystemExit('WNBA query declaration not found')

          old_query_opts = 'queryKey: ["/api/wnba/all"], staleTime: 30 * 60 * 1000, retry: 1,'
          new_query_opts = 'queryKey: ["/api/wnba/all"], staleTime: 30 * 60 * 1000, retry: 0,'
          if old_query_opts in frontend:
              frontend = frontend.replace(old_query_opts, new_query_opts, 1)

          old_select = '<Select value={team} onValueChange={setTeam}>'
          new_select = '<Select value={team} onValueChange={(value) => autoFillWNBA(value, side)} disabled={wnbaLoading || wnbaError || wnbaTeams.length === 0}>'
          if old_select in frontend:
              frontend = frontend.replace(old_select, new_select, 1)
          elif new_select not in frontend:
              raise SystemExit('WNBA team selector not found')

          old_loading = '{wnbaLoading && <p className="text-xs text-muted-foreground italic"><RefreshCw className="h-3 w-3 inline animate-spin mr-1" /> Cargando stats de equipos...</p>}'
          new_loading = '''{wnbaLoading && <p className="text-xs text-muted-foreground italic"><RefreshCw className="h-3 w-3 inline animate-spin mr-1" /> Cargando stats de equipos...</p>}
          {wnbaError && (
            <div className="flex flex-wrap items-center gap-2 text-xs text-red-300">
              <span>No se pudieron cargar estadísticas WNBA verificadas. No se usarán valores predeterminados como si fueran reales.</span>
              <Button size="sm" variant="outline" onClick={() => refetchWNBA()} className="h-7 border-red-500/30 text-red-300">
                <RefreshCw className="h-3 w-3 mr-1" /> Reintentar
              </Button>
            </div>
          )}'''
          if old_loading in frontend:
              frontend = frontend.replace(old_loading, new_loading, 1)
          elif 'No se pudieron cargar estadísticas WNBA verificadas' not in frontend:
              raise SystemExit('WNBA loading state not found')

          frontend_path.write_text(frontend, encoding='utf-8')

          routes_path = Path('server/routes.ts')
          routes = routes_path.read_text(encoding='utf-8')

          old_fetch = '''async function nbaFetch(url: string) {
  const res = await fetch(url, { headers: NBA_HEADERS });
  if (!res.ok) throw new Error(`NBA API ${res.status}: ${url}`);
  return res.json();
}'''
          new_fetch = '''async function nbaFetch(
  url: string,
  headers: Record<string, string> = NBA_HEADERS,
  timeoutMs = 12_000,
) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, { headers, signal: controller.signal });
    if (!res.ok) throw new Error(`NBA API ${res.status}: ${url}`);
    return res.json();
  } finally {
    clearTimeout(timer);
  }
}

const WNBA_HEADERS: Record<string, string> = {
  ...NBA_HEADERS,
  Referer: "https://www.wnba.com/",
  Origin: "https://www.wnba.com",
};

async function wnbaFetch(url: string) {
  const candidates = url.includes("stats.nba.com")
    ? [url.replace("https://stats.nba.com", "https://stats.wnba.com"), url]
    : [url];
  let lastError: unknown;
  for (const candidate of candidates) {
    try {
      return await nbaFetch(candidate, WNBA_HEADERS, 12_000);
    } catch (error) {
      lastError = error;
      console.warn(`WNBA stats source failed: ${candidate}`, error);
    }
  }
  throw lastError instanceof Error ? lastError : new Error("WNBA stats sources unavailable");
}'''
          if old_fetch in routes:
              routes = routes.replace(old_fetch, new_fetch, 1)
          elif 'async function wnbaFetch(url: string)' not in routes:
              raise SystemExit('nbaFetch helper not found')

          wnba_marker = '// WNBA ROUTES (same NBA API with LeagueID=10)'
          nhl_marker = '// NHL ROUTES'
          start = routes.index(wnba_marker)
          end = routes.index(nhl_marker, start)
          wnba_section = routes[start:end]
          if 'nbaFetch(' in wnba_section:
              wnba_section = wnba_section.replace('nbaFetch(', 'wnbaFetch(')
              routes = routes[:start] + wnba_section + routes[end:]

          routes_path.write_text(routes, encoding='utf-8')

          workflow_path = Path('.github/workflows/integration-p0-frontend.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          begin = workflow.index('  # BEGIN ONE-TIME WNBA REPAIR')
          end_marker = '  # END ONE-TIME WNBA REPAIR\n'
          end = workflow.index(end_marker, begin) + len(end_marker)
          workflow = workflow[:begin] + workflow[end:]
          workflow = workflow.replace('permissions:\n  contents: write', 'permissions:\n  contents: read', 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

      - name: Verify backend build
        run: |
          npm ci
          npm run build:backend

      - name: Verify frontend type-check and build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit verified WNBA repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts frontend/client/src/pages/wnba-predictor.tsx .github/workflows/integration-p0-frontend.yml
          git commit -m "fix(wnba): prevent hanging stats and wire verified autofill"
          git push origin HEAD:integration/p0-staging-secure
  # END ONE-TIME WNBA REPAIR
