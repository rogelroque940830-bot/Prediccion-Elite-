name: Court Edge P0 Frontend Integration

on:
  workflow_dispatch:
  push:
    branches:
      - integration/p0-frontend-session
      - integration/p0-staging-secure
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'
  pull_request:
    branches:
      - security/p0-remediation
    paths:
      - 'server/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/integration-p0-frontend.yml'

permissions:
  contents: write

jobs:
  apply-mlb-injury-stake-hardening:
    if: github.event_name == 'pull_request' && github.head_ref == 'integration/p0-staging-secure'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/p0-staging-secure
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Align MLB hardening migrator with current predictor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-mlb-injury-stake-hardening.py")
          text = path.read_text(encoding="utf-8")
          old = '''page = replace_once(
              page,
              \'''        const injuryProbDelta = Math.abs(parseFloat(homeInjury) || 0) + Math.abs(parseFloat(awayInjury) || 0);\''',
              \'''        const injuryProbDelta = Math.abs(parseFloat(homeInjury) || 0) + Math.abs(parseFloat(awayInjury) || 0);
                  const injuryDataQuality: "VERIFIED" | "DEGRADED" =
                    homeInjuryFeed.status === "VERIFIED" && awayInjuryFeed.status === "VERIFIED"
                      ? "VERIFIED"
                      : "DEGRADED";\''',
              "derive MLB injury data quality",
          )'''
          new = '''page = replace_once(
              page,
              \'''    let injuryProbDelta = 0;
              let injuryTotalDelta = 0;\''',
              \'''    let injuryProbDelta = 0;
              let injuryTotalDelta = 0;
              const injuryDataQuality: "VERIFIED" | "DEGRADED" =
                homeInjuryFeed.status === "VERIFIED" && awayInjuryFeed.status === "VERIFIED"
                  ? "VERIFIED"
                  : "DEGRADED";\''',
              "derive MLB injury data quality",
          )'''
          if old not in text:
              raise RuntimeError("old injuryDataQuality migrator block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              'if page.count("injuryProbDelta, injuryDataQuality") != 4:',
              'if page.count("injuryProbDelta, injuryDataQuality") != 3:',
              1,
          )
          text = text.replace(
              'PQS injuryDataQuality propagation: expected 4 calls',
              'PQS injuryDataQuality propagation: expected 3 calls',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply MLB injury and stake hardening
        id: migration
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/apply-mlb-injury-stake-hardening.py > /tmp/mlb-injury-stake-hardening.log 2>&1
          status=$?
          cat /tmp/mlb-injury-stake-hardening.log
          exit "$status"

      - name: Upload MLB hardening diagnostics
        if: ${{ steps.migration.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: mlb-injury-stake-hardening-diagnostic
          path: /tmp/mlb-injury-stake-hardening.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce MLB hardening migration result
        if: ${{ steps.migration.outcome == 'failure' }}
        run: exit 1

      - name: Validate backend and security
        if: ${{ steps.migration.outcome == 'success' }}
        run: |
          npm ci
          npm run build:backend
          npx tsx scripts/p0-security-smoke.ts
          npx tsx scripts/integration-auth-smoke.ts

      - name: Validate frontend
        if: ${{ steps.migration.outcome == 'success' }}
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: |
          npm ci
          npm run audit:static
          npm run check
          npm run build
          npm run check:dist

      - name: Commit validated MLB hardening
        if: ${{ steps.migration.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts frontend/client/src/pages/mlb-predictor.tsx
          git commit -m "fix(mlb): verify injury feed and cap stake at one unit"
          git push origin HEAD:integration/p0-staging-secure

  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Verify imported frontend types are reconciled
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix-integration-frontend-types.py
          git diff --exit-code -- frontend/client/src

  backend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Run P0 middleware smoke test
        run: npx tsx scripts/p0-security-smoke.ts

      - name: Run session and CSRF integration smoke test
        run: npx tsx scripts/integration-auth-smoke.ts

  frontend:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout current integration revision
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: npm ci

      - name: Static frontend audit
        id: static_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run audit:static 2>&1 | tee frontend-static-audit.txt

      - name: Upload frontend audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static-audit
          path: frontend/frontend-static-audit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce static audit result
        if: ${{ steps.static_audit.outcome == 'failure' }}
        run: exit 1

      - name: TypeScript type-check
        id: typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee frontend-typecheck.txt

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-typecheck
          path: frontend/frontend-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce TypeScript result
        if: ${{ steps.typecheck.outcome == 'failure' }}
        run: exit 1

      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://p0-staging.invalid
        run: npm run build

      - name: Distribution smoke test
        id: dist_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:dist 2>&1 | tee frontend-dist-smoke.txt

      - name: Upload distribution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-smoke
          path: frontend/frontend-dist-smoke.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce distribution smoke result
        if: ${{ steps.dist_smoke.outcome == 'failure' }}
        run: exit 1
