name: Validate P1-M6A3B2A MLB Team Strength

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-market-team-strength.ts'
      - 'server/mlb-market-team-strength.test.ts'
      - 'server/mlb-market-team-strength-inference.ts'
      - 'server/mlb-market-team-strength-inference.test.ts'
      - 'scripts/p1-m6a3b2a-team-strength-backtest.mjs'
      - 'docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md'
      - 'evidence/p1-m6a3b1/2025-official-baseline.json'
      - 'tsconfig.p1-m6a3b2a-team-strength.json'
      - '.github/workflows/validate-p1-m6a3b2a-mlb-team-strength.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-m6a3b2a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned B2A surface
        run: npx tsc -p tsconfig.p1-m6a3b2a-team-strength.json
      - name: Run team-strength and paired-inference falsification tests
        run: |
          npx tsx --test \
            server/mlb-market-team-strength.test.ts \
            server/mlb-market-team-strength-inference.test.ts
      - name: Preserve A3A and B1 statistical contracts
        run: |
          npx tsx --test \
            server/mlb-market-run-distribution.test.ts \
            server/mlb-market-calibration.test.ts \
            server/mlb-market-historical-dataset.test.ts \
            server/mlb-market-historical-source.test.ts \
            server/mlb-market-historical-fit.test.ts
      - name: Preserve ledger, backend and scientific regressions
        run: |
          npm run test:mlb-ledger
          npm run test:s3-modularization
          npm run build:backend
          npm run test:s5a-e2e
          npm run test:s5b-shadow
      - name: Verify paired inference, stable outcome and no-promotion boundaries
        shell: bash
        run: |
          set -euo pipefail
          model='server/mlb-market-team-strength.ts'
          inference='server/mlb-market-team-strength-inference.ts'
          script='scripts/p1-m6a3b2a-team-strength-backtest.mjs'
          docs='docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md'
          evidence='evidence/p1-m6a3b1/2025-official-baseline.json'
          grep -F 'NB2_TEAM_ATTACK_DEFENSE_SHRINKAGE' "$model"
          grep -F 'P1_M6A3B2A_INFERENCE_OUTER_TIME_LEAKAGE_DETECTED' "$inference"
          grep -F 'P1_M6A3B2A_INFERENCE_INNER_TIME_LEAKAGE_DETECTED' "$inference"
          grep -F 'SUPPORTED_IMPROVEMENT' "$inference"
          grep -F 'SUPPORTED_REGRESSION' "$inference"
          grep -F 'INCONCLUSIVE' "$inference"
          grep -F 'familywiseAlpha = 0.05 / familywiseHorizons' "$inference"
          grep -F 'automaticModelSelectionAllowed: false' "$inference"
          grep -F 'automaticPromotionAllowed: false' "$inference"
          grep -F 'actionabilityAllowed: false' "$inference"
          grep -F 'P1_M6A3B2A_FROZEN_BASELINE_OUTCOME_DIGEST_MISMATCH' "$script"
          grep -F 'P1_M6A3B2A_POINT_ESTIMATE_PARITY_FAILURE' "$script"
          grep -F 'sourceProvenanceDrift' "$script"
          grep -F 'legacyDatasetDigestDrift' "$script"
          grep -F '"outcomeDigest": "c4f0c8b3bf2b7cb8eed5660d836034410b9f125b0491194df9b2162a4c19a64d"' "$evidence"
          grep -F '"canonicalOutcomeDifferences": 0' "$evidence"
          grep -Fi 'Bonferroni' "$docs"
          ! grep -E 'appendPrediction\(|appendSettlement\(|automaticBetPlacement:[[:space:]]*true|actionabilityAllowed:[[:space:]]*true|automaticModelSelectionAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' "$model" "$inference" "$script"
      - name: Verify exact paired-inference scope from PR base to PR head
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ -z "$base" || -z "$head" ]]; then
            git fetch origin integration/p0-staging-secure --depth=1
            base='origin/integration/p0-staging-secure'
            head='HEAD'
          fi
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-m6a3b2a-mlb-team-strength.yml' \
            'docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md' \
            'scripts/p1-m6a3b2a-team-strength-backtest.mjs' \
            'server/mlb-market-team-strength-inference.test.ts' \
            'server/mlb-market-team-strength-inference.ts' \
            'tsconfig.p1-m6a3b2a-team-strength.json' | sort)
          [[ "$changed" == "$expected" ]]
