name: Validate P1-M6A3B2A MLB Team Strength

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-market-team-strength.ts'
      - 'server/mlb-market-team-strength.test.ts'
      - 'server/mlb-market-historical-dataset.ts'
      - 'server/mlb-market-historical-dataset.test.ts'
      - 'scripts/p1-m6a3b2a-team-strength-backtest.mjs'
      - 'docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md'
      - 'evidence/p1-m6a3b1/2025-outcome-integrity.json'
      - 'tsconfig.p1-m6a3b2a-team-strength.json'
      - '.github/workflows/validate-p1-m6a3b2a-mlb-team-strength.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-m6a3b2a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned B2A surface
        run: npx tsc -p tsconfig.p1-m6a3b2a-team-strength.json
      - name: Run team-strength falsification tests
        run: npx tsx --test server/mlb-market-team-strength.test.ts
      - name: Preserve A3A and B1 statistical contracts
        run: |
          npx tsx --test \
            server/mlb-market-run-distribution.test.ts \
            server/mlb-market-calibration.test.ts \
            server/mlb-market-historical-dataset.test.ts \
            server/mlb-market-historical-source.test.ts \
            server/mlb-market-historical-fit.test.ts
      - name: Preserve ledger, backend and scientific regressions
        run: |
          npm run test:mlb-ledger
          npm run test:s3-modularization
          npm run build:backend
          npm run test:s5a-e2e
          npm run test:s5b-shadow
      - name: Verify B2A research and no-promotion boundaries
        shell: bash
        run: |
          set -euo pipefail
          model='server/mlb-market-team-strength.ts'
          dataset='server/mlb-market-historical-dataset.ts'
          script='scripts/p1-m6a3b2a-team-strength-backtest.mjs'
          docs='docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md'
          baseline='evidence/p1-m6a3b1/2025-official-baseline.json'
          integrity='evidence/p1-m6a3b1/2025-outcome-integrity.json'
          grep -F 'NB2_TEAM_ATTACK_DEFENSE_SHRINKAGE' "$model"
          grep -F 'P1_M6A3B2A_INNER_TIME_LEAKAGE_DETECTED' "$model"
          grep -F 'P1_M6A3B2A_OUTER_TIME_LEAKAGE_DETECTED' "$model"
          grep -F 'automaticModelSelectionAllowed: false' "$model"
          grep -F 'automaticPromotionAllowed: false' "$model"
          grep -F 'actionabilityAllowed: false' "$model"
          grep -F 'digestMlbHistoricalOutcomeObservations' "$dataset"
          grep -F 'digestMlbHistoricalSourceProvenance' "$dataset"
          grep -F 'P1_M6A3B2A_FROZEN_BASELINE_OUTCOME_DIGEST_MISMATCH' "$script"
          grep -F 'providerMetadataDriftObserved' "$script"
          grep -F '15827a9172824bb0863ab8c3ecd086184ada6a18fa99bbdee526a58f91aa8a4b' "$baseline"
          grep -F 'c4f0c8b3bf2b7cb8eed5660d836034410b9f125b0491194df9b2162a4c19a64d' "$integrity"
          grep -F '"gamesWithSportingFieldDifference": 0' "$integrity"
          grep -Fi 'outer validation block is never used to select the prior' "$docs"
          ! grep -E 'appendPrediction\(|appendSettlement\(|automaticBetPlacement:[[:space:]]*true|actionabilityAllowed:[[:space:]]*true|automaticModelSelectionAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' "$model" "$dataset" "$script"
      - name: Verify bounded B2A maintenance scope from PR base to PR head
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ -z "$base" || -z "$head" ]]; then
            git fetch origin integration/p0-staging-secure --depth=1
            base='origin/integration/p0-staging-secure'
            head='HEAD'
          fi
          git diff --check "$base...$head"
          mapfile -t changed < <(git diff --name-only "$base...$head" | sort)
          allowed=(
            '.github/workflows/validate-p1-m6a3b1-mlb-historical-oos.yml'
            '.github/workflows/validate-p1-m6a3b2a-mlb-team-strength.yml'
            'docs/P1_M6A3B2A_MLB_TEAM_STRENGTH_CHALLENGER.md'
            'evidence/p1-m6a3b1/2025-outcome-integrity.json'
            'scripts/p1-m6a3b2a-team-strength-backtest.mjs'
            'server/mlb-market-historical-dataset.test.ts'
            'server/mlb-market-historical-dataset.ts'
            'server/mlb-market-team-strength.test.ts'
            'server/mlb-market-team-strength.ts'
            'tsconfig.p1-m6a3b2a-team-strength.json'
          )
          for file in "${changed[@]}"; do
            printf '%s\n' "${allowed[@]}" | grep -Fx -- "$file" >/dev/null || {
              echo "Unexpected P1-M6A3B2A maintenance file: $file" >&2
              exit 1
            }
          done
          changed_text=$(printf '%s\n' "${changed[@]}")
          if grep -Eq '^server/mlb-market-historical-dataset(\.test)?\.ts$' <<<"$changed_text"; then
            grep -Fx 'server/mlb-market-historical-dataset.ts' <<<"$changed_text" >/dev/null
            grep -Fx 'server/mlb-market-historical-dataset.test.ts' <<<"$changed_text" >/dev/null
          fi
          if grep -Eq '^server/mlb-market-team-strength(\.test)?\.ts$' <<<"$changed_text"; then
            grep -Fx 'server/mlb-market-team-strength.ts' <<<"$changed_text" >/dev/null
            grep -Fx 'server/mlb-market-team-strength.test.ts' <<<"$changed_text" >/dev/null
          fi
