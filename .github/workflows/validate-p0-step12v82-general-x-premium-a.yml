name: Validate P0 Step 12V82 General x Premium-A

on:
  pull_request:
    paths:
      - 'research/p0-step12v82-general-x-premium-a-contract.json'
      - 'scripts/p0-step12v82-general-x-premium-a.py'
      - '.github/workflows/validate-p0-step12v82-general-x-premium-a.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-discovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'

      - name: Prove V82 plan predates V82 scorer
        shell: bash
        run: |
          set -euo pipefail
          C='research/p0-step12v82-general-x-premium-a-contract.json'
          S='scripts/p0-step12v82-general-x-premium-a.py'
          CADD="$(git log --diff-filter=A --format=%H -- "$C" | tail -1)"
          SADD="$(git log --diff-filter=A --format=%H -- "$S" | tail -1)"
          test -n "$CADD" && test -n "$SADD" && test "$CADD" != "$SADD"
          git merge-base --is-ancestor "$CADD" "$SADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v82-general-x-premium-a-contract.json'))
          assert c['scientificStatus']=='FROZEN_GENERAL_X_PREMIUM_A_DISCOVERY_PLAN_BEFORE_ANY_V82_SCORER_EXISTS'
          assert c['targetDefinition']['consensusThreshold']==0.55
          assert c['premiumADefinition']['componentCountThresholds']==[1,2,3]
          assert c['statisticsBoundary']['newThresholdSearchAllowed'] is False
          assert c['statisticsBoundary']['awayPremiumASymmetrizationAllowed'] is False
          assert c['decisionBoundary']['v80Changed'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V82_FREEZE_FIRST_PLAN_PROVED')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/p0-step12v82-general-x-premium-a.py

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793

      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do
            test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"
            test -s "inputs/step12v3/$S/cohort/official-acquisition.json"
          done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY" && test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Execute frozen V82 General x Premium-A study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/p0-step12v82-general-x-premium-a.py \
            --root inputs/step12v3 \
            --custody '${{ steps.inputs.outputs.custody }}' \
            --v16-manifest '${{ steps.inputs.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v79-contract research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json \
            --v79-scorer scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py \
            --contract research/p0-step12v82-general-x-premium-a-contract.json \
            --out work/v82-general-x-premium-a.json

      - name: Enforce V82 integrity and print decision table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v82-general-x-premium-a.json'))
          assert r['classification']=='V82_GENERAL_X_PREMIUM_A_RETROSPECTIVE_DISCOVERY_COMPLETE'
          assert r['routingIdentity']['exactConfluenceGeneralRouteAndExactPremiumAOverlap']==0
          i=r['integrity']
          assert i['refitPerformed'] is False
          assert i['recalibrationPerformed'] is False
          assert i['newFeaturesSearched'] is False
          assert i['newThresholdsSearched'] is False
          assert i['premiumThresholdRelaxed'] is False
          assert i['awayPremiumASymmetrized'] is False
          assert i['v80Changed'] is False
          assert i['realFinancialExposure']==0
          print(json.dumps({
            'routingIdentity':r['routingIdentity'],
            'pureGeneral':r['pureGeneralParity'],
            'home':r['pureGeneralHome'],
            'away':r['pureGeneralAway'],
            'componentDose':r['premiumComponentDoseResponseHome'],
            'headlineViews':r['headlineViews'],
            'seriousTop10':r['seriousCandidatesByHistoricalHitRate'][:10]
          },indent=2))
          PY

      - name: Upload V82 discovery report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v82-general-x-premium-a
          path: work/v82-general-x-premium-a.json
          if-no-files-found: error
          retention-days: 90
