name: MLB R1B Statcast xERA Wayback Mapping-Stability Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe.ts
      - .github/workflows/mlb-r1b-statcast-xera-wayback-mapping-stability-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Probe primary archived Savant xERA mapping stability
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe
          npx tsx scripts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe.ts \
            --out=artifacts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe/evidence.json

      - name: Enforce primary-anchor-only fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe/evidence.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          if(e.status!=='WAYBACK_PRIMARY_XERA_MAPPING_STABILITY_PROBE_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.sourceAuthority?.archivedPayloadIsReplayOfPrimaryPublisherSurface!==true) throw new Error('truth anchor');
          if(e.sourceAuthority?.interpolationBetweenArchiveCapturesAllowed!==false) throw new Error('interpolation');
          if(!Array.isArray(e.seasonEvidence)||e.seasonEvidence.length!==5) throw new Error('season coverage');
          if(!(e.summary?.parsedCaptureCount>0)||!(e.summary?.parsedRowCount>0)) throw new Error('empty replay');
          if(e.summary?.exactTargetDateXeraCustodyForFullUniverseProven!==false) throw new Error('premature custody');
          if(e.summary?.exactSavantProductionConversionProven!==false) throw new Error('premature mechanism');
          if(e.summary?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          if(e.interpretationPolicy?.noInterpolationBetweenArchiveSnapshots!==true) throw new Error('no-interpolation policy');
          if(e.interpretationPolicy?.empiricalPolynomialOrSquareLawFitForbidden!==true) throw new Error('empirical fit policy');
          if(e.interpretationPolicy?.approximationForbidden!==true) throw new Error('approximation policy');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('scientific boundary');
          NODE

      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe.ts
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'noInterpolationBetweenArchiveSnapshots: true' "$src"
          grep -F 'empiricalPolynomialOrSquareLawFitForbidden: true' "$src"
          grep -F 'familyPromotionAuthorized: false' "$src"

      - name: Backend build regression
        run: npm run build:backend

      - name: Upload mapping-stability evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-wayback-mapping-stability-probe
          path: artifacts/mlb-r1b-statcast-xera-wayback-mapping-stability-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
