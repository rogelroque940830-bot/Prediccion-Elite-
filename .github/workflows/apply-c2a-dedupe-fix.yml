name: Apply C2A decision-context deduplication

on:
  push:
    branches:
      - feature/mlb-injury-calibration-report-c2a
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-calibration-report-c2a
          fetch-depth: 0
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Ignore per-market capture time in injury decision fingerprint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          report = Path('server/mlb-injury-calibration-report.ts')
          text = report.read_text()
          old = '''  const digest = crypto.createHash("sha256").update(canonicalJson(audit)).digest("hex");
          return `${gameIdentity}:${digest}`;
          '''
          new = '''  // Each selected market receives its own capture timestamp even when the injury
            // evidence and Phase B decision are identical. Exclude only capturedAt so ML,
            // F5 and totals from the same analysis share one calibration context.
            const { capturedAt: _capturedAt, ...decisionAudit } = audit;
            const digest = crypto.createHash("sha256").update(canonicalJson(decisionAudit)).digest("hex");
            return `${gameIdentity}:${digest}`;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'report dedupe anchor count={text.count(old)}')
          report.write_text(text.replace(old, new, 1))

          tests = Path('server/mlb-injury-calibration-report.test.ts')
          test_text = tests.read_text()
          old_record = '''function record(market: string, settled: boolean, withAudit = true, recordedAtMs = 1_000) {
            return {
          '''
          new_record = '''function record(market: string, settled: boolean, withAudit = true, recordedAtMs = 1_000) {
            const auditPayload = audit();
            if (market === "F5_ML") auditPayload.capturedAt = "2026-07-28T03:55:25.324Z";
            return {
          '''
          if test_text.count(old_record) != 1:
              raise SystemExit(f'test record anchor count={test_text.count(old_record)}')
          test_text = test_text.replace(old_record, new_record, 1)
          old_payload = '''        analysis: withAudit ? { injuryAudit: audit() } : {},
          '''
          new_payload = '''        analysis: withAudit ? { injuryAudit: auditPayload } : {},
          '''
          if test_text.count(old_payload) != 1:
              raise SystemExit(f'test payload anchor count={test_text.count(old_payload)}')
          tests.write_text(test_text.replace(old_payload, new_payload, 1))
          PY
      - run: npm ci
      - run: npm run test:mlb-ledger
      - run: npm run typecheck:mlb-ledger
      - run: npm run build:backend
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm run build
      - name: Commit validated clean implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-c2a-dedupe-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-injury-calibration-report.ts server/mlb-injury-calibration-report.test.ts .github/workflows/apply-c2a-dedupe-fix.yml
          git commit -m 'Fix C2A injury context deduplication across markets'
          git push origin HEAD:feature/mlb-injury-calibration-report-c2a
