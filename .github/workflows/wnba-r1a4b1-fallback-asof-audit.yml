# Operational/source-layout revision 2; no scientific formula or target-cohort rule changed.
name: WNBA R1A.4B1 Fallback As-Of Analogue Audit

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4B1_PRODUCTION_FALLBACK_ASOF_ANALOGUE.json'
      - 'scripts/wnba-r1a4b1-fallback-asof-audit.py'
      - 'scripts/wnba-r1a4b1-2026-layout-probe.py'
      - '.github/workflows/wnba-r1a4b1-fallback-asof-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install --quiet pyarrow
      - name: Characterize 2026 source layout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4b1-2026-layout-probe.py
      - name: Audit distinct production-fallback analogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4b1-fallback-asof-audit.py
      - name: Upload R1A.4B1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4b1-fallback-asof-${{ github.run_id }}
          path: |
            wnba-r1a4b1-fallback-asof-evidence.json
            wnba-r1a4b1-2026-layout-evidence.json
          if-no-files-found: error
          retention-days: 90
