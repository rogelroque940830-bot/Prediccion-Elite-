name: Research P1-M3E Live Owner Cohort

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p1-m3e-live-owner-cohort.yml'

permissions:
  contents: read

jobs:
  research-live-owner-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: 86d38b038e552febd291fdbed03343064e41c9ed
      COURTEDGE_WRITE_TOKEN: ${{ secrets.COURTEDGE_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Fetch complete owner-scoped ledger privately and run P1-M3E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit private
          chmod 700 private

          if [[ -z "${COURTEDGE_WRITE_TOKEN:-}" ]]; then
            echo 'P1_M3E_SERVICE_TOKEN_UNAVAILABLE' >&2
            exit 42
          fi

          health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health")
          status_code=$(curl -sS -o audit/ledger-status.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status")
          export_code=$(curl -sS -o private/owner-ledger.jsonl -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer ${COURTEDGE_WRITE_TOKEN}" \
            "${BACKEND_URL}/api/mlb/ledger/v1/export?format=jsonl&limit=10000")

          [[ "${health_code}" == "200" ]]
          [[ "${status_code}" == "200" ]]
          [[ "${export_code}" == "200" ]]
          test -s private/owner-ledger.jsonl
          chmod 600 private/owner-ledger.jsonl

          EXPECTED_BACKEND_COMMIT="${EXPECTED_BACKEND_COMMIT}" node --import tsx --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { buildMlbP1M3dEconomicReview } from './server/mlb-p1-economic-review.ts';
          import { buildMlbP1M3eOperatingEnvelope } from './server/mlb-p1-operating-envelope.ts';

          const raw = fs.readFileSync('private/owner-ledger.jsonl', 'utf8');
          const health = JSON.parse(fs.readFileSync('audit/health.json', 'utf8'));
          const status = JSON.parse(fs.readFileSync('audit/ledger-status.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(health.status === 'healthy', `health=${health.status}`);
          assert(health.commit === process.env.EXPECTED_BACKEND_COMMIT, `commit=${health.commit}`);
          assert(status.success === true, 'ledger status success=false');
          assert(status.data?.schemaVersion === 'mlb-ledger.v1', `schema=${status.data?.schemaVersion}`);
          assert(status.data?.immutable === true, 'ledger immutable=false');
          assert(status.data?.ownership?.owners === 1, `owners=${status.data?.ownership?.owners}`);
          assert(status.data?.ownership?.unownedPredictions === 0, `unowned=${status.data?.ownership?.unownedPredictions}`);

          const lines = raw.split(/\r?\n/).filter((line) => line.trim().length > 0);
          const records = lines.map((line, index) => {
            try { return JSON.parse(line); }
            catch (error) { throw new Error(`P1_M3E_OWNER_EXPORT_JSON_INVALID:${index + 1}`); }
          });
          assert(records.length === status.data.predictions,
            `P1_M3E_OWNER_EXPORT_INCOMPLETE:${records.length}/${status.data.predictions}`);

          const exportSha256 = crypto.createHash('sha256').update(raw).digest('hex');
          const review = buildMlbP1M3dEconomicReview(records, { generatedAt: new Date().toISOString() });
          const sourceWindowComplete = review.sample.uniqueAnalyticalDecisions <= review.rows.length;

          let operatingEnvelope = null;
          let researchState = 'SOURCE_WINDOW_TRUNCATED';
          if (sourceWindowComplete) {
            operatingEnvelope = buildMlbP1M3eOperatingEnvelope(review.rows, {
              generatedAt: new Date().toISOString(),
            });
            researchState = operatingEnvelope.state;
          }

          const result = {
            schemaVersion: 'p1-m3e-live-owner-cohort-research.v1',
            generatedAt: new Date().toISOString(),
            backendCommit: health.commit,
            environment: health.environment,
            source: {
              endpoint: '/api/mlb/ledger/v1/export?format=jsonl&limit=10000',
              ownerScoped: true,
              serviceTokenUsed: true,
              rawExportUploaded: false,
              rawExportSha256: exportSha256,
              exportedRecords: records.length,
              publicLedgerPredictions: status.data.predictions,
              publicLedgerSettlementEvents: status.data.settlementEvents,
              ownershipOwners: status.data.ownership.owners,
              unownedPredictions: status.data.ownership.unownedPredictions,
              completeAgainstPublicLedger: records.length === status.data.predictions,
            },
            p1M3d: {
              state: review.state,
              sample: review.sample,
              lifecycle: review.lifecycle,
              readiness: review.readiness,
              overall: review.overall,
              economicallyActionable: review.economicallyActionable,
              controls: review.controls,
              sourceWindowRows: review.rows.length,
              sourceWindowComplete,
            },
            p1M3e: operatingEnvelope == null ? {
              state: 'SOURCE_WINDOW_TRUNCATED',
              blocker: 'P1_M3E_SOURCE_WINDOW_TRUNCATED',
              analysisPerformed: false,
            } : {
              state: operatingEnvelope.state,
              analysisPerformed: true,
              configuration: operatingEnvelope.configuration,
              cohort: operatingEnvelope.cohort,
              temporalSplit: operatingEnvelope.temporalSplit,
              selectedRule: operatingEnvelope.selectedRule,
              discovery: operatingEnvelope.discovery,
              confirmation: operatingEnvelope.confirmation,
              confirmationInference: operatingEnvelope.confirmationInference,
              interpretation: operatingEnvelope.interpretation,
              blockers: operatingEnvelope.blockers,
            },
            researchState,
            safety: {
              privateRawLedgerPersistedInArtifact: false,
              predictionsCreated: 0,
              settlementsCreated: 0,
              betsPlaced: 0,
              realFinancialExposure: 0,
              automaticModelChangesAllowed: false,
              automaticPromotionAllowed: false,
            },
          };

          fs.writeFileSync('audit/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify({
            backendCommit: result.backendCommit,
            exportedRecords: result.source.exportedRecords,
            interactiveDecisions: result.p1M3d.sample.uniqueAnalyticalDecisions,
            settledInteractiveDecisions: result.p1M3d.sample.settledDecisions,
            sourceWindowRows: result.p1M3d.sourceWindowRows,
            sourceWindowComplete: result.p1M3d.sourceWindowComplete,
            researchState: result.researchState,
            p1M3eCohort: result.p1M3e.analysisPerformed ? result.p1M3e.cohort : null,
            selectedRule: result.p1M3e.analysisPerformed ? result.p1M3e.selectedRule : null,
            blockers: result.p1M3e.blockers ?? [result.p1M3e.blocker],
          }, null, 2));
          NODE

          rm -f private/owner-ledger.jsonl
          rmdir private
          test -f audit/result.json
          ! find audit -type f -name '*ledger*.jsonl' -o -name '*ledger*.ndjson' | grep -q .
      - name: Prove private raw export is absent
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/result.json
          test ! -d private
          ! find audit -type f \( -name '*.jsonl' -o -name '*.ndjson' \) | grep -q .
      - name: Upload aggregate P1-M3E owner-cohort evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m3e-live-owner-cohort-aggregate
          path: audit/result.json
          if-no-files-found: warn
          retention-days: 30
