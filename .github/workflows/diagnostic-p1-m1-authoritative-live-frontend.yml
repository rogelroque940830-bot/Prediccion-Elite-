name: Diagnostic P1-M1 Authoritative Live Frontend

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-p1-m1-authoritative-live-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-p1-m1-authoritative:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_FRONTEND_RELEASE: p1-m1-mlb-daily-slate-2026-08-04
      EXPECTED_BACKEND_COMMIT: 01d7d4de51af0f8aa83c1d2bec74bc0633564c11
      SLATE_DATE: '2026-08-04'
    steps:
      - name: Wait for authoritative P1-M1 bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            code=$(curl -sS -o audit/index.html -w '%{http_code}' --max-time 25 "${FRONTEND_URL}/" || true)
            if [[ "${code}" == "200" ]]; then
              asset=$(grep -oE 'src="[^"]+\.js"' audit/index.html | head -n1 | sed -E 's/src="([^"]+)"/\1/' || true)
              if [[ -n "${asset}" ]]; then
                case "${asset}" in
                  http*) asset_url="${asset}" ;;
                  /*) asset_url="${FRONTEND_URL}${asset}" ;;
                  *) asset_url="${FRONTEND_URL}/${asset}" ;;
                esac
                if curl -fsS --max-time 30 "${asset_url}" -o audit/bundle.js; then
                  if grep -Fq "${EXPECTED_FRONTEND_RELEASE}" audit/bundle.js; then
                    echo 'Authoritative P1-M1 frontend release is live.'
                    break
                  fi
                fi
              fi
            fi
            echo "Attempt ${attempt}/100: waiting for P1-M1 authoritative bundle"
            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for P1-M1 authoritative frontend deployment' >&2
              exit 1
            fi
            sleep 15
          done
      - name: Verify served daily slate and backend contract
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            'Partidos de la jornada' \
            'Analizar partido' \
            'Analizar provisional' \
            'Listos FINAL' \
            'Lineups confirmados' \
            'MLB oficial' \
            'SHADOW · exposición 0' \
            '/api/mlb/p1/v1/slate?date='; do
            grep -Fq "${marker}" audit/bundle.js || { echo "Missing bundle marker: ${marker}" >&2; exit 1; }
          done

          health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health")
          slate_code=$(curl -sS -o audit/slate.json -w '%{http_code}' --max-time 90 "${BACKEND_URL}/api/mlb/p1/v1/slate?date=${SLATE_DATE}")
          HEALTH_CODE="${health_code}" SLATE_CODE="${slate_code}" node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('audit/health.json', 'utf8'));
          const payload = JSON.parse(fs.readFileSync('audit/slate.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(Number(process.env.HEALTH_CODE) === 200, `health HTTP ${process.env.HEALTH_CODE}`);
          assert(Number(process.env.SLATE_CODE) === 200, `slate HTTP ${process.env.SLATE_CODE}`);
          assert(health.commit === process.env.EXPECTED_BACKEND_COMMIT, `backend commit=${health.commit}`);
          assert(payload.success === true, 'slate success=false');
          const report = payload.data;
          assert(report?.schemaVersion === 'courtedge-p1-mlb-daily-slate.v1', `schema=${report?.schemaVersion}`);
          assert(report.date === process.env.SLATE_DATE, `date=${report.date}`);
          assert(Array.isArray(report.games) && report.summary.total === report.games.length, 'game total mismatch');
          assert(report.safety?.mode === 'SHADOW_DECISION_SUPPORT', `mode=${report.safety?.mode}`);
          assert(report.safety?.realFinancialExposure === 0, `exposure=${report.safety?.realFinancialExposure}`);
          assert(report.safety?.automaticBetPlacement === false, 'automatic betting enabled');
          console.log(JSON.stringify({
            frontendRelease: process.env.EXPECTED_FRONTEND_RELEASE,
            backendCommit: health.commit,
            date: report.date,
            summary: report.summary,
            schemaVersion: report.schemaVersion,
            markersVerified: 8,
            readOnlyRequests: 4,
            predictionsGenerated: 0,
            picksSaved: 0,
            betsPlaced: 0,
            safety: report.safety,
          }, null, 2));
          NODE
