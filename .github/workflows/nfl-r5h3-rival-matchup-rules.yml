name: NFL R5H3 Rival Matchup Rule Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/**'
      - '.github/workflows/nfl-r5h3-rival-matchup-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-r5h3:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests

      - name: Validate scripts
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py
          python -m py_compile research/nfl/nfl_r5h3_rival_matchup_rule_engine.py

      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5-output \
            --cache-dir .cache/nflverse

      - name: Rebuild R5B QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5b-output \
            --cache-dir .cache/nflverse

      - name: Rebuild R5B2 hybrid dataset
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output \
            --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 \
            --end-season 2025

      - name: Run NFL-R5H3 rival-specific rule search
        run: |
          python research/nfl/nfl_r5h3_rival_matchup_rule_engine.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h3-output \
            --expert-oos-start 2013 \
            --test-start 2018 \
            --end-season 2025

      - name: Enforce R5H3 sports-only boundary
        run: |
          python - <<'PY'
          import json, pandas as pd
          a=json.load(open('nfl-r5h3-output/nfl_r5h3_audit.json'))
          m=json.load(open('nfl-r5h3-output/nfl_r5h3_manifest.json'))
          v=json.load(open('nfl-r5h3-output/nfl_r5h3_verdict.json'))
          c=pd.read_csv('nfl-r5h3-output/nfl_r5h3_coverage_bands.csv')
          assert a['marketBoundary']=='PASS_MARKET_FREE'
          assert a['targetSeasonUsedForRuleExpertFit']=='NO'
          assert a['targetSeasonUsedForMetaFit']=='NO'
          assert a['targetSeasonUsedForRuleCombinationSelection']=='NO'
          assert a['targetSeasonUsedForCoverageThreshold']=='NO'
          assert a['gameSpecificRuleWeighting']=='PASS'
          assert a['rivalSpecificMatchups']=='PASS_PASS_RUSH_PRESSURE_EXPLOSIVE_AND_OPPONENT_ADJUSTED'
          assert a['productionCodeTouched'] is False
          assert m['researchOnly'] is True
          assert m['marketDataUsedAsFeatures'] is False
          assert m['marketOptimizationPerformed'] is False
          assert m['ruleBlockCount']==17
          assert v['researchOnly'] is True
          assert v['marketDataUsed'] is False
          assert v['productionChanged'] is False
          assert v['ruleWeightsGameSpecific'] is True
          assert v['rivalSpecificRuleLibrary'] is True
          assert set(c.target_coverage.round(2)) == {1.00,0.80,0.60,0.50,0.40,0.30,0.25,0.20}
          print('NFL_R5H3_BOUNDARY_VERIFIED')
          PY

      - name: Show R5H3 results
        run: |
          cat nfl-r5h3-output/nfl_r5h3_model_summary.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_by_season.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_coverage_bands.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_coverage_by_season.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_config_by_season.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_rule_selection_frequency.csv
          echo
          cat nfl-r5h3-output/nfl_r5h3_verdict.json

      - name: Upload NFL-R5H3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h3-rival-matchup-rule-evidence
          path: nfl-r5h3-output/
          if-no-files-found: error
          retention-days: 30
