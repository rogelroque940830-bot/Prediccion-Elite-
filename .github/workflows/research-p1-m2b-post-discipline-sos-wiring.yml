name: Research P1-M2B Post Discipline SOS Wiring

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p1-m2b-post-discipline-sos-wiring.yml'

permissions:
  contents: read

jobs:
  audit-post-wiring:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: f5b38116d87b38a4e21f1af3cda8f9af6660ad65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact one-file research scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          [[ "$changed" == '.github/workflows/research-p1-m2b-post-discipline-sos-wiring.yml' ]]
      - name: Wait for exact merged backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit private
          chmod 700 private
          observed=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS -o private/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            if [[ "$code" == '200' ]]; then
              observed=$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('private/health.json','utf8'));process.stdout.write(String(j.commit||''));")
              if [[ "$observed" == "$EXPECTED_BACKEND_COMMIT" ]]; then
                break
              fi
            fi
            sleep 10
          done
          [[ "$observed" == "$EXPECTED_BACKEND_COMMIT" ]]
          printf '%s' "$observed" > private/deployed-commit.txt
      - name: Measure sanitized live ML advanced coverage
        shell: bash
        run: |
          set -euo pipefail
          slate_code=$(curl -sS -o private/slate.json -w '%{http_code}' --max-time 90 "${BACKEND_URL}/api/mlb/p1/v1/slate")
          [[ "$slate_code" == '200' ]]

          BACKEND_URL="$BACKEND_URL" node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const slateEnvelope = JSON.parse(fs.readFileSync('private/slate.json', 'utf8'));
          if (slateEnvelope?.success !== true || !Array.isArray(slateEnvelope?.data?.games)) {
            throw new Error('POST_WIRING_SLATE_INVALID');
          }
          const slate = slateEnvelope.data;
          const now = Date.now();
          const candidates = slate.games
            .filter((g) => ['SCHEDULED', 'PREGAME'].includes(g.state) && g.analysisAllowed === true)
            .sort((a, b) => {
              const ams = a.startTime ? Date.parse(a.startTime) : Number.POSITIVE_INFINITY;
              const bms = b.startTime ? Date.parse(b.startTime) : Number.POSITIVE_INFINITY;
              const afuture = ams >= now ? 0 : 1;
              const bfuture = bms >= now ? 0 : 1;
              return afuture - bfuture || Math.abs(ams - now) - Math.abs(bms - now);
            })
            .slice(0, 3);

          const componentName = (endpoint) => {
            const text = String(endpoint || '');
            if (text.includes('/quality/')) return 'QUALITY';
            if (text.includes('/statcast-matchup/')) return 'STATCAST_MATCHUP';
            if (text.includes('/discipline-speed/')) return 'DISCIPLINE_SPEED';
            if (text.includes('/sos/')) return 'SOS';
            if (text.includes('/advanced/')) return 'ADVANCED_CONTEXT';
            return 'UNKNOWN';
          };
          const result = {
            schemaVersion: 'p1-m2b-post-discipline-sos-wiring.v1',
            generatedAt: new Date().toISOString(),
            deployedCommit: fs.readFileSync('private/deployed-commit.txt', 'utf8'),
            baseline: {
              evidencePr: 398,
              sampledMlEvaluations: 3,
              certifiedComponents: 2,
              totalAdvancedComponents: 5,
              disciplineSpeedCertified: false,
              sosCertified: false,
              statcastCertified: false,
            },
            slate: {
              date: slate.date,
              totalGames: slate.summary?.total ?? slate.games.length,
              sampledGames: candidates.length,
            },
            samples: [],
            aggregate: {
              gateStatusCounts: {},
              advancedStateCounts: {},
              advancedQualityCounts: {},
              certifiedCountHistogram: {},
              componentCertifiedCounts: {
                QUALITY: 0,
                STATCAST_MATCHUP: 0,
                DISCIPLINE_SPEED: 0,
                SOS: 0,
                ADVANCED_CONTEXT: 0,
              },
              componentDegradedCounts: {
                QUALITY: 0,
                STATCAST_MATCHUP: 0,
                DISCIPLINE_SPEED: 0,
                SOS: 0,
                ADVANCED_CONTEXT: 0,
              },
              injuriesStateCounts: {},
            },
            safety: { writesPerformed: 0, sportsbookCallsPerformedByResearchRunner: 0, rawIdentityUploaded: false },
          };
          const bump = (obj, key) => { obj[key] = (obj[key] || 0) + 1; };

          for (let index = 0; index < candidates.length; index += 1) {
            const game = candidates[index];
            const url = `${process.env.BACKEND_URL}/api/mlb/p1/v1/pregame-readiness?gamePk=${encodeURIComponent(game.gamePk)}&market=ML&date=${encodeURIComponent(game.officialDate)}`;
            const raw = `private/readiness-${index}.json`;
            let httpCode = '000';
            try {
              httpCode = execFileSync('curl', ['-sS', '-o', raw, '-w', '%{http_code}', '--max-time', '180', url], { encoding: 'utf8' }).trim();
            } catch {
              result.samples.push({ gameOrdinal: index + 1, requestStatus: 'FAILED' });
              continue;
            }
            const envelope = JSON.parse(fs.readFileSync(raw, 'utf8'));
            if (httpCode !== '200' || envelope?.success !== true || !envelope?.data?.gate) {
              result.samples.push({ gameOrdinal: index + 1, requestStatus: `HTTP_${httpCode}` });
              continue;
            }
            const report = envelope.data;
            const advanced = (report.evidence || []).find((e) => e.field === 'ADVANCED_FACTORS');
            const injuries = (report.evidence || []).find((e) => e.field === 'INJURIES');
            const calls = Array.isArray(advanced?.details?.calls) ? advanced.details.calls : [];
            const components = calls.map((call) => ({
              component: componentName(call.endpoint),
              ok: Boolean(call.ok),
              httpStatus: Number(call.status) || 0,
              sourceStatus: call.sourceStatus || null,
              certified: Boolean(call.certified),
              hasExplicitTimestamp: typeof call.explicitTimestamp === 'string' && call.explicitTimestamp.length > 0,
              freshness: call.freshness || null,
            }));
            const certified = components.filter((c) => c.certified).length;
            bump(result.aggregate.gateStatusCounts, report.gate.status);
            bump(result.aggregate.advancedStateCounts, advanced?.state || 'MISSING');
            bump(result.aggregate.advancedQualityCounts, advanced?.quality || 'NONE');
            bump(result.aggregate.certifiedCountHistogram, String(certified));
            bump(result.aggregate.injuriesStateCounts, injuries?.state || 'MISSING');
            for (const component of components) {
              if (component.certified && Object.prototype.hasOwnProperty.call(result.aggregate.componentCertifiedCounts, component.component)) {
                result.aggregate.componentCertifiedCounts[component.component] += 1;
              }
              if (!component.certified && Object.prototype.hasOwnProperty.call(result.aggregate.componentDegradedCounts, component.component)) {
                result.aggregate.componentDegradedCounts[component.component] += 1;
              }
            }
            result.samples.push({
              gameOrdinal: index + 1,
              requestStatus: 'OK',
              gateStatus: report.gate.status,
              advanced: {
                state: advanced?.state || null,
                quality: advanced?.quality || null,
                sourceStatus: advanced?.sourceStatus || null,
                certifiedComponents: certified,
                totalComponents: components.length,
                components,
              },
              injuries: {
                state: injuries?.state || null,
                quality: injuries?.quality || null,
                sourceStatus: injuries?.sourceStatus || null,
              },
            });
          }

          const okSamples = result.samples.filter((s) => s.requestStatus === 'OK' && s.advanced);
          result.conclusion = {
            measured: okSamples.length > 0,
            sampledMlEvaluations: okSamples.length,
            disciplineSpeedCertifiedInAllMeasured: okSamples.length > 0 && okSamples.every((s) => s.advanced.components.some((c) => c.component === 'DISCIPLINE_SPEED' && c.certified)),
            sosCertifiedInAllMeasured: okSamples.length > 0 && okSamples.every((s) => s.advanced.components.some((c) => c.component === 'SOS' && c.certified)),
            statcastCertifiedInAllMeasured: okSamples.length > 0 && okSamples.every((s) => s.advanced.components.some((c) => c.component === 'STATCAST_MATCHUP' && c.certified)),
            maxCertifiedComponentsObserved: okSamples.length ? Math.max(...okSamples.map((s) => s.advanced.certifiedComponents)) : 0,
            readyFinalObserved: okSamples.some((s) => s.gateStatus === 'READY_FINAL'),
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify({ aggregate: result.aggregate, conclusion: result.conclusion }, null, 2));
          NODE

          test -f audit/result.json
          rm -rf private
          test ! -d private
      - name: Prove accepted artifact is identity-free
        shell: bash
        run: |
          set -euo pipefail
          test -f audit/result.json
          test ! -d private
          ! grep -E '"gamePk"|"homeTeam"|"awayTeam"|"playerId"|"pitcherId"|"selection"|/api/mlb/[A-Za-z0-9_-]+/[0-9]+' audit/result.json
      - name: Upload sanitized aggregate only
        uses: actions/upload-artifact@v4
        with:
          name: p1-m2b-post-discipline-sos-wiring-aggregate
          path: audit/result.json
          if-no-files-found: error
          retention-days: 30
