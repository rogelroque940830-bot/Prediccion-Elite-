name: Temporary P1-M3C Patcher

# Second trusted push triggers the workflow after its definition exists on main.
on:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/tmp_p1_m3c_patch.py'
      - '.github/workflows/tmp-p1-m3c-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p1-m3c-mlb-scientific-emission-ui
          fetch-depth: 0
      - name: Load trusted patcher from main
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/scripts/tmp_p1_m3c_patch.py > /tmp/p1_m3c_patch.py
      - name: Apply deterministic patch
        run: python /tmp/p1_m3c_patch.py
      - name: Verify exact patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            'frontend/client/src/components/mlb-pregame-readiness-gate.tsx' \
            'frontend/client/src/pages/mlb-predictor.tsx' | sort)
          [[ "$changed" == "$expected" ]]
          grep -F 'onExecutionReport={setPregameExecutionReport}' frontend/client/src/pages/mlb-predictor.tsx
          grep -F 'saveToHistory: false' frontend/client/src/pages/mlb-predictor.tsx
          grep -F 'emitScientific: true' frontend/client/src/pages/mlb-predictor.tsx
          grep -F '<MlbScientificCaptureStatus state={scientificCaptureState} />' frontend/client/src/pages/mlb-predictor.tsx
          grep -F 'onExecutionReportRef.current(executionReport)' frontend/client/src/components/mlb-pregame-readiness-gate.tsx
      - name: Commit product patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/components/mlb-pregame-readiness-gate.tsx frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'P1-M3C: connect MLB predictor scientific emission'
          git push origin HEAD:agent/p1-m3c-mlb-scientific-emission-ui
