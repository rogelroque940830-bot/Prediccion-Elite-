name: Diagnostic O3 live backend verification

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/diagnostic-o3-live-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-o3-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: 5a61e0bca986906a17966d1c7eac7a9d3786f209
    steps:
      - name: Wait for exact O3 deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            code=$(curl -sS -o audit/health-before.json -w '%{http_code}' --max-time 25 "${BASE_URL}/health" || true)
            if [[ "${code}" == "200" ]]; then
              live_commit=$(node -e "const h=require('./audit/health-before.json'); process.stdout.write(String(h.commit||''))" 2>/dev/null || true)
              if [[ "${live_commit}" == "${EXPECTED_COMMIT}" ]]; then
                echo "Exact O3 backend commit is live."
                break
              fi
              echo "Attempt ${attempt}/100: live=${live_commit:-unknown} expected=${EXPECTED_COMMIT}"
            else
              echo "Attempt ${attempt}/100: health HTTP ${code}"
            fi
            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact O3 backend deployment' >&2
              cat audit/health-before.json 2>/dev/null || true
              exit 1
            fi
            sleep 15
          done

      - name: Verify O3 safety and private routes without creating a plan
        shell: bash
        run: |
          set -euo pipefail
          status_code=$(curl -sS -o audit/status-private.json -w '%{http_code}' --max-time 25 "${BASE_URL}/api/ops/v1/reprocessing/status")
          audit_code=$(curl -sS -o audit/audit-private.json -w '%{http_code}' --max-time 25 "${BASE_URL}/api/ops/v1/reprocessing/audit")
          plan_code=$(curl -sS -o audit/plan-private.json -w '%{http_code}' --max-time 25 "${BASE_URL}/api/ops/v1/reprocessing/plans/o3-plan-diagnostic-never-created")
          preview_code=$(curl -sS -o audit/preview-private.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"incidentId":"ops-MLB:diagnostic-never-created","league":"MLB"}' \
            "${BASE_URL}/api/ops/v1/reprocessing/preview")
          execute_code=$(curl -sS -o audit/execute-private.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"planId":"o3-plan-diagnostic-never-created","planDigest":"invalid","idempotencyKey":"diagnostic-never-created","confirmation":"REPROCESS_ONE_MLB_GAME","reason":"Unauthenticated diagnostic request that must be rejected before execution."}' \
            "${BASE_URL}/api/ops/v1/reprocessing/execute")
          curl -fsS --max-time 25 "${BASE_URL}/health" -o audit/health-after.json

          STATUS_CODE="${status_code}" AUDIT_CODE="${audit_code}" PLAN_CODE="${plan_code}" PREVIEW_CODE="${preview_code}" EXECUTE_CODE="${execute_code}" node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('audit/health-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('audit/health-after.json', 'utf8'));
          const payloads = {
            status: JSON.parse(fs.readFileSync('audit/status-private.json', 'utf8')),
            audit: JSON.parse(fs.readFileSync('audit/audit-private.json', 'utf8')),
            plan: JSON.parse(fs.readFileSync('audit/plan-private.json', 'utf8')),
            preview: JSON.parse(fs.readFileSync('audit/preview-private.json', 'utf8')),
            execute: JSON.parse(fs.readFileSync('audit/execute-private.json', 'utf8')),
          };
          const codes = {
            status: Number(process.env.STATUS_CODE),
            audit: Number(process.env.AUDIT_CODE),
            plan: Number(process.env.PLAN_CODE),
            preview: Number(process.env.PREVIEW_CODE),
            execute: Number(process.env.EXECUTE_CODE),
          };
          const expected = String(process.env.EXPECTED_COMMIT || '');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(before.status === 'healthy', `health=${before.status}`);
          assert(before.commit === expected, `commit=${before.commit}`);
          assert(before.environment === 'p0-integration', `environment=${before.environment}`);
          assert(before.privateReadProtection === true, 'private read protection disabled');

          const o3 = before.operationalReprocessing;
          assert(o3?.schemaVersion === 'courtedge-operational-reprocessing-status.v1', 'O3 status missing');
          assert(o3.confirmationPhrase === 'REPROCESS_ONE_MLB_GAME', `confirmation=${o3.confirmationPhrase}`);
          assert(o3.planTtlMs === 600000, `planTtlMs=${o3.planTtlMs}`);
          assert(o3.maxTargetsPerPlan === 50, `maxTargets=${o3.maxTargetsPerPlan}`);
          assert(Array.isArray(o3.supportedLeagues) && o3.supportedLeagues.length === 1 && o3.supportedLeagues[0] === 'MLB', 'supported leagues invalid');

          const safety = o3.safety;
          assert(safety?.mode === 'SHADOW_CONTROLLED_REPROCESSING', `mode=${safety?.mode}`);
          assert(safety?.shadowOnly === true, 'shadowOnly disabled');
          assert(safety?.realFinancialExposure === 0, `exposure=${safety?.realFinancialExposure}`);
          for (const key of [
            'requiresExplicitPreview',
            'requiresPlanDigest',
            'requiresAdminExecution',
            'requiresConfirmationPhrase',
            'singleGameOnly',
            'appendOnlySettlementEvents',
          ]) assert(safety?.[key] === true, `safety.${key}=${safety?.[key]}`);
          for (const key of [
            'automaticExecution',
            'historicalLedgerMutation',
            'automaticSettlementRetry',
            'automaticBetPlacement',
            'automaticModelChangesAllowed',
            'automaticPromotionAllowed',
          ]) assert(safety?.[key] === false, `safety.${key}=${safety?.[key]}`);

          for (const [name, code] of Object.entries(codes)) {
            assert(code === 401, `${name} HTTP ${code}`);
            assert(payloads[name]?.success === false, `${name} did not fail closed`);
            assert(/Authentication required/i.test(String(payloads[name]?.error || '')), `${name} auth message missing`);
          }

          const afterO3 = after.operationalReprocessing;
          assert(after.commit === expected, `after commit=${after.commit}`);
          assert(afterO3.plans === o3.plans, `plans changed ${o3.plans} -> ${afterO3.plans}`);
          assert(afterO3.executions === o3.executions, `executions changed ${o3.executions} -> ${afterO3.executions}`);
          assert(afterO3.latestPlanAt === o3.latestPlanAt, 'latestPlanAt changed');
          assert(afterO3.latestExecutionAt === o3.latestExecutionAt, 'latestExecutionAt changed');

          console.log(JSON.stringify({
            commit: before.commit,
            environment: before.environment,
            privateReadProtection: before.privateReadProtection,
            o3: {
              schemaVersion: o3.schemaVersion,
              plans: o3.plans,
              readyPlans: o3.readyPlans,
              blockedPlans: o3.blockedPlans,
              executions: o3.executions,
              completedExecutions: o3.completedExecutions,
              partialFailures: o3.partialFailures,
              confirmationPhrase: o3.confirmationPhrase,
              planTtlMs: o3.planTtlMs,
              maxTargetsPerPlan: o3.maxTargetsPerPlan,
              supportedLeagues: o3.supportedLeagues,
              safety: o3.safety,
            },
            unauthenticated: codes,
            noStateChange: {
              plansBefore: o3.plans,
              plansAfter: afterO3.plans,
              executionsBefore: o3.executions,
              executionsAfter: afterO3.executions,
            },
          }, null, 2));
          NODE
