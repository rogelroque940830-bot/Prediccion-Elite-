name: Validate final MLB injury C2A implementation

on:
  push:
    branches:
      - test/validate-final-mlb-injury-c2a
  pull_request:
    branches:
      - feature/mlb-injury-calibration-report-c2a

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/validate-final-mlb-injury-c2a
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        shell: bash
        run: |
          set +e
          npm ci > /tmp/npm-ci-c2a.txt 2>&1
          code=$?
          cat /tmp/npm-ci-c2a.txt
          if [ "$code" -ne 0 ]; then
            mkdir -p .diagnostics
            cp /tmp/npm-ci-c2a.txt .diagnostics/npm-ci-c2a.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .diagnostics/npm-ci-c2a.txt
            git commit -m 'test: save C2A npm install diagnostic [skip ci]'
            git push origin HEAD:test/validate-final-mlb-injury-c2a
            exit "$code"
          fi
      - name: Run MLB regression suite
        run: npm run test:mlb-ledger
      - name: Type-check backend
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
