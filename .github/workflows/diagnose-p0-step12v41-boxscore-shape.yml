name: Diagnose P0 Step 12V41 Boxscore Shape

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-p0-step12v41-boxscore-shape.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect official MLB boxscore batting shape
        run: |
          node - <<'NODE'
          const gamePk=744795;
          const url=`https://statsapi.mlb.com/api/v1/game/${gamePk}/boxscore`;
          const response=await fetch(url,{headers:{'User-Agent':'CourtEdge-P0-Step12V41-Diagnostic/1.0','Accept':'application/json'}});
          if(!response.ok) throw new Error(`HTTP_${response.status}`);
          const box=await response.json();
          const output={gamePk};
          for(const side of ['away','home']){
            const team=box?.teams?.[side];
            const teamBatting=team?.teamStats?.batting ?? null;
            const batterIds=Array.isArray(team?.batters)?team.batters:[];
            const playerSamples=[];
            let missingAtBats=null;
            for(const batterId of batterIds){
              const player=team?.players?.[`ID${batterId}`];
              const batting=player?.stats?.batting ?? null;
              const sample={
                batterId,
                name:player?.person?.fullName ?? null,
                battingOrder:player?.battingOrder ?? null,
                battingKeys:batting?Object.keys(batting).sort():null,
                atBats:batting?.atBats ?? null,
                plateAppearances:batting?.plateAppearances ?? null,
                hits:batting?.hits ?? null,
                totalBases:batting?.totalBases ?? null,
              };
              if(playerSamples.length<3) playerSamples.push(sample);
              if(!missingAtBats && batting && batting.atBats==null) missingAtBats=sample;
            }
            output[side]={
              teamId:team?.team?.id ?? null,
              batterCount:batterIds.length,
              teamBattingKeys:teamBatting?Object.keys(teamBatting).sort():null,
              teamAtBats:teamBatting?.atBats ?? null,
              teamPlateAppearances:teamBatting?.plateAppearances ?? null,
              teamHits:teamBatting?.hits ?? null,
              teamTotalBases:teamBatting?.totalBases ?? null,
              playerSamples,
              firstBatterWithMissingAtBats:missingAtBats,
            };
          }
          console.log(JSON.stringify(output,null,2));
          NODE
