name: Apply S6P First Twenty Settlements

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/generate-s6p-first-twenty-settlements.mjs'
      - '.github/workflows/apply-s6p-first-twenty-settlements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize nested template escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('scripts/generate-s6p-first-twenty-settlements.mjs')
          source = path.read_text()
          start = source.index('const tests = `')
          end = source.index('`;\nfs.writeFileSync("server/mlb-s6p-first-twenty-settlements-certification.test.ts", tests);', start)
          segment = source[start:end]
          segment = re.sub(r'\\*\$\{', r'\${', segment)
          source = source[:start] + segment + source[end:]
          path.write_text(source)
          PY
      - name: Generate and integrate S6P Phase 5C-5
        run: node scripts/generate-s6p-first-twenty-settlements.mjs
      - name: Patch generated prerequisite and analytical evidence wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/mlb-s6p-first-twenty-settlements-certification.ts')
          source = path.read_text()
          source = source.replace(
              'from "./mlb-s6o-first-twenty-settlements-certification";',
              'from "./mlb-s6o-first-five-settlements-certification";',
          )
          source = source.replace(
              '  selected: S6mObservation[],\n  generatedAt: string,',
              '  selected: S6mObservation[],\n  records: LedgerRecord[],\n  generatedAt: string,',
              1,
          )
          source = source.replace(
              '          selected,\n          generatedAt,',
              '          selected,\n          records,\n          generatedAt,',
              1,
          )
          path.write_text(source)
          PY
      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/mlb-s6p-first-twenty-settlements-certification.ts \
            server/mlb-s6p-first-twenty-settlements-certification.test.ts \
            server/s5b-staging-entry.ts \
            server/route-contract.extensions.json \
            tsconfig.s5b-shadow.json \
            tsconfig.s6p-first-twenty-settlements.json \
            package.json \
            docs/S6P_PHASE5C5_FIRST_TWENTY_SETTLEMENTS.md
          if git diff --cached --quiet; then
            echo 'No generated implementation changes required.'
            exit 0
          fi
          git commit -m 'Fix S6P first twenty settlements integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
