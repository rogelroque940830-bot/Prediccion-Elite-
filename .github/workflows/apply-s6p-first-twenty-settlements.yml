name: Apply S6P First Twenty Settlements

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/generate-s6p-first-twenty-settlements.mjs'
      - '.github/workflows/apply-s6p-first-twenty-settlements.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize nested template escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-s6p-first-twenty-settlements.mjs')
          source = path.read_text()
          path.write_text(source.replace(r'\\${', r'\${'))
          PY
      - name: Generate and integrate S6P Phase 5C-5
        run: node scripts/generate-s6p-first-twenty-settlements.mjs
      - name: Commit generated implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No generated changes required.'
            exit 0
          fi
          git add \
            server/mlb-s6p-first-twenty-settlements-certification.ts \
            server/mlb-s6p-first-twenty-settlements-certification.test.ts \
            server/s5b-staging-entry.ts \
            server/route-contract.extensions.json \
            tsconfig.s5b-shadow.json \
            tsconfig.s6p-first-twenty-settlements.json \
            package.json \
            docs/S6P_PHASE5C5_FIRST_TWENTY_SETTLEMENTS.md \
            .github/workflows/validate-s6p-first-twenty-settlements.yml
          git commit -m 'Implement S6P first twenty settlements certification'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
