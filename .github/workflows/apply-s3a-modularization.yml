name: Apply S3A route runtime extraction

on:
  pull_request:
    branches:
      - feature/s3-backend-modularization

permissions:
  contents: write

jobs:
  modularize-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply deterministic S3A extraction
        run: |
          python scripts/s3a_modularize.py
          python scripts/s3a_extract_legacy_routes.py
      - name: Install dependencies
        run: npm ci
      - name: Validate S3 route contract
        run: npm run test:s3-modularization
      - name: Typecheck S3 modules
        run: npm run typecheck:s3-modularization
      - name: S1 regression
        run: npm run test:s1-auth
      - name: S2 regression
        run: npm run test:s2-multiuser
      - name: Full MLB regression
        run: npm run test:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Commit validated S3A extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes.ts server/route-runtime.ts server/legacy-picks-store.ts server/legacy-picks-routes.ts server/mlb-route-runtime.ts server/route-contract.snapshot.json server/routes-modularization.test.ts tsconfig.s3-modularization.json package.json
          git commit -m "S3A: extract shared route runtime and legacy compatibility routes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
