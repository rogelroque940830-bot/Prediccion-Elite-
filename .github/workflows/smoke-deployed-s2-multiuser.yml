name: Smoke deployed S2 multiuser ownership

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: 246c541dd5141ba670a7ea9dd92a0becf5890a2c
    steps:
      - name: Verify deployed S2 migration and isolation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done

          echo "DEPLOYED HEALTH"
          jq . /tmp/health.json

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/status.json
          echo "DEPLOYED LEDGER STATUS"
          jq . /tmp/status.json

          jq -e --arg commit "$EXPECTED_COMMIT" '
            .status == "healthy"
            and .commit == $commit
            and .authPersistence == true
            and .multiUserOwnership == true
            and .ownershipStore == "sqlite-append-only"
            and .ledgerOwnership.immutable == true
            and .ledgerOwnership.unownedPredictions == 0
            and .ledgerOwnership.assignments >= 6
            and .ledgerOwnership.owners >= 1
            and .pickOwnership.unowned == 0
          ' /tmp/health.json >/dev/null

          jq -e '
            .success == true
            and .data.immutable == true
            and .data.predictions >= 6
            and .data.settlementEvents >= 4
            and .data.ownership.immutable == true
            and .data.ownership.unownedPredictions == 0
            and .data.ownership.assignments == .data.predictions
          ' /tmp/status.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/auth/session" > /tmp/session.json
          jq -e '
            .success == true
            and .authenticated == false
            and .user == null
            and .role == null
          ' /tmp/session.json >/dev/null

          for endpoint in \
            '/api/picks/v2' \
            '/api/mlb/ledger/v1/history?limit=1' \
            '/api/mlb/ledger/v1/predictions?limit=1'; do
            code=$(curl --silent --show-error --output /tmp/private.json --write-out '%{http_code}' "$BACKEND_URL$endpoint")
            test "$code" = "401"
            jq -e '.success == false and .error == "Authentication required for private data"' /tmp/private.json >/dev/null
          done

          sharp_code=$(curl --silent --show-error --output /tmp/sharp.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/sharp/mlb/s2-smoke-nonexistent")
          test "$sharp_code" != "401"
