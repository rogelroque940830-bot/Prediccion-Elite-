name: MLB R1B Statcast Raw BBE Count Parity Probe

on:
  push:
    branches: [research/mlb-unified-sporting-authority-r1]
    paths:
      - 'scripts/mlb-r1b-statcast-raw-bbe-count-parity-probe.ts'
      - '.github/workflows/mlb-r1b-statcast-raw-bbe-count-parity-probe.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Probe raw BBE count parity
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/mlb-r1b-statcast-raw-bbe-count-parity-probe.ts \
            --out=artifacts/mlb-r1b-statcast-raw-bbe-count-parity-probe/evidence.json
      - name: Validate research-only fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-raw-bbe-count-parity-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e=JSON.parse(fs.readFileSync('artifacts/mlb-r1b-statcast-raw-bbe-count-parity-probe/evidence.json','utf8'));
          if(e.status!=='RAW_BBE_COUNT_PARITY_PROBE_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.scientificBoundary?.researchOnly!==true) throw new Error('research-only');
          if(e.scientificBoundary?.productionChanged!==false) throw new Error('production');
          if(e.scientificBoundary?.weightsChanged!==false) throw new Error('weights');
          if(e.scientificBoundary?.marketPricesRead!==false) throw new Error('prices');
          if(e.scientificBoundary?.targetOutcomeReadForModeling!==false) throw new Error('outcomes');
          if(e.scientificBoundary?.statcastQualityParityCertifiedByThisProbe!==false) throw new Error('premature certification');
          if(e.scientificBoundary?.r1b2Authorized!==false) throw new Error('r1b2');
          if(e.decision?.familyClassificationAfter!=='PARTIAL_PARITY') throw new Error('classification');
          if(e.decision?.familyPromotionAuthorized!==false) throw new Error('promotion');
          NODE
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-raw-bbe-count-parity-probe
          path: artifacts/mlb-r1b-statcast-raw-bbe-count-parity-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
