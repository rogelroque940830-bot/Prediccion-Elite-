name: Apply S6F MLB Review UI

on:
  push:
    branches:
      - feature/s6f-mlb-review-priority
    paths:
      - 'scripts/apply-s6f-mlb-review-ui.mjs'
      - '.github/workflows/apply-s6f-mlb-review-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/s6f-mlb-review-priority
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply deterministic patch
        run: node scripts/apply-s6f-mlb-review-ui.mjs
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/client/src/pages/mlb-predictor.tsx; then
            echo 'No source changes produced.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'S6F: prioritize MLB games in predictor UI'
          git push origin HEAD:feature/s6f-mlb-review-priority
