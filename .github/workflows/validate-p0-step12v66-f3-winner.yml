name: Validate P0 Step 12V66 F3 Winner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v66-game-horizon-exposure-suite-contract.json'
      - 'research/p0-step12v66-preoutcome-zero-variance-correction.json'
      - 'research/p0-step12v66-f3-winner-scoring-spec.json'
      - 'scripts/p0-step12v66-f3-winner.py'
      - '.github/workflows/validate-p0-step12v66-f3-winner.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify F3 scoring freeze predates F3 scorer
        run: |
          set -euo pipefail
          FREEZE=60046f0c6d9c7d284636fb4d12b872cd1d913585
          git merge-base --is-ancestor "$FREEZE" HEAD
          git cat-file -e "$FREEZE:research/p0-step12v66-f3-winner-scoring-spec.json"
          ! git cat-file -e "$FREEZE:scripts/p0-step12v66-f3-winner.py"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v66-game-horizon-exposure-suite-contract.json'))
          s=json.load(open('research/p0-step12v66-f3-winner-scoring-spec.json'))
          assert c['scientificStatus']=='FROZEN_BEFORE_ANY_V66_OUTCOME_SCORER_EXISTS'
          assert s['scientificStatus']=='FROZEN_F3_WINNER_SCORING_SEMANTICS_BEFORE_FIRST_V66_F3_OUTCOME_SCORER'
          assert s['formalControl']['model']=='TRAINING_SEASON_HOME_DRAW_AWAY_CLIMATOLOGY'
          assert s['formalControl']['targetClassesExactly']==['HOME','DRAW','AWAY']
          assert s['candidateTraining']['trainingSeason']=='2022'
          assert s['candidateTraining']['validationSeason']=='2023'
          assert s['candidateTraining']['evaluationSeasons']==['2024','2025','2026_YTD']
          assert s['candidateTraining']['multiclassCalibration'].startswith('NONE_FOR_F3')
          assert s['featureDefinitions']['bullpenFeaturesAllowed'] is False
          assert s['primaryCandidate']=='STARTER_QUALITY5_PLUS_EXPOSURE_F3_PLUS_QUALITY_X_EXPOSURE5'
          assert s['bootstrap']['resamples']==5000 and s['bootstrap']['seed']==20260816
          assert s['policy']['betEliteAllowed'] is False and s['policy']['realFinancialExposure']==0
          print('V66_F3_PREOUTCOME_SCORING_FREEZE_VERIFIED')
          PY
          python -m py_compile scripts/p0-step12v66-f3-winner.py

  score-f3:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.18.0'
      - name: Download frozen V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: artifacts/p0-step12v66
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793
      - name: Download frozen V23 F3 outcome evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v23-f3-model-suite
          path: artifacts/p0-step12v23
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31894436492
      - name: Verify immutable source packs
        run: |
          set -euo pipefail
          test -s artifacts/p0-step12v66/v66-pregame-custody.jsonl.gz
          test -s artifacts/p0-step12v66/v66-custody-report.json
          test -s artifacts/p0-step12v23/f3-outcomes.json
          test -s artifacts/p0-step12v23/f3-model-suite-report.json
          python - <<'PY'
          import json
          c=json.load(open('artifacts/p0-step12v66/v66-custody-report.json'))
          assert c['classification']=='V66_PREOUTCOME_CUSTODY_FROZEN_READY_FOR_SEPARATE_OUTCOME_SCORER'
          assert c['rows']==11407
          assert c['output']['containsOutcomeTargets'] is False
          o=json.load(open('artifacts/p0-step12v23/f3-outcomes.json'))
          assert o['schemaVersion']=='courtedge-p0-step12v23-f3-outcomes.v1'
          assert o['acquisition']['canonicalGames']==11407
          assert o['acquisition']['outcomeCompleteGames']==11405
          assert o['acquisition']['coverageShare']>=0.995
          assert o['policy']['labelsOnly'] is True
          print('V66_F3_INPUTS_VERIFIED')
          PY
      - name: Score predeclared F3 winner mechanism
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-step12v66-f3
          python scripts/p0-step12v66-f3-winner.py \
            --custody artifacts/p0-step12v66/v66-pregame-custody.jsonl.gz \
            --f3-outcomes artifacts/p0-step12v23/f3-outcomes.json \
            --v23-report artifacts/p0-step12v23/f3-model-suite-report.json \
            --contract research/p0-step12v66-game-horizon-exposure-suite-contract.json \
            --scoring-spec research/p0-step12v66-f3-winner-scoring-spec.json \
            --out artifacts/p0-step12v66-f3/v66-f3-winner-report.json
      - name: Validate frozen route decision and research-only boundary
        run: |
          python - <<'PY'
          import json
          p='artifacts/p0-step12v66-f3/v66-f3-winner-report.json'
          r=json.load(open(p))
          assert r['schemaVersion']=='courtedge-p0-step12v66-f3-winner-score.v1'
          assert r['scientificStatus']=='OUTCOME_SCORING_COMPLETED_WITH_PREDECLARED_F3_MODEL_AND_GATES'
          assert r['route']=='V66_A_F3_WINNER'
          assert r['primaryCandidate']=='STARTER_QUALITY5_PLUS_EXPOSURE_F3_PLUS_QUALITY_X_EXPOSURE5'
          assert r['classification'] in {
            'V66_F3_WINNER_MECHANISM_CERTIFIED_FOR_NEXT_RESEARCH_STAGE',
            'V66_A_F3_WINNER_NOT_ROBUST_ENOUGH_TO_ADVANCE'
          }
          assert len(r['pairedBootstrap']['logLossImprovement']['ci95'])==2
          assert len(r['pairedBootstrap']['brierImprovement']['ci95'])==2
          pol=r['policy']
          for k in ('historicalPricesUsed','marketOddsUsedAsFeatures','positiveEvEstablished','v16ProductionChanged','routingChanged','rankingChanged','stakeChanged','betEliteAllowed','finalRecommendationChanged','automaticBetPlacementAllowed'):
            assert pol[k] is False
          assert pol['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'passed':r['passed'],
            'validation2023Delta':r['validation2023Delta'],
            'combinedDelta':r['combinedEvaluation']['delta'],
            'seasonDeltas':r['seasonDeltas'],
            'bootstrap':r['pairedBootstrap'],
            'diagnosticAblations':r['diagnosticAblations']
          },indent=2))
          PY
      - name: Verify no production policy changes
        run: |
          set -euo pipefail
          git diff --check
          ! grep -E "betEliteAllowed[^\n]*True|realFinancialExposure[^\n]*[1-9]|automaticBetPlacementAllowed[^\n]*True" scripts/p0-step12v66-f3-winner.py
      - name: Upload V66 F3 winner evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v66-f3-winner
          path: artifacts/p0-step12v66-f3/v66-f3-winner-report.json
          if-no-files-found: error
          retention-days: 30
