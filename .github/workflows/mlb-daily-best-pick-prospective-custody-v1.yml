name: MLB Daily BEST PICK Exact Prospective Custody V1

on:
  push:
    branches:
      - research/mlb-current-selector-historical-reconstruction-v1
    paths:
      - "research/MLB_DAILY_BEST_PICK_PROSPECTIVE_CUSTODY_CONTRACT.json"
      - "server/mlb-daily-best-pick-prospective-custody-v1.ts"
      - "server/mlb-daily-best-pick-prospective-custody-v1.test.ts"
      - "server/mlb-unified-priced-v16-runner.ts"
      - ".github/workflows/mlb-daily-best-pick-prospective-custody-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT_PATH: research/MLB_DAILY_BEST_PICK_PROSPECTIVE_CUSTODY_CONTRACT.json
  CUSTODY_PATH: server/mlb-daily-best-pick-prospective-custody-v1.ts
  TEST_PATH: server/mlb-daily-best-pick-prospective-custody-v1.test.ts
  RUNNER_PATH: server/mlb-unified-priced-v16-runner.ts

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout frozen custody branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove contract predates implementation
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- "$CONTRACT_PATH" | tail -1)"
          IMPLEMENTATION_ADD="$(git log --diff-filter=A --format=%H -- "$CUSTODY_PATH" | tail -1)"
          TEST_ADD="$(git log --diff-filter=A --format=%H -- "$TEST_PATH" | tail -1)"
          test -n "$CONTRACT_ADD"
          test -n "$IMPLEMENTATION_ADD"
          test -n "$TEST_ADD"
          test "$CONTRACT_ADD" != "$IMPLEMENTATION_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$IMPLEMENTATION_ADD"
          git merge-base --is-ancestor "$IMPLEMENTATION_ADD" "$TEST_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/MLB_DAILY_BEST_PICK_PROSPECTIVE_CUSTODY_CONTRACT.json'))
          assert c['schemaVersion']=='courtedge-mlb-daily-best-pick-prospective-custody-contract.v1'
          assert c['frozenBeforeImplementation'] is True
          assert c['frozenBeforeAnyProspectiveOutcomeRead'] is True
          assert c['eligibilityBoundary']['earliestPermittedOfficialDate']=='2026-08-26'
          assert c['eligibilityBoundary']['backfillAllowed'] is False
          assert c['captureProtocol']['outcomesMayAffectCustody'] is False
          assert c['captureProtocol']['sportsbookPriceMayAffectCustody'] is False
          assert c['immutability']['storageModel']=='APPEND_ONLY_FIRST_CANONICAL_PER_SOURCE_RUN'
          assert c['canonicalizationBoundary']['canonicalDailyRunDefinedInThisStage'] is False
          assert c['probabilityBoundary']['selectedPopulationProbabilityScoringAllowed'] is False
          print('MLB_DAILY_BEST_PICK_PROSPECTIVE_CONTRACT_PREIMPLEMENTATION_FREEZE_PROVED')
          PY

      - name: Type-check exact custody surface
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit \
            --module ESNext \
            --moduleResolution bundler \
            --target ES2022 \
            --esModuleInterop \
            --skipLibCheck \
            --types node \
            "$CUSTODY_PATH" \
            "$TEST_PATH" \
            "$RUNNER_PATH"

      - name: Execute outcome-blind immutable custody regression suite
        run: npx tsx --test "$TEST_PATH"

      - name: Prove capture occurs before paid odds and cannot change sporting selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          runner=Path('server/mlb-unified-priced-v16-runner.ts').read_text()
          preprice=runner.index('const preprice = runMlbUnifiedPrepriceStep11c(input);')
          capture=runner.index('captureMlbDailyBestPickProspective({')
          paid=runner.index('const acquisition = await input.oddsService.acquire({')
          assert preprice < capture < paid
          block=runner[capture:paid]
          assert 'preprice,' in block
          assert 'capturedAtUtc: preprice.generatedAt' in block
          assert 'custody: input.dailyBestPickProspectiveCustody' in block
          assert 'capture failed closed' in block
          assert 'return' not in block
          print('MLB_DAILY_BEST_PICK_CUSTODY_PREPRICE_BEFORE_PAID_ODDS_PROVED')
          PY

      - name: Prove append-only and outcome-blind custody boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('server/mlb-daily-best-pick-prospective-custody-v1.ts').read_text()
          compact=text.replace(' ', '')
          required=[
            'MLB_DAILY_BEST_PICK_PROSPECTIVE_FIRST_DATE = "2026-08-26"',
            'INSERT OR IGNORE INTO mlb_daily_best_pick_prospective_snapshot',
            'PRIMARY KEY (official_date, source_run_id)',
            'MLB_DAILY_BEST_PICK_PROSPECTIVE_SOURCE_RUN_IMMUTABILITY_CONFLICT',
            'outcomesRead: false',
            'outcomeStatusReadForSelection: false',
            'sportsbookPricesReadForCustody: false',
            'performanceMetricsRead: false',
            'historicalBackfillAllowed: false',
            'canonicalDailyRunDefined: false as const',
            'selectedPopulationProbabilityScoringAllowed: false as const',
            'crossSportProbabilityAuthorized: false as const',
            'selectMlbDailyBestPickFromUnifiedPreprice({',
            'orderedIntrinsicRankedGames',
            'frozenRouteLedgerForCapturedRuntime',
            'prepriceRuntime: preprice',
            'snapshotDigest: sha256(withoutDigest)',
          ]
          for item in required:
            assert item in text, item
          forbidden_imports=[
            './mlb-selective-odds-acquisition',
            './mlb-market-edge',
            './mlb-operating-envelope',
            './mlb-pure-settlement',
            './mlb-daily-best-pick-price',
            './mlb-daily-best-pick-manual-price',
          ]
          found=[item for item in forbidden_imports if item in text]
          assert not found, found
          assert 'outcomeReadUnlocked:false' in compact
          assert 'promotionAllowed:false' in compact
          print('MLB_DAILY_BEST_PICK_PROSPECTIVE_CUSTODY_SAFETY_BOUNDARY_INTACT')
          PY

      - name: Build production backend with custody integration
        run: npm run build:backend

      - name: Materialize validation evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python - <<'PY'
          import json, subprocess
          def blob(path):
              return subprocess.check_output(['git','hash-object',path], text=True).strip()
          out={
            'schemaVersion':'courtedge-mlb-daily-best-pick-prospective-custody-validation.v1',
            'classification':'MLB_DAILY_BEST_PICK_EXACT_PROSPECTIVE_CUSTODY_IMPLEMENTED_AND_SYNTHETICALLY_VALIDATED',
            'headSha':subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'firstEligibleOfficialDate':'2026-08-26',
            'contractBlobSha':blob('research/MLB_DAILY_BEST_PICK_PROSPECTIVE_CUSTODY_CONTRACT.json'),
            'custodyImplementationBlobSha':blob('server/mlb-daily-best-pick-prospective-custody-v1.ts'),
            'custodyTestBlobSha':blob('server/mlb-daily-best-pick-prospective-custody-v1.test.ts'),
            'pricedRunnerBlobSha':blob('server/mlb-unified-priced-v16-runner.ts'),
            'productionIntegration':'EXACT_STEP11C_PREPRICE_CAPTURE_BEFORE_PAID_ODDS_ACQUISITION',
            'storageModel':'APPEND_ONLY_FIRST_CANONICAL_PER_SOURCE_RUN',
            'syntheticTestsPassed':True,
            'productionBackendBuildPassed':True,
            'outcomesRead':False,
            'sportsbookPricesAffectCustody':False,
            'performanceMetricsRead':False,
            'historicalBackfillAllowed':False,
            'canonicalDailyRunDefined':False,
            'selectedPopulationProbabilityScoringAllowed':False,
            'crossSportProbabilityAuthorized':False,
            'globalEliteRanker':'BLOCKED',
            'productionSelectionChanged':False,
            'nextAction':'BEGIN_EXACT_PROSPECTIVE_CAPTURE_ON_OR_AFTER_2026_08_26_AND_FREEZE_OUTCOME_BLIND_DAILY_CANONICALIZATION_RULE_BEFORE_ANY_OUTCOME_READ'
          }
          with open('work/mlb-daily-best-pick-prospective-custody-v1-validation.json','w') as f:
              json.dump(out,f,indent=2,sort_keys=True); f.write('\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Upload exact prospective custody validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-best-pick-prospective-custody-v1-validation
          path: work/mlb-daily-best-pick-prospective-custody-v1-validation.json
          if-no-files-found: error
          retention-days: 90
