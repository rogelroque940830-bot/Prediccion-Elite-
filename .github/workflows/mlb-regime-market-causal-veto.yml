name: MLB Regime Market Causal Veto Study

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-regime-market-causal-veto-v1
    paths:
      - "research/mlb-regime-market-causal-veto-v1-contract.json"
      - "research/mlb-regime-market-causal-veto-v1-result-summary.json"
      - "scripts/mlb-regime-market-causal-veto-v1.py"
      - ".github/workflows/mlb-regime-market-causal-veto.yml"
  pull_request:
    branches:
      - research/mlb-market-state-matchup-modular-router-v1
    paths:
      - "research/mlb-regime-market-causal-veto-v1-contract.json"
      - "research/mlb-regime-market-causal-veto-v1-result-summary.json"
      - "scripts/mlb-regime-market-causal-veto-v1.py"
      - ".github/workflows/mlb-regime-market-causal-veto.yml"

permissions:
  contents: read
  actions: read

jobs:
  regime-market-causal-veto:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen scientific dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'

      - name: Prove protocol freeze predates scorer
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- research/mlb-regime-market-causal-veto-v1-contract.json | tail -1)"
          SCORER_ADD="$(git log --diff-filter=A --format=%H -- scripts/mlb-regime-market-causal-veto-v1.py | tail -1)"
          test -n "$CONTRACT_ADD"
          test -n "$SCORER_ADD"
          test "$CONTRACT_ADD" != "$SCORER_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SCORER_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/mlb-regime-market-causal-veto-v1-contract.json'))
          assert c['schemaVersion']=='courtedge-mlb-regime-market-causal-veto-contract.v1'
          assert c['scientificStatus']=='FROZEN_BEFORE_SCORER_RETROSPECTIVE_REGIME_MARKET_CAUSAL_VETO_STUDY_PROSPECTIVE_CONFIRMATION_REQUIRED'
          assert c['adaptiveSelectionDisclosure']['parentRetrospectiveResultsWereInspectedBeforeThisProtocol'] is True
          assert c['adaptiveSelectionDisclosure']['thereforeEvaluation2024To2026CanCertifyProductionWinner'] is False
          assert c['adaptiveSelectionDisclosure']['postProtocolThresholdSearchAllowed'] is False
          assert c['productionBoundary']['productionChanged'] is False
          assert c['productionBoundary']['maximumDailyPicks']==1
          assert c['leagueRegimeDiagnostic']['policyEffect']=='DIAGNOSTIC_ONLY_NO_ROUTING_EFFECT_IN_V1'
          assert c['leagueRegimeDiagnostic']['windowCalendarDays']==28
          assert c['leagueRegimeDiagnostic']['minimumPriorCompletedGames']==100
          assert c['leagueRegimeDiagnostic']['stressQuantileExactly']==0.8
          assert c['causalWeakLinkVeto']['lowerQuantileExactly']==0.2
          assert c['marketScope']['marketGuardBlockedVariantsExactly']==['F5_RL_HOME_MINUS_0_5']
          assert list(c['policies'])==[
            'CONTROL_FULL_MODULAR','CHALLENGER_MARKET_GUARD',
            'CHALLENGER_CAUSAL_VETO','CHALLENGER_MARKET_X_CAUSAL_VETO'
          ]
          assert c['dailyShadowRouter']['maximumShadowSelectionsPerDate']==1
          assert c['dailyShadowRouter']['outcomeMaySelectDailyCandidate'] is False
          assert c['primaryReporting']['singleWeightedUtilityScoreAllowed'] is False
          assert c['primaryReporting']['winnerMayBeDeclaredFromRetrospectiveSeasons'] is False
          assert c['pairedStatistics']['multipleComparisonCorrection']=='HOLM_BONFERRONI'
          assert c['decisionBoundary']['productionWinnerMayBeDeclared'] is False
          print('REGIME_MARKET_CAUSAL_VETO_PROTOCOL_PRE_SCORER_FREEZE_PROVED')
          PY

      - name: Syntax check frozen scorers
        run: |
          python -m py_compile scripts/mlb-regime-market-causal-veto-v1.py
          python -m py_compile scripts/mlb-market-state-matchup-modular-router-v1.py
          python -m py_compile scripts/mlb-multi-market-coverage-report-compat-v1.py

      - name: Materialize pinned team-state parent research
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='research/mlb-modular-team-structure-nrfi-yrfi-v1'
          PIN='b2cd717f49d3063c6b7ed679674661961679d2a2'
          REF="refs/remotes/origin/${BRANCH}"
          git fetch origin "refs/heads/${BRANCH}:${REF}"
          test "$(git rev-parse "$REF")" = "$PIN"
          mkdir -p inputs/modular-parent/scripts inputs/modular-parent/research
          git show "${PIN}:scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py" > inputs/modular-parent/scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py
          git show "${PIN}:research/mlb-modular-team-structure-nrfi-yrfi-v1-contract.json" > inputs/modular-parent/research/mlb-modular-team-structure-nrfi-yrfi-v1-contract.json
          test -s inputs/modular-parent/scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py
          test -s inputs/modular-parent/research/mlb-modular-team-structure-nrfi-yrfi-v1-contract.json

      - name: Materialize immutable V69 parent source
        shell: bash
        run: |
          set -euo pipefail
          PARENT_BRANCH='research/p0-step12v69-confluence-frequency-quality-frontier'
          PARENT_REF="refs/remotes/origin/${PARENT_BRANCH}"
          git fetch origin "refs/heads/${PARENT_BRANCH}:${PARENT_REF}"
          mkdir -p inputs/parent/scripts inputs/parent/research inputs/parent/server
          for FILE in \
            scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            server/mlb-frozen-a-plus-classifier.ts \
            server/mlb-frozen-research-route-assessor.ts
          do
            git show "${PARENT_REF}:${FILE}" > "inputs/parent/${FILE}"
            test -s "inputs/parent/${FILE}"
          done

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31659518059

      - name: Download immutable V66 pregame custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31962659793

      - name: Download immutable V16 pure settlement manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for S in 2022 2023 2024 2025 2026_YTD; do
            test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"
          done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY" && test -s "$CUSTODY"
          test -n "$V16" && test -s "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Reconstruct exact frozen parent control artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/mlb-market-state-matchup-modular-router-v1.py \
            --root inputs/step12v3 \
            --custody '${{ steps.inputs.outputs.custody }}' \
            --v16-manifest '${{ steps.inputs.outputs.v16 }}' \
            --v68-contract inputs/parent/research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source inputs/parent/server/mlb-frozen-a-plus-classifier.ts \
            --router-source inputs/parent/server/mlb-frozen-research-route-assessor.ts \
            --v69-contract inputs/parent/research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer inputs/parent/scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --multi-market-scorer scripts/mlb-multi-market-coverage-report-compat-v1.py \
            --multi-market-contract research/mlb-multi-market-coverage-expansion-v1-contract.json \
            --modular-parent-scorer inputs/modular-parent/scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py \
            --modular-parent-contract inputs/modular-parent/research/mlb-modular-team-structure-nrfi-yrfi-v1-contract.json \
            --contract research/mlb-market-state-matchup-modular-router-v1-contract.json \
            --out work/parent-modular-router.json

      - name: Execute frozen regime market causal veto study
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mlb-regime-market-causal-veto-v1.py \
            --root inputs/step12v3 \
            --custody '${{ steps.inputs.outputs.custody }}' \
            --v16-manifest '${{ steps.inputs.outputs.v16 }}' \
            --v68-contract inputs/parent/research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source inputs/parent/server/mlb-frozen-a-plus-classifier.ts \
            --router-source inputs/parent/server/mlb-frozen-research-route-assessor.ts \
            --v69-contract inputs/parent/research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer inputs/parent/scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --multi-market-scorer scripts/mlb-multi-market-coverage-report-compat-v1.py \
            --multi-market-contract research/mlb-multi-market-coverage-expansion-v1-contract.json \
            --modular-parent-scorer inputs/modular-parent/scripts/mlb-modular-team-structure-nrfi-yrfi-v1.py \
            --modular-parent-contract inputs/modular-parent/research/mlb-modular-team-structure-nrfi-yrfi-v1-contract.json \
            --parent-router-scorer scripts/mlb-market-state-matchup-modular-router-v1.py \
            --parent-router-contract research/mlb-market-state-matchup-modular-router-v1-contract.json \
            --parent-result work/parent-modular-router.json \
            --contract research/mlb-regime-market-causal-veto-v1-contract.json \
            --out work/mlb-regime-market-causal-veto-v1.json

      - name: Validate scientific and governance boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/mlb-regime-market-causal-veto-v1.json'))
          assert r['schemaVersion']=='courtedge-mlb-regime-market-causal-veto.v1'
          assert r['classification']=='REGIME_MARKET_CAUSAL_VETO_RETROSPECTIVE_STUDY_COMPLETE_PROSPECTIVE_CONFIRMATION_REQUIRED'
          assert r['sample']['trainingRows2022']==2398
          assert r['sample']['calibrationRows2023']==2399
          assert r['sample']['evaluationRows']==6610
          assert r['sample']['eligibleSlateDates']==505
          assert r['sample']['parentActiveDates']==200
          assert r['sample']['parentNoPlayDates']==305
          assert r['parentControlParity']['dailyPickIdentitiesExact'] is True
          assert r['parentControlParity']['metricsExactWithin1e12'] is True
          assert set(r['policyResults'])=={
            'CONTROL_FULL_MODULAR','CHALLENGER_MARKET_GUARD',
            'CHALLENGER_CAUSAL_VETO','CHALLENGER_MARKET_X_CAUSAL_VETO'
          }
          for name,picks in r['dailyShadowPicks'].items():
            dates=[x['officialDate'] for x in picks]
            assert len(dates)==len(set(dates))
          b=r['scientificBoundary']
          assert b['parentControlBitwiseDailyIdentityPreserved'] is True
          assert b['oneShadowPickMaximumPerParentNoPlayDate'] is True
          assert b['parentAPlusPremiumDatesReplaced'] is False
          assert b['marketGuardAdaptiveHypothesisDisclosed'] is True
          assert b['causalVetoThresholdUses2023Only'] is True
          assert b['regimeUsesStrictlyPriorCompletedGames'] is True
          assert b['regimeHasRoutingEffect'] is False
          assert b['retrospective2024To2026IsIndependentConfirmation'] is False
          assert b['prospectiveConfirmationRequired'] is True
          assert b['historicalPricesUsed'] is False
          assert b['positiveEvEstablished'] is False
          assert b['betEliteProduced'] is False
          assert b['stakeCalculated'] is False
          assert b['automaticBetPlacement'] is False
          assert b['realFinancialExposure']==0
          assert b['productionChanged'] is False
          assert b['currentAPlusPremiumHierarchyChanged'] is False
          assert b['generalV68Fallback'] is False
          assert b['v80Dependency'] is False
          print(json.dumps({
            'sample':r['sample'],
            'policyResults':{
              k:{
                'coveragePct':v['combinedDailyOpportunityCoveragePct'],
                'shadowPickDates':v['shadowPickDates'],
                'hitRate':v['hitRate'],
                'wilson95':v['wilson95'],
                'brier':v['decisiveBrierScore'],
                'calibrationGap':v['absoluteCalibrationGap'],
                'maxNoPlayStreak':v['remainingNoPlayStreaks']['maximum'],
                'bySeason':v['bySeason'],
                'byMarket':v['byMarket'],
                'byGeometry':v['bySelectedSideLineGeometry'],
                'byRegime':v['byLeagueRegime'],
              } for k,v in r['policyResults'].items()
            },
            'paretoPolicies':r['paretoPolicies'],
            'pairedComparisons':r['pairedComparisonsVsControl'],
            'removalDiagnostics':r['removalDiagnosticsVsControl'],
            'leagueRegime':r['leagueRegime'],
            'vetoReasonCounts':r['vetoReasonCounts'],
          },indent=2))
          PY

      - name: Upload frozen study artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-regime-market-causal-veto-v1
          path: work/mlb-regime-market-causal-veto-v1.json
          if-no-files-found: error
          retention-days: 90
