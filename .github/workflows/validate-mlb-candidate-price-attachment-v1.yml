name: Validate MLB Candidate Price Attachment V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/mlb-normalized-candidate-pricing-v1.ts'
      - 'server/mlb-normalized-candidate-pricing-v1.test.ts'
      - 'server/mlb-normalized-candidate-pool-v1.ts'
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-edge.ts'
      - '.github/workflows/validate-mlb-candidate-price-attachment-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prove normalized candidate price attachment
        run: npx tsx --test server/mlb-normalized-candidate-pricing-v1.test.ts
      - name: Preserve normalized sporting pool
        run: npx tsx --test server/mlb-normalized-candidate-pool-v1.test.ts
      - name: Build production backend
        run: npm run build:backend
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
