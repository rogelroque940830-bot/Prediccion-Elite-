name: Harden MLB Full Snapshot

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/harden-mlb-full-snapshot.py'
      - '.github/workflows/mlb-full-snapshot-harden.yml'

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: integration/mlb-ledger-full-snapshot
          fetch-depth: 0

      - name: Detect completed hardening
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[snapshot-hardened\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 20
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Apply hardening patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/harden-mlb-full-snapshot.py

      - name: Install backend dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Type-check backend contracts
        if: steps.guard.outputs.skip != 'true'
        run: npm run typecheck:mlb-ledger

      - name: Run ledger and snapshot tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:mlb-ledger

      - name: Build backend
        if: steps.guard.outputs.skip != 'true'
        run: npm run build:backend

      - name: Install frontend dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run build

      - name: Commit hardened implementation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "courtedge-ci"
          git config user.email "courtedge-ci@users.noreply.github.com"
          git add \
            frontend/client/src/lib/mlb-scientific-snapshot.ts \
            frontend/client/src/pages/mlb-predictor.tsx \
            server/mlb-scientific-snapshot.ts \
            server/mlb-scientific-snapshot.test.ts \
            server/picks-v2.ts
          git commit -m "fix(mlb): harden canonical scientific snapshot [snapshot-hardened]"
          git push origin HEAD:integration/mlb-ledger-full-snapshot
