name: MLB Supersession Integrity

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/link-mlb-supersession.py'
      - '.github/workflows/mlb-supersession-integrity.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: integration/mlb-ledger-full-snapshot
          fetch-depth: 0

      - name: Detect completed supersession patch
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[snapshot-supersession\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 20
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Apply supersession patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/link-mlb-supersession.py

      - name: Install backend dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Type-check backend contracts
        id: supersession_typecheck
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:mlb-ledger 2>&1 | tee mlb-supersession-typecheck.txt

      - name: Upload supersession diagnostics
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mlb-supersession-typecheck
          path: mlb-supersession-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce backend contracts
        if: steps.supersession_typecheck.outcome == 'failure'
        run: exit 1

      - name: Run ledger and snapshot tests
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:mlb-ledger

      - name: Build backend
        if: steps.guard.outputs.skip != 'true'
        run: npm run build:backend

      - name: Install frontend dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run build

      - name: Commit validated supersession
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "courtedge-ci"
          git config user.email "courtedge-ci@users.noreply.github.com"
          git add \
            frontend/client/src/pages/mlb-predictor.tsx \
            server/mlb-scientific-snapshot.ts \
            server/mlb-scientific-snapshot.test.ts \
            server/picks-v2.ts
          git commit -m "fix(mlb): link recalculations and enforce pregame capture [snapshot-supersession]"
          git push origin HEAD:integration/mlb-ledger-full-snapshot
