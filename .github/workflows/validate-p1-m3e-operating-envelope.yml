name: Validate P1-M3E MLB Operating Envelope

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-p1-operating-envelope.ts'
      - 'server/mlb-p1-operating-envelope.test.ts'
      - 'server/mlb-p1-operating-envelope-routes.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.test.ts'
      - 'server/mlb-statcast-matchup-identity-routes.ts'
      - 'server/mlb-statcast-matchup-identity-routes.test.ts'
      - 'server/routes.ts'
      - 'server/route-contract.extensions.json'
      - 'docs/P1_M3E_MLB_OPERATING_ENVELOPE.md'
      - 'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md'
      - 'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md'
      - 'tsconfig.p1-m3e-operating-envelope.json'
      - 'tsconfig.p1-m3f3b5-vsteam-identity.json'
      - '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml'
      - '.github/workflows/validate-p1-m3d-interactive-economic-review.yml'
      - '.github/workflows/validate-p1-m3e-operating-envelope.yml'
      - '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml'
      - '.github/workflows/validate-p1-m4c-backend-economic-response.yml'
      - '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned P1-M3E surface
        run: npx tsc -p tsconfig.p1-m3e-operating-envelope.json
      - name: Run operating-envelope falsification tests
        run: npx tsx --test server/mlb-p1-operating-envelope.test.ts
      - name: Preserve P1-M3D and capture/economic contracts
        run: |
          npx tsx --test \
            server/mlb-p1-economic-review.test.ts \
            server/mlb-p1-scientific-capture-contract.test.ts \
            server/mlb-p1-economic-decision-adapter.test.ts
      - name: Verify modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend required by S5A
        run: npm run build:backend
      - name: Run S5A real-save regression
        run: npm run test:s5a-e2e
      - name: Run complete S5B shadow regression
        run: npm run test:s5b-shadow
      - name: Verify no-outcome selector and read-only boundaries
        shell: bash
        run: |
          set -euo pipefail
          source='server/mlb-p1-operating-envelope.ts'
          route='server/mlb-p1-operating-envelope-routes.ts'
          docs='docs/P1_M3E_MLB_OPERATING_ENVELOPE.md'
          adapter_docs='docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md'

          grep -F 'courtedge-p1-m3e-operating-envelope.v1' "$source"
          grep -F 'ELITE_MODEL_QUALITY_SUPPORTED' "$source"
          grep -F 'bootstrapReplicates: 5000' "$source"
          grep -F 'maximumRuleAtoms: 2' "$source"
          grep -F 'economicProfitabilityCertified: false' "$source"
          grep -F 'operationalGateAllowed: false' "$source"
          grep -F 'modelProbabilityChanged: false' "$source"
          grep -F 'existingEconomicThresholdsChanged: false' "$source"
          grep -F 'automaticModelChangesAllowed: false' "$source"
          grep -F 'automaticPromotionAllowed: false' "$source"
          grep -F 'Forbidden selector inputs' "$docs"

          matcher=$(sed -n '/export function matchesMlbP1M3eAtom/,/^}/p' "$source")
          ! grep -E 'result|settledAt|brierScore|logLoss|flatProfitUnits|policyProfitUnits|clvPp|closingOddsAmerican' <<< "$matcher"

          grep -F 'app.get(' "$route"
          grep -F '"/api/mlb/p1/v1/operating-envelope"' "$route"
          grep -F 'requireInteractiveMlbCaptureSession' "$route"
          grep -F 'ownershipStore.listPredictionIds(userId)' "$route"
          grep -F 'store.getRecord(predictionId)' "$route"
          grep -F 'buildMlbP1M3dEconomicReview(records)' "$route"
          grep -F 'buildMlbP1M3eOperatingEnvelope(economicReview.rows)' "$route"
          grep -F 'P1_M3E_SOURCE_WINDOW_TRUNCATED' "$route" "$adapter_docs"
          grep -F 'registerMlbP1OperatingEnvelopeRoutes(app)' server/routes.ts
          grep -F '"GET", "path": "/api/mlb/p1/v1/operating-envelope"' server/route-contract.extensions.json

          ! grep -E 'app\.(post|put|patch|delete)\(' "$route"
          ! grep -E 'appendOwnedPrediction|appendOwnedSettlement|appendPrediction|appendSettlement' "$source" "$route"
          ! grep -E 'sportsbookIntegration:[[:space:]]*true|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]|automaticModelChangesAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true' "$source" "$route"
      - name: Verify exact protected P1-M3E or B5 successor scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ -z "$base" || -z "$head" ]]; then
            git fetch origin integration/p0-staging-secure --depth=1
            base='origin/integration/p0-staging-secure'
            head='HEAD'
          fi
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)

          m3e_package=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3e-operating-envelope.yml' \
            'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md' \
            'server/mlb-p1-operating-envelope-routes.ts' \
            'server/route-contract.extensions.json' \
            'server/routes.ts' \
            'tsconfig.p1-m3e-operating-envelope.json' | sort)

          compatibility_package=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml' \
            '.github/workflows/validate-p1-m3d-interactive-economic-review.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope.yml' \
            '.github/workflows/validate-p1-m4c-backend-economic-response.yml' \
            '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml' | sort)

          b5_successor=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml' \
            'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md' \
            'server/mlb-statcast-matchup-identity-routes.test.ts' \
            'server/mlb-statcast-matchup-identity-routes.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.test.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.ts' \
            'server/routes.ts' \
            'tsconfig.p1-m3f3b5-vsteam-identity.json' | sort)

          if [[ "$changed" != "$m3e_package" \
            && "$changed" != "$compatibility_package" \
            && "$changed" != "$b5_successor" ]]; then
            echo 'P1-M3E scope rejected. Diff must be exactly the M3E read-only package, the B5 identity-safe successor package, or the five-workflow compatibility package.' >&2
            printf 'Changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
