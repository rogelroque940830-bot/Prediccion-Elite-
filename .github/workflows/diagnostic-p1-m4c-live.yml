name: Diagnostic P1-M4C Live

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-p1-m4c-live.yml'

permissions:
  contents: read

jobs:
  verify-live-p1-m4c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_FRONTEND_RELEASE: p1-m4c-mlb-economic-decision-card-2026-08-06
      EXPECTED_BACKEND_COMMIT: 58b0b8aef3fb78db30e8b5e78961858047317b84
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact P1-M4C deployment and verify safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            index_code=$(curl -sS -L -o audit/index.html -w '%{http_code}' --max-time 25 "${FRONTEND_URL}/" || true)
            health_code=$(curl -sS -o audit/backend-health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            ledger_code=$(curl -sS -o audit/ledger.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            capture_code=$(curl -sS -o audit/anonymous-capture.json -w '%{http_code}' --max-time 25 \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "${BACKEND_URL}/api/mlb/p1/v1/scientific-captures" || true)

            rm -f audit/bundle.js
            if [[ "${index_code}" == "200" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('audit/index.html', 'utf8');
          const sources = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((match) => match[1]);
          fs.writeFileSync('audit/script-sources.txt', `${sources.join('\n')}\n`);
          NODE
              while IFS= read -r source || [[ -n "${source}" ]]; do
                [[ -n "${source}" ]] || continue
                if [[ "${source}" =~ ^https?:// ]]; then
                  asset_url="${source}"
                else
                  clean="${source#./}"
                  clean="${clean#/}"
                  asset_url="${FRONTEND_URL}/${clean}"
                fi
                curl -sS -L --max-time 30 "${asset_url}" >> audit/bundle.js || true
                printf '\n' >> audit/bundle.js
              done < audit/script-sources.txt
            fi

            release_ok=false
            markers_ok=false
            backend_ok=false
            if [[ -s audit/bundle.js ]] && grep -Fq "${EXPECTED_FRONTEND_RELEASE}" audit/bundle.js; then
              release_ok=true
            fi
            if [[ -s audit/bundle.js ]] \
              && grep -Fq 'Decisión económica certificada' audit/bundle.js \
              && grep -Fq 'FINAL ACCIONABLE' audit/bundle.js \
              && grep -Fq 'ESPERAR FINAL' audit/bundle.js \
              && grep -Fq 'Precio mínimo' audit/bundle.js \
              && grep -Fq 'EV por unidad' audit/bundle.js \
              && grep -Fq 'SHADOW · exposición 0' audit/bundle.js \
              && grep -Fq '/api/mlb/p1/v1/scientific-captures' audit/bundle.js; then
              markers_ok=true
            fi
            if [[ "${health_code}" == "200" ]] && node -e '
              const fs=require("fs");
              const health=JSON.parse(fs.readFileSync("audit/backend-health.json","utf8"));
              process.exit(health.status === "healthy" && health.commit === process.env.EXPECTED_BACKEND_COMMIT ? 0 : 1);
            '; then
              backend_ok=true
            fi

            echo "Attempt ${attempt}/100: index=${index_code} health=${health_code} ledger=${ledger_code} anonymousCapture=${capture_code} frontend=${release_ok} markers=${markers_ok} backend=${backend_ok}"

            if [[ "${index_code}" == "200" && "${health_code}" == "200" && "${ledger_code}" == "200" && "${capture_code}" == "401" && "${release_ok}" == "true" && "${markers_ok}" == "true" && "${backend_ok}" == "true" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('audit/backend-health.json', 'utf8'));
          const ledger = JSON.parse(fs.readFileSync('audit/ledger.json', 'utf8'));
          const capture = JSON.parse(fs.readFileSync('audit/anonymous-capture.json', 'utf8'));
          const bundle = fs.readFileSync('audit/bundle.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const markers = [
            process.env.EXPECTED_FRONTEND_RELEASE,
            'Decisión económica certificada',
            'FINAL ACCIONABLE',
            'ESPERAR FINAL',
            'Precio mínimo',
            'EV por unidad',
            'SHADOW · exposición 0',
            '/api/mlb/p1/v1/scientific-captures',
          ];
          assert(health.status === 'healthy', `backend health=${health.status}`);
          assert(health.commit === process.env.EXPECTED_BACKEND_COMMIT, `backend commit=${health.commit}`);
          assert(ledger.success === true, 'ledger success=false');
          assert(ledger.data?.schemaVersion === 'mlb-ledger.v1', `ledger schema=${ledger.data?.schemaVersion}`);
          assert(ledger.data?.immutable === true, 'ledger immutable=false');
          assert(capture.success === false, 'anonymous capture unexpectedly succeeded');
          assert(/Authentication required/i.test(String(capture.error || '')), `capture error=${capture.error}`);
          for (const marker of markers) assert(bundle.includes(marker), `missing marker: ${marker}`);

          const evidence = {
            frontendRelease: process.env.EXPECTED_FRONTEND_RELEASE,
            backendCommit: health.commit,
            environment: health.environment,
            visibleCardMarkers: markers.slice(1, 7),
            endpoint: '/api/mlb/p1/v1/scientific-captures',
            anonymousPostStatus: 401,
            anonymousWriteProtected: true,
            ledger: {
              schemaVersion: ledger.data.schemaVersion,
              immutable: ledger.data.immutable,
              predictions: ledger.data.predictions,
              settlementEvents: ledger.data.settlementEvents,
            },
            syntheticCapturesCreatedByDiagnostic: 0,
            canonicalPicksCreatedByDiagnostic: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
            authenticatedEconomicResponseExercisedByDiagnostic: false,
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
              exit 0
            fi

            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact P1-M4C deployment' >&2
              for file in backend-health.json ledger.json anonymous-capture.json script-sources.txt; do
                echo "--- ${file}"
                cat "audit/${file}" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 10
          done
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m4c-live-evidence
          path: audit
          if-no-files-found: warn
