name: Validate S6K First Ten Cycles

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-s6k-first-ten-cycles-certification.ts'
      - 'server/mlb-s6k-first-ten-cycles-certification.test.ts'
      - 'server/s5b-staging-entry.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.s6k-first-ten.json'
      - 'tsconfig.s5b-shadow.json'
      - 'package.json'
      - 'docs/S6K_PHASE5B_FIRST_TEN_CYCLES.md'
      - '.github/workflows/validate-s6k-first-ten-cycles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-s6k:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused Phase 5B tests
        run: npx tsx --test server/mlb-s6k-first-ten-cycles-certification.test.ts
      - name: Type-check Phase 5B surface
        run: npx tsc -p tsconfig.s6k-first-ten.json
      - name: Type-check complete shadow surface
        run: npx tsc -p tsconfig.s5b-shadow.json
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify Phase 5B integration and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mlb-s6k-first-ten-clean-cycles.v1' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'MLB_S6K_TARGET_COUNT = 10' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'READY_FOR_ANALYSIS' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'ACTION_REQUIRED' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'targetRegistryAppendOnly: true' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'realFinancialExposure: 0' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'automaticBetPlacement: false' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'historicalLedgerMutation: false' server/mlb-s6k-first-ten-cycles-certification.ts
          grep -F 'startMlbS6kFirstTenCyclesCertificationWorker' server/s5b-staging-entry.ts
          grep -F '/health/s6k-first-ten-cycles' server/s5b-staging-entry.ts
          grep -F '/api/mlb/ledger/v1/s6k-first-ten-cycles/status' server/route-contract.extensions.json
          grep -F 'mlb-s6k-first-ten-clean-cycles.v1' dist/index.cjs
