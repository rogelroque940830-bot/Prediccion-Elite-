name: Validate P0 Step 12G Regime Diagnostics

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12g-regime-diagnostics.py'
      - 'scripts/p0-step12-pocket-pilot.py'
      - 'scripts/p0-step12d-freeze-candidates.mjs'
      - 'scripts/p0-step12d-acquire-forward-cohort.mjs'
      - 'scripts/p0-step12f-acquire-2024-replication.mjs'
      - 'evidence/p0-step12/2025-pocket-pilot.json'
      - '.github/workflows/validate-p0-step12g-regime-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-step12g-regime-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Freeze exact leader family
        run: >-
          node scripts/p0-step12d-freeze-candidates.mjs
          --input evidence/p0-step12/2025-pocket-pilot.json
          --out artifacts/p0-step12g/frozen-candidates.json
      - name: Syntax-check diagnostic surface
        run: python -m py_compile scripts/p0-step12g-regime-diagnostics.py scripts/p0-step12-pocket-pilot.py
      - name: Acquire untouched 2024 cohort
        run: >-
          node --import tsx scripts/p0-step12f-acquire-2024-replication.mjs
          --start 2024-03-01 --end 2024-09-30 --concurrency 6
          --out artifacts/p0-step12g/cohort-2024
      - name: Acquire frozen 2026 cohort
        run: >-
          node --import tsx scripts/p0-step12d-acquire-forward-cohort.mjs
          --start 2026-03-01 --end 2026-08-10 --concurrency 6
          --out artifacts/p0-step12g/cohort-2026
      - name: Compare feature distributions and outcome conversion without retuning
        run: >-
          python scripts/p0-step12g-regime-diagnostics.py
          --candidates artifacts/p0-step12g/frozen-candidates.json
          --dataset-2024 artifacts/p0-step12g/cohort-2024/dataset.json
          --starter-2024 artifacts/p0-step12g/cohort-2024/starting-pitcher-history.json
          --lineup-2024 artifacts/p0-step12g/cohort-2024/pregame-lineup-history.json
          --dataset-2026 artifacts/p0-step12g/cohort-2026/dataset.json
          --starter-2026 artifacts/p0-step12g/cohort-2026/starting-pitcher-history.json
          --lineup-2026 artifacts/p0-step12g/cohort-2026/pregame-lineup-history.json
          --out artifacts/p0-step12g/regime-diagnostics.json
      - name: Validate diagnostic-only contract
        run: |
          python - <<'PY'
          import json
          with open('artifacts/p0-step12g/regime-diagnostics.json',encoding='utf-8') as f:r=json.load(f)
          assert r['schemaVersion']=='courtedge-p0-step12g-regime-diagnostics.v1'
          assert r['evidenceStatus']=='DIAGNOSTIC_ONLY_NO_RETUNING_NO_PROMOTION'
          assert r['leader']['hypothesisKey']=='FIRST_5:46a7cbb6ff5c2458'
          b=r['comparison']['interpretation']
          assert b['thresholdRetuningAllowed'] is False
          assert b['regimeExclusionAllowed'] is False
          assert b['monthDroppingAllowed'] is False
          assert b['canProduceBetElite'] is False
          assert b['canChangeLiveFilters'] is False
          assert b['diagnosticDoesNotCreateIndependentEvidence'] is True
          print(json.dumps({'comparison':r['comparison'],'season2024':r['season2024'],'season2026':r['season2026']},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload Step 12G diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12g-regime-diagnostics
          path: artifacts/p0-step12g/
          if-no-files-found: error
          retention-days: 30
