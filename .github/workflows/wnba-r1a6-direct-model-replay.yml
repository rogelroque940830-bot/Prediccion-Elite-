name: WNBA R1A.6 Direct Outcome-Blind Model Replay

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A6_OUTCOME_BLIND_MODEL_REPLAY_CONTRACT.json'
      - 'research/wnba/WNBA_R1A5_NEUTRAL_AVAILABILITY_CANDIDATE_CERTIFICATION.json'
      - 'scripts/wnba-r1a5-neutral-availability-candidate.py'
      - 'scripts/wnba-r1a6-direct-model-replay.mjs'
      - 'frontend/client/src/lib/wnba-model.ts'
      - '.github/workflows/wnba-r1a6-direct-model-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install historical constructor dependency
        run: python -m pip install --quiet pyarrow
      - name: Reproduce frozen R1A.5 candidate input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a5-neutral-availability-candidate.py
      - name: Directly execute production TypeScript sports-only model
        run: npx --yes tsx@4.20.5 scripts/wnba-r1a6-direct-model-replay.mjs
      - name: Upload probability custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a6-probabilities-${{ github.run_id }}
          path: |
            wnba-r1a6-model-replay-evidence.json
            wnba-r1a6-sports-only-probability-rowset.jsonl
            wnba-r1a5-neutral-availability-candidate-rowset.jsonl
          if-no-files-found: error
          retention-days: 90
