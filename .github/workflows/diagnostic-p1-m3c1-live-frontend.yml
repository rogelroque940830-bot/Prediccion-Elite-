name: Diagnostic P1-M3C.1 Live Frontend

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-p1-m3c1-live-frontend.yml'

permissions:
  contents: read

jobs:
  verify-live-p1-m3c1:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_RELEASE: p1-m3c1-json-digest-transport-2026-08-05
    steps:
      - name: Wait for exact P1-M3C.1 bundle and verify safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            index_code=$(curl -sS -L -o audit/index.html -w '%{http_code}' --max-time 25 "${FRONTEND_URL}/" || true)
            health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            ledger_code=$(curl -sS -o audit/ledger.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            capture_code=$(curl -sS -o audit/anonymous-capture.json -w '%{http_code}' --max-time 25 \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "${BACKEND_URL}/api/mlb/p1/v1/scientific-captures" || true)

            : > audit/bundle.js
            if [[ "$index_code" == "200" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('audit/index.html', 'utf8');
          const sources = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((m) => m[1]);
          fs.writeFileSync('audit/sources.txt', `${sources.join('\n')}\n`);
          NODE
              while IFS= read -r source || [[ -n "$source" ]]; do
                [[ -n "$source" ]] || continue
                if [[ "$source" =~ ^https?:// ]]; then
                  url="$source"
                else
                  clean="${source#./}"
                  clean="${clean#/}"
                  url="${FRONTEND_URL}/${clean}"
                fi
                curl -sS -L --max-time 30 "$url" >> audit/bundle.js || true
                printf '\n' >> audit/bundle.js
              done < audit/sources.txt
            fi

            release=false
            transport=false
            details=false
            if [[ -s audit/bundle.js ]] && grep -Fq "$EXPECTED_RELEASE" audit/bundle.js; then release=true; fi
            if [[ -s audit/bundle.js ]] \
              && grep -Fq 'P1_M3C_SNAPSHOT_TOO_LARGE' audit/bundle.js \
              && grep -Fq 'P1_M3C_SNAPSHOT_NOT_JSON_SERIALIZABLE' audit/bundle.js; then transport=true; fi
            if [[ -s audit/bundle.js ]] && grep -Fq 'details' audit/bundle.js; then details=true; fi

            echo "Attempt ${attempt}/100 index=${index_code} health=${health_code} ledger=${ledger_code} capture=${capture_code} release=${release} transport=${transport} details=${details}"

            if [[ "$index_code" == "200" && "$health_code" == "200" && "$ledger_code" == "200" && "$capture_code" == "401" && "$release" == "true" && "$transport" == "true" && "$details" == "true" ]]; then
              EXPECTED_RELEASE="$EXPECTED_RELEASE" node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('audit/health.json', 'utf8'));
          const ledger = JSON.parse(fs.readFileSync('audit/ledger.json', 'utf8'));
          const capture = JSON.parse(fs.readFileSync('audit/anonymous-capture.json', 'utf8'));
          const bundle = fs.readFileSync('audit/bundle.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(health.status === 'healthy', `health=${health.status}`);
          assert(ledger.success === true && ledger.data?.immutable === true, 'ledger is not healthy and immutable');
          assert(capture.success === false && /Authentication required/i.test(String(capture.error || '')), 'anonymous write protection failed');
          for (const marker of [
            process.env.EXPECTED_RELEASE,
            'P1_M3C_SNAPSHOT_TOO_LARGE',
            'P1_M3C_SNAPSHOT_NOT_JSON_SERIALIZABLE',
            '/api/mlb/p1/v1/scientific-captures',
          ]) assert(bundle.includes(marker), `missing marker ${marker}`);
          const evidence = {
            frontendRelease: process.env.EXPECTED_RELEASE,
            backendCommit: health.commit,
            environment: health.environment,
            anonymousPostStatus: 401,
            immutableLedger: ledger.data.immutable,
            predictions: ledger.data.predictions,
            settlementEvents: ledger.data.settlementEvents,
            syntheticCapturesCreated: 0,
            picksCreated: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
              exit 0
            fi

            if [[ "$attempt" == "100" ]]; then
              echo 'Timed out waiting for P1-M3C.1 live deployment' >&2
              exit 1
            fi
            sleep 10
          done
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m3c1-live-frontend-evidence
          path: audit
          if-no-files-found: warn
