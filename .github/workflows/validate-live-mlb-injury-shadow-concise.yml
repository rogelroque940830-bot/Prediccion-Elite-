name: Concise live MLB injury shadow evidence

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Validate current sources and SEA-TEX classifications
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/live-shadow/server /tmp/live-shadow/scripts
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/rogelroque940830-bot/Prediccion-Elite-/5c21e3a29435e323b4c6d2f6df07e5ab4e6f2a31/server/mlb-injury-shadow.ts' -o /tmp/live-shadow/server/mlb-injury-shadow.ts
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/rogelroque940830-bot/Prediccion-Elite-/5c21e3a29435e323b4c6d2f6df07e5ab4e6f2a31/scripts/validate-live-shadow-evidence.mts' -o /tmp/live-shadow/scripts/validate-live-shadow-evidence.mts
          cd /tmp/live-shadow
          node --experimental-strip-types scripts/validate-live-shadow-evidence.mts
