name: WNBA R1A.4D2 Deployed Travel Custody

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4D2_DEPLOYED_COORDINATE_TRAVEL_BUCKET_CUSTODY.json'
      - 'research/wnba/WNBA_R1A4D1_SEASON_VENUE_REGISTRY_CERTIFICATION.json'
      - 'frontend/client/src/lib/travel.ts'
      - 'frontend/client/src/lib/wnba-model.ts'
      - 'research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_CERTIFICATION.json'
      - 'research/wnba/WNBA_R1A4C2_SPECIAL_EVENT_EXCLUSION_AND_PREFIX_CUSTODY.json'
      - 'scripts/wnba-r1a4d2-deployed-travel-custody.py'
      - '.github/workflows/wnba-r1a4d2-deployed-travel-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --quiet pyarrow
      - name: Certify deployed coordinate and bucket semantics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4d2-deployed-travel-custody.py
      - name: Upload deployed travel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4d2-deployed-travel-${{ github.run_id }}
          path: wnba-r1a4d2-deployed-travel-evidence.json
          if-no-files-found: error
          retention-days: 90
