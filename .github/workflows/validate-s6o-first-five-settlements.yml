# Phase 5C-4 focused validation
name: Validate S6O First Five Settlements

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-s6o-first-five-settlements-certification.ts'
      - 'server/mlb-s6o-first-five-settlements-certification.test.ts'
      - 'server/mlb-s6m-statistical-milestones.ts'
      - 'server/mlb-s6n-first-real-settlement-monitor.ts'
      - 'server/s5b-staging-entry.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.s6o-first-five-settlements.json'
      - 'tsconfig.s5b-shadow.json'
      - 'package.json'
      - 'package-lock.json'
      - 'docs/S6O_PHASE5C4_FIRST_FIVE_SETTLEMENTS.md'
      - '.github/workflows/validate-s6o-first-five-settlements.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-s6o:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused Phase 5C-4 tests
        run: npm run test:s6o-first-five-settlements
      - name: Type-check Phase 5C-4 surface
        run: npm run typecheck:s6o-first-five-settlements
      - name: Type-check complete shadow surface
        run: npm run typecheck:s5b-shadow
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify certification and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ARMED_AND_WAITING_FOR_5' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'OBSERVING_FIVE_RESULT_STABILITY' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'FIRST_FIVE_SETTLEMENTS_CERTIFIED' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'ACTION_REQUIRED' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'TECHNICAL_REPETITION_CHECK_ONLY_TOO_SMALL_FOR_MODEL_CONCLUSIONS' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'certificateStableAcrossRuns: true' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'realFinancialExposure: 0' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'automaticBetPlacement: false' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'historicalLedgerMutation: false' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'conclusionsAllowed: false' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q 'automaticModelChangesAllowed: false' server/mlb-s6o-first-five-settlements-certification.ts
          grep -q '/health/s6o-first-five-settlements' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6o-first-five-settlements/status' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6o-first-five-settlements/evidence' server/s5b-staging-entry.ts
