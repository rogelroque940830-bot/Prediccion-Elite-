name: Smoke deployed MLB injury shadow mode

on:
  push:
    branches:
      - test/smoke-mlb-injury-shadow-2026-07-27
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Railway and verify shadow mode without ledger mutation
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: e6700f0b0895c0ecc8cc4771fdab1c73fc8826d6
          GAME_PK: '822868'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/ledger-before.json
          echo 'LEDGER BEFORE'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/ledger-before.json

          served=''
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json; then
              served=$(jq -r '.commit // ""' /tmp/health.json)
              echo "Attempt $attempt: served commit $served"
              if [ "$served" = "$EXPECTED_COMMIT" ]; then
                break
              fi
            else
              echo "Attempt $attempt: Railway temporarily unavailable during deploy"
            fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/all?date=2026-07-27" > /tmp/mlb.json
          jq --argjson gamePk "$GAME_PK" '.games[] | select((.gamePk // .gameId) == $gamePk) | {
            gamePk:(.gamePk // .gameId),
            home:.homeTeam.name,
            away:.awayTeam.name,
            homeInjuries:(.homeInjuries|length),
            awayInjuries:(.awayInjuries|length),
            homeShadow:.homeInjuryData.shadowSummary,
            awayShadow:.awayInjuryData.shadowSummary,
            homeAutoApply:.homeInjuryData.autoApplyAllowed,
            awayAutoApply:.awayInjuryData.autoApplyAllowed
          }' /tmp/mlb.json
          jq -e --argjson gamePk "$GAME_PK" '
            .games[] | select((.gamePk // .gameId) == $gamePk)
            | .homeInjuryData.shadowMode == true
              and .awayInjuryData.shadowMode == true
              and .homeInjuryData.autoApplyAllowed == false
              and .awayInjuryData.autoApplyAllowed == false
              and .homeInjuryData.shadowSummary.mode == "SHADOW"
              and .awayInjuryData.shadowSummary.mode == "SHADOW"
              and (.homeInjuries | all(.shadow.shadowOnly == true))
              and (.awayInjuries | all(.shadow.shadowOnly == true))
          ' /tmp/mlb.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/ledger-after.json
          echo 'LEDGER AFTER'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/ledger-after.json
          jq -e --slurpfile before /tmp/ledger-before.json '
            .success == true
            and .data.immutable == true
            and .data.predictions == $before[0].data.predictions
            and .data.settlementEvents >= $before[0].data.settlementEvents
          ' /tmp/ledger-after.json >/dev/null
