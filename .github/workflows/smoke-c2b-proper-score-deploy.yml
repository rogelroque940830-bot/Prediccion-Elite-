name: Smoke deployed C2B proper-score fix

on:
  push:
    branches:
      - test/smoke-c2b-proper-score-deploy
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify corrected C2B/C2C metrics and ledger integrity
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 09c0e326c85bded63574bfa64a1999b896d8fd2b
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/before.json
          for attempt in $(seq 1 48); do
            curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-outcomes?limit=10000" > /tmp/outcomes.json
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/injury-decisions?limit=10000" > /tmp/decisions.json
          echo 'C2B CORRECTED SUMMARY'
          jq '.data.summary | {settled,pending,wins,losses,roiPct,brierScore,logLoss}' /tmp/outcomes.json
          echo 'C2C GLOBAL'
          jq '.data.global | {verdict,sampleStatus,confidence,metrics}' /tmp/decisions.json

          jq -e '
            .success == true
            and .data.summary.settled == 3
            and .data.summary.wins == 3
            and .data.summary.losses == 0
            and (.data.summary.brierScore >= 0 and .data.summary.brierScore <= 1)
            and (.data.summary.logLoss >= 0)
            and ((.data.summary.brierScore - 0.108504) | fabs < 0.00001)
            and ((.data.summary.logLoss - 0.399459) | fabs < 0.00001)
          ' /tmp/outcomes.json >/dev/null

          jq -e '
            .success == true
            and .data.global.verdict == "MANTENER"
            and .data.global.sampleStatus == "INSUFFICIENT"
            and (.data.global.metrics.brierScore >= 0 and .data.global.metrics.brierScore <= 1)
            and (.data.global.metrics.logLoss >= 0)
          ' /tmp/decisions.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/after.json
          jq -e --slurpfile before /tmp/before.json '
            .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
            and .data.immutable == true
          ' /tmp/after.json >/dev/null
