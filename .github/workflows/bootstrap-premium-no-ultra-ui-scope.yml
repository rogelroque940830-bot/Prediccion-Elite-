name: Repair PREMIUM No ULTRA UI Successor Scope

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/bootstrap-premium-no-ultra-ui-scope.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact successor and repair packages to real guardians
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bootstrap = '.github/workflows/bootstrap-premium-no-ultra-ui-scope.yml'
          guardians = [
              '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml',
              '.github/workflows/validate-p1-m3c1-json-transport.yml',
              '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml',
              '.github/workflows/validate-p1-m3e-operating-envelope-ui.yml',
              '.github/workflows/validate-p1-m4c-frontend-economic-card.yml',
              '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml',
          ]
          ui_successor = [
              '.github/workflows/validate-p1-premium-no-ultra-prospective-ui.yml',
              'docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_UI.md',
              'frontend/client/src/components/mlb-premium-no-ultra-card.tsx',
              'frontend/client/src/lib/mlb-premium-no-ultra-prospective.test.ts',
              'frontend/client/src/lib/mlb-premium-no-ultra-prospective.ts',
              'frontend/client/src/pages/mlb-economic-review-activated.tsx',
          ]
          compatibility = guardians
          repair_package = [bootstrap, *guardians]
          marker = '# PREMIUM_NO_ULTRA_UI_SUCCESSOR_PACKAGES_V1'

          def package_block(name, items):
              lines = [f"          {name}=$(printf '%s\\n' \\"]
              for index, item in enumerate(items):
                  suffix = ' \\' if index < len(items) - 1 else ' | sort)'
                  lines.append(f"            '{item}'{suffix}")
              return '\n'.join(lines)

          block = '\n'.join([
              f'          {marker}',
              package_block('premium_no_ultra_ui_successor', ui_successor),
              '',
              package_block('premium_no_ultra_ui_compatibility', compatibility),
              '',
              package_block('premium_no_ultra_ui_repair', repair_package),
              '',
              '          if [[ "$changed" == "$premium_no_ultra_ui_successor" \\',
              '             || "$changed" == "$premium_no_ultra_ui_compatibility" \\',
              '             || "$changed" == "$premium_no_ultra_ui_repair" ]]; then',
              '            exit 0',
              '          fi',
              '',
          ])

          for filename in guardians:
              path = Path(filename)
              if not path.exists():
                  raise RuntimeError(f'{filename}: guardian does not exist')
              text = path.read_text()
              if marker in text:
                  raise RuntimeError(f'{filename}: successor package marker already present')
              needle = '          changed=$(git diff --name-only'
              start = text.rfind(needle)
              if start < 0:
                  raise RuntimeError(f'{filename}: final changed-set marker not found')
              line_end = text.find('\n', start)
              if line_end < 0:
                  raise RuntimeError(f'{filename}: changed-set line is unterminated')
              text = text[:line_end + 1] + '\n' + block + text[line_end + 1:]
              path.write_text(text)
          PY

          rm -f .github/workflows/bootstrap-premium-no-ultra-ui-scope.yml
          git diff --check
          current=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/bootstrap-premium-no-ultra-ui-scope.yml' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope-ui.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml' | sort)
          [[ "$current" == "$expected" ]]
      - name: Commit repaired guardian package and remove broken bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'ci: repair exact PREMIUM no ULTRA UI successor scopes'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
