name: Validate P1-M5A Real Cohort Activation UI

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/client/src/lib/mlb-real-cohort-activation.ts'
      - '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml'

permissions:
  contents: write

jobs:
  apply-typescript-narrowing-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add explicit non-null activation guard once
        shell: bash
        run: |
          set -euo pipefail
          file='frontend/client/src/lib/mlb-real-cohort-activation.ts'
          if grep -Fq 'if (!activation) throw new Error("P1_M5A_INVALID_ACTIVATION:object")' "$file"; then
            echo 'P1-M5A activation guard already applied.'
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          path = Path('frontend/client/src/lib/mlb-real-cohort-activation.ts')
          source = path.read_text()
          old = '''  const fail = (message: string): never => {
    throw new Error(`P1_M5A_INVALID_ACTIVATION:${message}`);
  };

  if (activation?.schemaVersion !== MLB_P1_M5A_SCHEMA) fail("schema");
'''
          new = '''  const fail = (message: string): never => {
    throw new Error(`P1_M5A_INVALID_ACTIVATION:${message}`);
  };

  if (!activation) throw new Error("P1_M5A_INVALID_ACTIVATION:object");
  if (activation.schemaVersion !== MLB_P1_M5A_SCHEMA) fail("schema");
'''
          if source.count(old) != 1:
              raise SystemExit(f'activation guard anchor count={source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          [[ "$(git diff --name-only)" == "$file" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git commit -m 'P1-M5A: narrow validated activation object'
          git push origin HEAD:${GITHUB_HEAD_REF}
