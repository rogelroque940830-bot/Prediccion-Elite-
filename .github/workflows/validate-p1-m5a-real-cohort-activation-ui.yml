name: Validate P1-M5A Real Cohort Activation UI

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/client/src/App.tsx'
      - 'frontend/client/src/components/mlb-real-cohort-activation-card.tsx'
      - 'frontend/client/src/lib/mlb-real-cohort-activation.ts'
      - 'frontend/client/src/lib/mlb-real-cohort-activation.test.ts'
      - 'frontend/client/src/pages/mlb-economic-review-activated.tsx'
      - 'docs/P1_M5A_REAL_COHORT_ACTIVATION_UI.md'
      - '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml'
      - '.github/workflows/validate-p1-m3c1-json-transport.yml'
      - '.github/workflows/validate-p1-m4c-frontend-economic-card.yml'
      - '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml'
      - '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml'

permissions:
  contents: read

jobs:
  validate-p1-m5a-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies reproducibly
        run: npm --prefix frontend ci
      - name: Run P1-M5A and inherited MLB tests
        run: |
          cd frontend
          npx tsx --test \
            client/src/lib/mlb-real-cohort-activation.test.ts \
            client/src/lib/mlb-interactive-economic-review.test.ts \
            client/src/lib/mlb-economic-decision.test.ts \
            client/src/lib/mlb-scientific-capture-transport.test.ts \
            client/src/lib/mlb-scientific-capture.test.ts \
            client/src/lib/mlb-pregame-readiness.test.ts \
            client/src/lib/mlb-daily-flow.test.ts \
            client/src/lib/mlb-daily-slate.test.ts \
            client/src/lib/mlb-review-priority.test.ts
      - name: Run production-equivalent frontend verification
        env:
          COURTEDGE_STANDALONE_DOCKER_BUILD: 'true'
        run: npm --prefix frontend run verify
      - name: Verify activation contract, display and safety
        shell: bash
        run: |
          set -euo pipefail
          app='frontend/client/src/App.tsx'
          helper='frontend/client/src/lib/mlb-real-cohort-activation.ts'
          testfile='frontend/client/src/lib/mlb-real-cohort-activation.test.ts'
          card='frontend/client/src/components/mlb-real-cohort-activation-card.tsx'
          wrapper='frontend/client/src/pages/mlb-economic-review-activated.tsx'
          docs='docs/P1_M5A_REAL_COHORT_ACTIVATION_UI.md'

          grep -F 'p1-m5a-real-cohort-activation-ui-2026-08-06' "$helper"
          grep -F 'MLB_P1_M5A_FRONTEND_RELEASE' "$app"
          grep -F 'MLB_P1_M3D_B_FRONTEND_RELEASE' "$app"
          grep -F 'MlbEconomicReviewActivated' "$app"
          grep -F 'courtedge-p1-m5a-real-cohort-activation.v1' "$helper"
          grep -F 'state_certified_mismatch' "$helper"
          grep -F 'certified_checklist' "$helper"
          grep -F 'synthetic_capture' "$helper"
          grep -F 'Activación de la cohorte interactiva real' "$card"
          grep -F 'Cohorte real certificada de extremo a extremo' "$card"
          grep -F 'Esperando primera predicción real' "$card"
          grep -F 'Decisión económica registrada' "$card"
          grep -F 'Certificación bloqueada por integridad' "$card"
          grep -F 'SHADOW · exposición 0' "$card"
          grep -F 'parseMlbP1M5aActivation(raw)' "$wrapper"
          grep -F 'P1_M5A_ACTIVATION_SETTLEMENT_COUNT_DRIFT' "$wrapper"
          grep -F '<MlbEconomicReview />' "$wrapper"
          grep -F 'browser does not recompute' "$docs"
          grep -F 'rejects exposure, sportsbook, writes and synthetic captures' "$testfile"

          node <<'NODE'
          const fs = require('node:fs');
          const helper = fs.readFileSync('frontend/client/src/lib/mlb-real-cohort-activation.ts', 'utf8');
          const card = fs.readFileSync('frontend/client/src/components/mlb-real-cohort-activation-card.tsx', 'utf8');
          const wrapper = fs.readFileSync('frontend/client/src/pages/mlb-economic-review-activated.tsx', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(helper.includes('profitabilityConclusionAllowed !== false'), 'profitability conclusion is not rejected');
          assert(helper.includes('safety?.realFinancialExposure !== 0'), 'nonzero exposure is not rejected');
          assert(helper.includes('safety?.syntheticCaptureCreation !== false'), 'synthetic capture is not rejected');
          assert(helper.includes('checklist?.sameDecisionEndToEndObserved !== true'), 'same-decision certificate is not required');
          assert(wrapper.includes('["p1-m3d-interactive-economic-review"]'), 'wrapper does not share the P1-M3D query cache');
          assert(!/\bfetch\s*\(|\bapiRequest\s*\(/.test(card), 'activation card performs a network side effect');
          assert(!/POST|PUT|PATCH|DELETE/.test(card + wrapper), 'activation UI contains a write method');
          assert(!/automaticBetPlacement:\s*true|realFinancialExposure:\s*[1-9]|syntheticCaptureCreation:\s*true/.test(helper + card + wrapper), 'unsafe activation UI setting');
          NODE

          cat frontend/dist/assets/*.js > /tmp/p1-m5a-ui-bundle.js
          grep -F 'p1-m5a-real-cohort-activation-ui-2026-08-06' /tmp/p1-m5a-ui-bundle.js
          grep -F 'Activación de la cohorte interactiva real' /tmp/p1-m5a-ui-bundle.js
          grep -F 'Cohorte real certificada de extremo a extremo' /tmp/p1-m5a-ui-bundle.js
          grep -F 'Esperando primera predicción real' /tmp/p1-m5a-ui-bundle.js
          grep -F 'Certificación bloqueada por integridad' /tmp/p1-m5a-ui-bundle.js
          grep -F 'SHADOW · exposición 0' /tmp/p1-m5a-ui-bundle.js
      - name: Diff hygiene and exact scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-frontend-session --depth=1
          git diff --check origin/integration/p0-frontend-session...HEAD
          changed=$(git diff --name-only origin/integration/p0-frontend-session...HEAD | sort)

          # PREMIUM_NO_ULTRA_UI_SUCCESSOR_PACKAGES_V1
          premium_no_ultra_ui_successor=$(printf '%s\n' \
            '.github/workflows/validate-p1-premium-no-ultra-prospective-ui.yml' \
            'docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_UI.md' \
            'frontend/client/src/components/mlb-premium-no-ultra-card.tsx' \
            'frontend/client/src/lib/mlb-premium-no-ultra-prospective.test.ts' \
            'frontend/client/src/lib/mlb-premium-no-ultra-prospective.ts' \
            'frontend/client/src/pages/mlb-economic-review-activated.tsx' | sort)
          premium_no_ultra_ui_compatibility=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope-ui.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml' | sort)
          premium_no_ultra_ui_repair=$(printf '%s\n' \
            '.github/workflows/bootstrap-premium-no-ultra-ui-scope.yml' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope-ui.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml' | sort)
          if [[ "$changed" == "$premium_no_ultra_ui_successor" \
             || "$changed" == "$premium_no_ultra_ui_compatibility" \
             || "$changed" == "$premium_no_ultra_ui_repair" ]]; then
            exit 0
          fi

          ci_infra=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml' | sort)
          m3e_ui_successor=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3e-operating-envelope-ui.yml' \
            'docs/P1_M3E_MLB_OPERATING_ENVELOPE_UI.md' \
            'frontend/client/src/components/mlb-operating-envelope-card.tsx' \
            'frontend/client/src/lib/mlb-operating-envelope.test.ts' \
            'frontend/client/src/lib/mlb-operating-envelope.ts' \
            'frontend/client/src/pages/mlb-economic-review-activated.tsx' | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation-ui.yml' \
            'docs/P1_M5A_REAL_COHORT_ACTIVATION_UI.md' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/mlb-real-cohort-activation-card.tsx' \
            'frontend/client/src/lib/mlb-real-cohort-activation.test.ts' \
            'frontend/client/src/lib/mlb-real-cohort-activation.ts' \
            'frontend/client/src/pages/mlb-economic-review-activated.tsx' | sort)
          if [[ "$changed" != "$ci_infra" && "$changed" != "$m3e_ui_successor" && "$changed" != "$expected" ]]; then
            echo 'P1-M5A UI scope rejected.' >&2
            printf 'Changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
