name: P0 Step 12V68 Capture Reliability Repair V1

on:
  push:
    branches:
      - research/mlb-v68-capture-reliability-repair-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile repaired capture surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/p0-step12v68-prospective-source.py \
            scripts/p0-step12v68-prospective-ledger.py \
            scripts/p0-step12v68-fg-winner-prospective-capture.py \
            scripts/p0-step12v68-capture-supervisor.py

      - name: Execute synthetic dense-poll supervisor tests
        run: python scripts/p0-step12v68-capture-supervisor.test.py

      - name: Prove scientific boundary stayed frozen
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          parent=json.load(open('research/p0-step12v68-fg-winner-prospective-confirmation-contract.json'))
          manifest=json.load(open('research/p0-step12v68-prospective-source-manifests.json'))
          repair=json.load(open('research/p0-step12v68-capture-reliability-repair-v1.json'))
          workflow=open('.github/workflows/p0-step12v68-capture-prospective-games.yml').read()
          supervisor=open('scripts/p0-step12v68-capture-supervisor.py').read()

          assert parent['prospectiveCohort']['captureMustOccurBeforeGameStart'] is True
          assert parent['prospectiveCohort']['requiresExactPregameLineupSemantics'] is True
          assert parent['prospectiveCohort']['requiresExactPregameProbableStarterSemantics'] is True
          assert parent['prospectiveCohort']['wholeOfficialDateMustUsePriorDateStateOnly'] is True
          assert parent['outcomeEmbargo']['interimOutcomePeekingAllowed'] is False

          op=manifest['operationalProspectiveCapture']
          assert op['captureWindowMaximumMinutesBeforeScheduledStart']==20
          assert op['requiresExactNineByNineCurrentLineups'] is True
          assert op['requiresBothCurrentPregameProbablePitchers'] is True
          assert op['outcomesOrMarketPricesInPregameLedgerAllowed'] is False

          boundary=repair['scientificBoundary']
          dense=repair['operationalRepair']
          assert repair['outcomesReadForRepairDesign'] is False
          assert repair['marketPricesReadForRepairDesign'] is False
          assert repair['parentScientificContractChanged'] is False
          assert boundary['captureEligibilityWindowMaximumMinutesBeforeScheduledStart']==20
          assert dense['cronCadenceMinutes']==5
          assert dense['pollAttemptsPerRun']==6
          assert dense['pollIntervalSeconds']==45
          assert dense['preflightUpcomingGameHorizonMinutes']==45

          assert "cron: '*/5 * * * *'" in workflow
          assert '--max-lead-minutes 20' in workflow
          assert '--attempts 6' in workflow
          assert '--interval-seconds 45' in workflow
          assert 'V68_SUPERVISOR_CAPTURE_WINDOW_WIDENING_FORBIDDEN' in supervisor
          assert 'args.max_lead_minutes <= 20' in supervisor
          assert '"outcomesRead": False' in supervisor
          assert '"marketPricesRead": False' in supervisor
          assert 'readiness_diagnostics' in supervisor
          print('V68_CAPTURE_RELIABILITY_REPAIR_SCIENTIFIC_BOUNDARY_INTACT')
          PY
