name: NFL R5 Leakage-Safe Historical Experiment

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/**'
      - '.github/workflows/nfl-r5-leakage-safe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-r5:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NFL-R5 research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow scikit-learn requests

      - name: Validate research scripts
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5_postcheck.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5b_certify.py
          python -m py_compile research/nfl/nfl_r5c_personnel_availability.py
          python -m py_compile research/nfl/nfl_r5c_run.py
          python -m py_compile research/nfl/nfl_r5c2_personnel_shocks.py

      - name: Run leakage-safe walk-forward experiment
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5-output \
            --cache-dir .cache/nflverse

      - name: Run cumulative significance and stability post-check
        run: |
          python research/nfl/nfl_r5_postcheck.py --out-dir nfl-r5-output

      - name: Run NFL-R5B QB identity and availability experiment
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5b-output \
            --cache-dir .cache/nflverse

      - name: Run gated NFL-R5B hybrid experiment
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output \
            --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 \
            --end-season 2025

      - name: Certify NFL-R5B2 stability
        run: |
          python research/nfl/nfl_r5b_certify.py \
            --hybrid-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5b-cert-output \
            --test-start 2018 \
            --end-season 2025

      - name: Run NFL-R5C personnel availability experiment
        run: |
          python research/nfl/nfl_r5c_run.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5c-output \
            --cache-dir .cache/nflverse \
            --start-season 2012 \
            --end-season 2024 \
            --test-start 2018

      - name: Run NFL-R5C2 high-confidence personnel shock experiment
        run: |
          python research/nfl/nfl_r5c2_personnel_shocks.py \
            --input-dir nfl-r5c-output \
            --out-dir nfl-r5c2-output \
            --cache-dir .cache/nflverse \
            --start-season 2012 \
            --end-season 2024 \
            --test-start 2018

      - name: Enforce market-free research boundary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('nfl-r5-output/nfl_r5_manifest.json'))
          a=json.load(open('nfl-r5-output/nfl_r5_audit.json'))
          b=json.load(open('nfl-r5b-output/nfl_r5b_manifest.json'))
          ba=json.load(open('nfl-r5b-output/nfl_r5b_audit.json'))
          c=json.load(open('nfl-r5b-cert-output/nfl_r5b_cert_verdict.json'))
          d=json.load(open('nfl-r5c-output/nfl_r5c_manifest.json'))
          da=json.load(open('nfl-r5c-output/nfl_r5c_audit.json'))
          e=json.load(open('nfl-r5c2-output/nfl_r5c2_manifest.json'))
          ea=json.load(open('nfl-r5c2-output/nfl_r5c2_audit.json'))
          assert p['researchOnly'] is True
          assert p['marketDataUsedAsFeatures'] is False
          assert p['marketOptimizationPerformed'] is False
          assert p['B4_QB']['targetActualStarterUsedAsFeature'] is False
          assert a['marketLeakageCheck'] == 'PASS'
          assert a['sameGameFeatureLeakageCheck'] == 'PASS_BY_CONSTRUCTION'
          assert a['targetActualQBFeatureCheck'] == 'PASS_NOT_USED'
          assert a['validation'] == 'NESTED_EXPANDING_SEASON_WALK_FORWARD'
          assert b['researchOnly'] is True
          assert b['marketDataUsedAsFeatures'] is False
          assert b['targetActualStarterUsedAsFeature'] is False
          assert ba['marketLeakageCheck'] == 'PASS'
          assert ba['targetActualQBFeatureCheck'] == 'PASS_NOT_USED'
          assert ba['sameWeekUntimestampedDepth'] == 'FORBIDDEN'
          assert ba['injuryTimestampFilter'] == 'STRICT_LT_CUTOFF'
          assert c['researchOnly'] is True
          assert c['modelChangedDuringCertification'] is False
          assert d['researchOnly'] is True
          assert d['marketDataUsedAsFeatures'] is False
          assert d['targetGameSnapUsedAsFeature'] is False
          assert d['qbExcludedFromR5C'] is True
          assert da['marketLeakageCheck'] == 'PASS'
          assert da['sameGameSnapLeakageCheck'] == 'PASS_BY_CONSTRUCTION'
          assert da['gamedayReattachmentCheck'] == 'GAME_ID_ONLY_FROM_BASE_SCHEDULE'
          assert da['2025MissingInjuryHandled'] == 'EXCLUDED_FROM_PRIMARY_R5C_EVALUATION'
          assert e['researchOnly'] is True
          assert e['marketDataUsedAsFeatures'] is False
          assert e['targetGameSnapUsedAsFeature'] is False
          assert e['thresholdTunedOnTest'] is False
          assert ea['marketLeakageCheck'] == 'PASS'
          assert ea['sameGameSnapLeakageCheck'] == 'PASS_BY_CONSTRUCTION'
          assert ea['postHocThresholdSelection'] == 'NONE'
          print('NFL_R5_RESEARCH_BOUNDARY_VERIFIED')
          PY

      - name: Show model ladder and personnel results
        run: |
          cat nfl-r5-output/nfl_r5_model_summary.csv
          echo
          cat nfl-r5b-hybrid-output/nfl_r5b_hybrid_summary.csv
          echo
          cat nfl-r5b-cert-output/nfl_r5b_cert_verdict.json
          echo
          cat nfl-r5c-output/nfl_r5c_model_summary.csv
          echo
          cat nfl-r5c-output/nfl_r5c_bootstrap.csv
          echo
          cat nfl-r5c2-output/nfl_r5c2_model_summary.csv
          echo
          cat nfl-r5c2-output/nfl_r5c2_bootstrap.csv
          echo
          cat nfl-r5c2-output/nfl_r5c2_subsets.csv
          echo
          cat nfl-r5c2-output/nfl_r5c2_week_bands.csv

      - name: Upload NFL-R5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5-leakage-safe-evidence
          path: nfl-r5-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload NFL-R5B evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5b-qb-identity-availability-evidence
          path: nfl-r5b-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload NFL-R5B hybrid evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5b-gated-hybrid-evidence
          path: nfl-r5b-hybrid-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload NFL-R5B certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5b-final-certification-evidence
          path: nfl-r5b-cert-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload NFL-R5C personnel evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5c-personnel-availability-evidence
          path: nfl-r5c-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload NFL-R5C2 personnel shock evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5c2-personnel-shock-evidence
          path: nfl-r5c2-output/
          if-no-files-found: error
          retention-days: 30
