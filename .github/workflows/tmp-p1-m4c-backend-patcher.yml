name: Temporary P1-M4C Backend Patcher

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/scripts/tmp_p1_m4c_backend_patch.py'
      - '.github/workflows/tmp-p1-m4c-backend-patcher.yml'
      - 'docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/p1-m4c-backend-economic-response'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic backend patch
        run: python .github/scripts/tmp_p1_m4c_backend_patch.py
      - name: Verify patch scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            'server/mlb-p1-scientific-capture-service.test.ts' \
            'server/mlb-p1-scientific-capture-service.ts' | sort)
          [[ "$changed" == "$expected" ]]
          grep -F 'attachMlbP1M4bEconomicDecision' server/mlb-p1-scientific-capture-service.ts
          grep -F 'economicDecision: MlbP1M4bAdapterResult' server/mlb-p1-scientific-capture-service.ts
          grep -F 'layers[MLB_P1_M4B_LAYER_KEY]' server/mlb-p1-scientific-capture-service.test.ts
      - name: Commit patched product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-p1-scientific-capture-service.ts server/mlb-p1-scientific-capture-service.test.ts
          git commit -m 'P1-M4C: return economic decision from scientific capture'
          git push origin HEAD:${GITHUB_HEAD_REF}
