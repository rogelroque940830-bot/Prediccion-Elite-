name: Diagnostic P1-M3B Live Backend

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/diagnostic-p1-m3b-live-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-p1-m3b-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: ed475eea25e302ce76d658a3a4b049e817bf898a
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact P1-M3B backend release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            ledger_code=$(curl -sS -o audit/ledger.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            capture_code=$(curl -sS -o audit/anonymous-capture.json -w '%{http_code}' --max-time 25 \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "${BACKEND_URL}/api/mlb/p1/v1/scientific-captures" || true)

            echo "Attempt ${attempt}/100: health=${health_code} ledger=${ledger_code} anonymousCapture=${capture_code}"

            if [[ "${health_code}" == "200" && "${ledger_code}" == "200" && "${capture_code}" == "401" ]]; then
              if EXPECTED_BACKEND_COMMIT="${EXPECTED_BACKEND_COMMIT}" node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(name, 'utf8'));
          const health = read('audit/health.json');
          const ledger = read('audit/ledger.json');
          const capture = read('audit/anonymous-capture.json');
          const expected = String(process.env.EXPECTED_BACKEND_COMMIT || '').trim();
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(health.status === 'healthy', `health=${health.status}`);
          assert(health.commit === expected, `deployed commit=${health.commit}; expected=${expected}`);
          assert(health.environment === 'p0-integration', `environment=${health.environment}`);
          assert(ledger.success === true, 'ledger success=false');
          assert(ledger.data?.schemaVersion === 'mlb-ledger.v1', `ledger schema=${ledger.data?.schemaVersion}`);
          assert(ledger.data?.immutable === true, 'ledger immutable=false');
          assert(capture.success === false, 'anonymous capture unexpectedly succeeded');
          assert(/Authentication required/i.test(String(capture.error || '')), `capture error=${capture.error}`);

          console.log(JSON.stringify({
            backendCommit: health.commit,
            environment: health.environment,
            endpoint: '/api/mlb/p1/v1/scientific-captures',
            anonymousPostStatus: 401,
            anonymousWriteProtected: true,
            ledger: {
              schemaVersion: ledger.data.schemaVersion,
              immutable: ledger.data.immutable,
              predictions: ledger.data.predictions,
              settlementEvents: ledger.data.settlementEvents,
            },
            syntheticCapturesCreated: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
          }, null, 2));
          NODE
              then
                exit 0
              fi
            fi

            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact P1-M3B backend deployment' >&2
              for file in health ledger anonymous-capture; do
                echo "--- ${file}"
                cat "audit/${file}.json" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 10
          done
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m3b-live-backend-evidence
          path: audit
          if-no-files-found: warn
