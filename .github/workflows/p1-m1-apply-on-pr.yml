name: Bootstrap P1 M1 Daily Flow On PR

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/scripts/apply-p1-m1-daily-flow.cjs'
      - 'frontend/client/src/lib/mlb-daily-flow.ts'
      - 'frontend/client/src/lib/mlb-daily-flow.test.ts'
      - '.github/workflows/p1-m1-apply-on-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply idempotent P1-M1 patch
        run: node frontend/scripts/apply-p1-m1-daily-flow.cjs
      - name: Commit integration when needed
        run: |
          git diff --check
          if git diff --quiet; then
            echo 'No integration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'feat(p1): integrate daily MLB preparation flow'
          git push origin HEAD:${{ github.head_ref }}
