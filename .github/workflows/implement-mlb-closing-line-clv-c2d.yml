name: Implement MLB closing-line CLV C2D

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Integrate C2D modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # server/mlb-ledger.ts
          replace_once(
              "server/mlb-ledger.ts",
              'import { runMlbAutoSettlement } from "./mlb-settlement-worker";\n',
              'import { runMlbAutoSettlement } from "./mlb-settlement-worker";\n'
              'import { MlbClosingLineStore } from "./mlb-closing-line-store";\n'
              'import { buildMlbClosingLineReport, enrichRecordsForMlbReports } from "./mlb-closing-line-report";\n'
              'import { runMlbClosingLineCapture } from "./mlb-closing-line-worker";\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              'let singletonStore: MlbLedgerStore | null = null;\n\nexport function getMlbLedgerStore(): MlbLedgerStore {\n  if (!singletonStore) singletonStore = new MlbLedgerStore();\n  return singletonStore;\n}\n',
              'let singletonStore: MlbLedgerStore | null = null;\n'
              'let singletonClosingStore: MlbClosingLineStore | null = null;\n\n'
              'export function getMlbLedgerStore(): MlbLedgerStore {\n'
              '  if (!singletonStore) singletonStore = new MlbLedgerStore();\n'
              '  return singletonStore;\n'
              '}\n\n'
              'export function getMlbClosingLineStore(): MlbClosingLineStore {\n'
              '  if (!singletonClosingStore) singletonClosingStore = new MlbClosingLineStore();\n'
              '  return singletonClosingStore;\n'
              '}\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              'export function registerMlbLedgerRoutes(app: Express): void {\n  const store = getMlbLedgerStore();\n\n  app.get("/api/mlb/ledger/v1/status", (_req, res) => {\n    res.json({ success: true, data: store.status() });\n  });\n',
              'export function registerMlbLedgerRoutes(app: Express): void {\n'
              '  const store = getMlbLedgerStore();\n'
              '  const closingStore = getMlbClosingLineStore();\n\n'
              '  app.get("/api/mlb/ledger/v1/status", (_req, res) => {\n'
              '    res.json({ success: true, data: { ...store.status(), closingLines: closingStore.status() } });\n'
              '  });\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '      const data = await runMlbAutoSettlement(store);\n',
              '      const data = await runMlbAutoSettlement(store, closingStore);\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '  app.post("/api/mlb/ledger/v1/predictions", (req, res) => {\n',
              '  app.post("/api/mlb/ledger/v1/capture-closing-lines", async (_req, res) => {\n'
              '    try {\n'
              '      const data = await runMlbClosingLineCapture(store, closingStore);\n'
              '      res.json({ success: true, data });\n'
              '    } catch (error: any) {\n'
              '      res.status(error?.status || 500).json({ success: false, error: error?.message || "Unable to capture MLB closing lines" });\n'
              '    }\n'
              '  });\n\n'
              '  app.get("/api/mlb/ledger/v1/closing-lines", (req, res) => {\n'
              '    try {\n'
              '      const filters = queryFilters(req.query as Record<string, unknown>);\n'
              '      const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n'
              '      res.json({ success: true, data: buildMlbClosingLineReport(records, closingStore) });\n'
              '    } catch (error: any) {\n'
              '      res.status(error?.status || 500).json({ success: false, error: error?.message || "Unable to build MLB closing-line report" });\n'
              '    }\n'
              '  });\n\n'
              '  app.post("/api/mlb/ledger/v1/predictions", (req, res) => {\n',
          )
          # Enrich read-only report routes. C2A remains based only on injury evidence.
          replace_once(
              "server/mlb-ledger.ts",
              '      const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n      res.json({ success: true, data: buildMlbLedgerHistoryView(records) });\n',
              '      const records = enrichRecordsForMlbReports(\n'
              '        store.listRecords({ ...filters, limit: filters.limit ?? 10_000 }),\n'
              '        closingStore,\n'
              '      );\n'
              '      res.json({ success: true, data: buildMlbLedgerHistoryView(records) });\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '      const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n      res.json({ success: true, data: buildMlbInjuryOutcomesReport(records) });\n',
              '      const records = enrichRecordsForMlbReports(\n'
              '        store.listRecords({ ...filters, limit: filters.limit ?? 10_000 }),\n'
              '        closingStore,\n'
              '      );\n'
              '      res.json({ success: true, data: buildMlbInjuryOutcomesReport(records) });\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '      const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n      res.json({ success: true, data: buildMlbInjuryDecisionReport(records) });\n',
              '      const records = enrichRecordsForMlbReports(\n'
              '        store.listRecords({ ...filters, limit: filters.limit ?? 10_000 }),\n'
              '        closingStore,\n'
              '      );\n'
              '      res.json({ success: true, data: buildMlbInjuryDecisionReport(records) });\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '      const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n      const trainPct = optionalNumber(req.query.trainPct) ?? 70;\n',
              '      const records = enrichRecordsForMlbReports(\n'
              '        store.listRecords({ ...filters, limit: filters.limit ?? 10_000 }),\n'
              '        closingStore,\n'
              '      );\n'
              '      const trainPct = optionalNumber(req.query.trainPct) ?? 70;\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              '    const records = store.listRecords({ ...filters, limit: filters.limit ?? 10_000 });\n    const format = optionalText(req.query.format) || "jsonl";\n',
              '    const records = enrichRecordsForMlbReports(\n'
              '      store.listRecords({ ...filters, limit: filters.limit ?? 10_000 }),\n'
              '      closingStore,\n'
              '    );\n'
              '    const format = optionalText(req.query.format) || "jsonl";\n',
          )
          replace_once(
              "server/mlb-ledger.ts",
              'export { buildMlbLedgerHistoryView } from "./mlb-ledger-history-view";\n',
              'export { buildMlbLedgerHistoryView } from "./mlb-ledger-history-view";\n'
              'export { MlbClosingLineStore } from "./mlb-closing-line-store";\n'
              'export { buildMlbClosingLineReport } from "./mlb-closing-line-report";\n',
          )

          # server/index.ts
          replace_once(
              "server/index.ts",
              'import { getMlbLedgerStore, registerMlbLedgerRoutes } from "./mlb-ledger";\nimport { startMlbSettlementWorker } from "./mlb-settlement-worker";\n',
              'import { getMlbClosingLineStore, getMlbLedgerStore, registerMlbLedgerRoutes } from "./mlb-ledger";\n'
              'import { startMlbSettlementWorker } from "./mlb-settlement-worker";\n'
              'import { startMlbClosingLineWorker } from "./mlb-closing-line-worker";\n',
          )
          replace_once(
              "server/index.ts",
              '  // Official MLB results are checked after startup and every 15 minutes.\n  startMlbSettlementWorker(getMlbLedgerStore());\n',
              '  const mlbLedgerStore = getMlbLedgerStore();\n'
              '  const mlbClosingLineStore = getMlbClosingLineStore();\n'
              '  // Pregame closing prices and official results are append-only workers.\n'
              '  startMlbClosingLineWorker(mlbLedgerStore, mlbClosingLineStore);\n'
              '  startMlbSettlementWorker(mlbLedgerStore, mlbClosingLineStore);\n',
          )
          replace_once(
              "server/index.ts",
              '    mlbLedgerAutoSettlement: process.env.MLB_LEDGER_AUTO_SETTLE !== "false",\n',
              '    mlbLedgerAutoSettlement: process.env.MLB_LEDGER_AUTO_SETTLE !== "false",\n'
              '    mlbClosingLineCapture: process.env.MLB_CLOSING_LINE_CAPTURE !== "false",\n',
          )

          # server/mlb-settlement-worker.ts
          replace_once(
              "server/mlb-settlement-worker.ts",
              'import type { LedgerPrediction, MlbLedgerStore } from "./mlb-ledger-store";\n',
              'import type { LedgerPrediction, MlbLedgerStore } from "./mlb-ledger-store";\n'
              'import type { MlbClosingLineStore } from "./mlb-closing-line-store";\n',
          )
          replace_once(
              "server/mlb-settlement-worker.ts",
              'export async function runMlbAutoSettlement(\n  store: MlbLedgerStore,\n): Promise<SettlementRunResult> {\n',
              'export async function runMlbAutoSettlement(\n'
              '  store: MlbLedgerStore,\n'
              '  closingStore?: MlbClosingLineStore,\n'
              '): Promise<SettlementRunResult> {\n',
          )
          replace_once(
              "server/mlb-settlement-worker.ts",
              '      store.appendSettlement(record.prediction.id, {\n        clientRequestId: `auto-settle:${record.prediction.id}:official-v1`,\n        result: graded.result,\n        outcomeValue: graded.outcomeValue,\n        finalScore: { home: game.homeScore, away: game.awayScore },\n        source: "official",\n        notes: `${graded.notes} · MLB gamePk ${game.gamePk}`,\n      });\n',
              '      const closing = closingStore?.latestBeforeCommence(\n'
              '        record.prediction.id,\n'
              '        record.prediction.game.commenceTime,\n'
              '      );\n'
              '      const exactComparableClosing = closing?.matchMode === "EXACT_BOOK" && closing.comparable\n'
              '        ? closing\n'
              '        : null;\n'
              '      store.appendSettlement(record.prediction.id, {\n'
              '        clientRequestId: `auto-settle:${record.prediction.id}:official-v1`,\n'
              '        result: graded.result,\n'
              '        closingOddsAmerican: exactComparableClosing?.oddsAmerican,\n'
              '        closingLine: exactComparableClosing?.line ?? undefined,\n'
              '        outcomeValue: graded.outcomeValue,\n'
              '        finalScore: { home: game.homeScore, away: game.awayScore },\n'
              '        source: "official",\n'
              '        notes: `${graded.notes} · MLB gamePk ${game.gamePk}${exactComparableClosing ? ` · Closing ${exactComparableClosing.bookmakerKey} ${exactComparableClosing.oddsAmerican}` : ""}`,\n'
              '      });\n',
          )
          replace_once(
              "server/mlb-settlement-worker.ts",
              'export function startMlbSettlementWorker(store: MlbLedgerStore): void {\n',
              'export function startMlbSettlementWorker(\n'
              '  store: MlbLedgerStore,\n'
              '  closingStore?: MlbClosingLineStore,\n'
              '): void {\n',
          )
          replace_once(
              "server/mlb-settlement-worker.ts",
              '      const summary = await runMlbAutoSettlement(store);\n',
              '      const summary = await runMlbAutoSettlement(store, closingStore);\n',
          )

          # package.json
          package = json.loads(Path("package.json").read_text())
          tests = [
              "server/mlb-closing-line-store.test.ts",
              "server/mlb-closing-line-worker.test.ts",
              "server/mlb-closing-line-report.test.ts",
          ]
          command = package["scripts"]["test:mlb-ledger"]
          for item in tests:
              if item not in command:
                  command += f" {item}"
          package["scripts"]["test:mlb-ledger"] = command
          Path("package.json").write_text(json.dumps(package, indent=2) + "\n")

          # tsconfig.mlb-ledger.json
          config = json.loads(Path("tsconfig.mlb-ledger.json").read_text())
          additions = [
              "server/mlb-closing-line-store.ts",
              "server/mlb-closing-line-store.test.ts",
              "server/mlb-closing-line-worker.ts",
              "server/mlb-closing-line-worker.test.ts",
              "server/mlb-closing-line-report.ts",
              "server/mlb-closing-line-report.test.ts",
          ]
          for item in additions:
              if item not in config["include"]:
                  config["include"].append(item)
          Path("tsconfig.mlb-ledger.json").write_text(json.dumps(config, indent=2) + "\n")

          # Frontend: import and place C2D before market performance.
          replace_once(
              "frontend/client/src/pages/mlb-history.tsx",
              'import { Button } from "@/components/ui/button";\n',
              'import { Button } from "@/components/ui/button";\n'
              'import { MlbClosingLinePanel } from "@/components/mlb-closing-line-panel";\n',
          )
          replace_once(
              "frontend/client/src/pages/mlb-history.tsx",
              '      {marketStats.length > 0 && (\n',
              '      <MlbClosingLinePanel />\n\n'
              '      {marketStats.length > 0 && (\n',
          )
          PY
      - name: Install backend dependencies
        run: npm ci
      - name: Run MLB tests
        run: npm run test:mlb-ledger
      - name: Typecheck MLB ledger
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add server frontend/client/src package.json tsconfig.mlb-ledger.json
          git commit -m "feat(clv): integrate automatic MLB closing-line capture C2D"
          git push origin HEAD:${{ github.head_ref }}
