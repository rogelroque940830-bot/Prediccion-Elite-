name: Validate P1-M2A MLB Pregame Readiness Contract

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-p1-pregame-readiness-contract.ts'
      - 'server/mlb-p1-pregame-readiness-contract.test.ts'
      - 'tsconfig.p1-m2a-mlb-pregame-readiness.json'
      - 'docs/P1_M2A_MLB_PREGAME_READINESS_CONTRACT.md'
      - '.github/workflows/validate-p1-m2a-mlb-pregame-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-p1-m2a-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused P1-M2A typecheck
        run: npx tsc -p tsconfig.p1-m2a-mlb-pregame-readiness.json
      - name: Run focused P1-M2A tests
        run: npx tsx --test server/mlb-p1-pregame-readiness-contract.test.ts
      - name: Run P1-M1 regression
        run: npx tsx --test server/mlb-p1-daily-slate.test.ts
      - name: Verify route composition remains unchanged
        run: npm run test:s3-modularization
      - name: Build production backend
        run: npm run build:backend
      - name: Verify contract and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'courtedge-p1-m2a-pregame-readiness-contract.v1' server/mlb-p1-pregame-readiness-contract.ts
          grep -F 'READY_FINAL' server/mlb-p1-pregame-readiness-contract.ts
          grep -F 'READY_PROVISIONAL' server/mlb-p1-pregame-readiness-contract.ts
          grep -F 'BLOCKED' server/mlb-p1-pregame-readiness-contract.ts
          grep -F 'NO_SINGLE_PREGAME_READINESS_CONTRACT' server/mlb-p1-pregame-readiness-contract.ts
          grep -F 'AGGREGATE_CACHE_EXCEEDS_DESIRED_FRESHNESS' server/mlb-p1-pregame-readiness-contract.ts
          ! grep -Ei 'app\.(get|post|put|patch|delete)|placeBet|sportsbook.*write|automaticBetPlacement: true|realFinancialExposure: [1-9]|appendSettlement|UPDATE[[:space:]]+[A-Za-z_]|DELETE[[:space:]]+FROM' server/mlb-p1-pregame-readiness-contract*.ts
      - name: Diff hygiene
        run: git diff --check
