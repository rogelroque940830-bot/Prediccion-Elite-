name: Validate P0 V19 Final-Scope Assembler

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-unified-v16-live-input-assembler.ts'
      - 'server/mlb-unified-v16-live-input-assembler.test.ts'
      - '.github/workflows/validate-p0-v19-final-scope-assembler.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate FINAL versus PROVISIONAL evidence boundary
        run: |
          npx tsx --test \
            server/mlb-unified-v16-live-input-assembler.test.ts \
            server/mlb-unified-v16-live-providers.test.ts \
            server/mlb-unified-v16-ui-orchestration.test.ts \
            server/mlb-unified-v16-ui-routes.test.ts
      - name: Preserve preprice and priced runner boundaries
        run: |
          npx tsx --test \
            server/mlb-unified-runner.test.ts \
            server/mlb-unified-priced-v16-runner.test.ts
      - name: Compile assembler surface
        run: npx esbuild server/mlb-unified-v16-live-input-assembler.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-v16-live-input-assembler.cjs
      - name: Backend build
        run: npm run build:backend
      - name: Preserve fail-closed safety boundary
        shell: bash
        run: |
          set -euo pipefail
          file='server/mlb-unified-v16-live-input-assembler.ts'
          grep -F 'loadBullpenWithProvisionalIsolation' "$file"
          grep -F 'blockersTouchAnyFinalGame' "$file"
          grep -F 'finalEligibleGamePks' "$file"
          ! grep -E 'automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]|appendPrediction\(|appendSettlement\(|placeBet\(|wager\(' "$file"
      - name: Verify exact repair slice
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p0-v19-final-scope-assembler.yml' \
            'server/mlb-unified-v16-live-input-assembler.test.ts' \
            'server/mlb-unified-v16-live-input-assembler.ts' | sort)
          [[ "$changed" == "$expected" ]]
