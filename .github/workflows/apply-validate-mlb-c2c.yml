name: Apply and validate MLB C2C

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-decisions-c2c
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply C2C integration patch
        run: |
          python scripts/apply-mlb-c2c.py
          python scripts/fix-mlb-c2c-package.py
      - name: Install backend dependencies
        run: npm ci
      - name: Run MLB regression suite
        run: npm run test:mlb-ledger
      - name: Type-check backend
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify C2C markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'mlb-injury-decision-report.v1' server/mlb-injury-decision-report.ts
          grep -Fq '/api/mlb/ledger/v1/injury-decisions?limit=10000' frontend/client/src/pages/mlb-history.tsx
          grep -Fq 'Veredictos de calibración · Fase C2C' frontend/client/src/pages/mlb-history.tsx
          grep -Fq 'automaticRuleChanges: false' server/mlb-injury-decision-report.ts
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-mlb-c2c.py
          rm -f scripts/fix-mlb-c2c-package.py
          rm -f .github/workflows/apply-validate-mlb-c2c.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement MLB injury calibration verdicts C2C'
          git push origin HEAD:feature/mlb-injury-decisions-c2c
