name: WNBA R3B0 H2H Support Custody V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/wnba-r3-elite-signal-discovery
    paths:
      - "research/wnba/WNBA_R3B0_H2H_SUPPORT_CUSTODY_CONTRACT_V2.json"
      - "scripts/wnba-r3b0-h2h-support-custody.py"
      - "scripts/wnba-r3b0-h2h-support-custody-v2.py"
      - ".github/workflows/wnba-r3b0-h2h-support-custody-v2.yml"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frozen branch state
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check "pyarrow==21.0.0"

      - name: Run R3B0 V2 support custody audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r3b0-h2h-support-custody-v2.py

      - name: Upload R3B0 V2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r3b0-h2h-support-v2-${{ github.run_id }}
          path: wnba-r3b0-h2h-support-custody-evidence.json
          if-no-files-found: error
          retention-days: 30
