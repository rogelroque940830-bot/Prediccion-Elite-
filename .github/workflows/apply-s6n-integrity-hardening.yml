name: Apply S6N Integrity Hardening

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6n-integrity-hardening.mjs'
      - '.github/workflows/apply-s6n-integrity-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply deterministic S6N integrity hardening
        run: node scripts/patch-s6n-integrity-hardening.mjs
      - name: Commit hardened source and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No hardening changes required.'
            exit 0
          fi
          git add server/mlb-s6n-first-real-settlement-monitor.ts server/mlb-s6n-first-real-settlement-monitor.test.ts
          git commit -m 'Harden S6N certificate and evidence integrity'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
