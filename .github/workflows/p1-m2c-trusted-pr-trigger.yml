name: Trusted P1-M2C Predictor Integration

on:
  pull_request_target:
    branches:
      - integration/p0-frontend-session
    types: [opened]

permissions:
  contents: write

jobs:
  integrate-exact-feature-branch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/p1-m2c-mlb-pregame-readiness-ui'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted script from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout exact P1-M2C feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-m2c-mlb-pregame-readiness-ui
          path: feature
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply trusted deterministic patch
        run: |
          set -euo pipefail
          python trusted/.github/scripts/apply-p1-m2c-predictor.py feature/frontend/client/src/pages/mlb-predictor.tsx
          git -C feature diff --check
          git -C feature diff --stat
          [[ "$(git -C feature diff --name-only)" == 'frontend/client/src/pages/mlb-predictor.tsx' ]]
          grep -F 'MlbPregameReadinessGate' feature/frontend/client/src/pages/mlb-predictor.tsx
          grep -F 'data-pregame-stage' feature/frontend/client/src/pages/mlb-predictor.tsx

      - name: Commit only the predictor integration
        run: |
          set -euo pipefail
          if git -C feature diff --quiet; then
            echo 'P1-M2C predictor integration already present.'
            exit 0
          fi
          git -C feature config user.name 'github-actions[bot]'
          git -C feature config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C feature add frontend/client/src/pages/mlb-predictor.tsx
          git -C feature commit -m 'P1-M2C wire pregame gate into predictor'
          git -C feature push origin HEAD:agent/p1-m2c-mlb-pregame-readiness-ui
