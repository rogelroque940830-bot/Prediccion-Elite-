name: Validate P0 Step 12V3 Expanded Pregame Regimes

on:
  pull_request:
    branches:
      - research/p0-step12v2-a-plus-consensus-freeze
    paths:
      - 'research/p0-step12v3-expanded-regime-contract.json'
      - 'scripts/p0-step12v3-expanded-regime-study.py'
      - '.github/workflows/validate-p0-step12v3-expanded-regimes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expanded-regime-study:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3'
      - name: Validate frozen V3 contract
        run: |
          python - <<'PY'
          import json
          m=json.load(open('research/p0-step12v3-expanded-regime-contract.json'))
          assert m['dataBoundary']['trainingSeason']==2022
          assert m['dataBoundary']['thresholdSelectionSeason']==2023
          assert m['dataBoundary']['sameDateOutcomeMayTrainSameDate'] is False
          assert m['selection']['noThresholdRetuningAfter2023Selection'] is True
          assert m['policy']['historicalPricesUsed'] is False
          assert m['policy']['liveFilterChangeAllowed'] is False
          assert m['policy']['betEliteAllowed'] is False
          print('STEP12V3_CONTRACT_LOCKED')
          PY
      - name: Syntax check
        run: |
          python -m py_compile scripts/p0-step12v3-expanded-regime-study.py scripts/p0-step12v-game-anatomy-feature-table.py
          node --check scripts/p0-step12m-acquire-clean-replication-cohort.mjs
          node --check scripts/p0-step12h-t5-starter-identity-audit.mjs
      - name: Rebuild clean T-5 anatomy tables 2022-2026
        shell: bash
        run: |
          set -euo pipefail
          build () {
            label="$1"; start="$2"; end="$3"; root="artifacts/p0-step12v3/${label}"
            node --import tsx scripts/p0-step12m-acquire-clean-replication-cohort.mjs --start "$start" --end "$end" --concurrency 6 --role "STEP12V3_${label}" --out "${root}/cohort"
            node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs --start "$start" --end "$end" --concurrency 6 --out "${root}/t5-audit"
            python scripts/p0-step12v-game-anatomy-feature-table.py --dataset "${root}/cohort/dataset.json" --starter-history "${root}/cohort/starting-pitcher-history.json" --lineup-history "${root}/cohort/pregame-lineup-history.json" --t5-audit "${root}/t5-audit/t5-starter-identity-audit.json" --season "$label" --out "${root}/game-anatomy-feature-table.json"
          }
          build 2022 2022-03-01 2022-10-06
          build 2023 2023-03-01 2023-10-01
          build 2024 2024-03-01 2024-10-01
          build 2025 2025-03-01 2025-10-01
          build 2026_YTD 2026-03-01 2026-08-10
      - name: Run expanded pregame regime study
        run: >-
          python scripts/p0-step12v3-expanded-regime-study.py
          --root artifacts/p0-step12v3
          --contract research/p0-step12v3-expanded-regime-contract.json
          --out artifacts/p0-step12v3/expanded-regime-report.json
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v3/expanded-regime-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v3-expanded-regime-study.v1'
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          assert r['policy']['futureSeasonStatsAllowed'] is False
          assert r['policy']['historicalPricesUsed'] is False
          assert r['policy']['liveFilterChanged'] is False
          assert r['policy']['betEliteProduced'] is False
          assert r['featureExpansion']['newFeatureCount']>0
          # Deliberately no favorable-accuracy assertion.
          print(json.dumps(r['fullGameHomeML'],indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload V3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3/
          if-no-files-found: error
          retention-days: 30
