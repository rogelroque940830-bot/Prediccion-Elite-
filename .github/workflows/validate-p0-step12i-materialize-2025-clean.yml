name: Validate P0 Step 12I Materialize 2025 Clean

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12i-acquire-2025-clean-cohort.mjs'
      - 'scripts/p0-step12i-clean-t5-feature-table.py'
      - 'scripts/p0-step12h-t5-starter-identity-audit.mjs'
      - 'server/mlb-market-historical-source.ts'
      - 'server/mlb-market-historical-dataset.ts'
      - 'server/mlb-market-starting-pitcher-history.ts'
      - 'server/mlb-market-pregame-lineup-history.ts'
      - '.github/workflows/validate-p0-step12i-materialize-2025-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-2025-clean-t5:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Syntax-check materialization surface
        run: |
          node --check scripts/p0-step12i-acquire-2025-clean-cohort.mjs
          node --check scripts/p0-step12h-t5-starter-identity-audit.mjs
          python -m py_compile scripts/p0-step12i-clean-t5-feature-table.py

      - name: Acquire frozen 2025 clean cohort
        run: >-
          node --import tsx scripts/p0-step12i-acquire-2025-clean-cohort.mjs
          --start 2025-03-01 --end 2025-10-01 --concurrency 6
          --out artifacts/p0-step12i/cohort-2025-clean

      - name: Reconstruct 2025 T-5 probable-pitcher identity
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2025-03-01 --end 2025-10-01 --concurrency 6
          --out artifacts/p0-step12i/t5-audit-2025

      - name: Build clean 2025 T-5 feature table
        run: >-
          python scripts/p0-step12i-clean-t5-feature-table.py
          --dataset artifacts/p0-step12i/cohort-2025-clean/dataset.json
          --starter-history artifacts/p0-step12i/cohort-2025-clean/starting-pitcher-history.json
          --lineup-history artifacts/p0-step12i/cohort-2025-clean/pregame-lineup-history.json
          --t5-audit artifacts/p0-step12i/t5-audit-2025/t5-starter-identity-audit.json
          --out artifacts/p0-step12i/clean-t5-feature-table-2025.json

      - name: Validate real-cohort coverage and contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          with open('artifacts/p0-step12i/cohort-2025-clean/cohort-manifest.json', encoding='utf-8') as f: c=json.load(f)
          with open('artifacts/p0-step12i/t5-audit-2025/t5-starter-identity-audit.json', encoding='utf-8') as f: a=json.load(f)
          with open('artifacts/p0-step12i/clean-t5-feature-table-2025.json', encoding='utf-8') as f: t=json.load(f)
          assert c['schemaVersion']=='courtedge-p0-step12i-2025-clean-cohort.v1'
          assert t['schemaVersion']=='courtedge-p0-step12i-clean-t5-feature-table.v1'
          assert t['featureContract']['currentGameStarterIdentity']=='T5_PROBABLE_PITCHER_ONLY'
          assert t['featureContract']['sameDateHistoryAllowed'] is False
          assert t['featureContract']['rawCumulativeLineupExperienceAllowedForDiscovery'] is False
          assert t['policy']['thresholdSearchPerformed'] is False
          assert t['policy']['candidateSearchPerformed'] is False
          assert t['policy']['betEliteProduced'] is False
          assert t['counts']['rows']==c['cohort']['regularSeasonFinalGames']
          assert a['counts']['bothProbableCoveragePct'] > 99.0
          assert t['counts']['completeLineupAndBothProbablesRows'] > 0.98*t['counts']['validT5PregameRows']
          assert t['counts']['coreFeatureUsableRows'] > 0.90*t['counts']['rows']
          print(json.dumps({'audit':a['counts'],'featureTable':t['counts']},indent=2))
          PY

      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend

      - name: Upload Step 12I clean 2025 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12i-clean-2025
          path: artifacts/p0-step12i/
          if-no-files-found: error
          retention-days: 30
