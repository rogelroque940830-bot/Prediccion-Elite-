name: Validate P1-M3E.2 MLB Operating Envelope Stability

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-p1-operating-envelope-stability.ts'
      - 'server/mlb-p1-operating-envelope-stability.test.ts'
      - 'docs/P1_M3E2_MLB_OPERATING_ENVELOPE_STABILITY.md'
      - 'tsconfig.p1-m3e2-operating-envelope-stability.json'
      - '.github/workflows/validate-p1-m3e2-operating-envelope-stability.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3e2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned P1-M3E.2 surface
        run: npx tsc -p tsconfig.p1-m3e2-operating-envelope-stability.json
      - name: Run P1-M3E.2 falsification tests
        run: npx tsx --test server/mlb-p1-operating-envelope-stability.test.ts
      - name: Preserve P1-M3E predecessor behavior
        run: npx tsx --test server/mlb-p1-operating-envelope.test.ts
      - name: Build production backend without integrating the research module
        run: npm run build:backend
      - name: Verify three-way chronology and fail-closed safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          source='server/mlb-p1-operating-envelope-stability.ts'
          docs='docs/P1_M3E2_MLB_OPERATING_ENVELOPE_STABILITY.md'

          grep -F 'courtedge-p1-m3e2-operating-envelope-stability.v1' "$source"
          grep -F 'discoveryDateFraction: 0.5' "$source"
          grep -F 'validationDateFraction: 0.25' "$source"
          grep -F 'confirmationDateFraction: 0.25' "$source"
          grep -F 'maximumRuleAtoms: 2' "$source"
          grep -F 'bootstrapReplicates: 5000' "$source"
          grep -F 'STABLE_MODEL_QUALITY_ENVELOPE_RESEARCH_ONLY' "$source"
          grep -F 'economicProfitabilityCertified: false' "$source"
          grep -F 'operationalRecommendationGateAllowed: false' "$source"
          grep -F 'bettingRecommendationAllowed: false' "$source"
          grep -F 'stakeChangesAllowed: false' "$source"
          grep -F 'automaticBettingAllowed: false' "$source"
          grep -F 'premiumNoUltraProspectiveHypothesisChanged: false' "$source"
          grep -F 'automaticModelChangesAllowed: false' "$source"
          grep -F 'automaticPromotionAllowed: false' "$source"
          grep -F 'Forbidden selector inputs' "$docs"

          matcher=$(sed -n '/export function matchesMlbP1M3e2Rule/,/^}/p' "$source")
          ! grep -E 'result|settledAt|brierScore|logLoss|flatProfitUnits|policyProfitUnits|closingOddsAmerican|clvPp' <<< "$matcher"

          ! grep -E 'app\.(post|put|patch|delete|get)\(' "$source"
          ! grep -E 'appendOwnedPrediction|appendOwnedSettlement|appendPrediction|appendSettlement' "$source"
          ! grep -E 'operationalRecommendationGateAllowed:[[:space:]]*true|bettingRecommendationAllowed:[[:space:]]*true|stakeChangesAllowed:[[:space:]]*true|automaticBettingAllowed:[[:space:]]*true|automaticModelChangesAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true' "$source"
      - name: Verify exact isolated successor scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          if [[ -z "$base" || -z "$head" ]]; then
            git fetch origin integration/p0-staging-secure --depth=1
            base='origin/integration/p0-staging-secure'
            head='HEAD'
          fi
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3e2-operating-envelope-stability.yml' \
            'docs/P1_M3E2_MLB_OPERATING_ENVELOPE_STABILITY.md' \
            'server/mlb-p1-operating-envelope-stability.test.ts' \
            'server/mlb-p1-operating-envelope-stability.ts' \
            'tsconfig.p1-m3e2-operating-envelope-stability.json' | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo 'P1-M3E.2 scope rejected: expected exact five-file isolated research package.' >&2
            printf 'Changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
