name: MLB Daily BEST PICK Selector

on:
  push:
    branches:
      - "production/mlb-daily-best-pick-router-v2"
      - "production/mlb-daily-best-pick-ui-v1"
      - "production/mlb-daily-best-pick-price-visibility-v1"
      - "production/mlb-daily-best-pick-manual-price-continuity"
      - "fix/frontend-static-verifier-tests-v1"
    paths:
      - "server/mlb-daily-best-pick-selector.ts"
      - "server/mlb-daily-best-pick-selector.test.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.test.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.integration.test.ts"
      - "server/mlb-daily-best-pick-ui-view.ts"
      - "server/mlb-daily-best-pick-price-view.ts"
      - "server/mlb-daily-best-pick-price-view.test.ts"
      - "server/mlb-daily-best-pick-price-safe-view.ts"
      - "server/mlb-daily-best-pick-price-safe-view.test.ts"
      - "server/mlb-daily-best-pick-manual-price.ts"
      - "server/mlb-daily-best-pick-manual-price-store.ts"
      - "server/mlb-daily-best-pick-manual-price.test.ts"
      - "server/mlb-unified-v16-ui-routes.ts"
      - "server/mlb-unified-v16-ui-routes.test.ts"
      - "server/mlb-unified-v16-ui-orchestration.test.ts"
      - "frontend/client/src/components/mlb-unified-v16-control.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-card.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-price-card.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-manual-price-card.tsx"
      - "frontend/client/src/lib/mlb-daily-best-pick.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price-safe.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price-safe.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-manual-price.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-manual-price.test.ts"
      - "frontend/scripts/verify-frontend.mjs"
      - "frontend/Dockerfile"
      - "tsconfig.mlb-daily-best-pick-selector.json"
      - ".github/workflows/mlb-daily-best-pick-selector.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "server/mlb-daily-best-pick-selector.ts"
      - "server/mlb-daily-best-pick-selector.test.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.test.ts"
      - "server/mlb-daily-best-pick-runtime-adapter.integration.test.ts"
      - "server/mlb-daily-best-pick-ui-view.ts"
      - "server/mlb-daily-best-pick-price-view.ts"
      - "server/mlb-daily-best-pick-price-view.test.ts"
      - "server/mlb-daily-best-pick-price-safe-view.ts"
      - "server/mlb-daily-best-pick-price-safe-view.test.ts"
      - "server/mlb-daily-best-pick-manual-price.ts"
      - "server/mlb-daily-best-pick-manual-price-store.ts"
      - "server/mlb-daily-best-pick-manual-price.test.ts"
      - "server/mlb-unified-v16-ui-routes.ts"
      - "server/mlb-unified-v16-ui-routes.test.ts"
      - "server/mlb-unified-v16-ui-orchestration.test.ts"
      - "frontend/client/src/components/mlb-unified-v16-control.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-card.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-price-card.tsx"
      - "frontend/client/src/components/mlb-daily-best-pick-manual-price-card.tsx"
      - "frontend/client/src/lib/mlb-daily-best-pick.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price-safe.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-price-safe.test.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-manual-price.ts"
      - "frontend/client/src/lib/mlb-daily-best-pick-manual-price.test.ts"
      - "frontend/scripts/verify-frontend.mjs"
      - "frontend/Dockerfile"
      - "tsconfig.mlb-daily-best-pick-selector.json"
      - ".github/workflows/mlb-daily-best-pick-selector.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck Daily BEST PICK backend block
        run: npx tsc -p tsconfig.mlb-daily-best-pick-selector.json
      - name: Test selector, frozen runtime adapter, price visibility, manual continuity and server UI exposure
        run: >-
          npx tsx --test
          server/mlb-daily-best-pick-selector.test.ts
          server/mlb-daily-best-pick-runtime-adapter.test.ts
          server/mlb-daily-best-pick-runtime-adapter.integration.test.ts
          server/mlb-daily-best-pick-price-view.test.ts
          server/mlb-daily-best-pick-price-safe-view.test.ts
          server/mlb-daily-best-pick-manual-price.test.ts
          server/mlb-unified-v16-ui-routes.test.ts
          server/mlb-unified-v16-ui-orchestration.test.ts
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test Daily BEST PICK frontend fail-closed presenters
        working-directory: frontend
        run: >-
          npx tsx --test
          client/src/lib/mlb-daily-best-pick.test.ts
          client/src/lib/mlb-daily-best-pick-price.test.ts
          client/src/lib/mlb-daily-best-pick-price-safe.test.ts
          client/src/lib/mlb-daily-best-pick-manual-price.test.ts
      - name: Verify frontend exactly through production pipeline
        working-directory: frontend
        run: COURTEDGE_STANDALONE_DOCKER_BUILD=true npm run verify
