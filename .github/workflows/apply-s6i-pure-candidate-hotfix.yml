name: Apply S6I Pure Candidate Hotfix

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6i-pure-candidate-readiness.mjs'
      - '.github/workflows/apply-s6i-pure-candidate-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/patch-s6i-pure-candidate-readiness.mjs
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then exit 0; fi
          git add server/mlb-s6i-postfix-certification.ts
          git commit -m 'Correct S6I pure-candidate readiness scoring'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
