name: Validate P0 Step 12V66 F5 Full-Game Winner

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v66-game-horizon-exposure-suite-contract.json'
      - 'research/p0-step12v66-preoutcome-zero-variance-correction.json'
      - 'research/p0-step12v66-f5-fullgame-winner-scoring-spec.json'
      - 'scripts/p0-step12v66-f5-fullgame-winner.py'
      - '.github/workflows/validate-p0-step12v66-f5-fullgame-winner.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V66 scoring freeze predates first outcome scorer
        run: |
          set -euo pipefail
          FREEZE=4f99b5d7afad3309e9df27bf8bb99528a6b43862
          git merge-base --is-ancestor "$FREEZE" HEAD
          git cat-file -e "$FREEZE:research/p0-step12v66-f5-fullgame-winner-scoring-spec.json"
          ! git cat-file -e "$FREEZE:scripts/p0-step12v66-f5-fullgame-winner.py"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v66-game-horizon-exposure-suite-contract.json'))
          s=json.load(open('research/p0-step12v66-f5-fullgame-winner-scoring-spec.json'))
          z=json.load(open('research/p0-step12v66-preoutcome-zero-variance-correction.json'))
          assert c['scientificStatus']=='FROZEN_BEFORE_ANY_V66_OUTCOME_SCORER_EXISTS'
          assert s['scientificStatus']=='FROZEN_WINNER_SCORING_SEMANTICS_BEFORE_FIRST_V66_OUTCOME_RUN'
          assert s['candidateTraining']['trainingSeason']=='2022'
          assert s['candidateTraining']['calibrationSeason']=='2023'
          assert s['candidateTraining']['evaluationSeasons']==['2024','2025','2026_YTD']
          assert s['bootstrap']=={
            'unit':'OFFICIAL_DATE_CLUSTER','resamples':5000,'seed':20260816,
            'confidenceLevel':0.95,'combinedEvaluationOnly':'2024_PLUS_2025_PLUS_2026_YTD',
            'clusterResampling':'SAMPLE_DISTINCT_OFFICIAL_DATES_WITH_REPLACEMENT_AND_RETAIN_ALL_GAMES_PER_SELECTED_DATE'}
          assert s['independence']['f5AndFullGamePromotionDecisionsIndependent'] is True
          assert z['outcomeBoundary']['v66OutcomeScorerExistedBeforeCorrection'] is False
          assert z['outcomeBoundary']['v66OutcomeMetricsAvailableBeforeCorrection'] is False
          assert s['policy']['betEliteAllowed'] is False and s['policy']['realFinancialExposure']==0
          print('V66_WINNER_SCORING_FREEZE_VERIFIED')
          PY
          python -m py_compile scripts/p0-step12v66-f5-fullgame-winner.py

  score-winner:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.18.0'
      - name: Download frozen V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: artifacts/p0-step12v66
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793
      - name: Download frozen Step12 control/outcome source
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v-winner-anatomy-walkforward
          path: artifacts/p0-step12v-control
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31649438822
      - name: Download exact frozen V16 control artifact
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: artifacts/p0-step12v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189
      - name: Verify frozen input custody and controls
        run: |
          set -euo pipefail
          test -s artifacts/p0-step12v66/v66-pregame-custody.jsonl.gz
          test -s artifacts/p0-step12v66/v66-custody-report.json
          for s in 2022 2023 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v-control/${s}/game-anatomy-feature-table.json"
          done
          test -s artifacts/p0-step12v16/pure-settlement-model-manifest.json
          test -s artifacts/p0-step12v16/pure-settlement-probability-report.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v66/v66-custody-report.json'))
          assert r['classification']=='V66_PREOUTCOME_CUSTODY_FROZEN_READY_FOR_SEPARATE_OUTCOME_SCORER'
          assert r['rows']==11407
          assert r['rowsBySeason']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert r['output']['containsOutcomeTargets'] is False
          q=r['qualityIndex']['2022TrainingScaler']['whiff']
          assert q['zeroVarianceTraining'] is True and q['rawScale']==0.0 and q['scale']==1.0
          assert r['policy']['betEliteAllowed'] is False and r['policy']['realFinancialExposure']==0
          m=json.load(open('artifacts/p0-step12v16/pure-settlement-model-manifest.json'))
          assert m['modelVersion']=='rogel-pure-settlement-ml-f5-v1'
          assert m['fullGame']['featureSet']=='C4' and m['first5']['featureSet']=='C4'
          print('V66_FROZEN_INPUTS_VERIFIED')
          PY
      - name: Score predeclared F5 and Full Game winner mechanisms
        run: |
          set -euo pipefail
          mkdir -p artifacts/p0-step12v66-winner
          python scripts/p0-step12v66-f5-fullgame-winner.py \
            --custody artifacts/p0-step12v66/v66-pregame-custody.jsonl.gz \
            --control-root artifacts/p0-step12v-control \
            --v16-manifest artifacts/p0-step12v16/pure-settlement-model-manifest.json \
            --v16-report artifacts/p0-step12v16/pure-settlement-probability-report.json \
            --contract research/p0-step12v66-game-horizon-exposure-suite-contract.json \
            --scoring-spec research/p0-step12v66-f5-fullgame-winner-scoring-spec.json \
            --out artifacts/p0-step12v66-winner/v66-f5-fullgame-winner-report.json
      - name: Validate independent route decisions and research-only boundary
        run: |
          python - <<'PY'
          import json
          p='artifacts/p0-step12v66-winner/v66-f5-fullgame-winner-report.json'
          r=json.load(open(p))
          assert r['schemaVersion']=='courtedge-p0-step12v66-f5-fullgame-winner-score.v1'
          assert r['scientificStatus']=='OUTCOME_SCORING_COMPLETED_WITH_PREDECLARED_MODELS_AND_GATES'
          assert set(r['routes'])=={'V66_B_F5_WINNER','V66_C_FULL_GAME_WINNER'}
          assert all(x['passed'] is True for x in r['v16ControlParity'].values())
          expected={
            'V66_B_F5_WINNER':{'V66_F5_WINNER_MECHANISM_CERTIFIED_FOR_NEXT_RESEARCH_STAGE','V66_B_F5_WINNER_NOT_ROBUST_ENOUGH_TO_ADVANCE'},
            'V66_C_FULL_GAME_WINNER':{'V66_FULL_GAME_WINNER_MECHANISM_CERTIFIED_FOR_NEXT_RESEARCH_STAGE','V66_C_FULL_GAME_WINNER_NOT_ROBUST_ENOUGH_TO_ADVANCE'},
          }
          for k,v in r['routes'].items():
            assert v['primaryCandidate']=='FULL_MECHANISTIC_PRIMARY'
            assert v['classification'] in expected[k]
            assert len(v['pairedBootstrap']['logLossImprovement']['ci95'])==2
            assert len(v['pairedBootstrap']['brierImprovement']['ci95'])==2
          pol=r['policy']
          assert pol['researchOnly'] is True
          for k in ('historicalPricesUsed','marketOddsUsedAsFeatures','positiveEvEstablished','v16ProductionChanged','routingChanged','rankingChanged','stakeChanged','betEliteAllowed','finalRecommendationChanged','automaticBetPlacementAllowed'):
            assert pol[k] is False
          assert pol['realFinancialExposure']==0
          print(json.dumps({k:{'classification':v['classification'],'passed':v['passed'],'validation2023Delta':v['validation2023Delta'],'combinedDelta':v['combinedEvaluation']['delta'],'bootstrap':v['pairedBootstrap'],'seasonDeltas':v['seasonDeltas'],'diagnosticAblations':v['diagnosticAblations']} for k,v in r['routes'].items()},indent=2))
          PY
      - name: Verify no production policy changes
        run: |
          set -euo pipefail
          git diff --check
          ! grep -E "betEliteAllowed[^\n]*True|realFinancialExposure[^\n]*[1-9]|automaticBetPlacementAllowed[^\n]*True" scripts/p0-step12v66-f5-fullgame-winner.py
      - name: Upload V66 F5 and Full Game winner evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v66-f5-fullgame-winner
          path: artifacts/p0-step12v66-winner/v66-f5-fullgame-winner-report.json
          if-no-files-found: error
          retention-days: 30
