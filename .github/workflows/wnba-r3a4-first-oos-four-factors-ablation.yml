name: WNBA R3A4 First OOS Four Factors Ablation

on:
  workflow_dispatch:
  push:
    branches:
      - research/wnba-r3-elite-signal-discovery
    paths:
      - "research/wnba/WNBA_R3A4_FIRST_OOS_FAMILY_ABLATION_CONTRACT.json"
      - "research/wnba/WNBA_R2B2_FIVE_FOLD_RESULT.json"
      - "scripts/wnba-r3a4-first-oos-four-factors-ablation.py"
      - ".github/workflows/wnba-r3a4-first-oos-four-factors-ablation.yml"

permissions:
  contents: read
  actions: read

jobs:
  ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check "numpy==2.2.6"
      - name: Run frozen rolling-origin Four Factors ablation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r3a4-first-oos-four-factors-ablation.py
      - name: Show R3A4 evidence summary
        if: always()
        run: |
          if [ -f wnba-r3a4-first-oos-four-factors-ablation-evidence.json ]; then
            python - <<'PY'
          import json
          p=json.load(open('wnba-r3a4-first-oos-four-factors-ablation-evidence.json'))
          print(json.dumps({
            'decision':p.get('decision'),
            'referenceParity':p.get('referenceParity'),
            'population':p.get('population'),
            'pooled':p.get('pooledOos2021To2025'),
            'pairedUncertainty':p.get('pairedUncertainty'),
            'gate':p.get('frozenIncrementalValueGate'),
            'oosRowset':p.get('oosRowset'),
            'nextGate':p.get('nextGate')
          },indent=2))
          PY
          fi
      - name: Upload R3A4 evidence and OOS rowset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r3a4-first-oos-four-factors-ablation-${{ github.run_id }}
          path: |
            wnba-r3a4-first-oos-four-factors-ablation-evidence.json
            wnba-r3a4-first-oos-four-factors-ablation-oos.jsonl
          if-no-files-found: warn
          retention-days: 90
