name: Validate P0 Step 12H T5 Starter Identity

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12h-t5-starter-identity-audit.mjs'
      - 'server/mlb-market-pregame-lineup-history.ts'
      - 'server/mlb-market-starting-pitcher-history.ts'
      - '.github/workflows/validate-p0-step12h-t5-starter-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-t5-starter-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Syntax-check audit surface
        run: node --check scripts/p0-step12h-t5-starter-identity-audit.mjs
      - name: Audit 2025 discovery season T-5 starter identities
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2025-03-01 --end 2025-10-01 --concurrency 6
          --out artifacts/p0-step12h/2025
      - name: Audit 2024 replication season T-5 starter identities
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2024-03-01 --end 2024-09-30 --concurrency 6
          --out artifacts/p0-step12h/2024
      - name: Audit 2026 forward season T-5 starter identities
        run: >-
          node --import tsx scripts/p0-step12h-t5-starter-identity-audit.mjs
          --start 2026-03-01 --end 2026-08-10 --concurrency 6
          --out artifacts/p0-step12h/2026
      - name: Validate audit contract
        run: |
          python - <<'PY'
          import json
          for season in ('2024','2025','2026'):
            with open(f'artifacts/p0-step12h/{season}/t5-starter-identity-audit.json',encoding='utf-8') as f:r=json.load(f)
            assert r['schemaVersion']=='courtedge-p0-step12h-t5-starter-identity-audit.v1'
            assert r['evidenceStatus']=='DIAGNOSTIC_ONLY_NO_PROMOTION'
            assert r['interpretation']['boxscoreStarterMaySubstituteFutureIdentity'] is True
            assert r['interpretation']['t5ProbableIdentityIsRequiredForPregameStarterFeatures'] is True
            assert r['interpretation']['thresholdRetuningAllowed'] is False
            assert r['interpretation']['canProduceBetElite'] is False
            assert r['counts']['validPregameSnapshots']>0
            print(season, json.dumps(r['counts'], sort_keys=True))
          PY
      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload T-5 starter identity audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12h-t5-starter-identity-audit
          path: artifacts/p0-step12h/
          if-no-files-found: error
          retention-days: 30
