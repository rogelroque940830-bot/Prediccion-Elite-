name: Validate MLB F5 Lifecycle E2E V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/mlb-scientific-snapshot.ts'
      - 'server/mlb-f5-canonical-lifecycle.e2e.test.ts'
      - 'server/mlb-early-engine-capture-projection.ts'
      - 'server/mlb-ledger-csv-export.ts'
      - 'server/mlb-early-ere-export.test.ts'
      - 'server/mlb-ledger.ts'
      - 'server/mlb-early-engine-service.ts'
      - 'server/mlb-early-routes.ts'
      - 'server/mlb-early-candidate-routes.ts'
      - 'server/mlb-early-whole-slate-candidates.ts'
      - 'server/mlb-early-whole-slate-candidates.test.ts'
      - 'server/routes.ts'
      - '.github/workflows/validate-mlb-f5-lifecycle-e2e-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prove canonical F5 ML/Total lifecycle
        run: npx tsx --test server/mlb-f5-canonical-lifecycle.e2e.test.ts
      - name: Prove compact Early ERE CSV export
        run: npx tsx --test server/mlb-early-ere-export.test.ts
      - name: Prove whole-slate Early candidate producer
        run: npx tsx --test server/mlb-early-whole-slate-candidates.test.ts
      - name: Run ledger regression suite
        run: npm run test:mlb-ledger
      - name: Build production backend
        run: npm run build:backend
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
