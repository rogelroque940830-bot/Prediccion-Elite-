name: MLB R1B Statcast xERA Legacy Savant Archive Surface Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery.mjs
      - .github/workflows/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Discover legacy archived primary Savant surfaces
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery
          node scripts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery.mjs \
            --out=artifacts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery/evidence.json

      - name: Enforce legacy-surface scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery/evidence.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          if(e.status!=='LEGACY_SAVANT_ARCHIVE_SURFACE_DISCOVERY_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.sourceAuthority?.replayedPrimaryPublisherContentOnly!==true) throw new Error('publisher replay boundary');
          if(e.scientificPolicy?.primaryPublisherUrlsOnly!==true) throw new Error('primary publisher only');
          if(e.scientificPolicy?.noThirdPartyDataAuthority!==true) throw new Error('third party');
          if(e.scientificPolicy?.noInterpolationBetweenSnapshots!==true) throw new Error('interpolation');
          if(e.scientificPolicy?.noEmpiricalFitAuthorized!==true) throw new Error('empirical fit');
          if(e.scientificPolicy?.approximationForbidden!==true) throw new Error('approximation');
          if(e.scientificPolicy?.xeraNotUsedToRankCandidates!==true) throw new Error('xera leakage');
          if(e.scientificPolicy?.currentLiveEndpointBehaviorIsNotHistoricalCustody!==true) throw new Error('live != historical');
          if(e.scientificConclusion?.completeHistoricalTargetDateCustodyProven!==false) throw new Error('premature custody');
          if(e.scientificConclusion?.exactTargetDateXeraCustodyForFullUniverseProven!==false) throw new Error('premature xera custody');
          if(e.scientificConclusion?.exactSavantProductionConversionProven!==false) throw new Error('premature conversion');
          if(e.scientificConclusion?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('scientific boundary');
          NODE

      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery.mjs
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'noInterpolationBetweenSnapshots:true' "$src"
          grep -F 'noEmpiricalFitAuthorized:true' "$src"
          grep -F 'familyPromotionAuthorized:false' "$src"

      - name: Backend build regression
        run: npm run build:backend

      - name: Upload legacy Savant surface evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery
          path: artifacts/mlb-r1b-statcast-xera-legacy-savant-archive-surface-discovery/evidence.json
          if-no-files-found: error
          retention-days: 30
