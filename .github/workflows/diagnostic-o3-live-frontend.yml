name: Diagnostic O3 live frontend verification

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-o3-live-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-o3-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_RELEASE: o3-controlled-reprocessing-2026-08-04
      EXPECTED_BACKEND_COMMIT: 5a61e0bca986906a17966d1c7eac7a9d3786f209
    steps:
      - name: Wait for exact O3 frontend release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            cache_bust="o3-${attempt}-$(date +%s)"
            if curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "${FRONTEND_URL}/?${cache_bust}" -o audit/index.html; then
              asset_path="$(grep -oE 'src="[^"]+\.js"' audit/index.html | head -1 | sed -E 's/^src="([^"]+)"$/\1/')"
              asset_path="${asset_path#./}"
              if [[ -n "${asset_path}" ]] && curl -fsS --max-time 45 -H 'Cache-Control: no-cache' "${FRONTEND_URL}/${asset_path}?${cache_bust}" -o audit/app.js; then
                if grep -Fq "${EXPECTED_RELEASE}" audit/app.js; then
                  echo 'Exact O3 frontend release marker is live.'
                  break
                fi
              fi
            fi
            echo "Attempt ${attempt}/100: waiting for O3 frontend deployment"
            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for O3 frontend release' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Assert live two-step UI and unchanged O3 backend state
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Reprocesamiento seguro y controlado' audit/app.js
          grep -Fq 'Crear vista previa' audit/app.js
          grep -Fq 'Revisar vista previa sellada' audit/app.js
          grep -Fq 'Ejecución administrativa' audit/app.js
          grep -Fq 'Ejecutar settlement append-only' audit/app.js
          grep -Fq 'REPROCESS_ONE_MLB_GAME' audit/app.js
          grep -Fq 'Auditoría append-only' audit/app.js
          grep -Fq 'SHADOW ONLY' audit/app.js
          grep -Fq 'No existe ejecución automática' audit/app.js
          grep -Fq '/api/ops/v1/reprocessing/status' audit/app.js
          grep -Fq '/api/ops/v1/reprocessing/audit?limit=250' audit/app.js
          grep -Fq '/api/ops/v1/reprocessing/preview' audit/app.js
          grep -Fq '/api/ops/v1/reprocessing/execute' audit/app.js

          curl -fsS --max-time 25 "${BACKEND_URL}/health" -o audit/health-before.json
          status_code=$(curl -sS -o audit/status-private.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/ops/v1/reprocessing/status")
          preview_code=$(curl -sS -o audit/preview-private.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"incidentId":"ops-MLB:frontend-diagnostic-never-created","league":"MLB"}' \
            "${BACKEND_URL}/api/ops/v1/reprocessing/preview")
          execute_code=$(curl -sS -o audit/execute-private.json -w '%{http_code}' --max-time 25 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"planId":"o3-plan-frontend-diagnostic-never-created","planDigest":"invalid","idempotencyKey":"frontend-diagnostic-never-created","confirmation":"REPROCESS_ONE_MLB_GAME","reason":"Unauthenticated frontend diagnostic that must fail before execution."}' \
            "${BACKEND_URL}/api/ops/v1/reprocessing/execute")
          curl -fsS --max-time 25 "${BACKEND_URL}/health" -o audit/health-after.json

          STATUS_CODE="${status_code}" PREVIEW_CODE="${preview_code}" EXECUTE_CODE="${execute_code}" node <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('audit/health-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('audit/health-after.json', 'utf8'));
          const privatePayloads = {
            status: JSON.parse(fs.readFileSync('audit/status-private.json', 'utf8')),
            preview: JSON.parse(fs.readFileSync('audit/preview-private.json', 'utf8')),
            execute: JSON.parse(fs.readFileSync('audit/execute-private.json', 'utf8')),
          };
          const codes = {
            status: Number(process.env.STATUS_CODE),
            preview: Number(process.env.PREVIEW_CODE),
            execute: Number(process.env.EXECUTE_CODE),
          };
          const expectedCommit = String(process.env.EXPECTED_BACKEND_COMMIT || '');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(before.status === 'healthy', `health=${before.status}`);
          assert(before.commit === expectedCommit, `backend commit=${before.commit}`);
          assert(before.environment === 'p0-integration', `environment=${before.environment}`);
          assert(before.privateReadProtection === true, 'private read protection disabled');
          const o3 = before.operationalReprocessing;
          assert(o3?.schemaVersion === 'courtedge-operational-reprocessing-status.v1', 'O3 health missing');
          assert(o3.plans === 0, `unexpected live plans=${o3.plans}`);
          assert(o3.executions === 0, `unexpected live executions=${o3.executions}`);
          assert(o3.safety?.mode === 'SHADOW_CONTROLLED_REPROCESSING', `mode=${o3.safety?.mode}`);
          assert(o3.safety?.automaticExecution === false, 'automatic execution enabled');
          assert(o3.safety?.appendOnlySettlementEvents === true, 'append-only disabled');
          assert(o3.safety?.realFinancialExposure === 0, `exposure=${o3.safety?.realFinancialExposure}`);

          for (const [name, code] of Object.entries(codes)) {
            assert(code === 401, `${name} HTTP ${code}`);
            assert(privatePayloads[name]?.success === false, `${name} did not fail closed`);
            assert(/Authentication required/i.test(String(privatePayloads[name]?.error || '')), `${name} auth message missing`);
          }

          const afterO3 = after.operationalReprocessing;
          assert(after.commit === expectedCommit, `after commit=${after.commit}`);
          assert(afterO3.plans === o3.plans, `plans changed ${o3.plans} -> ${afterO3.plans}`);
          assert(afterO3.executions === o3.executions, `executions changed ${o3.executions} -> ${afterO3.executions}`);

          console.log(JSON.stringify({
            frontendRelease: process.env.EXPECTED_RELEASE,
            backendCommit: before.commit,
            backendEnvironment: before.environment,
            privateReadProtection: before.privateReadProtection,
            o3: {
              plans: o3.plans,
              executions: o3.executions,
              readyPlans: o3.readyPlans,
              blockedPlans: o3.blockedPlans,
              confirmationPhrase: o3.confirmationPhrase,
              planTtlMs: o3.planTtlMs,
              maxTargetsPerPlan: o3.maxTargetsPerPlan,
              safety: o3.safety,
            },
            unauthenticated: codes,
            noStateChange: {
              plansBefore: o3.plans,
              plansAfter: afterO3.plans,
              executionsBefore: o3.executions,
              executionsAfter: afterO3.executions,
            },
          }, null, 2));
          NODE
