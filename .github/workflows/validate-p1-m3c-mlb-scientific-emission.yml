name: Validate P1-M3C MLB Scientific Emission

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/client/src/App.tsx'
      - 'frontend/client/src/components/app-sidebar.tsx'
      - 'frontend/client/src/components/mlb-pregame-readiness-gate.tsx'
      - 'frontend/client/src/components/mlb-scientific-capture-status.tsx'
      - 'frontend/client/src/lib/mlb-scientific-capture.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture.test.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture-transport.ts'
      - 'frontend/client/src/lib/mlb-scientific-capture-transport.test.ts'
      - 'frontend/client/src/lib/mlb-interactive-economic-review.ts'
      - 'frontend/client/src/lib/mlb-interactive-economic-review.test.ts'
      - 'frontend/client/src/pages/mlb-predictor.tsx'
      - 'frontend/client/src/pages/mlb-economic-review.tsx'
      - 'docs/P1_M3D_B_INTERACTIVE_ECONOMIC_REVIEW_UI.md'
      - '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml'
      - '.github/workflows/validate-p1-m3c1-json-transport.yml'
      - '.github/workflows/validate-p1-m4c-frontend-economic-card.yml'
      - '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies reproducibly
        run: npm --prefix frontend ci
      - name: Run focused P1-M3C and MLB gate regressions
        run: |
          cd frontend
          tests=(
            client/src/lib/mlb-scientific-capture.test.ts
            client/src/lib/mlb-pregame-readiness.test.ts
            client/src/lib/mlb-daily-flow.test.ts
            client/src/lib/mlb-daily-slate.test.ts
            client/src/lib/mlb-review-priority.test.ts
          )
          if [[ -f client/src/lib/mlb-scientific-capture-transport.test.ts ]]; then
            tests+=(client/src/lib/mlb-scientific-capture-transport.test.ts)
          fi
          npx tsx --test "${tests[@]}"
      - name: Run production-equivalent frontend verification
        env:
          COURTEDGE_STANDALONE_DOCKER_BUILD: 'true'
        run: npm --prefix frontend run verify
      - name: Verify P1-M3C execution and successor lineage
        shell: bash
        run: |
          set -euo pipefail
          app='frontend/client/src/App.tsx'
          gate='frontend/client/src/components/mlb-pregame-readiness-gate.tsx'
          status='frontend/client/src/components/mlb-scientific-capture-status.tsx'
          client='frontend/client/src/lib/mlb-scientific-capture.ts'
          predictor='frontend/client/src/pages/mlb-predictor.tsx'

          grep -E 'MLB_P1_M3C_FRONTEND_RELEASE|MLB_P1_M4C_FRONTEND_RELEASE|MLB_P1_M3D_B_FRONTEND_RELEASE' "$app"
          grep -F '/api/mlb/p1/v1/scientific-captures' "$client"
          grep -F 'userAction: "GENERATE_PREDICTION"' "$client"
          grep -F 'buildMlbP1M3cCandidate' "$predictor"
          grep -F 'postMlbP1M3cScientificCapture' "$predictor"
          grep -F 'saveToHistory: false' "$predictor"
          grep -F 'emitScientific: true' "$predictor"
          grep -F 'if (!saveToHistory) return;' "$predictor"
          grep -F 'onExecutionReport={setPregameExecutionReport}' "$predictor"
          grep -F 'onExecutionReportRef.current(executionReport)' "$gate"
          grep -F '<MlbScientificCaptureStatus state={scientificCaptureState} />' "$predictor"
          grep -F 'Evaluación científica RECHAZADA' "$status"
          grep -F 'SHADOW · exposición 0' "$status"
          grep -F 'realFinancialExposure: 0 as const' "$client"
          grep -F 'automaticBetPlacement: false as const' "$client"

          node <<'NODE'
          const fs = require('node:fs');
          const app = fs.readFileSync('frontend/client/src/App.tsx', 'utf8');
          const predictor = fs.readFileSync('frontend/client/src/pages/mlb-predictor.tsx', 'utf8');
          const client = fs.readFileSync('frontend/client/src/lib/mlb-scientific-capture.ts', 'utf8');
          const gate = fs.readFileSync('frontend/client/src/components/mlb-pregame-readiness-gate.tsx', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const automaticStart = predictor.indexOf('saveToHistory: false');
          const historyBarrier = predictor.indexOf('if (!saveToHistory) return;');
          const dispatch = predictor.indexOf('type: "ADD_MLB_PICK"', historyBarrier);
          assert(automaticStart >= 0, 'automatic scientific emission missing');
          assert(historyBarrier >= 0 && dispatch > historyBarrier, 'scientific emission is not separated from pick saving');
          assert(client.includes('P1_M3C_CERTIFIED_QUOTE_SELECTION_MISMATCH'), 'selected quote fail-closed rule missing');
          assert(client.includes('P1_M3C_CERTIFIED_TOTAL_LINE_MISMATCH'), 'total line fail-closed rule missing');
          assert(client.includes('P1_M3C_CERTIFIED_RUN_LINE_MISMATCH'), 'run line fail-closed rule missing');
          assert(gate.includes('onExecutionReportRef.current(null)'), 'execution report invalidation missing');
          assert(!client.includes('automaticBetPlacement: true'), 'automatic betting enabled');
          assert(
            app.includes('MLB_P1_M3C_FRONTEND_RELEASE')
              || app.includes('MLB_P1_M4C_FRONTEND_RELEASE')
              || app.includes('MLB_P1_M3D_B_FRONTEND_RELEASE'),
            'frontend release lineage does not recognize P1-M3C or a validated successor',
          );
          NODE

          cat frontend/dist/assets/*.js > /tmp/p1-m3c-bundle.js
          grep -E 'p1-m3c-mlb-scientific-emission-2026-08-05|p1-m3c1-json-digest-transport-2026-08-05|p1-m4c-mlb-economic-decision-card-2026-08-06|p1-m3d-b-interactive-economic-review-ui-2026-08-06' /tmp/p1-m3c-bundle.js
          grep -F 'Registrando evaluación científica SHADOW' /tmp/p1-m3c-bundle.js
          grep -F '/api/mlb/p1/v1/scientific-captures' /tmp/p1-m3c-bundle.js
      - name: Diff hygiene and protected extension scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-frontend-session --depth=1
          git diff --check origin/integration/p0-frontend-session...HEAD
          changed=$(git diff --name-only origin/integration/p0-frontend-session...HEAD | sort)
          allowed=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml' \
            '.github/workflows/validate-p1-m3c1-json-transport.yml' \
            '.github/workflows/validate-p1-m4c-frontend-economic-card.yml' \
            '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml' \
            'docs/P1_M3D_B_INTERACTIVE_ECONOMIC_REVIEW_UI.md' \
            'frontend/client/src/App.tsx' \
            'frontend/client/src/components/app-sidebar.tsx' \
            'frontend/client/src/lib/mlb-interactive-economic-review.test.ts' \
            'frontend/client/src/lib/mlb-interactive-economic-review.ts' \
            'frontend/client/src/pages/mlb-economic-review.tsx' | sort)
          unexpected=$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))
          [[ -z "$unexpected" ]]
          grep -Fxq 'frontend/client/src/App.tsx' <<< "$changed"
          grep -Fxq 'frontend/client/src/pages/mlb-economic-review.tsx' <<< "$changed"

          ! grep -E 'realFinancialExposure:[[:space:]]*[1-9]|automaticBetPlacement:[[:space:]]*true|automaticModelChangesAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true' \
            frontend/client/src/lib/mlb-scientific-capture.ts \
            frontend/client/src/lib/mlb-interactive-economic-review.ts \
            frontend/client/src/pages/mlb-economic-review.tsx
