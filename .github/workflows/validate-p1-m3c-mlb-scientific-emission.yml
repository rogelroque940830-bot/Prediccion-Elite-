name: Validate P1-M3C MLB Scientific Emission

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'frontend/client/src/lib/mlb-scientific-capture.ts'
      - 'frontend/client/src/pages/mlb-predictor.tsx'
      - '.github/workflows/validate-p1-m3c-mlb-scientific-emission.yml'

permissions:
  contents: write

jobs:
  apply-ts-compatibility-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Set spread with Array.from once
        shell: bash
        run: |
          set -euo pipefail
          helper='frontend/client/src/lib/mlb-scientific-capture.ts'
          predictor='frontend/client/src/pages/mlb-predictor.tsx'
          if grep -Fq 'Array.from(new Set(evaluation.filterReasons))' "$helper" && grep -Fq 'Array.from(new Set(pq?.warnings || []))' "$predictor"; then
            echo 'TypeScript compatibility fix already applied.'
            exit 0
          fi
          python <<'PY'
          from pathlib import Path
          replacements = [
              (Path('frontend/client/src/lib/mlb-scientific-capture.ts'),
               '[...new Set(evaluation.filterReasons)].slice(0, 100)',
               'Array.from(new Set(evaluation.filterReasons)).slice(0, 100)'),
              (Path('frontend/client/src/pages/mlb-predictor.tsx'),
               '[...new Set(pq?.warnings || [])].slice(0, 100)',
               'Array.from(new Set(pq?.warnings || [])).slice(0, 100)'),
          ]
          for path, old, new in replacements:
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {source.count(old)}')
              path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' "$helper" "$predictor" | sort)
          [[ "$changed" == "$expected" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$helper" "$predictor"
          git commit -m 'P1-M3C: keep Set dedup compatible with frontend target'
          git push origin HEAD:${GITHUB_HEAD_REF}
