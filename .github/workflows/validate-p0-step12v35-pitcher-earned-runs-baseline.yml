name: Validate P0 Step 12V35 Pitcher Earned Runs Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v35-pitcher-earned-runs-baseline-contract.json'
      - 'scripts/p0-step12v35-pitcher-earned-runs-baseline.py'
      - '.github/workflows/validate-p0-step12v35-pitcher-earned-runs-baseline.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scipy==1.18.0' 'scikit-learn==1.8.0'

      - name: Validate frozen V35 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v35-pitcher-earned-runs-baseline-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v35-pitcher-earned-runs-baseline-contract.v1'
          assert c['parentEvidence']['mainBaseSha']=='25e4ce613fb7e08cb6bf04bf64e6f14860a15b05'
          assert c['parentEvidence']['step12v3WorkflowRunId']==31659518059
          assert c['marketEvidence']['providerMarketKey']=='pitcher_earned_runs'
          assert c['marketEvidence']['repositoryRegistryEntryAlreadyExists'] is True
          assert c['marketEvidence']['repositoryRegistryFamily']=='PITCHER_PROP'
          assert c['marketEvidence']['repositoryRegistryQuoteShape']=='PLAYER_OVER_UNDER'
          assert c['marketEvidence']['repositoryModelIntegrationStatusExpected']=='NOT_IMPLEMENTED'
          assert c['marketEvidence']['hardRockExactFirstPartyProductEvidenceExistsInRegistry'] is True
          assert c['marketEvidence']['hardRockEvidenceSourceId']=='HARD_ROCK_MLB_GUIDE_20260807'
          assert c['marketEvidence']['hardRockFloridaPerEventAvailabilityEstablished'] is False
          d=c['dataBoundary']
          assert d['modelFitSeason']=='2022' and d['validationSeason']=='2023'
          assert d['retrospectiveEvaluationSeasons']==['2024','2025','2026_YTD']
          assert d['requiresExactProbableEqualsRecordedStarter'] is True
          assert d['sameDateHistoryAllowed'] is False and d['seasonHistoryReset'] is True
          assert d['scoreWholeDateBeforeUpdatingAnySameDateState'] is True
          assert d['historicalPitcherEarnedRunPricesUsed'] is False
          e=c['featureEngineering']
          assert e['rateShrinkagePriorBattersFaced']==72 and e['workloadShrinkagePriorStarts']==5
          assert e['opponentRateShrinkagePriorBattersFaced']==72 and e['opponentWorkloadShrinkagePriorGames']==5
          assert e['recentStartsWindow']==5
          f=c['features']
          assert f['featureCount']==12 and len(f['exactly'])==12 and len(set(f['exactly']))==12
          assert f['featureSearchAllowed'] is False and f['postResultFeatureAdditionAllowed'] is False and f['postResultFeatureRemovalAllowed'] is False
          assert set(f['exactly'])=={
            'pitcher_erbf_shrunk','pitcher_hrbf_shrunk','pitcher_bbbf_shrunk','pitcher_kbf_shrunk',
            'pitcher_bf_per_start_shrunk','pitcher_recent5_er_per_start','pitcher_recent5_bf_per_start',
            'opponent_vs_starters_erbf_scored_shrunk','opponent_vs_starters_bf_per_game_shrunk',
            'opponent_rs10','opponent_lineup_continuity','pitcher_prior_bf'
          }
          assert c['baselines']['pitcherOnlyMechanistic']=='PITCHER_ERBF_SHRUNK_TIMES_PITCHER_BF_PER_START_SHRUNK'
          m=c['model']
          assert m['providerMarketKey']=='pitcher_earned_runs' and m['canonicalResearchMarketType']=='PITCHER_EARNED_RUNS'
          assert m['poissonAlpha']==1.0 and m['maxIter']==1000
          assert m['fixedHalfRunLines']==[0.5,1.5,2.5,3.5,4.5]
          assert m['lineSearchAllowed'] is False and m['modelSelectionAllowed'] is False and m['hyperparameterSearchAllowed'] is False
          assert c['statistics']['postResultRuleChangeAllowed'] is False
          assert c['policy']['productionMarketRegistryChangeAllowed'] is False
          assert c['policy']['betEliteAllowed'] is False and c['policy']['realFinancialExposure']==0

          registry=open('server/mlb-market-universe-registry.ts',encoding='utf-8').read()
          assert '["pitcher_earned_runs", "Pitcher earned runs", "PITCHER_PROP", "PLAYER_OVER_UNDER"]' in registry
          assert 'pitcher_earned_runs: ["HARD_ROCK_MLB_GUIDE_20260807"]' in registry
          canonical=registry.split('const CANONICAL_BY_PROVIDER_KEY',1)[1].split('});',1)[0]
          assert 'pitcher_earned_runs:' not in canonical
          print('STEP12V35_PITCHER_EARNED_RUNS_CONTRACT_LOCKED')
          PY

      - name: Syntax check V35 scorer
        run: python -m py_compile scripts/p0-step12v35-pitcher-earned-runs-baseline.py

      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Run V35 exact probable-starter pitcher earned-runs model
        run: |
          mkdir -p artifacts/p0-step12v35
          python scripts/p0-step12v35-pitcher-earned-runs-baseline.py \
            --root artifacts/p0-step12v3 \
            --contract research/p0-step12v35-pitcher-earned-runs-baseline-contract.json \
            --out artifacts/p0-step12v35/pitcher-earned-runs-baseline-report.json

      - name: Validate player prop custody, model, and safety boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v35/pitcher-earned-runs-baseline-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v35-pitcher-earned-runs-baseline.v1'
          assert r['data']['featureCount']==12
          assert r['data']['sameDateHistoryAllowed'] is False and r['data']['seasonHistoryReset'] is True
          assert set(r['data']['custodyBySeason'])=={'2022','2023','2024','2025','2026_YTD'}
          total_slots=0; total_eligible=0
          for c in r['data']['custodyBySeason'].values():
              assert c['canonicalStarterSlots']==2*c['canonicalT5Games']
              assert c['auditValidProbableStarterSlots']>0.98*c['canonicalStarterSlots']
              assert c['exactProbableRecordedStarterEligibleSlots']>0.98*c['canonicalStarterSlots']
              assert c['completeAuditValidLineupPairs']>0.98*c['canonicalT5Games']
              total_slots += c['canonicalStarterSlots']
              total_eligible += c['exactProbableRecordedStarterEligibleSlots']
          assert r['data']['scoredRows']==total_eligible==22753
          assert r['model']['providerMarketKey']=='pitcher_earned_runs'
          assert r['model']['canonicalResearchMarketType']=='PITCHER_EARNED_RUNS'
          assert r['model']['trainingRows']==4777 and r['model']['trainingSeason']=='2022'
          assert r['model']['fixedHalfRunLines']==[0.5,1.5,2.5,3.5,4.5]
          assert r['model']['featureSearchUsed'] is False
          assert r['model']['modelSearchUsed'] is False
          assert r['model']['hyperparameterSearchUsed'] is False
          assert r['model']['lineSearchUsed'] is False
          assert r['validation2023']['rows']==4791
          assert r['evaluation2024_2026Ytd']['rows']==13185
          assert set(r['bySeasonDescriptiveOnly'])=={'2023','2024','2025','2026_YTD'}
          assert r['volumeDiagnostics']['eligibilityShare']>0.997
          mb=r['marketBoundary']
          assert mb['providerMarketKey']=='pitcher_earned_runs' and mb['repositoryRegistryFamily']=='PITCHER_PROP'
          assert mb['hardRockFloridaPerEventAvailabilityEstablished'] is False
          assert mb['productionRegistryChanged'] is False
          assert mb['historicalPitcherEarnedRunPricesUsed'] is False
          assert mb['positiveEvEstablished'] is False and mb['priceCaptureAuthorized'] is False and mb['productionPromotionAuthorized'] is False
          p=r['policy']
          for key in ['sameDateOutcomeLeakageAllowed','futureGameDataAllowed','featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','lineSearchUsed','thresholdSearchUsed','subsetMiningUsed','postResultRuleChangeUsed','productionMarketRegistryChanged','liveLookupAuthorizationChanged','liveMarketDiscoveryChanged','rankingChanged','stakeChanged','betEliteAllowed','automaticBetPlacementAllowed']:
              assert p[key] is False
          assert p['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'candidateRubricPassed':r['candidateRubricPassed'],
            'validation2023':r['validation2023'],
            'evaluation2024_2026Ytd':r['evaluation2024_2026Ytd'],
            'bySeason':r['bySeasonDescriptiveOnly'],
            'candidateRubricChecks':r['candidateRubricChecks'],
            'volumeDiagnostics':r['volumeDiagnostics'],
          },indent=2))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Preserve canonical MLB regressions and unchanged registry
        run: |
          npm ci
          npx tsx --test server/mlb-full13-live-feature-builder.test.ts server/mlb-market-universe-registry.test.ts server/mlb-market-odds-normalizer.test.ts
          npm run build:backend
          grep -F '["pitcher_earned_runs", "Pitcher earned runs", "PITCHER_PROP", "PLAYER_OVER_UNDER"]' server/mlb-market-universe-registry.ts
          grep -F 'pitcher_earned_runs: ["HARD_ROCK_MLB_GUIDE_20260807"]' server/mlb-market-universe-registry.ts

      - name: Upload V35 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v35-pitcher-earned-runs-baseline
          path: artifacts/p0-step12v35/
          if-no-files-found: error
          retention-days: 30
