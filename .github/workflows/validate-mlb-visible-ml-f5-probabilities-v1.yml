name: Validate MLB Visible ML F5 Probabilities V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/mlb-daily-opportunity-context-v1.ts'
      - 'server/mlb-daily-opportunity-context-v1.test.ts'
      - 'server/mlb-whole-slate-sporting-finalization-v1.ts'
      - 'server/mlb-visible-market-probabilities-v1.test.ts'
      - 'frontend/client/src/components/mlb-sporting-daily-pick-control.tsx'
      - '.github/workflows/validate-mlb-visible-ml-f5-probabilities-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Test ML and F5 probability transport
        run: |
          npx tsx --test \
            server/mlb-daily-opportunity-context-v1.test.ts \
            server/mlb-visible-market-probabilities-v1.test.ts
      - name: Bundle-check sporting probability path
        run: |
          npx esbuild server/mlb-daily-opportunity-context-v1.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-context.mjs
          npx esbuild server/mlb-whole-slate-sporting-finalization-v1.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-finalization.mjs
      - name: Prove price boundary is unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'marketPricesRead: false' server/mlb-daily-opportunity-context-v1.ts
          grep -F 'oddsRead: false' server/mlb-whole-slate-sporting-finalization-v1.ts
          grep -F 'priceMayCreateSportingPick: false' server/mlb-whole-slate-sporting-finalization-v1.ts
      - name: Diff integrity
        run: git diff --check origin/main...HEAD

  validate-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Type-check frontend
        run: npm run check
      - name: Prove ML and F5 market matrix is visible
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Probabilidades V16 por mercado · sin cuotas' client/src/components/mlb-sporting-daily-pick-control.tsx
          grep -F '>ML<' client/src/components/mlb-sporting-daily-pick-control.tsx
          grep -F '>ML F5<' client/src/components/mlb-sporting-daily-pick-control.tsx
          grep -F 'Empate / Push' client/src/components/mlb-sporting-daily-pick-control.tsx
      - name: Build frontend
        env:
          VITE_API_BASE_URL: https://web-production-7067b.up.railway.app
        run: npm run build
