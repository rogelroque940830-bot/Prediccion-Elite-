name: WNBA R1A.1 Sportradar Probe

on:
  workflow_dispatch:
    inputs:
      access_level:
        description: Sportradar access level
        required: true
        default: trial
        type: choice
        options:
          - trial
          - production

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Sportradar API key
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
        run: |
          test -n "$SPORTRADAR_API_KEY" || { echo 'SPORTRADAR_API_KEY secret is not configured; empirical certification cannot run.'; exit 2; }
      - name: Run outcome-blind historical Daily Injuries probe
        env:
          SPORTRADAR_API_KEY: ${{ secrets.SPORTRADAR_API_KEY }}
          SPORTRADAR_ACCESS_LEVEL: ${{ inputs.access_level }}
        run: python scripts/wnba-r1a1-sportradar-probe.py --out wnba-r1a1-sportradar-probe.json
      - name: Upload probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a1-sportradar-probe-${{ github.run_id }}
          path: wnba-r1a1-sportradar-probe.json
          if-no-files-found: error
