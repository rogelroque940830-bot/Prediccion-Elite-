name: Validate P0 Step 12I Clean T5 Feature Table

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/p0-step12i-clean-t5-feature-table.py'
      - 'scripts/p0-step12i-clean-t5-feature-table.test.py'
      - '.github/workflows/validate-p0-step12i-clean-t5-feature-table.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-step12i-clean-t5-feature-table:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Syntax-check Step 12I
        run: |
          python -m py_compile scripts/p0-step12i-clean-t5-feature-table.py scripts/p0-step12i-clean-t5-feature-table.test.py

      - name: Prove T-5 identity and same-date leakage invariants
        run: python scripts/p0-step12i-clean-t5-feature-table.test.py

      - name: Freeze clean feature contract
        shell: bash
        run: |
          set -euo pipefail
          f='scripts/p0-step12i-clean-t5-feature-table.py'
          grep -F "'currentGameStarterIdentity': 'T5_PROBABLE_PITCHER_ONLY'" "$f"
          grep -F "'starterPerformanceHistory': 'COMPLETED_PRIOR_DATES_ONLY_FROM_FINAL_BOXSCORES'" "$f"
          grep -F "'sameDateHistoryAllowed': False" "$f"
          grep -F "'rawCumulativeLineupExperienceAllowedForDiscovery': False" "$f"
          grep -F "'thresholdSearchPerformed': False" "$f"
          grep -F "'candidateSearchPerformed': False" "$f"
          grep -F "'betEliteProduced': False" "$f"
          grep -F "'livePickFiltersChanged': False" "$f"
          grep -F "'step11cCapturePopulationChanged': False" "$f"
          ! grep -E "betEliteProduced['\"]?:[[:space:]]*True|livePickFiltersChanged['\"]?:[[:space:]]*True|automaticBetPlacement['\"]?:[[:space:]]*True" "$f"
          git diff --check

      - name: Preserve live regressions
        run: |
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
