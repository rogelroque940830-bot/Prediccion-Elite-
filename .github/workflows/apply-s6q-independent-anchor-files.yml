name: Apply S6Q Independent Anchor Files

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6q-independent-anchor-files.mjs'
      - '.github/workflows/apply-s6q-independent-anchor-files.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize current S6Q option name
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-s6q-independent-anchor-files.mjs')
          source = path.read_text()
          source = source.replace(
              '  evidenceDigestAnchorSha256?: string | null;',
              '  previousEvidenceDigestAnchorSha256?: string | null;',
          )
          path.write_text(source)
          PY
      - name: Apply independent S6Q anchor files
        run: node scripts/patch-s6q-independent-anchor-files.mjs
      - name: Commit permanent hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/mlb-s6q-fifty-settlement-human-review.ts \
            server/mlb-s6q-fifty-settlement-human-review.test.ts
          if git diff --cached --quiet; then
            echo 'No independent-anchor changes required.'
            exit 0
          fi
          git commit -m 'Persist independent S6Q integrity anchors'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
