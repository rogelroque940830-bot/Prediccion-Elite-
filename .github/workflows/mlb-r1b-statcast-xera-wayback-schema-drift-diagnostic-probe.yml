name: MLB R1B Statcast xERA Wayback Schema Drift Diagnostic Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe.mjs
      - .github/workflows/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Diagnose archived Savant Expected Statistics schema drift
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe
          node scripts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe.mjs \
            --out=artifacts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe/evidence.json

      - name: Enforce diagnostic scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe/evidence.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          if(e.status!=='PRIMARY_SAVANT_ARCHIVED_EXPECTED_STATS_SCHEMA_DRIFT_DIAGNOSTIC_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.scientificPolicy?.primaryPublisherOnly!==true) throw new Error('primary only');
          if(e.scientificPolicy?.noInterpolation!==true) throw new Error('interpolation');
          if(e.scientificPolicy?.noEmpiricalFit!==true) throw new Error('fit');
          if(e.scientificPolicy?.approximationForbidden!==true) throw new Error('approximation');
          if(e.scientificPolicy?.diagnosticOnly!==true) throw new Error('diagnostic');
          if(e.summary?.schemaDriftResolved!==false) throw new Error('premature schema resolution');
          if(e.summary?.exactTargetDateXeraCustodyForFullUniverseProven!==false) throw new Error('premature custody');
          if(e.summary?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('boundary');
          NODE

      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe.mjs
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'noEmpiricalFit:true' "$src"
          grep -F 'noInterpolation:true' "$src"
          grep -F 'familyPromotionAuthorized:false' "$src"

      - name: Backend build regression
        run: npm run build:backend

      - name: Upload schema drift diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe
          path: artifacts/mlb-r1b-statcast-xera-wayback-schema-drift-diagnostic-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
