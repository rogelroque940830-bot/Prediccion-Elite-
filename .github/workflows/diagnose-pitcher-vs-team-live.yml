name: Diagnose live pitcher name sources

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  diagnose-live:
    runs-on: ubuntu-latest
    steps:
      - name: Compare backend and MLB feed pitcher names
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          GAME_PK: '822868'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/pitcher-vs-team/$GAME_PK" > /tmp/pvt.json
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/all?date=2026-07-27" > /tmp/all.json
          curl --fail --silent --show-error "https://statsapi.mlb.com/api/v1.1/game/$GAME_PK/feed/live" > /tmp/feed.json
          echo '=== PITCHER VS TEAM ==='
          jq '{homeName:.homeVsAway.pitcherName,awayName:.awayVsHome.pitcherName,homeOpponent:.homeVsAway.opponentTeamName,awayOpponent:.awayVsHome.opponentTeamName}' /tmp/pvt.json
          echo '=== MLB ALL ==='
          jq '.games[] | select(.gamePk == 822868) | {homePitcher:(.homePitcher|{id,name}),awayPitcher:(.awayPitcher|{id,name})}' /tmp/all.json
          echo '=== OFFICIAL FEED ==='
          jq '{
            probablePitchers:.gameData.probablePitchers,
            homeFirstPitcher: ((.liveData.boxscore.teams.home.pitchers[0] // 0) as $id | .gameData.players["ID\($id)"] | {id,fullName}),
            awayFirstPitcher: ((.liveData.boxscore.teams.away.pitchers[0] // 0) as $id | .gameData.players["ID\($id)"] | {id,fullName})
          }' /tmp/feed.json
