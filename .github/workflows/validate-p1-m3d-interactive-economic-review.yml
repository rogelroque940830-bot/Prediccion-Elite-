name: Validate P1-M3D Interactive Economic Review

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-p1-economic-review.ts'
      - 'server/mlb-p1-economic-review-routes.ts'
      - 'server/mlb-p1-economic-review.test.ts'
      - 'server/mlb-p1-operating-envelope-routes.ts'
      - 'server/mlb-p1-real-cohort-activation.ts'
      - 'server/mlb-p1-real-cohort-activation.test.ts'
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-odds-normalizer.test.ts'
      - 'server/mlb-market-universe-odds-routes.ts'
      - 'server/mlb-market-universe-odds-routes.test.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.test.ts'
      - 'server/mlb-statcast-matchup-identity-routes.ts'
      - 'server/mlb-statcast-matchup-identity-routes.test.ts'
      - 'server/mlb-statcast-matchup-certifier.ts'
      - 'server/mlb-statcast-matchup-certifier.test.ts'
      - 'server/routes.ts'
      - 'server/route-contract.extensions.json'
      - 'docs/P1_M3D_INTERACTIVE_ECONOMIC_REVIEW.md'
      - 'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md'
      - 'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md'
      - 'docs/P1_M3F3B5B_STATCAST_CERTIFICATION.md'
      - 'docs/P1_M5A_REAL_COHORT_ACTIVATION.md'
      - 'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md'
      - 'tsconfig.p1-m3d-interactive-economic-review.json'
      - 'tsconfig.p1-m3e-operating-envelope.json'
      - 'tsconfig.p1-m3f3b5-vsteam-identity.json'
      - 'tsconfig.p1-m5a-real-cohort-activation.json'
      - 'tsconfig.p1-m6a2-market-odds.json'
      - '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml'
      - '.github/workflows/validate-p1-m3d-interactive-economic-review.yml'
      - '.github/workflows/validate-p1-m3e-operating-envelope.yml'
      - '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml'
      - '.github/workflows/validate-p1-m3f3b5b-statcast-certification.yml'
      - '.github/workflows/validate-p1-m4c-backend-economic-response.yml'
      - '.github/workflows/validate-p1-m5a-real-cohort-activation.yml'
      - '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3d:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck P1-M3D surface
        run: npx tsc -p tsconfig.p1-m3d-interactive-economic-review.json
      - name: Run focused economic review and contract regressions
        run: |
          npx tsx --test \
            server/mlb-p1-economic-review.test.ts \
            server/mlb-shadow-evaluation.test.ts \
            server/mlb-p1-economic-decision-adapter.test.ts \
            server/mlb-p1-scientific-capture-service.test.ts
      - name: Verify modular routes and production backend build
        run: |
          npm run test:s3-modularization
          npm run build:backend
      - name: Run S5A real-save regression
        run: npm run test:s5a-e2e
      - name: Run complete S5B/S6 scientific regression
        run: npm run test:s5b-shadow
      - name: Verify P1-M3D endpoint and safety contract
        shell: bash
        run: |
          set -euo pipefail
          review='server/mlb-p1-economic-review.ts'
          routes='server/mlb-p1-economic-review-routes.ts'
          composition='server/routes.ts'

          grep -F 'courtedge-p1-m3d-interactive-economic-review.v1' "$review"
          grep -F '/api/mlb/p1/v1/economic-review' "$review"
          grep -F 'INTERACTIVE_MLB_PREDICTOR' "$review"
          grep -F 'terminalSupersessionLeavesOnly: true' "$review"
          grep -F 'buildMlbShadowRows' "$review"
          grep -F 'flatStakeRoiPct' "$review"
          grep -F 'policyStakeRoiPct' "$review"
          grep -F 'brierScore' "$review"
          grep -F 'logLoss' "$review"
          grep -F 'meanClvPp' "$review"
          grep -F 'leanPassInfoControls' "$review"
          grep -F 'conclusionsAllowed: false' "$review"
          grep -F 'automaticModelChangesAllowed: false' "$review"
          grep -F 'automaticPromotionAllowed: false' "$review"
          grep -F 'mode: "SHADOW_ECONOMIC_REVIEW"' "$review"
          grep -F 'realFinancialExposure: 0' "$review"
          grep -F 'productionWrites: false' "$review"
          grep -F 'settlementWrites: false' "$review"
          grep -F 'app.get(' "$routes"
          grep -F '"/api/mlb/p1/v1/economic-review"' "$routes"
          grep -F 'ownershipStore.listPredictionIds(userId)' "$routes"
          grep -F 'store.getRecord(predictionId)' "$routes"
          grep -F 'requireInteractiveMlbCaptureSession' "$routes"
          grep -F 'registerMlbP1EconomicReviewRoutes(app)' "$composition"
          grep -F '"GET", "path": "/api/mlb/p1/v1/economic-review"' server/route-contract.extensions.json

          ! grep -E 'app\.(post|put|patch|delete)\(' "$routes"
          ! grep -E 'appendOwnedPrediction|appendOwnedSettlement|appendPrediction|appendSettlement' "$review" "$routes"
          ! grep -E 'sportsbookIntegration:[[:space:]]*true|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]|automaticModelChangesAllowed:[[:space:]]*true|automaticPromotionAllowed:[[:space:]]*true' "$review" "$routes"
      - name: Diff hygiene and protected successor scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-staging-secure --depth=1
          git diff --check origin/integration/p0-staging-secure...HEAD
          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)

          # P1-M3D owns the read-only economic-review boundary. P1-M3E and
          # P1-M3F3B5/B5B may extend read-only/identity-safe analytical routing,
          # while P1-M6A2 remains read-only market evidence. None may mutate
          # the M3D report or write boundaries.
          allowed=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml' \
            '.github/workflows/validate-p1-m3d-interactive-economic-review.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope.yml' \
            '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml' \
            '.github/workflows/validate-p1-m3f3b5b-statcast-certification.yml' \
            '.github/workflows/validate-p1-m4c-backend-economic-response.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation.yml' \
            '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml' \
            'docs/P1_M3D_INTERACTIVE_ECONOMIC_REVIEW.md' \
            'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md' \
            'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md' \
            'docs/P1_M3F3B5B_STATCAST_CERTIFICATION.md' \
            'docs/P1_M5A_REAL_COHORT_ACTIVATION.md' \
            'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md' \
            'server/mlb-market-odds-normalizer.test.ts' \
            'server/mlb-market-odds-normalizer.ts' \
            'server/mlb-market-universe-odds-routes.test.ts' \
            'server/mlb-market-universe-odds-routes.ts' \
            'server/mlb-p1-economic-review-routes.ts' \
            'server/mlb-p1-economic-review.test.ts' \
            'server/mlb-p1-economic-review.ts' \
            'server/mlb-p1-operating-envelope-routes.ts' \
            'server/mlb-p1-real-cohort-activation.test.ts' \
            'server/mlb-p1-real-cohort-activation.ts' \
            'server/mlb-statcast-matchup-certifier.test.ts' \
            'server/mlb-statcast-matchup-certifier.ts' \
            'server/mlb-statcast-matchup-identity-routes.test.ts' \
            'server/mlb-statcast-matchup-identity-routes.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.test.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.ts' \
            'server/route-contract.extensions.json' \
            'server/routes.ts' \
            'tsconfig.p1-m3d-interactive-economic-review.json' \
            'tsconfig.p1-m3e-operating-envelope.json' \
            'tsconfig.p1-m3f3b5-vsteam-identity.json' \
            'tsconfig.p1-m5a-real-cohort-activation.json' \
            'tsconfig.p1-m6a2-market-odds.json' | sort)
          unexpected=$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))
          [[ -z "$unexpected" ]]

          if grep -Fxq 'server/mlb-p1-real-cohort-activation.ts' <<< "$changed"; then
            grep -Fxq 'server/mlb-p1-real-cohort-activation.test.ts' <<< "$changed"
            grep -Fxq 'server/mlb-p1-economic-review.ts' <<< "$changed"
            grep -Fxq 'server/mlb-p1-economic-review.test.ts' <<< "$changed"
            grep -Fxq 'docs/P1_M5A_REAL_COHORT_ACTIVATION.md' <<< "$changed"
            grep -Fxq 'tsconfig.p1-m5a-real-cohort-activation.json' <<< "$changed"
            grep -Fxq '.github/workflows/validate-p1-m5a-real-cohort-activation.yml' <<< "$changed"
          fi
