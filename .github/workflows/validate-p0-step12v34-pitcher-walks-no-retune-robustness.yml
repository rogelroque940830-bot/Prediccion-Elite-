name: Validate P0 Step 12V34 Pitcher Walks No Retune Robustness

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v34-pitcher-walks-no-retune-robustness-contract.json'
      - 'scripts/p0-step12v34-pitcher-walks-no-retune-robustness.py'
      - '.github/workflows/validate-p0-step12v34-pitcher-walks-no-retune-robustness.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scipy==1.18.0' 'scikit-learn==1.8.0'
      - name: Validate frozen V34 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v34-pitcher-walks-no-retune-robustness-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v34-pitcher-walks-no-retune-robustness-contract.v1'
          assert c['parentEvidence']['mainBaseSha']=='629d014f8f2be6cc16e29b9fcabcb4258a659e10'
          assert c['parentEvidence']['v33WorkflowRunId']==31900247122
          assert c['parentEvidence']['v33ArtifactId']==9250897763
          assert c['parentEvidence']['v33ArtifactDigest']=='sha256:0d11229fc91774c0ae25e5b94b809f040a62d0c4c1856ef4776cb8ece3bb51f0'
          assert c['parentEvidence']['v33ClassificationRequired']=='PITCHER_WALKS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          m=c['modelBoundary']
          assert m['sourceImplementation']=='scripts/p0-step12v33-pitcher-walks-baseline.py'
          assert m['unchangedV33TrainingSeasonRequired']=='2022'
          assert m['unchangedV33PoissonAlphaRequired']==1.0
          assert m['unchangedV33FixedLinesRequired']==[0.5,1.5,2.5,3.5,4.5]
          assert m['unchangedV33PitcherOnlyBaselineRequired']=='PITCHER_BBBF_SHRUNK_TIMES_PITCHER_BF_PER_START_SHRUNK'
          for key in ['refitWithAdditionalSeasonsAllowed','recalibrationAllowed','coefficientChangeAllowed','featureChangeAllowed','imputationChangeAllowed','scalingChangeAllowed','dispersionChangeAllowed','lineSetChangeAllowed','baselineFormulaChangeAllowed','thresholdSearchAllowed']:
              assert m[key] is False
          assert c['replayParity']['absoluteTolerance']==1e-12
          s=c['seasonStabilityGate']
          assert s['partitions']==['2023','2024','2025','2026_YTD']
          assert s['requireModelDevianceBeatConstantEachPartition'] is True
          assert s['requireModelDevianceBeatPitcherOnlyEachPartition'] is True
          assert s['requireModelAverageBrierBeatConstantEachPartition'] is True
          assert s['requireModelAverageBrierBeatPitcherOnlyEachPartition'] is True
          assert s['requireModelAbsoluteMeanBiasNoWorseThanConstantEachPartition'] is True
          assert s['requireModelAbsoluteMeanBiasNoWorseThanPitcherOnlyEachPartition'] is True
          b=c['dateClusterBootstrapGate']
          assert b['replicates']==10000 and b['randomSeed']==3401 and b['confidenceLevel']==0.95
          assert len(b['metrics'])==4
          assert c['policy']['betEliteAllowed'] is False and c['policy']['realFinancialExposure']==0
          print('STEP12V34_GATE_PREDECLARED')
          PY
      - name: Syntax check V34 scorer
        run: python -m py_compile scripts/p0-step12v34-pitcher-walks-no-retune-robustness.py
      - name: Download immutable V33 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v33-pitcher-walks-baseline
          path: artifacts/p0-step12v33
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31900247122
      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Verify V33 parent custody
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v33/pitcher-walks-baseline-report.json'))
          assert r['classification']=='PITCHER_WALKS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          assert r['candidateRubricPassed'] is True
          assert all(r['candidateRubricChecks'].values())
          assert r['data']['scoredRows']==22753
          assert r['model']['trainingRows']==4777
          assert r['volumeDiagnostics']['eligibilityShare']>0.997
          print('V33_PARENT_CUSTODY_VERIFIED')
          PY
      - name: Run V34 exact V33 replay and robustness gate
        run: |
          mkdir -p artifacts/p0-step12v34
          python scripts/p0-step12v34-pitcher-walks-no-retune-robustness.py \
            --root artifacts/p0-step12v3 \
            --contract research/p0-step12v34-pitcher-walks-no-retune-robustness-contract.json \
            --v33-contract research/p0-step12v33-pitcher-walks-baseline-contract.json \
            --v33-script scripts/p0-step12v33-pitcher-walks-baseline.py \
            --v33-report artifacts/p0-step12v33/pitcher-walks-baseline-report.json \
            --out artifacts/p0-step12v34/pitcher-walks-no-retune-robustness-report.json
      - name: Validate immutable replay and safety boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v34/pitcher-walks-no-retune-robustness-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v34-pitcher-walks-no-retune-robustness.v1'
          assert r['parent']['v33Classification']=='PITCHER_WALKS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          assert r['modelBoundary']['unchangedV33ImplementationReplayed'] is True
          assert r['modelBoundary']['replayParityPassed'] is True
          assert r['modelBoundary']['replayParityTolerance']==1e-12
          assert r['data']['scoredRows']==22753 and r['data']['featureCount']==12
          assert set(r['seasonMetrics'])=={'2023','2024','2025','2026_YTD'}
          b=r['dateClusterBootstrap']
          assert b['replicates']==10000 and b['randomSeed']==3401 and b['confidenceLevel']==0.95
          assert b['uniqueDates']>490
          assert set(b['metrics'])=={'devianceVsConstant','devianceVsPitcherOnly','averageBrierVsConstant','averageBrierVsPitcherOnly'}
          mb=r['marketBoundary']
          assert mb['providerMarketKey']=='pitcher_walks'
          assert mb['historicalPitcherWalkPricesUsed'] is False
          assert mb['positiveEvEstablished'] is False
          assert mb['hardRockFloridaPerEventAvailabilityEstablished'] is False
          assert mb['productionPromotionAuthorized'] is False
          assert mb['prospectivePriceCaptureEngineeringAuthorized']==r['robustnessGatePassed']
          p=r['policy']
          for key in ['featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','lineSearchUsed','thresholdSearchUsed','subsetMiningUsed','postResultRuleChangeUsed','productionMarketRegistryChanged','liveLookupAuthorizationChanged','liveMarketDiscoveryChanged','rankingChanged','stakeChanged','betEliteAllowed','automaticBetPlacementAllowed']:
              assert p[key] is False
          assert p['realFinancialExposure']==0
          print(json.dumps({'classification':r['classification'],'robustnessGatePassed':r['robustnessGatePassed'],'seasonStabilityGatePassed':r['seasonStabilityGatePassed'],'seasonStabilityChecks':r['seasonStabilityChecks'],'seasonMetrics':r['seasonMetrics'],'bootstrapGatePassed':r['bootstrapGatePassed'],'dateClusterBootstrap':r['dateClusterBootstrap'],'bootstrapChecks':r['bootstrapChecks']},indent=2))
          PY
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Preserve canonical MLB regressions and registry
        run: |
          npm ci
          npx tsx --test server/mlb-full13-live-feature-builder.test.ts server/mlb-market-universe-registry.test.ts server/mlb-market-odds-normalizer.test.ts
          npm run build:backend
          grep -F 'pitcher_walks: ["HARD_ROCK_MLB_GUIDE_20260807"]' server/mlb-market-universe-registry.ts
      - name: Upload V34 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v34-pitcher-walks-no-retune-robustness
          path: artifacts/p0-step12v34/
          if-no-files-found: error
          retention-days: 30
