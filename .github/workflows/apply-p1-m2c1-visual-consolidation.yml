name: Apply P1-M2C.1 Visual Consolidation

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - 'scripts/apply-p1-m2c1-visual-consolidation.mjs'
      - '.github/workflows/apply-p1-m2c1-visual-consolidation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-visual-consolidation:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/p1-m2c1-mlb-visual-consolidation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/p1-m2c1-mlb-visual-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Apply deterministic page patch
        run: node scripts/apply-p1-m2c1-visual-consolidation.mjs
      - name: Verify only the predictor page changed
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git status --short | awk '{print $2}')
          [[ "${changed}" == 'frontend/client/src/pages/mlb-predictor.tsx' ]]
          git diff --check
      - name: Commit the page consolidation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/pages/mlb-predictor.tsx
          git commit -m 'P1-M2C.1: consolidate the MLB operational flow'
          git push origin HEAD:feature/p1-m2c1-mlb-visual-consolidation
