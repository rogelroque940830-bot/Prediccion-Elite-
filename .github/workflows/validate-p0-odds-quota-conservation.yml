name: Validate P0 Odds Quota Conservation

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-quota-conservation.yml'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-odds-quota-conservation.test.ts'
      - 'server/mlb-f5-odds-routes.ts'
      - 'server/mlb-s5c-shadow-ingestion.ts'
      - 'server/mlb-s5e-coverage-service.ts'
      - 'server/mlb-closing-line-worker.ts'
      - 'server/odds-demand-policy.ts'
      - 'server/mlb-market-universe-registry.ts'
      - 'server/mlb-market-universe-registry.test.ts'
      - 'server/mlb-odds-budget-controller.ts'
      - 'server/mlb-odds-budget-controller.test.ts'
      - 'server/mlb-odds-budget-controller-concurrency.test.ts'
      - 'server/mlb-cheap-screening.ts'
      - 'server/mlb-cheap-screening.test.ts'
      - 'server/mlb-shortlist.ts'
      - 'server/mlb-shortlist.test.ts'
      - 'server/mlb-market-discovery.ts'
      - 'server/mlb-market-discovery.test.ts'
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-contract.ts'
      - 'server/index.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Quota conservation, F5, registry, budget, cheap-screen, shortlist and market-discovery falsification tests
        run: >-
          npx tsx --test
          server/mlb-odds-quota-conservation.test.ts
          server/mlb-f5-odds-routes.test.ts
          server/mlb-s5c-shadow-ingestion.test.ts
          server/mlb-s5e-coverage-service.test.ts
          server/mlb-market-universe-registry.test.ts
          server/mlb-odds-budget-controller.test.ts
          server/mlb-odds-budget-controller-concurrency.test.ts
          server/mlb-cheap-screening.test.ts
          server/mlb-shortlist.test.ts
          server/mlb-market-discovery.test.ts

      - name: Preserve modular routes and production bundle
        run: |
          npm run test:s3-modularization
          npm run build:backend

      - name: Prove provider quota cannot be consumed by legacy/background/registry/budget/cheap-screen/shortlist/discovery paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'api.the-odds-api.com' server/legacy-picks-routes.ts
          ! grep -F 'ODDS_API_KEY' server/legacy-picks-routes.ts
          ! grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          ! grep -F 'pollOddsForSport' server/legacy-picks-routes.ts
          grep -F 'Legacy provider polling was permanently removed' server/legacy-picks-routes.ts

          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          grep -F 'F5_BACKGROUND_CACHE_TTL_MS = 5 * 60 * 1000' server/mlb-f5-odds-routes.ts
          grep -F 'BACKGROUND_CACHE_MISS' server/mlb-f5-odds-routes.ts

          grep -F 'isMlbClosingLineCaptureEnabled' server/index.ts
          grep -F 'if (mlbClosingLineCaptureEnabled)' server/index.ts

          ! grep -nE 'setInterval|setTimeout' server/mlb-market-universe-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/mlb-f5-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/market-support-routes.ts
          ! grep -nE '\bfetch\s*\(|ODDS_API_KEY|api\.the-odds-api\.com|setInterval|setTimeout' server/mlb-market-universe-registry.ts
          ! grep -nE '\bfetch\s*\(|ODDS_API_KEY|process\.env|api\.the-odds-api\.com|setInterval|setTimeout' server/mlb-odds-budget-controller.ts
          ! grep -nE 'ODDS_API_KEY|api\.the-odds-api\.com|x-requests-|PREMIUM|ULTRA|setInterval|setTimeout' server/mlb-cheap-screening.ts
          ! grep -nE 'ODDS_API_KEY|api\.the-odds-api\.com|x-requests-|setInterval|setTimeout' server/mlb-shortlist.ts
          ! grep -nE '\bfetch\s*\(|ODDS_API_KEY|api\.the-odds-api\.com|x-requests-|setInterval|setTimeout|PREMIUM|ULTRA' server/mlb-market-discovery.ts
          grep -F 'requiresMarketOdds: false' server/mlb-cheap-screening.ts
          grep -F 'theOddsApiCreditsConsumed: 0' server/mlb-cheap-screening.ts
          grep -F 'deferredGamesRequireNewExplicitRun: true' server/mlb-cheap-screening.ts
          grep -F 'requiresMarketOdds: false' server/mlb-shortlist.ts
          grep -F 'theOddsApiCreditsConsumed: 0' server/mlb-shortlist.ts
          grep -F 'weightsApplied: false' server/mlb-shortlist.ts
          grep -F 'forcedQuota: false' server/mlb-shortlist.ts
          grep -F 'MLB_SHORTLIST_MAX_CANDIDATES = 8' server/mlb-shortlist.ts
          grep -F 'firstThreeInningsPriority: false' server/mlb-market-discovery.ts
          grep -F 'marketOrderCarriesPreference: false' server/mlb-market-discovery.ts
          grep -F 'researchOnlyMarketsConsumeProviderCredits: false' server/mlb-market-discovery.ts
          grep -F 'onlyFinalInputsMayAuthorizePaidLookup: true' server/mlb-market-discovery.ts
          grep -F 'callsTheOddsApi: false' server/mlb-market-discovery.ts
          grep -F 'theOddsApiCreditsConsumed: 0' server/mlb-market-discovery.ts
          grep -F 'PROVIDER_QUOTA_NOT_PROBED' server/mlb-odds-budget-controller.ts
          grep -F 'PROVIDER_REMAINING_INSUFFICIENT' server/mlb-odds-budget-controller.ts
          grep -F 'CONSERVATIVE_WORST_CASE' server/mlb-odds-budget-controller.ts
          grep -F 'PROVIDER_USAGE_INCONSISTENT' server/mlb-odds-budget-controller.ts
          git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
