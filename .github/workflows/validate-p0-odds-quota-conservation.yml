name: Validate P0 Odds Quota Conservation

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-quota-conservation.yml'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-odds-quota-conservation.test.ts'
      - 'server/mlb-f5-odds-routes.ts'
      - 'server/mlb-s5c-shadow-ingestion.ts'
      - 'server/mlb-s5e-coverage-service.ts'
      - 'server/mlb-closing-line-worker.ts'
      - 'server/odds-demand-policy.ts'
      - 'server/mlb-market-universe-registry.ts'
      - 'server/mlb-market-universe-registry.test.ts'
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-contract.ts'
      - 'server/index.ts'

permissions:
  contents: write

jobs:
  patch-registry-semantics:
    if: github.event.pull_request.head.ref == 'feature/p0-mlb-market-universe-registry-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Apply exact semantic corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('server/mlb-market-universe-registry.ts')
          text = registry_path.read_text()

          replacements = [
            (
              '  | "TEAM_THREE_WAY"\n  | "OVER_UNDER"\n',
              '  | "TEAM_THREE_WAY"\n  | "TEAM_SPREAD"\n  | "OVER_UNDER"\n',
            ),
            (
              '  h2h_1st_1_innings: ["HARD_ROCK_MLB_GUIDE_20260807"],\n',
              '',
            ),
            (
              'const HARD_ROCK_CATEGORY_ONLY_EVIDENCE: Readonly<Record<string, readonly string[]>> = Object.freeze({\n',
              'const HARD_ROCK_CATEGORY_ONLY_EVIDENCE: Readonly<Record<string, readonly string[]>> = Object.freeze({\n  h2h_1st_1_innings: ["HARD_ROCK_MLB_GUIDE_20260807"],\n',
            ),
            (
              'entry({ providerMarketKey: "spreads", displayName: "Run line / spread", documentationClass: "MLB_FEATURED", providerApplicability: "MLB_EXPLICIT", acquisition: "SPORT_ODDS_OR_EVENT_ODDS", period: "FULL_GAME", family: "RUN_LINE", quoteShape: "OVER_UNDER", notes:',
              'entry({ providerMarketKey: "spreads", displayName: "Run line / spread", documentationClass: "MLB_FEATURED", providerApplicability: "MLB_EXPLICIT", acquisition: "SPORT_ODDS_OR_EVENT_ODDS", period: "FULL_GAME", family: "RUN_LINE", quoteShape: "TEAM_SPREAD", notes:',
            ),
            (
              'entry({ providerMarketKey: "alternate_spreads", displayName: "Alternate run lines / spreads", documentationClass: "GENERAL_ADDITIONAL", providerApplicability: "LIVE_DISCOVERY_REQUIRED", acquisition: "EVENT_ODDS_ONLY", period: "FULL_GAME", family: "RUN_LINE", quoteShape: "OVER_UNDER", notes:',
              'entry({ providerMarketKey: "alternate_spreads", displayName: "Alternate run lines / spreads", documentationClass: "GENERAL_ADDITIONAL", providerApplicability: "LIVE_DISCOVERY_REQUIRED", acquisition: "EVENT_ODDS_ONLY", period: "FULL_GAME", family: "RUN_LINE", quoteShape: "TEAM_SPREAD", notes:',
            ),
            (
              '{ prefix: "spreads", label: "Run line / spread", family: "RUN_LINE" as const, quoteShape: "OVER_UNDER" as const },',
              '{ prefix: "spreads", label: "Run line / spread", family: "RUN_LINE" as const, quoteShape: "TEAM_SPREAD" as const },',
            ),
            (
              '{ prefix: "alternate_spreads", label: "Alternate run lines / spreads", family: "RUN_LINE" as const, quoteShape: "OVER_UNDER" as const },',
              '{ prefix: "alternate_spreads", label: "Alternate run lines / spreads", family: "RUN_LINE" as const, quoteShape: "TEAM_SPREAD" as const },',
            ),
          ]

          changed = False
          for old, new in replacements:
            count = text.count(old)
            if count == 1:
              text = text.replace(old, new, 1)
              changed = True
            elif count == 0 and new and new in text:
              pass
            elif count == 0 and new == '' and 'h2h_1st_1_innings: ["HARD_ROCK_MLB_GUIDE_20260807"],' not in text:
              pass
            else:
              raise SystemExit(f'exact registry semantic anchor count={count}: {old[:100]!r}')
          registry_path.write_text(text)

          test_path = Path('server/mlb-market-universe-registry.test.ts')
          test = test_path.read_text()
          marker = 'test("three-way markets remain contract mismatches and are never treated as two-way MLB moneylines", () => {'
          insertion = '''test("run-line families use a team-spread quote shape and first-inning winner evidence stays category-only", () => {\n  for (const key of [\n    "spreads",\n    "alternate_spreads",\n    "spreads_1st_1_innings",\n    "alternate_spreads_1st_1_innings",\n    "spreads_1st_3_innings",\n    "alternate_spreads_1st_3_innings",\n    "spreads_1st_5_innings",\n    "alternate_spreads_1st_5_innings",\n    "spreads_1st_7_innings",\n    "alternate_spreads_1st_7_innings",\n  ]) {\n    const market = getMlbMarketRegistryEntry(key);\n    assert.ok(market, `missing spread registry entry: ${key}`);\n    assert.equal(market.quoteShape, "TEAM_SPREAD", `${key} must not be modeled as an over/under quote`);\n  }\n\n  const firstInningWinner = getMlbMarketRegistryEntry("h2h_1st_1_innings");\n  assert.ok(firstInningWinner);\n  assert.equal(firstInningWinner.hardRockEvidenceStatus, "CATEGORY_ONLY_FIRST_PARTY_EVIDENCE");\n  assert.equal(firstInningWinner.liveHardRockFloridaDiscoveryRequired, true);\n});\n\n'''
          if insertion not in test:
            if test.count(marker) != 1:
              raise SystemExit('test insertion anchor is not an exact singleton')
            test = test.replace(marker, insertion + marker, 1)
            changed = True
          test_path.write_text(test)

          if not changed:
            print('Semantic corrections already applied.')
          PY

      - name: Validate corrected registry before push
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsx --test server/mlb-market-universe-registry.test.ts
          npm run build:backend
          grep -F '| "TEAM_SPREAD"' server/mlb-market-universe-registry.ts
          grep -F 'quoteShape: "TEAM_SPREAD"' server/mlb-market-universe-registry.ts
          ! awk '/HARD_ROCK_EXACT_EVIDENCE/,/HARD_ROCK_CATEGORY_ONLY_EVIDENCE/' server/mlb-market-universe-registry.ts | grep -F 'h2h_1st_1_innings'
          awk '/HARD_ROCK_CATEGORY_ONLY_EVIDENCE/,/CANONICAL_BY_PROVIDER_KEY/' server/mlb-market-universe-registry.ts | grep -F 'h2h_1st_1_innings'
          git diff --check

      - name: Commit only semantic registry corrections
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/mlb-market-universe-registry.ts server/mlb-market-universe-registry.test.ts; then
            echo 'Semantic corrections already committed; nothing to push.'
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('server/mlb-market-universe-registry.test.ts' 'server/mlb-market-universe-registry.ts')
          [[ "${#changed[@]}" -eq 2 ]]
          [[ "${changed[0]}" == "${expected[0]}" ]]
          [[ "${changed[1]}" == "${expected[1]}" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-market-universe-registry.ts server/mlb-market-universe-registry.test.ts
          git commit -m 'P0 MLB: correct registry quote and evidence semantics'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Quota conservation, F5 and market-registry falsification tests
        run: >-
          npx tsx --test
          server/mlb-odds-quota-conservation.test.ts
          server/mlb-f5-odds-routes.test.ts
          server/mlb-s5c-shadow-ingestion.test.ts
          server/mlb-s5e-coverage-service.test.ts
          server/mlb-market-universe-registry.test.ts

      - name: Preserve modular routes and production bundle
        run: |
          npm run test:s3-modularization
          npm run build:backend

      - name: Prove provider quota cannot be consumed by legacy/background/registry paths
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'api.the-odds-api.com' server/legacy-picks-routes.ts
          ! grep -F 'ODDS_API_KEY' server/legacy-picks-routes.ts
          ! grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          ! grep -F 'pollOddsForSport' server/legacy-picks-routes.ts
          grep -F 'Legacy provider polling was permanently removed' server/legacy-picks-routes.ts

          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          grep -F 'F5_BACKGROUND_CACHE_TTL_MS = 5 * 60 * 1000' server/mlb-f5-odds-routes.ts
          grep -F 'BACKGROUND_CACHE_MISS' server/mlb-f5-odds-routes.ts

          grep -F 'isMlbClosingLineCaptureEnabled' server/index.ts
          grep -F 'if (mlbClosingLineCaptureEnabled)' server/index.ts

          ! grep -nE 'setInterval|setTimeout' server/mlb-market-universe-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/mlb-f5-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/market-support-routes.ts
          ! grep -nE '\bfetch\s*\(|ODDS_API_KEY|api\.the-odds-api\.com|setInterval|setTimeout' server/mlb-market-universe-registry.ts
          git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
