name: Validate P0 Odds Quota Conservation

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-quota-conservation.yml'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-f5-odds-routes.ts'
      - 'server/mlb-odds-quota-conservation.test.ts'
      - 'server/mlb-s5c-shadow-ingestion.ts'
      - 'server/mlb-s5e-coverage-service.ts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Quota conservation and F5 falsification tests
        run: >-
          npx tsx --test
          server/mlb-odds-quota-conservation.test.ts
          server/mlb-f5-odds-routes.test.ts
          server/mlb-s5c-shadow-ingestion.test.ts
          server/mlb-s5e-coverage-service.test.ts

      - name: Preserve modular routes and production bundle
        run: |
          npm run test:s3-modularization
          npm run build:backend

      - name: Prove background quota policy and five-minute scientific freshness
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          grep -F 'legacy background polling disabled' server/legacy-picks-routes.ts
          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          grep -F 'F5_BACKGROUND_CACHE_TTL_MS = 5 * 60 * 1000' server/mlb-f5-odds-routes.ts
          ! grep -F 'F5_BACKGROUND_CACHE_TTL_MS = 30 * 60 * 1000' server/mlb-f5-odds-routes.ts
          grep -F 'const cacheFresh = Boolean' server/mlb-f5-odds-routes.ts
          ! grep -F 'withCache(cacheKey' server/mlb-f5-odds-routes.ts
          grep -F 'BACKGROUND_CACHE_MISS' server/mlb-f5-odds-routes.ts
          grep -F 'F5_EVENT_ODDS_PROVIDER_FAILURE' server/mlb-f5-odds-routes.ts
          grep -F 'providerFailureCount' server/mlb-f5-odds-routes.ts
          grep -F 'providerErrorCodes' server/mlb-f5-odds-routes.ts

      - name: Exact six-file runtime package and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | sort)
          expected=(
            ".github/workflows/validate-p0-odds-quota-conservation.yml"
            "server/legacy-picks-routes.ts"
            "server/mlb-f5-odds-routes.ts"
            "server/mlb-odds-quota-conservation.test.ts"
            "server/mlb-s5c-shadow-ingestion.ts"
            "server/mlb-s5e-coverage-service.ts"
          )
          [[ "${#changed[@]}" -eq "${#expected[@]}" ]]
          for i in "${!expected[@]}"; do
            [[ "${changed[$i]}" == "${expected[$i]}" ]] || {
              echo "Unexpected scope: ${changed[$i]} != ${expected[$i]}" >&2
              exit 1
            }
          done
          ! git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" | grep -E '^frontend/|ledger|settlement|mlb-core-routes\.ts'
          ! git diff "origin/${GITHUB_BASE_REF}...HEAD" -- server/legacy-picks-routes.ts server/mlb-f5-odds-routes.ts server/mlb-s5c-shadow-ingestion.ts server/mlb-s5e-coverage-service.ts | grep -Ei 'modelProbability|confidencePct|stakeUnits|automaticBetPlacement: true|realFinancialExposure: [1-9]|sportsbook.*write|appendSettlement|DELETE[[:space:]]+FROM|UPDATE[[:space:]]+[A-Za-z_]'
          git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
