name: Validate P0 Odds Quota Conservation

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-quota-conservation.yml'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-odds-quota-conservation.test.ts'
      - 'server/mlb-f5-odds-routes.ts'
      - 'server/mlb-s5c-shadow-ingestion.ts'
      - 'server/mlb-s5e-coverage-service.ts'

permissions:
  contents: write

jobs:
  patch-remove-legacy-provider-poller:
    if: github.event.pull_request.head.ref == 'fix/p0-remove-legacy-background-odds-poller-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Remove legacy provider poller with exact anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          legacy_path = Path('server/legacy-picks-routes.ts')
          legacy = legacy_path.read_text()
          legacy = legacy.replace(
              'import { getAllSnapshots, recordSnapshot } from "./sharp-signals";\nimport { requireSecret } from "./route-runtime";\n',
              'import { getAllSnapshots } from "./sharp-signals";\n',
              1,
          )
          start = '  // ── BACKGROUND ODDS POLLER ──────────────────────────────────────────────\n'
          end = '  // Auto-refresh CLV every 30 minutes (background)\n'
          if legacy.count(start) != 1 or legacy.count(end) != 1:
              raise SystemExit('legacy poller anchors are not exact singletons')
          before, rest = legacy.split(start, 1)
          _, after = rest.split(end, 1)
          replacement = (
              '  // Legacy provider polling was permanently removed. CourtEdge must not consume\n'
              '  // sportsbook quota merely because the backend is running. Fresh odds are acquired\n'
              '  // only by explicit foreground analysis/market requests; CLV refresh below reuses\n'
              '  // already-recorded snapshots and makes no provider request.\n\n'
              + end
          )
          legacy_path.write_text(before + replacement + after)

          test_path = Path('server/mlb-odds-quota-conservation.test.ts')
          test = test_path.read_text()
          test = test.replace(
              'test("static quota policy disables legacy polling, makes S5C/S5E cache-only, and keeps all F5 cache reuse inside five minutes", () => {',
              'test("static quota policy removes legacy provider polling, makes S5C/S5E cache-only, and keeps all F5 cache reuse inside five minutes", () => {',
              1,
          )
          assertion_start = '  assert.match(legacy, /LEGACY_ODDS_BACKGROUND_POLLING/);\n'
          assertion_end = '  assert.match(s5c, /hasPregameGame/);\n'
          if test.count(assertion_start) != 1 or test.count(assertion_end) != 1:
              raise SystemExit('quota test anchors are not exact singletons')
          before, rest = test.split(assertion_start, 1)
          _, after = rest.split(assertion_end, 1)
          assertions = (
              '  assert.doesNotMatch(legacy, /api\\.the-odds-api\\.com/);\n'
              '  assert.doesNotMatch(legacy, /ODDS_API_KEY/);\n'
              '  assert.doesNotMatch(legacy, /LEGACY_ODDS_BACKGROUND_POLLING/);\n'
              '  assert.doesNotMatch(legacy, /pollOddsForSport/);\n'
              '  assert.match(legacy, /Legacy provider polling was permanently removed/);\n\n'
              + assertion_end
          )
          test_path.write_text(before + assertions + after)
          PY

      - name: Validate exact safety change
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx tsx --test server/mlb-odds-quota-conservation.test.ts server/mlb-f5-odds-routes.test.ts
          npm run build:backend
          ! grep -F 'api.the-odds-api.com' server/legacy-picks-routes.ts
          ! grep -F 'ODDS_API_KEY' server/legacy-picks-routes.ts
          ! grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          ! grep -F 'pollOddsForSport' server/legacy-picks-routes.ts
          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          git diff --check

      - name: Commit exact runtime/test patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/legacy-picks-routes.ts server/mlb-odds-quota-conservation.test.ts; then
            echo 'Patch already applied; nothing to commit.'
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only | sort)
          expected=('server/legacy-picks-routes.ts' 'server/mlb-odds-quota-conservation.test.ts')
          [[ "${#changed[@]}" -eq 2 ]]
          [[ "${changed[0]}" == "${expected[0]}" ]]
          [[ "${changed[1]}" == "${expected[1]}" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/legacy-picks-routes.ts server/mlb-odds-quota-conservation.test.ts
          git commit -m 'P0 odds: remove legacy background provider polling'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
