name: Research MLB Odds Consumer Audit

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-quota-conservation.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exhaustive static odds-consumer inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "AUDIT_COMMIT=$GITHUB_SHA"
          echo '=== DIRECT PROVIDER RUNTIME FILES ==='
          mapfile -t direct < <(grep -RIl --include='*.ts' 'api\.the-odds-api\.com' server \
            | grep -vE '\.test\.ts$' | sort)
          printf '%s\n' "${direct[@]}"

          expected=(
            'server/legacy-picks-routes.ts'
            'server/market-support-routes.ts'
            'server/mlb-closing-line-worker.ts'
            'server/mlb-f5-odds-routes.ts'
            'server/mlb-market-universe-odds-routes.ts'
          )
          [[ "${#direct[@]}" -eq "${#expected[@]}" ]] || exit 1
          for i in "${!expected[@]}"; do
            [[ "${direct[$i]}" == "${expected[$i]}" ]] || exit 1
          done

          echo '=== ODDS API KEY RUNTIME REFERENCES ==='
          grep -RIn --include='*.ts' 'ODDS_API_KEY' server | grep -vE '\.test\.ts:' || true

          echo '=== INTERNAL /api/odds CALLERS (SERVER + FRONTEND) ==='
          grep -RIn --include='*.ts' --include='*.tsx' '/api/odds' server frontend 2>/dev/null || true

          echo '=== PREGAME READINESS CALLERS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'pregame-readiness' server frontend 2>/dev/null || true
          grep -RIn --include='*.ts' --include='*.tsx' 'MlbPregameReadiness\|PregameReadiness\|pregameReadiness' server frontend 2>/dev/null || true

          echo '=== MARKET UNIVERSE CALLERS ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'market-universe-odds' server frontend 2>/dev/null || true

          echo '=== BACKGROUND/TIMER SIGNALS IN ODDS-RELEVANT MODULES ==='
          grep -nE 'setInterval|setTimeout|background=cache-only|LEGACY_ODDS_BACKGROUND_POLLING|MLB_CLOSING_LINE_CAPTURE' \
            server/legacy-picks-routes.ts server/mlb-closing-line-worker.ts \
            server/mlb-s5c-shadow-ingestion.ts server/mlb-s5e-coverage-service.ts server/index.ts || true

          echo '=== HARD SAFETY ASSERTIONS ==='
          grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          grep -F 'legacy background polling disabled' server/legacy-picks-routes.ts
          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          grep -F 'if (mlbClosingLineCaptureEnabled)' server/index.ts
          grep -F 'isMlbClosingLineCaptureEnabled' server/index.ts
          grep -F 'F5_BACKGROUND_CACHE_TTL_MS = 5 * 60 * 1000' server/mlb-f5-odds-routes.ts
          grep -F 'BACKGROUND_CACHE_MISS' server/mlb-f5-odds-routes.ts

          echo '=== NO UNGATED TIMER IN NON-WORKER DIRECT CONSUMERS ==='
          ! grep -nE 'setInterval|setTimeout' server/mlb-market-universe-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/mlb-f5-odds-routes.ts
          ! grep -nE 'setInterval|setTimeout' server/market-support-routes.ts

          echo 'AUDIT_RESULT=PASS'
