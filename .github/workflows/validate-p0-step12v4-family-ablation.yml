name: Validate P0 Step 12V4 Independent Family Ablation

on:
  pull_request:
    branches:
      - research/p0-step12v3-expanded-pregame-regimes
    paths:
      - 'research/p0-step12v4-family-ablation-contract.json'
      - 'scripts/p0-step12v4-family-ablation.py'
      - '.github/workflows/validate-p0-step12v4-family-ablation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  family-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analysis dependencies
        run: |
          python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scikit-learn==1.8.0' 'xgboost==3.1.3'

      - name: Validate frozen V4 contract
        run: |
          python - <<'PY'
          import json
          m=json.load(open('research/p0-step12v4-family-ablation-contract.json'))
          assert m['schemaVersion']=='courtedge-p0-step12v4-family-ablation-contract.v1'
          assert m['parentEvidence']['workflowRunId']==31659518059
          assert m['parentEvidence']['artifactId']==9166442982
          assert m['dataBoundary']['trainingSeason']=='2022'
          assert m['dataBoundary']['thresholdSelectionSeason']=='2023'
          assert m['selection']['noThresholdRetuningAfter2023Selection'] is True
          assert len(m['families'])==10
          flat=[x for v in m['families'].values() for x in v]
          assert len(flat)==48 and len(set(flat))==48
          assert m['policy']['liveFilterChangeAllowed'] is False
          assert m['policy']['betEliteAllowed'] is False
          print('STEP12V4_CONTRACT_LOCKED')
          PY

      - name: Syntax check scorer
        run: python -m py_compile scripts/p0-step12v4-family-ablation.py

      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31659518059

      - name: Validate parent evidence pack
        run: |
          set -euo pipefail
          for label in 2022 2023 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v3/${label}/game-anatomy-feature-table.json"
            test -s "artifacts/p0-step12v3/${label}/cohort/starting-pitcher-history.json"
          done
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v3/expanded-regime-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v3-expanded-regime-study.v1'
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          assert r['policy']['futureSeasonStatsAllowed'] is False
          assert r['policy']['historicalPricesUsed'] is False
          print('STEP12V4_PARENT_EVIDENCE_VERIFIED')
          PY

      - name: Run independent family ablation
        run: >-
          python scripts/p0-step12v4-family-ablation.py
          --root artifacts/p0-step12v3
          --contract research/p0-step12v4-family-ablation-contract.json
          --out artifacts/p0-step12v4/family-ablation-report.json

      - name: Validate evidence boundary and print ranking
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v4/family-ablation-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v4-family-ablation.v1'
          assert len(r['families'])==10
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          assert r['policy']['futureSeasonStatsAllowed'] is False
          assert r['policy']['historicalPricesUsed'] is False
          assert r['policy']['liveFilterChanged'] is False
          assert r['policy']['betEliteProduced'] is False
          # Deliberately no favorable-result assertion.
          print(json.dumps({'baseline':r['baseline'],'ranking':r['ranking']},indent=2))
          PY

      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend

      - name: Upload V4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v4-family-ablation
          path: artifacts/p0-step12v4/
          if-no-files-found: error
          retention-days: 30
