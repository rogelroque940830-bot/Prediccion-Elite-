name: Validate S5B Shadow Mode

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-shadow-evaluation.ts'
      - 'server/mlb-shadow-evaluation.test.ts'
      - 'scripts/s5b-shadow-dry-run.mjs'
      - 'docs/S5B_SHADOW_MODE.md'
      - '.github/workflows/validate-s5b-shadow.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.s5b-shadow.json'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s5b-shadow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-s5b-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout S5B branch
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Type-check S5B shadow evaluator
        run: npm run typecheck:s5b-shadow

      - name: Test S5B shadow evaluator
        run: npm run test:s5b-shadow

      - name: Run existing S1-S5A regression gates
        run: |
          npm run typecheck:s1-auth
          npm run test:s1-auth
          npm run typecheck:s2-multiuser
          npm run test:s2-multiuser
          npm run typecheck:s3-modularization
          npm run test:s3-modularization
          npm run typecheck:s4-operations
          npm run test:s4-operations
          npm run typecheck:mlb-ledger
          npm run test:mlb-ledger
          npm run build:backend

      - name: Execute isolated S5B shadow dry run
        shell: bash
        run: |
          set -o pipefail
          npm run dry-run:s5b-shadow 2>&1 | tee s5b-shadow-run.log

      - name: Upload S5B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5b-shadow-mode-evidence
          path: |
            artifacts/s5b-shadow-dry-run/
            s5b-shadow-run.log
          if-no-files-found: warn
          retention-days: 30

  patch-p0-odds-quota-conservation:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/p0-odds-quota-conservation-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact pre/post patch scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-staging-secure
          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)
          pre=$(printf '%s\n' \
            '.github/workflows/validate-p0-odds-quota-conservation.yml' \
            'server/mlb-odds-quota-conservation.test.ts' | sort)
          post=$(printf '%s\n' \
            '.github/workflows/validate-p0-odds-quota-conservation.yml' \
            'server/legacy-picks-routes.ts' \
            'server/mlb-f5-odds-routes.ts' \
            'server/mlb-odds-quota-conservation.test.ts' \
            'server/mlb-s5c-shadow-ingestion.ts' \
            'server/mlb-s5e-coverage-service.ts' | sort)
          if [[ "$changed" != "$pre" && "$changed" != "$post" ]]; then
            printf 'Unexpected quota-fix scope:\n%s\n' "$changed" >&2
            exit 1
          fi

      - name: Apply exact quota-conservation runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new, 1))

          # 1) Legacy compatibility poller becomes explicit opt-in.
          replace_once(
              'server/legacy-picks-routes.ts',
              '  const ODDS_API_KEY_BG = requireSecret("ODDS_API_KEY");\n',
              '  const LEGACY_ODDS_BACKGROUND_POLLING = process.env.LEGACY_ODDS_BACKGROUND_POLLING?.trim().toLowerCase() === "true";\n'
              '  const ODDS_API_KEY_BG = LEGACY_ODDS_BACKGROUND_POLLING ? requireSecret("ODDS_API_KEY") : null;\n',
              'legacy provider key gate',
          )
          replace_once(
              'server/legacy-picks-routes.ts',
              '      const apiSport = SPORT_MAP_BG[sport]; if (!apiSport) return 0;\n',
              '      const apiSport = SPORT_MAP_BG[sport]; if (!apiSport || !ODDS_API_KEY_BG) return 0;\n',
              'legacy poll function gate',
          )
          old_timers = '''  // First poll 30 s after boot, then every 15 min
          setTimeout(async () => {
            const a = await pollOddsForSport("mlb");
            const b = await pollOddsForSport("nhl");
            const c = await pollOddsForSport("nba");
            console.log(`[odds-poll boot] mlb=${a} nhl=${b} nba=${c} snapshots`);
          }, 30 * 1000);
          // CUOTA: plan Starter de 500 req/mes. Cada poll hace 3 deportes = 3 requests.
          // A 2h: 3*12*30 = 1080/mes — supera 500, pero combinado con la cuota fresca del día 1
          // del mes nos da cobertura ~14 días/mes (la mejor relación cobertura/resolución).
          // Antes era 15 min y consumía la cuota en 1.7 días.
          setInterval(async () => {
            const a = await pollOddsForSport("mlb");
            const b = await pollOddsForSport("nhl");
            const c = await pollOddsForSport("nba");
            if (a + b + c > 0) console.log(`[odds-poll] mlb=${a} nhl=${b} nba=${c} snapshots`);
          }, 2 * 60 * 60 * 1000);
'''
          new_timers = '''  // Legacy all-sport polling is disabled by default. It is incompatible with a bounded
          // monthly provider quota and duplicates newer decision/checkpoint-specific collectors.
          // On-demand odds routes still record snapshots. Explicit opt-in is available only for
          // environments with a separately budgeted provider plan.
          if (LEGACY_ODDS_BACKGROUND_POLLING) {
            const bootPoll = setTimeout(async () => {
              const a = await pollOddsForSport("mlb");
              const b = await pollOddsForSport("nhl");
              const c = await pollOddsForSport("nba");
              console.log(`[odds-poll boot] mlb=${a} nhl=${b} nba=${c} snapshots`);
            }, 30 * 1000);
            bootPoll.unref();
            const recurringPoll = setInterval(async () => {
              const a = await pollOddsForSport("mlb");
              const b = await pollOddsForSport("nhl");
              const c = await pollOddsForSport("nba");
              if (a + b + c > 0) console.log(`[odds-poll] mlb=${a} nhl=${b} nba=${c} snapshots`);
            }, 2 * 60 * 60 * 1000);
            recurringPoll.unref();
          } else {
            console.log("[odds-poll] legacy background polling disabled; set LEGACY_ODDS_BACKGROUND_POLLING=true for explicit opt-in");
          }
'''
          replace_once('server/legacy-picks-routes.ts', old_timers, new_timers, 'legacy timer block')

          # 2) S5C never causes provider refresh. It also skips the internal odds request when
          # there are no pregame games left for the day.
          old_s5c = '''      const [schedule, oddsPayload] = await Promise.all([
            fetchJson(this.fetcher, `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${encodeURIComponent(gameDate)}&hydrate=team,probablePitcher,venue,weather`),
            fetchJson(this.fetcher, `${this.selfBaseUrl}/api/odds/mlb/f5?date=${encodeURIComponent(gameDate)}`),
          ]);
          const games = scheduleGames(schedule);
          const oddsGames = Array.isArray(oddsPayload?.games) ? oddsPayload.games : [];
          summary.gamesDiscovered = games.length;
'''
          new_s5c = '''      const schedule = await fetchJson(
            this.fetcher,
            `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${encodeURIComponent(gameDate)}&hydrate=team,probablePitcher,venue,weather`,
          );
          const games = scheduleGames(schedule);
          summary.gamesDiscovered = games.length;
          const hasPregameGame = games.some((game) => isPregame(game, now.getTime()));
          const oddsPayload = hasPregameGame
            ? await fetchJson(this.fetcher, `${this.selfBaseUrl}/api/odds/mlb/f5?date=${encodeURIComponent(gameDate)}&background=cache-only`)
            : { success: true, games: [], backgroundCacheOnly: true };
          const oddsGames = Array.isArray(oddsPayload?.games) ? oddsPayload.games : [];
'''
          replace_once('server/mlb-s5c-shadow-ingestion.ts', old_s5c, new_s5c, 'S5C cache-only acquisition')

          # 3) S5E closing coverage can consume a recent interactive/readiness F5 cache, but
          # cannot independently refresh the provider.
          replace_once(
              'server/mlb-s5e-coverage-service.ts',
              '          payload = await fetchJson(this.fetcher, `${this.selfBaseUrl}/api/odds/mlb/f5?date=${encodeURIComponent(record.prediction.game.gameDate)}`);\n',
              '          payload = await fetchJson(this.fetcher, `${this.selfBaseUrl}/api/odds/mlb/f5?date=${encodeURIComponent(record.prediction.game.gameDate)}&background=cache-only`);\n',
              'S5E cache-only acquisition',
          )

          # 4) Protected F5 route serves background callers from a bounded recent cache only,
          # and propagates an all-event provider failure rather than caching success:true/[] .
          replace_once(
              'server/mlb-f5-odds-routes.ts',
              'const F5_BOOKS = ["fanduel", "betmgm", "draftkings"] as const;\n',
              'const F5_BOOKS = ["fanduel", "betmgm", "draftkings"] as const;\n'
              'const F5_BACKGROUND_CACHE_TTL_MS = 30 * 60 * 1000;\n'
              'const f5BackgroundCache = new Map<string, { data: any; providerFetchedAt: number }>();\n',
              'F5 background cache declarations',
          )

          old_fetch = '''  const dateParam = String(req.query.date ?? "").trim();
          const cacheKey = `${MLB_F5_CACHE_KEY}:${dateParam || "all"}`;
          try {
            const ODDS_API_KEY = requireSecret("ODDS_API_KEY");
            const data = await withCache(cacheKey, async () => {
              const eventsResponse = await fetch(`https://api.the-odds-api.com/v4/sports/baseball_mlb/events/?apiKey=${ODDS_API_KEY}`);
              const events = await eventsResponse.json();
              if (!Array.isArray(events)) {
                const error: any = new Error(events?.message || "Odds API error");
                error.code = events?.error_code;
                error.noCache = true;
                throw error;
              }

              const eligibleEvents = dateParam
                ? events.filter((event: any) => commenceToFloridaDate(String(event?.commence_time ?? "")) === dateParam)
                : events;
              const queue = [...eligibleEvents];
              const games: any[] = [];
              const workers = Array.from({ length: 4 }, async () => {
                while (queue.length > 0) {
                  const event: any = queue.shift();
                  if (!event) break;
                  try {
                    const url = `https://api.the-odds-api.com/v4/sports/baseball_mlb/events/${event.id}/odds/?apiKey=${ODDS_API_KEY}&regions=us,us2&markets=h2h_1st_5_innings,spreads_1st_5_innings,totals_1st_5_innings&oddsFormat=american&bookmakers=${F5_BOOKS.join(",")}`;
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const providerGame = await response.json();
                    games.push(buildMlbF5ConsensusGame(providerGame, new Date().toISOString()));
                  } catch {
                    // One event may be unavailable while the rest of the slate remains usable.
                  }
                }
              });
              await Promise.all(workers);
              return { games };
            });
'''
          new_fetch = '''  const dateParam = String(req.query.date ?? "").trim();
          const cacheKey = `${MLB_F5_CACHE_KEY}:${dateParam || "all"}`;
          const backgroundCacheOnly = String(req.query.background ?? "").trim().toLowerCase() === "cache-only";
          try {
            let data: any;
            if (backgroundCacheOnly) {
              const cached = f5BackgroundCache.get(cacheKey);
              if (!cached || Date.now() - cached.providerFetchedAt >= F5_BACKGROUND_CACHE_TTL_MS) {
                return void res.json({
                  success: false,
                  schemaVersion: MLB_F5_ODDS_SCHEMA_VERSION,
                  games: [],
                  source: "n/a",
                  code: "BACKGROUND_CACHE_MISS",
                  error: "No recent F5 cache is available; background provider refresh is disabled to conserve quota.",
                  backgroundCacheOnly: true,
                });
              }
              data = cached.data;
            } else {
              const ODDS_API_KEY = requireSecret("ODDS_API_KEY");
              data = await withCache(cacheKey, async () => {
                const providerFetchedAt = Date.now();
                const eventsResponse = await fetch(`https://api.the-odds-api.com/v4/sports/baseball_mlb/events/?apiKey=${ODDS_API_KEY}`);
                const events = await eventsResponse.json();
                if (!Array.isArray(events)) {
                  const error: any = new Error(events?.message || "Odds API error");
                  error.code = events?.error_code;
                  error.noCache = true;
                  throw error;
                }

                const eligibleEvents = dateParam
                  ? events.filter((event: any) => commenceToFloridaDate(String(event?.commence_time ?? "")) === dateParam)
                  : events;
                const queue = [...eligibleEvents];
                const games: any[] = [];
                const eventFailures: Array<{ code: string | null; message: string; status: number | null }> = [];
                const workers = Array.from({ length: 4 }, async () => {
                  while (queue.length > 0) {
                    const event: any = queue.shift();
                    if (!event) break;
                    try {
                      const url = `https://api.the-odds-api.com/v4/sports/baseball_mlb/events/${event.id}/odds/?apiKey=${ODDS_API_KEY}&regions=us,us2&markets=h2h_1st_5_innings,spreads_1st_5_innings,totals_1st_5_innings&oddsFormat=american&bookmakers=${F5_BOOKS.join(",")}`;
                      const response = await fetch(url);
                      if (!response.ok) {
                        const body: any = await response.json().catch(() => null);
                        eventFailures.push({
                          code: String(body?.error_code ?? "").trim() || null,
                          message: String(body?.message ?? `Odds API HTTP ${response.status}`),
                          status: response.status,
                        });
                        continue;
                      }
                      const providerGame = await response.json();
                      games.push(buildMlbF5ConsensusGame(providerGame, new Date().toISOString()));
                    } catch (error) {
                      eventFailures.push({
                        code: null,
                        message: error instanceof Error ? error.message : String(error),
                        status: null,
                      });
                    }
                  }
                });
                await Promise.all(workers);
                if (eligibleEvents.length > 0 && games.length === 0 && eventFailures.length > 0) {
                  const first = eventFailures[0];
                  const error: any = new Error(first.message || "F5 event odds provider failure");
                  error.code = first.code || "F5_EVENT_ODDS_PROVIDER_FAILURE";
                  error.noCache = true;
                  throw error;
                }
                return {
                  games,
                  providerFetchedAt,
                  eligibleEventCount: eligibleEvents.length,
                  providerFailureCount: eventFailures.length,
                  providerErrorCodes: Array.from(new Set(eventFailures.map((failure) => failure.code).filter(Boolean))),
                };
              });
              const providerFetchedAt = Number(data?.providerFetchedAt);
              if (Number.isFinite(providerFetchedAt) && providerFetchedAt > 0) {
                f5BackgroundCache.set(cacheKey, { data, providerFetchedAt });
              }
            }
'''
          replace_once('server/mlb-f5-odds-routes.ts', old_fetch, new_fetch, 'F5 provider/cache-only acquisition')

          old_response = '''    res.json({
              success: true,
              schemaVersion: MLB_F5_ODDS_SCHEMA_VERSION,
              generatedAt: new Date().toISOString(),
              games,
              source: sources.join(", ") || "n/a",
              consensusMethod: MLB_F5_CONSENSUS_METHOD,
              note: "Hard Rock no publica mercados F5. Consenso por mediana de probabilidad implícita de FanDuel/BetMGM/DraftKings; nunca se promedian cuotas americanas directamente.",
            });
'''
          new_response = '''    res.json({
              success: true,
              schemaVersion: MLB_F5_ODDS_SCHEMA_VERSION,
              generatedAt: new Date().toISOString(),
              games,
              source: sources.join(", ") || "n/a",
              consensusMethod: MLB_F5_CONSENSUS_METHOD,
              backgroundCacheOnly,
              coverageStatus: Number((data as any)?.providerFailureCount || 0) > 0 ? "PARTIAL" : "COMPLETE",
              eligibleEventCount: Number((data as any)?.eligibleEventCount || 0),
              providerFailureCount: Number((data as any)?.providerFailureCount || 0),
              providerErrorCodes: Array.isArray((data as any)?.providerErrorCodes) ? (data as any).providerErrorCodes : [],
              note: "Hard Rock no publica mercados F5. Consenso por mediana de probabilidad implícita de FanDuel/BetMGM/DraftKings; nunca se promedian cuotas americanas directamente.",
            });
'''
          replace_once('server/mlb-f5-odds-routes.ts', old_response, new_response, 'F5 response observability')
          PY
          git diff --check

      - name: Verify exact runtime deltas
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'LEGACY_ODDS_BACKGROUND_POLLING' server/legacy-picks-routes.ts
          grep -F 'background=cache-only' server/mlb-s5c-shadow-ingestion.ts
          grep -F 'background=cache-only' server/mlb-s5e-coverage-service.ts
          grep -F 'BACKGROUND_CACHE_MISS' server/mlb-f5-odds-routes.ts
          grep -F 'F5_EVENT_ODDS_PROVIDER_FAILURE' server/mlb-f5-odds-routes.ts
          grep -F 'providerFailureCount' server/mlb-f5-odds-routes.ts

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quota-conservation falsification tests
        run: >-
          npx tsx --test
          server/mlb-odds-quota-conservation.test.ts
          server/mlb-f5-odds-routes.test.ts
          server/mlb-s5c-shadow-ingestion.test.ts
          server/mlb-s5e-coverage-service.test.ts

      - name: Preserve route inventory and backend bundle
        run: |
          npm run test:s3-modularization
          npm run build:backend
          npm run test:s5b-shadow

      - name: Prove exact effective scope and no model/money mutation
        shell: bash
        run: |
          set -euo pipefail
          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)
          effective=$(printf '%s\n%s\n' "$changed" "$(git diff --name-only)" | sed '/^$/d' | sort -u)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p0-odds-quota-conservation.yml' \
            'server/legacy-picks-routes.ts' \
            'server/mlb-f5-odds-routes.ts' \
            'server/mlb-odds-quota-conservation.test.ts' \
            'server/mlb-s5c-shadow-ingestion.ts' \
            'server/mlb-s5e-coverage-service.ts' | sort)
          [[ "$effective" == "$expected" ]]
          ! git diff origin/integration/p0-staging-secure -- server/legacy-picks-routes.ts server/mlb-f5-odds-routes.ts server/mlb-s5c-shadow-ingestion.ts server/mlb-s5e-coverage-service.ts | grep -Ei 'modelProbability|confidencePct|stakeUnits|automaticBetPlacement: true|realFinancialExposure: [1-9]|sportsbook.*write|appendSettlement|DELETE[[:space:]]+FROM|UPDATE[[:space:]]+[A-Za-z_]'

      - name: Commit only patched runtime files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            server/legacy-picks-routes.ts
            server/mlb-f5-odds-routes.ts
            server/mlb-s5c-shadow-ingestion.ts
            server/mlb-s5e-coverage-service.ts
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'Runtime already patched; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected=$(printf '%s\n' "${files[@]}" | sort)
          [[ "$(printf '%s\n' "${staged[@]}")" == "$expected" ]]
          git commit -m 'P0 odds: conserve provider quota for background workers'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
