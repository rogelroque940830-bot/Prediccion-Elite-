name: Smoke deployed immutable MLB history frontend

on:
  push:
    branches:
      - test/smoke-frontend-mlb-ledger-history
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for ledger-backed history assets
        shell: bash
        env:
          FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
        run: |
          set -euo pipefail
          cat > /tmp/crawl.py <<'PY'
          import re
          import sys
          import urllib.parse
          import urllib.request

          base = sys.argv[1].rstrip('/') + '/'
          queue = [urllib.parse.urljoin(base, 'mlb-history')]
          seen = set()
          texts = []

          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent': 'CourtEdge-Smoke/1.0'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', errors='ignore')

          while queue and len(seen) < 500:
              url = queue.pop(0)
              if url in seen:
                  continue
              seen.add(url)
              try:
                  text = get(url)
              except Exception as exc:
                  print(f'WARN {url}: {exc}')
                  continue
              texts.append(text)
              for pattern in [
                  r'(?P<u>/assets/[A-Za-z0-9._-]+\.js)',
                  r'(?P<u>assets/[A-Za-z0-9._-]+\.js)',
                  r'(?P<u>\./[A-Za-z0-9._-]+\.js)',
              ]:
                  for match in re.finditer(pattern, text):
                      candidate = urllib.parse.urljoin(url, match.group('u'))
                      if candidate not in seen:
                          queue.append(candidate)

          combined = '\n'.join(texts)
          targets = [
              '/api/mlb/ledger/v1/history?limit=10000',
              'Esperando liquidación',
              'Respaldo local',
              'Inmutable',
          ]
          missing = [target for target in targets if target not in combined]
          print(f'CRAWLED {len(seen)} resources')
          if missing:
              print('MISSING ' + ' | '.join(missing))
              raise SystemExit(1)
          print('PASS immutable MLB ledger history labels found')
          PY

          for attempt in $(seq 1 48); do
            if python /tmp/crawl.py "$FRONTEND_URL"; then
              echo "Frontend ledger history detected on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          exit 1
