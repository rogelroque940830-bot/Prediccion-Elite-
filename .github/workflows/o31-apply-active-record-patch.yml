name: O3.1 Apply Active Record Integration Patch

on:
  push:
    branches:
      - feature/o3-1-mlb-evidence-repair-backend
    paths:
      - '.github/workflows/o31-apply-active-record-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/o3-1-mlb-evidence-repair-backend
          fetch-depth: 0
      - name: Apply minimal active-record integrations
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          incident = Path('server/operational-incident-center.ts')
          text = incident.read_text()
          old_import = 'import type { LedgerRecord } from "./mlb-ledger-store";\n'
          new_import = old_import + 'import { activeMlbLedgerRecords } from "./mlb-active-records";\n'
          if 'activeMlbLedgerRecords' not in text:
              if old_import not in text:
                  raise SystemExit('O1 import anchor missing')
              text = text.replace(old_import, new_import, 1)
          old_fn = 'function buildMlbIncidents(records: LedgerRecord[], now: Date): OperationalIncident[] {\n  const groups = new Map<string, LedgerRecord[]>();'
          new_fn = 'function buildMlbIncidents(records: LedgerRecord[], now: Date): OperationalIncident[] {\n  records = activeMlbLedgerRecords(records);\n  const groups = new Map<string, LedgerRecord[]>();'
          if 'records = activeMlbLedgerRecords(records);' not in text:
              if old_fn not in text:
                  raise SystemExit('O1 function anchor missing')
              text = text.replace(old_fn, new_fn, 1)
          incident.write_text(text)

          o3 = Path('server/operational-reprocessing.ts')
          text = o3.read_text()
          import_anchor = 'import type {\n  LedgerPrediction,\n  LedgerRecord,\n  LedgerSettlement,\n  MlbSettlementInput,\n} from "./mlb-ledger-store";\n'
          if 'from "./mlb-active-records"' not in text:
              if import_anchor not in text:
                  raise SystemExit('O3 import anchor missing')
              text = text.replace(import_anchor, import_anchor + 'import { activeMlbLedgerRecords } from "./mlb-active-records";\n', 1)
          old_provider = '''    recordsProvider: (ownerUserId) => ownedRecordsForUser(
      ledger,
      ownership,
      ownerUserId,
    ),'''
          new_provider = '''    recordsProvider: (ownerUserId) => activeMlbLedgerRecords(ownedRecordsForUser(
      ledger,
      ownership,
      ownerUserId,
    )),'''
          if 'recordsProvider: (ownerUserId) => activeMlbLedgerRecords(' not in text:
              if old_provider not in text:
                  raise SystemExit('O3 provider anchor missing')
              text = text.replace(old_provider, new_provider, 1)
          o3.write_text(text)
          PY
          rm .github/workflows/o31-apply-active-record-patch.yml
          git diff --check
      - name: Commit integration patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/operational-incident-center.ts server/operational-reprocessing.ts .github/workflows/o31-apply-active-record-patch.yml
          git commit -m 'O3.1: use active supersession leaves in O1 and O3'
          git push origin HEAD:feature/o3-1-mlb-evidence-repair-backend
