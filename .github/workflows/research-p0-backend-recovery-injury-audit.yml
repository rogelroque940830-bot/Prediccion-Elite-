name: Research P0 Backend Recovery Injury Audit

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p0-backend-recovery-injury-audit.yml'

permissions:
  contents: read

jobs:
  verify-recovery-and-injuries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: b9c403f5682792f397d814451a94b1467c8253ef
      AUDIT_DATE: '2026-08-08'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact one-file research scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          [[ "$changed" == '.github/workflows/research-p0-backend-recovery-injury-audit.yml' ]]

      - name: Wait for recovered exact backend and audit injury metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit private
          chmod 700 private

          observed=''
          health_code='000'
          for attempt in $(seq 1 30); do
            health_code=$(curl -sS -o private/health.json -w '%{http_code}' --max-time 30 "${BACKEND_URL}/health" || true)
            health_code=${health_code:-000}
            if [[ "$health_code" == '200' ]]; then
              observed=$(node -e "const fs=require('fs');try{const j=JSON.parse(fs.readFileSync('private/health.json','utf8'));process.stdout.write(String(j.commit||''));}catch{}")
              if [[ "$observed" == "$EXPECTED_BACKEND_COMMIT" ]]; then break; fi
            fi
            sleep 10
          done

          all_code='000'
          slate_code='000'
          if [[ "$health_code" == '200' && "$observed" == "$EXPECTED_BACKEND_COMMIT" ]]; then
            slate_code=$(curl -sS -o private/slate.json -w '%{http_code}' --max-time 60 "${BACKEND_URL}/api/mlb/p1/v1/slate" || true)
            all_code=$(curl -sS -o private/all.json -w '%{http_code}' --max-time 180 "${BACKEND_URL}/api/mlb/all?date=${AUDIT_DATE}" || true)
            slate_code=${slate_code:-000}
            all_code=${all_code:-000}
          fi

          EXPECTED_BACKEND_COMMIT="$EXPECTED_BACKEND_COMMIT" OBSERVED_COMMIT="$observed" HEALTH_CODE="$health_code" SLATE_CODE="$slate_code" ALL_CODE="$all_code" AUDIT_DATE="$AUDIT_DATE" node <<'NODE'
          const fs=require('fs');
          const code=v=>/^\d{3}$/.test(String(v||''))?String(v):'000';
          const endpointStatus={health:code(process.env.HEALTH_CODE),slate:code(process.env.SLATE_CODE),all:code(process.env.ALL_CODE)};
          const expected=String(process.env.EXPECTED_BACKEND_COMMIT||'');
          const observed=String(process.env.OBSERVED_COMMIT||'');
          const bump=(o,k)=>{o[k]=(o[k]||0)+1;};
          const clean=v=>String(v??'').trim().toUpperCase();
          const result={
            schemaVersion:'p0-backend-recovery-injury-audit.v1',
            generatedAt:new Date().toISOString(),
            auditDate:process.env.AUDIT_DATE,
            expectedCommit:expected,
            observedCommit:observed||null,
            exactCommitDeployed:endpointStatus.health==='200'&&observed===expected,
            endpointStatus,
            samples:[],
            aggregate:{
              measuredGames:0,measuredSides:0,statusCounts:{},phaseBCoverageCounts:{},
              alreadyVerifiedSides:0,partialSides:0,
              partialOnlyOfficialGapNoRejects:0,partialWithRejectedIdentity:0,
              partialWithSourceHealthProblem:0,partialWithBothOfficialGapAndRejected:0,partialOther:0,
              officialOnlyTotal:0,rejectedIdentityTotal:0,sourceErrorTotal:0,freshOfficialVerifiedSides:0
            },
            safety:{writesPerformed:0,predictionsCreated:0,settlementsCreated:0,betsPlaced:0,rawIdentityUploaded:false,readinessPolicyChanged:false,modelFormulaChanged:false}
          };

          if(result.exactCommitDeployed&&endpointStatus.all==='200'){
            let payload=null;
            try{payload=JSON.parse(fs.readFileSync('private/all.json','utf8'));}catch{}
            const games=Array.isArray(payload?.games)?payload.games:Array.isArray(payload?.data?.games)?payload.data.games:[];
            for(let i=0;i<games.length;i++){
              const ag=games[i];
              const sample={gameOrdinal:i+1,sides:{}};
              let validSideCount=0;
              for(const side of ['home','away']){
                const meta=ag?.[`${side}InjuryData`]||null;
                if(!meta){sample.sides[side]={status:'MISSING'};continue;}
                validSideCount++;
                const status=clean(meta.status)||'MISSING';
                const officialValidationStatus=clean(meta.officialValidationStatus)||'MISSING';
                const stale=meta.stale===true;
                const sourceErrorCount=Array.isArray(meta.sourceErrors)?meta.sourceErrors.length:0;
                const rejectedCount=Math.max(0,Number(meta.rejectedCount)||0);
                const officialOnly=Math.max(0,Number(meta?.shadowSummary?.officialOnly)||0);
                const phaseBCoverage=clean(meta?.phaseB?.coverage)||'MISSING';
                const sourceHealthy=!stale&&officialValidationStatus==='VERIFIED'&&sourceErrorCount===0;
                let cause='NONE';
                if(status==='PARTIAL'){
                  result.aggregate.partialSides++;
                  if(!sourceHealthy){cause='SOURCE_HEALTH';result.aggregate.partialWithSourceHealthProblem++;}
                  else if(rejectedCount>0&&officialOnly>0){cause='OFFICIAL_GAP_AND_REJECTED';result.aggregate.partialWithBothOfficialGapAndRejected++;}
                  else if(rejectedCount>0){cause='REJECTED_IDENTITY';result.aggregate.partialWithRejectedIdentity++;}
                  else if(officialOnly>0){cause='OFFICIAL_ONLY_GAP';result.aggregate.partialOnlyOfficialGapNoRejects++;}
                  else{cause='OTHER';result.aggregate.partialOther++;}
                }
                bump(result.aggregate.statusCounts,status);
                bump(result.aggregate.phaseBCoverageCounts,phaseBCoverage);
                result.aggregate.measuredSides++;
                if(status==='VERIFIED')result.aggregate.alreadyVerifiedSides++;
                if(sourceHealthy)result.aggregate.freshOfficialVerifiedSides++;
                result.aggregate.officialOnlyTotal+=officialOnly;
                result.aggregate.rejectedIdentityTotal+=rejectedCount;
                result.aggregate.sourceErrorTotal+=sourceErrorCount;
                sample.sides[side]={status,officialValidationStatus,stale,sourceErrorCount,rejectedCount,officialOnly,phaseBCoverage,cause,sourceHealthy};
              }
              if(validSideCount>0){result.aggregate.measuredGames++;result.samples.push(sample);}
            }
          }

          const backendRecovered=result.exactCommitDeployed&&endpointStatus.health==='200';
          const auditUsable=backendRecovered&&endpointStatus.all==='200'&&result.aggregate.measuredGames>0;
          result.conclusion={
            backendRecovered,
            auditUsable,
            sampledGames:result.aggregate.measuredGames,
            sampledSides:result.aggregate.measuredSides,
            recoverableOfficialOnlySideCount:result.aggregate.partialOnlyOfficialGapNoRejects,
            anyRecoverableOfficialOnlySides:auditUsable&&result.aggregate.partialOnlyOfficialGapNoRejects>0,
            anyRejectedIdentitySides:auditUsable&&(result.aggregate.partialWithRejectedIdentity+result.aggregate.partialWithBothOfficialGapAndRejected)>0,
            anySourceHealthProblems:auditUsable&&result.aggregate.partialWithSourceHealthProblem>0,
            safeToTreatAllPartialAsFresh:false,
            safeToIgnoreRejectedExternalRecords:false,
            nextStep:!backendRecovered?'BACKEND_RECOVERY_FAILED':(!auditUsable?'RESTORE_MLB_ALL_ENDPOINT':(result.aggregate.partialOnlyOfficialGapNoRejects>0?'TEST_OFFICIAL_SUPPLEMENT':((result.aggregate.partialWithRejectedIdentity+result.aggregate.partialWithBothOfficialGapAndRejected)>0?'INVESTIGATE_REJECTED_IDENTITIES':'INVESTIGATE_SOURCE_HEALTH_OR_OTHER')))
          };
          fs.writeFileSync('audit/result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify({endpointStatus:result.endpointStatus,exactCommitDeployed:result.exactCommitDeployed,aggregate:result.aggregate,conclusion:result.conclusion},null,2));
          NODE

          rm -rf private
          test -f audit/result.json

      - name: Prove accepted artifact is identity-free
        shell: bash
        run: |
          set -euo pipefail
          ! grep -E '"gamePk"|"teamId"|"playerId"|"name"|"homeTeam"|"awayTeam"|/api/mlb/[A-Za-z0-9_-]+/[0-9]+' audit/result.json

      - name: Upload sanitized recovery and injury evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-backend-recovery-injury-audit
          path: audit/result.json
          if-no-files-found: error
          retention-days: 30
