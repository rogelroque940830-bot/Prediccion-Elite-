name: TEMP Patch P1-M2B Official Injury Supplement

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - server/mlb-injury-official-supplement.ts
      - server/mlb-injury-official-supplement.test.ts
      - .github/workflows/patch-p1-m2b-official-injury-supplement.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact fail-closed wiring patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('server/mlb-core-routes.ts')
          text = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          import_anchor = 'import { buildMlbInjuryPhaseBPlan } from "./mlb-injury-phase-b";\n'
          import_new = import_anchor + 'import { reconcileMlbOfficialOnlyInjuries } from "./mlb-injury-official-supplement";\n'
          if 'from "./mlb-injury-official-supplement"' not in text:
              replace_once(import_anchor, import_new, 'import')

          empty_anchor = '''            const officialOnly = anomalous ? 0 : officialIlEntries.length;
            const sourcesVerified = !anomalous
              && injuryFeed.status === "VERIFIED"
              && officialSnapshot?.status === "VERIFIED";
'''
          empty_new = '''            const officialOnly = anomalous ? 0 : officialIlEntries.length;
            const sourcesVerified = !anomalous
              && injuryFeed.status === "VERIFIED"
              && officialSnapshot?.status === "VERIFIED";
            const officialReconciliation = reconcileMlbOfficialOnlyInjuries({
              sourceStatus: injuryFeed.status,
              stale: injuryFeed.stale,
              anomalous,
              rejectedCount: 0,
              officialSnapshot,
              existingPlayerIds: [],
              asOfDate: dateParam,
            });
            if (officialReconciliation.rawOfficialOnlyCount !== officialOnly) {
              throw new Error("MLB official-only injury reconciliation count mismatch");
            }
'''
          if 'existingPlayerIds: [],' not in text:
              replace_once(empty_anchor, empty_new, 'empty-list reconciliation')

          replace_once(
              '            injuryMap[tid] = [];\n            injuryMetaMap[tid] = {\n',
              '            injuryMap[tid] = officialReconciliation.supplements;\n            injuryMetaMap[tid] = {\n',
              'empty-list injuryMap',
          )
          replace_once(
              '              status: anomalous ? "ANOMALOUS" : sourcesVerified && officialOnly === 0 ? "VERIFIED" : "PARTIAL",\n',
              '              status: anomalous ? "ANOMALOUS" : sourcesVerified && officialReconciliation.unresolvedOfficialOnlyCount === 0 ? "VERIFIED" : "PARTIAL",\n',
              'empty-list status',
          )
          replace_once(
              '                highConfidence: 0, officialOnly, mode: "SHADOW",\n',
              '                highConfidence: 0, officialOnly,\n                officialSupplemented: officialReconciliation.supplementedCount,\n                unresolvedOfficialOnly: officialReconciliation.unresolvedOfficialOnlyCount,\n                mode: "SHADOW",\n',
              'empty-list summary',
          )
          replace_once(
              '              note: anomalous\n                ? `Lista anormal (${rawBdlList.length}); ajuste automático bloqueado`\n                : officialOnly > 0\n                  ? `BALLDONTLIE no reportó ${officialOnly} jugador(es) que MLB mantiene en lista de lesionados; cobertura en revisión`\n                  : "Ambas fuentes verificadas: no hay ausencias activas confirmadas para este equipo",\n',
              '              officialSupplementedCount: officialReconciliation.supplementedCount,\n              unresolvedOfficialOnlyCount: officialReconciliation.unresolvedOfficialOnlyCount,\n              coverageReconciled: officialReconciliation.coverageReconciled,\n              coverageMode: officialReconciliation.supplementedCount > 0 ? "BDL_PLUS_MLB_OFFICIAL_SUPPLEMENT" : "BDL_PLUS_MLB_VALIDATION",\n              note: anomalous\n                ? `Lista anormal (${rawBdlList.length}); ajuste automático bloqueado`\n                : officialReconciliation.supplementedCount > 0\n                  ? `${officialReconciliation.supplementedCount} ausencia(s) omitida(s) por BALLDONTLIE fueron reconciliadas con roster MLB oficial como evidencia; no son autoaplicables`\n                  : officialOnly > 0\n                    ? `BALLDONTLIE no reportó ${officialOnly} jugador(es) que MLB mantiene en lista de lesionados; cobertura en revisión`\n                    : "Ambas fuentes verificadas: no hay ausencias activas confirmadas para este equipo",\n',
              'empty-list metadata/note',
          )

          nonempty_anchor = '''          const officialOnly = Object.values(officialSnapshot?.rosterByPlayerId ?? {})
            .filter((entry: any) => /^D\\d+$/i.test(String(entry.statusCode || "")) || /injured/i.test(String(entry.statusDescription || "")))
            .filter((entry: any) => !bdlPlayerIds.has(Number(entry.playerId)))
            .length;
          const shadowSummary = {
'''
          nonempty_new = '''          const officialOnly = Object.values(officialSnapshot?.rosterByPlayerId ?? {})
            .filter((entry: any) => /^D\\d+$/i.test(String(entry.statusCode || "")) || /injured/i.test(String(entry.statusDescription || "")))
            .filter((entry: any) => !bdlPlayerIds.has(Number(entry.playerId)))
            .length;
          const officialReconciliation = reconcileMlbOfficialOnlyInjuries({
            sourceStatus: injuryFeed.status,
            stale: injuryFeed.stale,
            anomalous,
            rejectedCount,
            officialSnapshot,
            existingPlayerIds: bdlPlayerIds,
            asOfDate: dateParam,
          });
          if (officialReconciliation.rawOfficialOnlyCount !== officialOnly) {
            throw new Error("MLB official-only injury reconciliation count mismatch");
          }
          const shadowSummary = {
'''
          if 'existingPlayerIds: bdlPlayerIds,' not in text:
              replace_once(nonempty_anchor, nonempty_new, 'nonempty reconciliation')

          replace_once(
              '            officialOnly,\n          };\n          const phaseB = buildMlbInjuryPhaseBPlan({\n',
              '            officialOnly,\n            officialSupplemented: officialReconciliation.supplementedCount,\n            unresolvedOfficialOnly: officialReconciliation.unresolvedOfficialOnlyCount,\n          };\n          const phaseB = buildMlbInjuryPhaseBPlan({\n',
              'nonempty summary',
          )
          replace_once(
              '          injuryMap[tid] = shadowList;\n\n          // Fase B:',
              '          injuryMap[tid] = [...shadowList, ...officialReconciliation.supplements];\n\n          // Fase B:',
              'nonempty injuryMap',
          )
          replace_once(
              '            && rejectedCount === 0\n            && officialOnly === 0;\n',
              '            && rejectedCount === 0\n            && officialReconciliation.unresolvedOfficialOnlyCount === 0;\n',
              'nonempty identity completeness',
          )
          replace_once(
              '            count: shadowList.length,\n            rejectedCount,\n',
              '            count: shadowList.length + officialReconciliation.supplements.length,\n            rejectedCount,\n            officialSupplementedCount: officialReconciliation.supplementedCount,\n            unresolvedOfficialOnlyCount: officialReconciliation.unresolvedOfficialOnlyCount,\n            coverageReconciled: officialReconciliation.coverageReconciled,\n            coverageMode: officialReconciliation.supplementedCount > 0 ? "BDL_PLUS_MLB_OFFICIAL_SUPPLEMENT" : "BDL_PLUS_MLB_VALIDATION",\n',
              'nonempty metadata',
          )
          replace_once(
              '              : rejectedCount > 0\n                ? `${rejectedCount} registro(s) descartado(s); los candidatos restantes no superaron todas las barreras de activación`\n                : shadowList.length > 0\n                  ? "BALLDONTLIE detecta y MLB valida; la Fase B se abstiene cuando falta certeza o existe riesgo de doble conteo"\n                  : "Fuentes verificadas: no hay ausencias activas confirmadas para este equipo",\n',
              '              : rejectedCount > 0\n                ? `${rejectedCount} registro(s) descartado(s); los candidatos restantes no superaron todas las barreras de activación`\n                : officialReconciliation.supplementedCount > 0\n                  ? `${officialReconciliation.supplementedCount} ausencia(s) oficial(es) suplementada(s) como evidencia; Phase B conserva solo candidatos detectados por BALLDONTLIE`\n                  : shadowList.length > 0\n                    ? "BALLDONTLIE detecta y MLB valida; la Fase B se abstiene cuando falta certeza o existe riesgo de doble conteo"\n                    : "Fuentes verificadas: no hay ausencias activas confirmadas para este equipo",\n',
              'nonempty note',
          )

          p.write_text(text)
          PY

          git diff --check
          git diff -- server/mlb-core-routes.ts

      - name: Commit patched core route
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- server/mlb-core-routes.ts; then
            echo "Core route already patched; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-core-routes.ts
          git commit -m "P1-M2B: wire official injury supplement"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
