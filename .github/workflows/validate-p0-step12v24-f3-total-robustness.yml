name: Validate P0 Step 12V24 F3 Total Robustness

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/p0-step12v24-f3-total-robustness-contract.json'
      - 'scripts/p0-step12v24-f3-total-robustness.py'
      - '.github/workflows/validate-p0-step12v24-f3-total-robustness.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.18.0'

      - name: Validate frozen V24 gate before reading V23 metrics
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v24-f3-total-robustness-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v24-f3-total-robustness-contract.v1'
          assert c['parentEvidence']['v23WorkflowRunId']==31894436492
          assert c['parentEvidence']['v23ArtifactId']==9249427586
          assert c['parentEvidence']['v23ArtifactDigest']=='sha256:7ac9b44038f48446e03c997b60ca18059bfacdd97be8a4a7829aa4c0d84d99e5'
          assert c['modelBoundary']['refitAllowed'] is False
          assert c['modelBoundary']['recalibrationAllowed'] is False
          assert c['modelBoundary']['coefficientChangeAllowed'] is False
          assert c['modelBoundary']['featureChangeAllowed'] is False
          assert c['modelBoundary']['lineSetChangeAllowed'] is False
          assert c['modelBoundary']['fixedLines']==[1.5,2.5,3.5,4.5,5.5]
          s=c['seasonStabilityGate']
          assert s['partitions']==['2023','2024','2025','2026_YTD']
          assert s['requirePositivePoissonDevianceImprovementEachPartition'] is True
          assert s['requirePositiveAverageBrierImprovementEachPartition'] is True
          assert s['requireModelAbsoluteMeanBiasNoWorseThanConstantBaselineEachPartition'] is True
          b=c['dateClusterBootstrapGate']
          assert b['clusterUnit']=='OFFICIAL_DATE'
          assert b['replicates']==10000
          assert b['randomSeed']==2401
          assert b['confidenceLevel']==0.95
          assert b['requireTwoSidedPercentileCiLowerBoundGreaterThanZeroForBothMetrics'] is True
          assert c['statistics']['thresholdSearchAllowed'] is False
          assert c['statistics']['featureSearchAllowed'] is False
          assert c['statistics']['modelSearchAllowed'] is False
          assert c['statistics']['postResultRuleChangeAllowed'] is False
          assert c['policy']['betEliteAllowed'] is False
          assert c['policy']['realFinancialExposure']==0
          print('STEP12V24_GATE_PREDECLARED')
          PY

      - name: Syntax check V24 scorer
        run: python -m py_compile scripts/p0-step12v24-f3-total-robustness.py

      - name: Download immutable V23 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v23-f3-model-suite
          path: artifacts/p0-step12v23
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31894436492

      - name: Download canonical Step 12V3 features
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Verify parent boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v23/f3-model-suite-report.json'))
          o=json.load(open('artifacts/p0-step12v23/f3-outcomes.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v23-f3-model-suite.v1'
          assert o['schemaVersion']=='courtedge-p0-step12v23-f3-outcomes.v1'
          assert r['classification']=='F3_TOTAL_PROSPECTIVE_CAPTURE_CANDIDATE_ONLY'
          assert r['total']['candidateRubricPassed'] is True
          assert r['moneyline']['candidateRubricPassed'] is False
          assert r['marketBoundary']['historicalF3PricesUsed'] is False
          assert r['marketBoundary']['positiveEvEstablished'] is False
          assert o['acquisition']['canonicalGames']==11407
          assert o['acquisition']['outcomeCompleteGames']==11405
          assert o['acquisition']['conflictingDuplicateApiObservations']==0
          print('V23_PARENT_CUSTODY_VERIFIED')
          PY

      - name: Run unchanged-model robustness gate
        run: |
          mkdir -p artifacts/p0-step12v24
          python scripts/p0-step12v24-f3-total-robustness.py \
            --root artifacts/p0-step12v3 \
            --contract research/p0-step12v24-f3-total-robustness-contract.json \
            --v23-report artifacts/p0-step12v23/f3-model-suite-report.json \
            --v23-outcomes artifacts/p0-step12v23/f3-outcomes.json \
            --out artifacts/p0-step12v24/f3-total-robustness-report.json

      - name: Validate safety and immutable-model boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v24/f3-total-robustness-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v24-f3-total-robustness.v1'
          assert r['modelBoundary']['unchangedV23Snapshot'] is True
          assert r['modelBoundary']['refitUsed'] is False
          assert r['modelBoundary']['recalibrationUsed'] is False
          assert r['modelBoundary']['featureChangeUsed'] is False
          assert r['modelBoundary']['lineSearchUsed'] is False
          assert r['modelBoundary']['historicalF3PricesUsed'] is False
          assert r['data']['canonicalSeasonRows']=={'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert r['data']['scoredRows']==9007
          assert set(r['partitionMetrics'])=={'2023','2024','2025','2026_YTD'}
          assert r['dateClusterBootstrap']['replicates']==10000
          assert r['dateClusterBootstrap']['randomSeed']==2401
          assert r['marketBoundary']['positiveEvEstablished'] is False
          assert r['marketBoundary']['productionPromotionAuthorized'] is False
          p=r['policy']
          assert p['sameDateOutcomeLeakageAllowed'] is False
          assert p['futureGameDataAllowed'] is False
          assert p['thresholdSearchUsed'] is False
          assert p['featureSearchUsed'] is False
          assert p['modelSearchUsed'] is False
          assert p['postResultRuleChangeUsed'] is False
          assert p['liveLookupAuthorizationChanged'] is False
          assert p['liveMarketDiscoveryChanged'] is False
          assert p['rankingChanged'] is False
          assert p['stakeChanged'] is False
          assert p['betEliteAllowed'] is False
          assert p['automaticBetPlacementAllowed'] is False
          assert p['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'robustnessGatePassed':r['robustnessGatePassed'],
            'seasonStabilityChecks':r['seasonStabilityChecks'],
            'dateClusterBootstrap':r['dateClusterBootstrap'],
          },indent=2))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Preserve MLB regressions
        run: |
          npm ci
          npx tsx --test \
            server/mlb-full13-live-feature-builder.test.ts \
            server/mlb-market-universe-registry.test.ts \
            server/mlb-market-odds-normalizer.test.ts
          npm run build:backend

      - name: Upload V24 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v24-f3-total-robustness
          path: artifacts/p0-step12v24/
          if-no-files-found: error
          retention-days: 30
