name: Validate MLB injury calibration report C2A

on:
  push:
    branches:
      - feature/mlb-injury-calibration-report-c2a
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-calibration-report-c2a
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Run MLB regression suite
        run: npm run test:mlb-ledger
      - name: Type-check backend
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
