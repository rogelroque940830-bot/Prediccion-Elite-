name: Validate P0 Step 12V81 General x APlus Strength

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v81-general-x-aplus-strength-contract.json'
      - 'scripts/p0-step12v81-general-x-aplus-strength.py'
      - '.github/workflows/validate-p0-step12v81-general-x-aplus-strength.yml'

permissions:
  contents: read
  actions: read

jobs:
  historical-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'

      - name: Prove V81 plan predates V81 scorer
        shell: bash
        run: |
          set -euo pipefail
          C='research/p0-step12v81-general-x-aplus-strength-contract.json'
          S='scripts/p0-step12v81-general-x-aplus-strength.py'
          CADD="$(git log --diff-filter=A --format=%H -- "$C" | tail -1)"
          SADD="$(git log --diff-filter=A --format=%H -- "$S" | tail -1)"
          test -n "$CADD" && test -n "$SADD" && test "$CADD" != "$SADD"
          git merge-base --is-ancestor "$CADD" "$SADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v81-general-x-aplus-strength-contract.json'))
          assert c['scientificStatus']=='FROZEN_GENERAL_X_APLUS_SIGNAL_DISCOVERY_PLAN_BEFORE_ANY_V81_SCORER_EXISTS'
          assert c['targetCohort']['routeExactly']=='V16_V68_CONSENSUS_T0.550'
          assert c['targetCohort']['expectedDecisiveRows']==223
          assert c['analysisPlan']['noOutcomeDrivenThresholdAddition'] is True
          assert c['interpretationBoundary']['v80Changed'] is False
          assert c['interpretationBoundary']['realFinancialExposure']==0
          print('V81_FREEZE_FIRST_PLAN_PROVED')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/p0-step12v81-general-x-aplus-strength.py

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793

      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do
            test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"
            test -s "inputs/step12v3/$S/cohort/official-acquisition.json"
          done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY" && test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Execute frozen V81 General x APlus study
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/p0-step12v81-general-x-aplus-strength.py \
            --root inputs/step12v3 \
            --custody '${{ steps.paths.outputs.custody }}' \
            --v16-manifest '${{ steps.paths.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v79-contract research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json \
            --v79-scorer scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py \
            --contract research/p0-step12v81-general-x-aplus-strength-contract.json \
            --out work/v81-general-x-aplus-strength.json

      - name: Enforce V81 integrity and print decision table
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v81-general-x-aplus-strength.json'))
          assert r['classification']=='V81_GENERAL_X_APLUS_RETROSPECTIVE_DISCOVERY_COMPLETE'
          b=r['cohortParity']
          assert b['decisiveRows']==223 and b['wins']==128 and b['losses']==95
          i=r['integrity']
          assert i['thresholdsAddedAfterOutcomeInspection'] is False
          assert i['featuresSearchedOutsideFrozenAPlusFamilies'] is False
          assert i['refitPerformed'] is False and i['recalibrationPerformed'] is False
          assert i['oddsUsed'] is False and i['v80Changed'] is False
          assert i['realFinancialExposure']==0
          print(json.dumps({
            'baseline':b,
            'signalDistribution':r['signalDistribution']['aPlusMinSelected'],
            'strongestPredeclaredViews':r['strongestPredeclaredViews'],
            'top15Serious':r['candidateRanking']['top15Serious']
          },indent=2))
          PY

      - name: Upload V81 discovery report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v81-general-x-aplus-strength
          path: work/v81-general-x-aplus-strength.json
          if-no-files-found: error
          retention-days: 90
