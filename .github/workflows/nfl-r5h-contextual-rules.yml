name: NFL R5H Contextual Rule Weighting

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/nfl/**'
      - '.github/workflows/nfl-r5h-contextual-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfl-r5h:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install NFL-R5H research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyarrow scikit-learn requests

      - name: Validate R5H scripts
        run: |
          python -m py_compile research/nfl/nfl_r5_leakage_safe.py
          python -m py_compile research/nfl/nfl_r5b_qb_identity_availability.py
          python -m py_compile research/nfl/nfl_r5b_hybrid.py
          python -m py_compile research/nfl/nfl_r5h_contextual_rule_weighting.py

      - name: Rebuild leakage-safe historical foundation
        run: |
          python research/nfl/nfl_r5_leakage_safe.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5-output \
            --cache-dir .cache/nflverse

      - name: Rebuild R5B QB identity and availability
        run: |
          python research/nfl/nfl_r5b_qb_identity_availability.py \
            --start-season 2012 \
            --end-season 2025 \
            --test-start 2018 \
            --out-dir nfl-r5b-output \
            --cache-dir .cache/nflverse

      - name: Rebuild R5B2 frozen feature dataset
        run: |
          python research/nfl/nfl_r5b_hybrid.py \
            --input-dir nfl-r5b-output \
            --out-dir nfl-r5b-hybrid-output \
            --test-start 2018 \
            --end-season 2025

      - name: Run NFL-R5H contextual rule combination search
        run: |
          python research/nfl/nfl_r5h_contextual_rule_weighting.py \
            --input-dir nfl-r5b-hybrid-output \
            --out-dir nfl-r5h-output \
            --expert-oos-start 2013 \
            --test-start 2018 \
            --end-season 2025

      - name: Enforce R5H sports-only dynamic-weight boundary
        run: |
          python - <<'PY'
          import json, pandas as pd
          m=json.load(open('nfl-r5h-output/nfl_r5h_manifest.json'))
          a=json.load(open('nfl-r5h-output/nfl_r5h_audit.json'))
          v=json.load(open('nfl-r5h-output/nfl_r5h_verdict.json'))
          c=pd.read_csv('nfl-r5h-output/nfl_r5h_coverage_bands.csv')
          assert m['researchOnly'] is True
          assert m['marketDataUsedAsFeatures'] is False
          assert m['marketOptimizationPerformed'] is False
          assert m['frozenFeatureCount'] == 32
          assert m['featureVectorChanged'] is False
          assert m['ruleBlockCount'] == 10
          assert m['productionPromotionAutomatic'] is False
          assert a['marketBoundary'] == 'PASS_MARKET_FREE'
          assert a['featurePartition'] == 'PASS_EXACT_32_FEATURE_R5B2_VECTOR_NO_OVERLAP'
          assert a['targetSeasonUsedForRuleExpertFit'] == 'NO'
          assert a['targetSeasonUsedForMetaFit'] == 'NO'
          assert a['targetSeasonUsedForRuleCombinationSelection'] == 'NO'
          assert a['targetSeasonUsedForCoverageThreshold'] == 'NO'
          assert a['gameSpecificRuleWeighting'] == 'PASS_PER_GAME_CONTEXTUAL_CONTRIBUTION_SHARES'
          assert a['referenceCoverage'] == 'PASS_EXACT_GAME_SET'
          assert a['productionCodeTouched'] is False
          assert v['researchOnly'] is True
          assert v['marketDataUsed'] is False
          assert v['productionChanged'] is False
          assert v['primaryObjective'] == 'OUT_OF_SAMPLE_GAME_WIN_ACCURACY'
          assert v['featureVectorChanged'] is False
          assert v['ruleWeightsGameSpecific'] is True
          assert v['selectionUsesOnlyPriorSeasons'] is True
          assert set(c.target_coverage.round(2)) == {1.00,0.80,0.60,0.50,0.40,0.30,0.25,0.20}
          print('NFL_R5H_CONTEXTUAL_RULE_BOUNDARY_VERIFIED')
          PY

      - name: Show R5H results
        run: |
          cat nfl-r5h-output/nfl_r5h_model_summary.csv
          echo
          cat nfl-r5h-output/nfl_r5h_by_season.csv
          echo
          cat nfl-r5h-output/nfl_r5h_coverage_bands.csv
          echo
          cat nfl-r5h-output/nfl_r5h_config_by_season.csv
          echo
          cat nfl-r5h-output/nfl_r5h_rule_selection_frequency.csv
          echo
          cat nfl-r5h-output/nfl_r5h_verdict.json

      - name: Upload NFL-R5H contextual rule evidence
        uses: actions/upload-artifact@v4
        with:
          name: nfl-r5h-contextual-rule-weighting-evidence
          path: nfl-r5h-output/
          if-no-files-found: error
          retention-days: 30
