name: Validate P0 V16 FULL13 Certified Materializer

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-full13-live-feature-builder.ts'
      - 'server/mlb-full13-live-feature-builder.test.ts'
      - 'server/mlb-c4-certified-materializer.ts'
      - 'server/mlb-full13-certified-materializer.test.ts'
      - 'scripts/mlb-full13-certified-live-smoke.ts'
      - '.github/workflows/validate-p0-v16-full13-certified-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate FULL13 canonical formulas and certified custody
        run: |
          npx tsx --test server/mlb-full13-live-feature-builder.test.ts server/mlb-full13-certified-materializer.test.ts
      - name: Preserve C4 and frozen classifier regressions
        run: |
          npx tsx --test server/mlb-c4-certified-materializer.test.ts server/mlb-frozen-a-plus-classifier.test.ts
      - name: Compile FULL13 and shared materializer
        run: |
          npx esbuild server/mlb-full13-live-feature-builder.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-full13-live-feature-builder.cjs
          npx esbuild server/mlb-c4-certified-materializer.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-full13-certified-materializer.cjs
          npx esbuild scripts/mlb-full13-certified-live-smoke.ts --bundle --platform=node --target=node20 --format=esm --outfile=/tmp/mlb-full13-certified-live-smoke.mjs
      - name: Backend build
        run: npm run build:backend
      - name: Preserve scientific and price boundary
        shell: bash
        run: |
          set -euo pipefail
          builder='server/mlb-full13-live-feature-builder.ts'
          materializer='server/mlb-c4-certified-materializer.ts'
          grep -F 'C4_STARTER_SHRINKAGE_PRIOR_BF' "$builder"
          grep -F 'sameDateHistoryAllowed: false' "$builder"
          grep -F 'seasonResetHistory: true' "$builder"
          grep -F 'priceIndependent: true' "$builder"
          grep -F 'assessFull13Game' "$materializer"
          ! grep -E 'odds|sportsbook|stake|BET_ELITE|automaticBetPlacement|appendPrediction\(|appendSettlement\(' "$builder" "$materializer"
      - name: Verify exact slice scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p0-v16-full13-certified-materializer.yml' \
            'scripts/mlb-full13-certified-live-smoke.ts' \
            'server/mlb-c4-certified-materializer.ts' \
            'server/mlb-full13-certified-materializer.test.ts' \
            'server/mlb-full13-live-feature-builder.test.ts' \
            'server/mlb-full13-live-feature-builder.ts' | sort)
          [[ "$changed" == "$expected" ]]

  official-mlb-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Run official MLB FULL13 to frozen classifier smoke
        run: npx tsx scripts/mlb-full13-certified-live-smoke.ts
