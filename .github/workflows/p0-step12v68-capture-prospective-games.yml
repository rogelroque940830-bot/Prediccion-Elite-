name: P0 Step 12V68 Legacy Dense Capture Supervisor

# V3 replaced this workflow's automatic slate-wide capture duty with the
# V80-style per-game planner + T10/T7/T4 child workflow. The dense supervisor
# remains available only for manual diagnostics/regression and has no schedule.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p0-step12v68-capture-supervisor.py'
      - 'scripts/p0-step12v68-capture-supervisor.test.py'
      - 'scripts/p0-step12v68-prospective-source.py'
      - 'research/p0-step12v68-capture-reliability-repair-v1.json'
      - 'research/p0-step12v68-capture-window-entry-alignment-v2.json'
      - 'research/p0-step12v68-per-game-capture-clock-v3.json'
      - '.github/workflows/p0-step12v68-capture-prospective-games.yml'

permissions:
  contents: read

jobs:
  validate-legacy-supervisor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve legacy regression surface without scheduled capture
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/p0-step12v68-capture-supervisor.py \
            scripts/p0-step12v68-prospective-source.py
          python scripts/p0-step12v68-capture-supervisor.test.py
          python scripts/p0-step12v68-pregame-state-parity.test.py
          python - <<'PY'
          import json
          p=json.load(open('research/p0-step12v68-per-game-capture-clock-v3.json'))
          assert p['legacyDenseSupervisor']['scheduledCaptureUseAfterEffectiveDate'] is False
          assert p['legacyDenseSupervisor']['retainedForHistoricalDiagnosticsAndRegressionTests'] is True
          assert p['scientificBoundary']['captureEligibilityWindowMaximumMinutesBeforeScheduledStart']==20
          text=open('.github/workflows/p0-step12v68-capture-prospective-games.yml').read()
          before_pr=text.split('pull_request:',1)[0]
          assert 'schedule:' not in before_pr
          print('V68_LEGACY_DENSE_AUTOMATIC_CAPTURE_DISABLED')
          PY
