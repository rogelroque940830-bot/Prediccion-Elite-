name: P0 Step 12V68 Capture Prospective Games

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/p0-step12v68-prospective-source.py'
      - 'scripts/p0-step12v68-prospective-ledger.py'
      - 'scripts/p0-step12v68-fg-winner-prospective-capture.py'
      - 'scripts/p0-step12v68-capture-supervisor.py'
      - 'scripts/p0-step12v68-capture-supervisor.test.py'
      - 'research/p0-step12v68-prospective-source-manifests.json'
      - 'research/p0-step12v68-capture-reliability-repair-v1.json'
      - '.github/workflows/p0-step12v68-capture-prospective-games.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: p0-step12v68-capture-prospective-games
  cancel-in-progress: false

jobs:
  validate-capture-operation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen scientific boundary and reliability amendment
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/p0-step12v68-prospective-source.py \
            scripts/p0-step12v68-prospective-ledger.py \
            scripts/p0-step12v68-fg-winner-prospective-capture.py \
            scripts/p0-step12v68-capture-supervisor.py
          python scripts/p0-step12v68-capture-supervisor.test.py
          python - <<'PY'
          import json
          m=json.load(open('research/p0-step12v68-prospective-source-manifests.json'))
          r=json.load(open('research/p0-step12v68-capture-reliability-repair-v1.json'))
          op=m['operationalProspectiveCapture']
          boundary=r['scientificBoundary']
          repair=r['operationalRepair']
          assert op['captureWindowMaximumMinutesBeforeScheduledStart']==20
          assert op['captureMustBeStrictlyBeforeScheduledStart'] is True
          assert op['requiresExactNineByNineCurrentLineups'] is True
          assert op['requiresBothCurrentPregameProbablePitchers'] is True
          assert op['firstCanonicalGameCaptureImmutable'] is True
          assert op['serializedDataLedgerWritesRequired'] is True
          assert op['outcomesOrMarketPricesInPregameLedgerAllowed'] is False
          assert r['outcomesReadForRepairDesign'] is False
          assert r['marketPricesReadForRepairDesign'] is False
          assert r['parentScientificContractChanged'] is False
          assert boundary['captureEligibilityWindowMaximumMinutesBeforeScheduledStart']==20
          assert boundary['requiresExactNineByNineCurrentLineups'] is True
          assert boundary['requiresBothCurrentPregameProbablePitchers'] is True
          assert repair['cronCadenceMinutes']==5
          assert repair['pollAttemptsPerRun']==6
          assert repair['pollIntervalSeconds']==45
          assert repair['preflightUpcomingGameHorizonMinutes']==45
          text=open('.github/workflows/p0-step12v68-capture-prospective-games.yml').read()
          assert "cron: '*/5 * * * *'" in text
          assert '--max-lead-minutes 20' in text
          assert '--attempts 6' in text
          assert '--interval-seconds 45' in text
          assert 'ledger/v68/final/evaluation.json' in text
          assert "steps.cohort.outputs.open == 'true'" in text
          print('V68_DENSE_POLL_REPAIR_BOUNDARY_VERIFIED')
          PY

  capture-live-pregame:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout frozen V68 code from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout prospective data ledger branch
        uses: actions/checkout@v4
        with:
          ref: data/p0-step12v68-prospective
          path: ledger
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check prospective cohort remains open
        id: cohort
        shell: bash
        run: |
          if test -s ledger/v68/final/evaluation.json; then
            echo 'open=false' >> "$GITHUB_OUTPUT"
            echo 'V68 single prospective evaluation already exists; capture ledger is permanently closed.'
          else
            echo 'open=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve MLB official date in Eastern time
        if: steps.cohort.outputs.open == 'true'
        id: date
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          from zoneinfo import ZoneInfo
          d=dt.datetime.now(ZoneInfo('America/New_York')).date()
          print(f'target={d.isoformat()}')
          print(f'eligible={str(d>=dt.date(2026,8,17)).lower()}')
          PY

      - name: Stop before first eligible official date
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible != 'true'
        run: echo 'V68 prospective capture is not eligible before 2026-08-17.'

      - name: Require immutable prior-date state
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "ledger/v68/states/${{ steps.date.outputs.target }}.json" || {
            echo 'V68_FAIL_CLOSED_DAILY_STATE_MISSING:${{ steps.date.outputs.target }}' >&2
            exit 1
          }

      - name: Download immutable V16 control manifest
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Densely poll authoritative MLB feed inside unchanged strict pregame window
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true'
        id: source
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../work
          python scripts/p0-step12v68-capture-supervisor.py \
            --state '../ledger/v68/states/${{ steps.date.outputs.target }}.json' \
            --target-date '${{ steps.date.outputs.target }}' \
            --source-manifest research/p0-step12v68-prospective-source-manifests.json \
            --v62-contract research/p0-step12v62-pitch-quality-winner-contract.json \
            --source-script scripts/p0-step12v68-prospective-source.py \
            --max-lead-minutes 20 \
            --preflight-horizon-minutes 45 \
            --attempts 6 \
            --interval-seconds 45 \
            --out ../work/source.json \
            --diagnostics-out ../work/supervisor-diagnostics.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('../work/source.json'))
          d=json.load(open('../work/supervisor-diagnostics.json'))
          n=len(x.get('rows',[]))
          near=bool((d.get('preflight') or {}).get('nearCaptureWindow'))
          print(f'rows={n}')
          print(f'has_rows={str(n>0).lower()}')
          print(f'near_window={str(near).lower()}')
          print(f'attempts={len(d.get("attempts",[]))}')
          PY

      - name: Preserve near-window dense-poll diagnostics without outcomes
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true' && steps.source.outputs.near_window == 'true'
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p '../ledger/v68/poll-diagnostics/${{ steps.date.outputs.target }}'
          python - <<'PY'
          import json,os
          src='../work/supervisor-diagnostics.json'
          x=json.load(open(src))
          assert x['outcomesRead'] is False
          assert x['marketPricesRead'] is False
          assert x['scientificModelChanged'] is False
          x['githubRunId']='${{ github.run_id }}'
          x['githubRunAttempt']='${{ github.run_attempt }}'
          out='../ledger/v68/poll-diagnostics/${{ steps.date.outputs.target }}/${{ github.run_id }}-${{ github.run_attempt }}.json'
          open(out,'w').write(json.dumps(x,indent=2,sort_keys=True)+'\n')
          PY

      - name: Score V16 and frozen V68 before outcomes exist
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true' && steps.source.outputs.has_rows == 'true'
        id: score
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          EXISTING=()
          if test -s ../ledger/v68/captures/canonical.json; then
            EXISTING=(--existing ../ledger/v68/captures/canonical.json)
          fi
          python scripts/p0-step12v68-fg-winner-prospective-capture.py \
            --input ../work/source.json \
            --contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --v16-manifest ../v16/pure-settlement-model-manifest.json \
            "${EXISTING[@]}" \
            --out ../work/canonical.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          x=json.load(open('../work/canonical.json'))
          n=int(x['summary']['newCaptures'])
          print(f'new={n}')
          print(f'has_new={str(n>0).lower()}')
          print(f'total={x["summary"]["canonicalGames"]}')
          PY

      - name: Preserve first source evidence and canonical probability ledger
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true' && steps.source.outputs.has_rows == 'true' && steps.score.outputs.has_new == 'true'
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p0-step12v68-prospective-ledger.py install-sources \
            --input ../work/source.json \
            --ledger-root ../ledger/v68
          mkdir -p ../ledger/v68/captures
          cp ../work/canonical.json ../ledger/v68/captures/canonical.json
          python - <<'PY'
          import json,os
          x=json.load(open('../work/canonical.json'))
          assert x['policy']['outcomesRead'] is False
          assert x['policy']['pricesRead'] is False
          assert x['policy']['realFinancialExposure']==0
          for r in x['rows']:
              assert r['containsOutcome'] is False
              assert r['containsMarketPrice'] is False
          os.makedirs('../ledger/v68/receipts',exist_ok=True)
          receipt={
            'schemaVersion':'courtedge-p0-step12v68-capture-receipt.v1',
            'officialDate':'${{ steps.date.outputs.target }}',
            'githubRunId':'${{ github.run_id }}',
            'githubRunAttempt':'${{ github.run_attempt }}',
            'summary':x['summary'],
            'researchOnly':True,
            'outcomesRead':False,
            'pricesRead':False,
            'realFinancialExposure':0,
          }
          open('../ledger/v68/receipts/${{ github.run_id }}-${{ github.run_attempt }}.json','w').write(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit diagnostics and only newly captured immutable games
        if: steps.cohort.outputs.open == 'true' && steps.date.outputs.eligible == 'true' && (steps.source.outputs.near_window == 'true' || steps.score.outputs.has_new == 'true')
        working-directory: ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'court-edge-v68-research-bot'
          git config user.email 'v68-research-bot@users.noreply.github.com'
          git add v68/poll-diagnostics v68/captures v68/source-records v68/receipts 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "V68 capture ${{ steps.date.outputs.target }}: dense-poll custody update"
          git pull --rebase origin data/p0-step12v68-prospective
          git push origin HEAD:data/p0-step12v68-prospective
