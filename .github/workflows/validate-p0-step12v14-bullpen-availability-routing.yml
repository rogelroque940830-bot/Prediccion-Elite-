name: Validate P0 Step 12V14 Bullpen Availability Routing

on:
  pull_request:
    branches:
      - research/p0-step12v13-f5-damage-volume-generalization
    paths:
      - 'research/p0-step12v14-bullpen-availability-routing-contract.json'
      - 'scripts/p0-step12v14-acquire-bullpen.py'
      - 'scripts/p0-step12v14-score-bullpen-routing.py'
      - '.github/workflows/validate-p0-step12v14-bullpen-availability-routing.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen V14 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v14-bullpen-availability-routing-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v14-bullpen-availability-routing-contract.v1'
          assert c['dataBoundary']['sameDateOutcomeLeakageAllowed'] is False
          assert c['dataBoundary']['currentMetadataFallbackAllowed'] is False
          assert len(c['metrics'])==4
          assert len(c['predeclaredSignCohorts'])==6
          assert c['statistics']['noNumericThresholdSearch'] is True
          assert c['statistics']['noAdditionalCohortsAfterResults'] is True
          assert c['volumePolicy']['premiumAOrAPlusPicksMayBeRemoved'] is False
          assert c['policy']['betEliteAllowed'] is False
          print('STEP12V14_CONTRACT_LOCKED')
          PY
      - name: Syntax check V14 scripts
        run: |
          python -m py_compile scripts/p0-step12v14-acquire-bullpen.py
          python -m py_compile scripts/p0-step12v14-score-bullpen-routing.py

  acquire-bullpen:
    needs: preflight
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: [2023, 2024, 2025, 2026_YTD]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Acquire archived bullpen boxscores
        run: |
          mkdir -p artifacts/p0-step12v14-${{ matrix.season }}
          python scripts/p0-step12v14-acquire-bullpen.py \
            --season '${{ matrix.season }}' \
            --table 'artifacts/p0-step12v3/${{ matrix.season }}/game-anatomy-feature-table.json' \
            --contract research/p0-step12v14-bullpen-availability-routing-contract.json \
            --out 'artifacts/p0-step12v14-${{ matrix.season }}/bullpen-${{ matrix.season }}.json' \
            --workers 8
      - name: Upload season bullpen pack
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v14-bullpen-${{ matrix.season }}
          path: artifacts/p0-step12v14-${{ matrix.season }}/bullpen-${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 30

  bullpen-routing-study:
    needs: acquire-bullpen
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check 'scipy==1.18.0'
      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download V14 bullpen packs
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v14-bullpen-*
          path: artifacts/p0-step12v14-bullpen
          merge-multiple: true
      - name: Validate parent evidence
        run: |
          for s in 2023 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v3/${s}/game-anatomy-feature-table.json"
            test -s "artifacts/p0-step12v14-bullpen/bullpen-${s}.json"
          done
          test -s research/p0-step12v6-a-team5-rest-cross-anatomy-contract.json
      - name: Run frozen V14 bullpen routing study
        run: |
          mkdir -p artifacts/p0-step12v14
          python scripts/p0-step12v14-score-bullpen-routing.py \
            --root artifacts/p0-step12v3 \
            --bullpen-dir artifacts/p0-step12v14-bullpen \
            --a-contract research/p0-step12v6-a-team5-rest-cross-anatomy-contract.json \
            --contract research/p0-step12v14-bullpen-availability-routing-contract.json \
            --out artifacts/p0-step12v14/bullpen-availability-routing-report.json
      - name: Validate scientific boundary and decision table
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v14/bullpen-availability-routing-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v14-bullpen-availability-routing.v1'
          assert len(r['continuousTests'])==8
          assert len(r['signCohorts']['PREMIUM_A_FULL_GAME_HOME'])==6
          assert len(r['signCohorts']['A_PLUS_FULL_GAME_HOME'])==6
          assert r['populations']['PREMIUM_A_FULL_GAME_HOME']['frozenBaseline']['selectedRows']==268
          assert r['populations']['A_PLUS_FULL_GAME_HOME']['frozenBaseline']['selectedRows']==95
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          assert r['policy']['liveFilterChangeAllowed'] is False
          assert r['policy']['betEliteAllowed'] is False
          assert r['policy']['premiumAOrAPlusPicksMayBeRemoved'] is False
          print(json.dumps({'classification':r['classification'],'coverage':r['coverage'],'populations':r['populations'],'tests':r['continuousTests'],'cohorts':r['signCohorts'],'pareto':r['paretoEfficientFgCohorts']},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npm run build:backend
      - name: Upload V14 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v14-bullpen-availability-routing
          path: artifacts/p0-step12v14/
          if-no-files-found: error
          retention-days: 30
