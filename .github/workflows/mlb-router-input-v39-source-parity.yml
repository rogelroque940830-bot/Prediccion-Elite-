name: MLB Router Input V39 Source Parity

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-router-input-parity-v1
    paths:
      - "research/mlb-router-input-parity-v1-contract.json"
      - "research/mlb-full-modular-v39-expected-outs-snapshot-v1.json"
      - "server/mlb-full-modular-mechanistic-feature-builder.ts"
      - "scripts/mlb-router-input-v39-source-parity-v1.ts"
      - ".github/workflows/mlb-router-input-v39-source-parity.yml"
  pull_request:
    branches:
      - research/mlb-full-modular-pp-horizon-prospective-v1
    paths:
      - "research/mlb-router-input-parity-v1-contract.json"
      - "research/mlb-full-modular-v39-expected-outs-snapshot-v1.json"
      - "server/mlb-full-modular-mechanistic-feature-builder.ts"
      - "scripts/mlb-router-input-v39-source-parity-v1.ts"
      - ".github/workflows/mlb-router-input-v39-source-parity.yml"

permissions:
  contents: read
  actions: read

jobs:
  v39-source-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout parity branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove V39 replay follows frozen contract and snapshot
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT='research/mlb-router-input-parity-v1-contract.json'
          SNAPSHOT='research/mlb-full-modular-v39-expected-outs-snapshot-v1.json'
          REPLAY='scripts/mlb-router-input-v39-source-parity-v1.ts'
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- "$CONTRACT" | tail -1)"
          SNAPSHOT_ADD="$(git log --diff-filter=A --format=%H -- "$SNAPSHOT" | tail -1)"
          REPLAY_ADD="$(git log --diff-filter=A --format=%H -- "$REPLAY" | tail -1)"
          test "$CONTRACT_ADD" = '624da74a251ed9443a2d56a731e5c57db92aa27d'
          test "$SNAPSHOT_ADD" = '0970e5c35a4610ca8d5a43a737ad6a35173402bd'
          test "$REPLAY_ADD" = '7a681c54ed3e0e72e4f5611059642598a9ef2e45'
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SNAPSHOT_ADD"
          git merge-base --is-ancestor "$SNAPSHOT_ADD" "$REPLAY_ADD"
          echo MLB_ROUTER_INPUT_V39_SOURCE_PARITY_CHRONOLOGY_PROVED

      - name: Download immutable Step12V3 source universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31962659793

      - name: Verify source universe and V66 custody
        id: source
        shell: bash
        run: |
          set -euo pipefail
          for s in 2022 2023 2024 2025 2026_YTD; do
            test -n "$(find inputs/step12v3 -type f -path "*/${s}/game-anatomy-feature-table.json" -print -quit)"
            test -n "$(find inputs/step12v3 -type f -path "*/${s}/cohort/starting-pitcher-history.json" -print -quit)"
            test -n "$(find inputs/step12v3 -type f -path "*/${s}/cohort/pregame-lineup-history.json" -print -quit)"
            test -n "$(find inputs/step12v3 -type f -path "*/${s}/t5-audit/t5-starter-identity-audit.json" -print -quit)"
          done
          CUSTODY="$(find inputs/v66 -type f -name 'v66-pregame-custody.jsonl.gz' -print -quit)"
          test -n "$CUSTODY" && test -s "$CUSTODY"
          test "sha256:$(sha256sum "$CUSTODY" | awk '{print $1}')" = 'sha256:1d7a7f35226186b0043606db3762c0e612ea90d6bca71fb4f1616a0dc493add2'
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo MLB_ROUTER_INPUT_V39_SOURCE_UNIVERSE_VERIFIED

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild V39 12-feature chronology and score frozen snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          npx tsx scripts/mlb-router-input-v39-source-parity-v1.ts \
            --root inputs/step12v3 \
            --custody '${{ steps.source.outputs.custody }}' \
            --out work/mlb-router-input-v39-source-parity-v1.json

      - name: Validate exact expected-outs parity
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('work/mlb-router-input-v39-source-parity-v1.json','utf8'));
          if(r.schemaVersion!=='courtedge-mlb-router-input-v39-source-parity.v1') throw new Error('schema');
          if(r.classification!=='V39_STEP12V3_SOURCE_TO_V66_PARITY_PASS') throw new Error('classification');
          if(r.rows!==11407 || r.comparisons!==22814) throw new Error(`rows/comparisons ${r.rows}/${r.comparisons}`);
          if(r.totalMismatches!==0 || r.numericMismatches!==0 || r.missingnessMismatches!==0) throw new Error('mismatch');
          if(r.maximumAbsoluteDifference>1e-12) throw new Error(`maxdiff ${r.maximumAbsoluteDifference}`);
          if(r.historicalReplayUsesRecordedStarterOnlyForEligibilityAudit!==true) throw new Error('historical eligibility');
          if(r.recordedStarterIdentityIsNotALiveRuntimeFeature!==true) throw new Error('live boundary');
          if(r.seasonHistoryReset!==true || r.sameDateStateUpdateAfterScoring!==true || r.futureGameDataUsed!==false) throw new Error('chronology');
          if(r.targetGameOutcomeUsedAsModelFeature!==false || r.productionChanged!==false || r.realFinancialExposure!==0) throw new Error('safety');
          console.log('MLB_ROUTER_INPUT_V39_STEP12V3_SOURCE_PARITY_PASSED');
          console.log('MLB_ROUTER_INPUT_V39_MAX_ABS_DIFF',r.maximumAbsoluteDifference);
          console.log('MLB_ROUTER_INPUT_V39_HISTORICAL_ELIGIBLE_SLOTS',r.historicalExactProbableRecordedEligibleSlots);
          console.log('MLB_ROUTER_INPUT_V39_LIVE_PROBABLE_SLOTS',r.livePregameProbableStarterSlots);
          NODE

      - name: Typecheck V39 source replay
        run: npx tsc --noEmit --skipLibCheck --module ESNext --moduleResolution bundler --target ES2022 --types node scripts/mlb-router-input-v39-source-parity-v1.ts server/mlb-full-modular-mechanistic-feature-builder.ts

      - name: Upload V39 source parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-router-input-v39-source-parity-v1
          path: work/mlb-router-input-v39-source-parity-v1.json
          if-no-files-found: error
          retention-days: 90
