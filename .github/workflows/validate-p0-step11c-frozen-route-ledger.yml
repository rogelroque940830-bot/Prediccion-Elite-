name: Validate P0 Step 11C Frozen Route Ledger

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-frozen-research-route-ledger.ts'
      - 'server/mlb-frozen-research-route-ledger.test.ts'
      - '.github/workflows/validate-p0-step11c-frozen-route-ledger.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate companion frozen-route ledger
        run: npx tsx --test server/mlb-frozen-research-route-ledger.test.ts
      - name: Preserve original Step 11C contract
        run: npx tsx --test server/mlb-elite-evidence-ledger.test.ts
      - name: Preserve Step 11B calibration
        run: npx tsx --test server/mlb-operating-envelope-calibration.test.ts
      - name: Backend build
        run: npm run build:backend
      - name: Static safety boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server/mlb-frozen-research-route-ledger.ts').read_text()
          required=[
            'changesStep11aPopulation: false',
            'changesOriginalStep11cPopulation: false',
            'liveFilterChangeAllowed: false',
            'betEliteAllowed: false',
            'automaticBetPlacement: false',
            'realFinancialExposure: 0',
          ]
          for x in required: assert x in p, x
          print('STEP11C_FROZEN_ROUTE_BOUNDARY_LOCKED')
          PY
