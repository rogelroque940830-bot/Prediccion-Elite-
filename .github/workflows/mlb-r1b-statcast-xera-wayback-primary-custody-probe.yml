name: MLB R1B Statcast xERA Wayback Primary-Custody Probe

on:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-primary-custody-probe.ts
      - .github/workflows/mlb-r1b-statcast-xera-wayback-primary-custody-probe.yml
  pull_request:
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-primary-custody-probe.ts
      - .github/workflows/mlb-r1b-statcast-xera-wayback-primary-custody-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Probe archived Baseball Savant xERA custody availability
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-wayback-primary-custody-probe
          npx tsx scripts/mlb-r1b-statcast-xera-wayback-primary-custody-probe.ts \
            --out=artifacts/mlb-r1b-statcast-xera-wayback-primary-custody-probe/evidence.json
      - name: Enforce research-only fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-wayback-primary-custody-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const e=JSON.parse(fs.readFileSync('artifacts/mlb-r1b-statcast-xera-wayback-primary-custody-probe/evidence.json','utf8'));
          if(e.status!=='WAYBACK_PRIMARY_CONTENT_CUSTODY_AVAILABILITY_PROBE_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceModel?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceModel?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(!Array.isArray(e.seasonInventory)||e.seasonInventory.length!==5) throw new Error('season inventory');
          if(!Array.isArray(e.replayEvidence)) throw new Error('replay evidence');
          if(e.interpretationPolicy?.archiveCaptureDoesNotEqualCompleteDailyCustody!==true) throw new Error('capture boundary');
          if(e.interpretationPolicy?.noInterpolationBetweenSnapshots!==true) throw new Error('interpolation boundary');
          if(e.interpretationPolicy?.approximationForbidden!==true) throw new Error('approximation boundary');
          if(e.scientificConclusion?.primaryAsOfXeraCustodyProven!==false||e.scientificConclusion?.captureCompletenessForPregameReplayProven!==false||e.scientificConclusion?.exactSavantProductionConversionProven!==false||e.scientificConclusion?.familyPromotionAuthorized!==false) throw new Error('premature authority');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('scientific boundary');
          NODE
      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-wayback-primary-custody-probe.ts
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'approximationForbidden: true' "$src"
          grep -F 'familyPromotionAuthorized: false' "$src"
      - name: Backend build regression
        run: npm run build:backend
      - name: Upload Wayback custody evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-wayback-primary-custody-probe
          path: artifacts/mlb-r1b-statcast-xera-wayback-primary-custody-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
