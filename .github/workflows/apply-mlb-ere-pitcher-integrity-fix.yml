name: Apply MLB ERE Pitcher Integrity Fix

on:
  push:
    branches:
      - fix/p0-mlb-ere-pitcher-source-integrity
    paths:
      - "scripts/apply-mlb-ere-pitcher-integrity-fix.py"
      - ".github/workflows/apply-mlb-ere-pitcher-integrity-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-mlb-ere-pitcher-source-integrity
          fetch-depth: 0
      - name: Apply exact source patch
        shell: bash
        run: |
          sed -i 's/if count != 2:/if count != 3:/' scripts/apply-mlb-ere-pitcher-integrity-fix.py
          sed -i 's/Expected two inning result types/Expected three inning result types/' scripts/apply-mlb-ere-pitcher-integrity-fix.py
          python3 scripts/apply-mlb-ere-pitcher-integrity-fix.py
      - name: Commit patched ERE source
        shell: bash
        run: |
          if git diff --quiet -- server/mlb-ere.ts; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mlb-ere.ts
          git commit -m "P0 MLB ERE: fix multi-team pitcher split integrity"
          git push origin HEAD:fix/p0-mlb-ere-pitcher-source-integrity
