name: Build MLB injury shadow mode

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-shadow-automation
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply integration patch
        shell: bash
        run: |
          set +e
          mkdir -p .diagnostics
          python scripts/fix-mlb-injury-shadow-script.py
          python scripts/apply-mlb-injury-shadow.py > .diagnostics/mlb-injury-shadow-apply.txt 2>&1
          code=$?
          cat .diagnostics/mlb-injury-shadow-apply.txt
          if [ "$code" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .diagnostics/mlb-injury-shadow-apply.txt
            git commit -m 'test: save MLB injury shadow patch diagnostic [skip ci]'
            git push origin HEAD:feature/mlb-injury-shadow-automation
            exit "$code"
          fi
          rm -f .diagnostics/mlb-injury-shadow-apply.txt
      - name: Install backend dependencies
        run: npm ci
      - name: Run MLB regression tests
        run: npm run test:mlb-ledger
      - name: Type-check MLB backend
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit validated implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply-mlb-injury-shadow.py
          rm -f scripts/fix-mlb-injury-shadow-script.py
          rm -f .github/workflows/run-mlb-injury-shadow-apply.yml
          rm -f .github/workflows/diagnose-mlb-injury-shadow-sources.yml
          rm -rf .diagnostics
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement MLB injury automation shadow mode'
          git push origin HEAD:feature/mlb-injury-shadow-automation
