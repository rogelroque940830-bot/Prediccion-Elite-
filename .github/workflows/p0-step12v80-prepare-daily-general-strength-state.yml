name: P0 Step 12V80 Prepare Daily General Strength State

on:
  workflow_dispatch:
  schedule:
    - cron: '5 11-15 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v80-general-strength-prospective-confirmation-contract.json'
      - 'research/p0-step12v80-general-strength-historical-parity-result-summary.json'
      - 'scripts/p0-step12v80-general-strength-live-context.ts'
      - 'scripts/p0-step12v80-general-strength-prospective.py'
      - '.github/workflows/p0-step12v80-prepare-daily-general-strength-state.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: p0-step12v80-prepare-daily-general-strength-state
  cancel-in-progress: false

jobs:
  validate-operational-boundary:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prove parity result predates all V80 prospective implementation
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT='research/p0-step12v80-general-strength-prospective-confirmation-contract.json'
          PARITY='research/p0-step12v80-general-strength-historical-parity-result-summary.json'
          LIVE='scripts/p0-step12v80-general-strength-live-context.ts'
          CAP='scripts/p0-step12v80-general-strength-prospective.py'
          CADD="$(git log --diff-filter=A --format=%H -- "$CONTRACT" | tail -1)"
          PADD="$(git log --diff-filter=A --format=%H -- "$PARITY" | tail -1)"
          LADD="$(git log --diff-filter=A --format=%H -- "$LIVE" | tail -1)"
          SADD="$(git log --diff-filter=A --format=%H -- "$CAP" | tail -1)"
          test -n "$CADD" && test -n "$PADD" && test -n "$LADD" && test -n "$SADD"
          git merge-base --is-ancestor "$CADD" "$PADD"
          git merge-base --is-ancestor "$PADD" "$LADD"
          git merge-base --is-ancestor "$PADD" "$SADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v80-general-strength-prospective-confirmation-contract.json'))
          p=json.load(open('research/p0-step12v80-general-strength-historical-parity-result-summary.json'))
          assert c['scientificStatus']=='FROZEN_GENERAL_STRENGTH_PROSPECTIVE_CONFIRMATION_BEFORE_ANY_V80_SCORER_OR_CAPTURE_EXISTS'
          assert c['prospectiveCohort']['firstEligibleOfficialDate']=='2026-08-18'
          assert c['prospectiveCohort']['targetRouteExactly']=='V16_V68_CONSENSUS_T0.550'
          assert c['prospectiveCohort']['parentPortfolioExactly']=='CONFLUENCE_LEDGER_TOP1_T0.550'
          assert c['outcomeEmbargo']['interimOutcomePeekingAllowed'] is False
          assert p['classification']=='V80_HISTORICAL_PARITY_GATE_PASSED'
          assert p['nextAuthorizedStage']=='IMPLEMENT_OUTCOME_FREE_V80_PROSPECTIVE_CAPTURE_ONLY'
          assert p['integrity']['prospectiveOutcomesRead'] is False
          assert p['integrity']['realFinancialExposure']==0
          print('V80_PROSPECTIVE_IMPLEMENTATION_CHRONOLOGY_PROVED')
          PY
      - name: Syntax and frozen-source import checks
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/p0-step12v80-general-strength-prospective.py
          # The frozen classifier has a pre-existing narrow TypeScript literal-type
          # diagnostic. V80 must not edit that frozen parent. --noCheck verifies
          # syntax/module transpilation while preserving the exact parent blob.
          npx tsc --noEmit --noCheck --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler \
            scripts/p0-step12v80-general-strength-live-context.ts \
            scripts/p0-full13-live-parity-state.ts \
            server/mlb-c4-live-feature-builder.ts \
            server/mlb-full13-live-feature-builder.ts \
            server/mlb-frozen-a-plus-classifier.ts
          npx tsx -e "import('./server/mlb-frozen-a-plus-classifier.ts').then(m=>{if(m.MLB_FROZEN_A_PLUS_CLASSIFIER_VERSION!=='mlb-frozen-a-plus-classifier.v1')process.exit(2);console.log('V80_FROZEN_CLASSIFIER_RUNTIME_IMPORT_OK')})"

  prepare-daily-state:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout V80 code from default branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout V68 immutable prospective source ledger
        uses: actions/checkout@v4
        with:
          ref: data/p0-step12v68-prospective
          path: v68-ledger
          fetch-depth: 1

      - name: Checkout V80 immutable prospective ledger
        uses: actions/checkout@v4
        with:
          ref: data/p0-step12v80-general-strength-prospective
          path: v80-ledger
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: code/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve target date and enforce first eligible boundary
        id: dates
        working-directory: code
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          from zoneinfo import ZoneInfo
          d=dt.datetime.now(ZoneInfo('America/New_York')).date()
          y=d-dt.timedelta(days=1)
          print(f'target={d.isoformat()}')
          print(f'yesterday={y.isoformat()}')
          print(f'eligible={str(d>=dt.date(2026,8,18)).lower()}')
          PY

      - name: Stop before first V80 eligible official date
        if: steps.dates.outputs.eligible != 'true'
        run: echo 'V80 prospective state is not eligible before 2026-08-18.'

      - name: Check whether immutable V80 state already exists
        if: steps.dates.outputs.eligible == 'true'
        id: existing
        shell: bash
        run: |
          if test -s "v80-ledger/v80/states/${{ steps.dates.outputs.target }}.json"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require complete V68 gap through prior official date
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s v68-ledger/v68/gap/ledger-manifest.json
          test -s "v68-ledger/v68/states/${{ steps.dates.outputs.target }}.json"
          python - <<'PY'
          import json
          m=json.load(open('v68-ledger/v68/gap/ledger-manifest.json'))
          expected='${{ steps.dates.outputs.yesterday }}'
          if m.get('lastOfficialDate') != expected:
              raise SystemExit(f'V80_FAIL_CLOSED_V68_GAP_NOT_THROUGH_PRIOR_DATE:{m.get("lastOfficialDate")}:{expected}')
          print('V80_V68_PRIOR_DATE_SOURCE_COMPLETE')
          PY

      - name: Install Node dependencies
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        working-directory: code
        run: npm ci --ignore-scripts

      - name: Download frozen V68 source base
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v68-frozen-prospective-source-base
          path: frozen
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31967561655

      - name: Expand frozen 2026 source base
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        id: base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/base
          tar -xzf frozen/step12v3/2026_YTD.tgz -C work/base
          TABLE="$(find work/base -type f -name game-anatomy-feature-table.json -print -quit)"
          test -n "$TABLE"
          ROOT="$(dirname "$TABLE")"
          test -s "$ROOT/cohort/official-acquisition.json"
          test -s "$ROOT/cohort/starting-pitcher-history.json"
          test -s "$ROOT/cohort/pregame-lineup-history.json"
          test -s "$ROOT/t5-audit/t5-starter-identity-audit.json"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Build immutable prior-date Full13 strength and bullpen state
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        working-directory: code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../work
          npx tsx scripts/p0-step12v80-general-strength-live-context.ts \
            --mode prepare \
            --base-root '../${{ steps.base.outputs.root }}' \
            --gap-root ../v68-ledger/v68/gap \
            --target-date '${{ steps.dates.outputs.target }}' \
            --out ../work/v80-state.json
          python - <<'PY'
          import json
          x=json.load(open('../work/v80-state.json'))
          assert x['schemaVersion']=='courtedge-p0-step12v80-general-strength-live-state.v1'
          assert x['targetOfficialDate']=='${{ steps.dates.outputs.target }}'
          assert x['chronology']['wholeOfficialDatePriorStateOnly'] is True
          assert x['chronology']['sameDateCompletedGamesUsed'] is False
          assert x['diagnostics']['rankedTeams'] >= 24
          assert x['policy']['containsCurrentGameOutcome'] is False
          assert x['policy']['containsMarketPrice'] is False
          assert x['policy']['realFinancialExposure']==0
          PY

      - name: Install first-write immutable V80 state
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "v80-ledger/v80/states"
          test ! -e "v80-ledger/v80/states/${{ steps.dates.outputs.target }}.json"
          cp work/v80-state.json "v80-ledger/v80/states/${{ steps.dates.outputs.target }}.json"

      - name: Commit immutable V80 daily state
        if: steps.dates.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        working-directory: v80-ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'court-edge-v80-research-bot'
          git config user.email 'v80-research-bot@users.noreply.github.com'
          git add v80/states
          git diff --cached --quiet && exit 0
          git commit -m "V80 state ${{ steps.dates.outputs.target }}: freeze prior-date strength context"
          git pull --rebase origin data/p0-step12v80-general-strength-prospective
          git push origin HEAD:data/p0-step12v80-general-strength-prospective
