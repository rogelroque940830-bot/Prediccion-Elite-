name: Apply P1-M6A3B2B1 Zero-Appearance Fix PR

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/apply-p1-m6a3b2b1-zero-appearance-fix-pr.yml'
      - '.github/scripts/apply-p1-m6a3b2b1-zero-appearance-fix.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-m6a3b2b1-zero-appearance-starter-order
      - name: Apply evidence-grounded patch
        run: python .github/scripts/apply-p1-m6a3b2b1-zero-appearance-fix.py
      - name: Commit source-only hotfix
        shell: bash
        run: |
          git diff --check
          git checkout -- .github/workflows/validate-p1-m6a3b2b1-starting-pitcher-history.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-market-starting-pitcher-history.ts \
                  server/mlb-market-starting-pitcher-history.test.ts \
                  docs/P1_M6A3B2B1_MLB_STARTING_PITCHER_HISTORY.md
          git commit -m 'P1-M6A3B2B1: handle zero-appearance pre-starter listing'
          git push origin HEAD:fix/p1-m6a3b2b1-zero-appearance-starter-order
