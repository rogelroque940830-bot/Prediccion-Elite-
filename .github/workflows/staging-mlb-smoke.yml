name: Staging MLB Smoke Tests

on:
  push:
    branches:
      - p0-staging
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-mlb-smoke
  cancel-in-progress: true

jobs:
  cleanup:
    name: Apply one-time credential cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout p0-staging
        uses: actions/checkout@v4
        with:
          ref: p0-staging
          fetch-depth: 0

      - name: Remove hardcoded credentials and restore regression workflow
        run: node scripts/staging-secret-cleanup-once.cjs
