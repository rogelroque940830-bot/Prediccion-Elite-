name: Validate P1-M4C Backend Economic Response

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-p1-scientific-capture-service.ts'
      - 'server/mlb-p1-scientific-capture-service.test.ts'
      - 'server/mlb-p1-economic-review.ts'
      - 'server/mlb-p1-economic-review-routes.ts'
      - 'server/mlb-p1-economic-review.test.ts'
      - 'server/mlb-p1-operating-envelope-routes.ts'
      - 'server/mlb-premium-no-ultra-prospective-routes.ts'
      - 'server/mlb-p1-real-cohort-activation.ts'
      - 'server/mlb-p1-real-cohort-activation.test.ts'
      - 'server/mlb-market-odds-normalizer.ts'
      - 'server/mlb-market-odds-normalizer.test.ts'
      - 'server/mlb-market-universe-odds-routes.ts'
      - 'server/mlb-market-universe-odds-routes.test.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.ts'
      - 'server/mlb-statcast-matchup-vsteam-identity.test.ts'
      - 'server/mlb-statcast-matchup-identity-routes.ts'
      - 'server/mlb-statcast-matchup-identity-routes.test.ts'
      - 'server/mlb-statcast-matchup-certifier.ts'
      - 'server/mlb-statcast-matchup-certifier.test.ts'
      - 'server/routes.ts'
      - 'server/route-contract.extensions.json'
      - 'docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md'
      - 'docs/P1_M3D_INTERACTIVE_ECONOMIC_REVIEW.md'
      - 'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md'
      - 'docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_READONLY.md'
      - 'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md'
      - 'docs/P1_M3F3B5B_STATCAST_CERTIFICATION.md'
      - 'docs/P1_M5A_REAL_COHORT_ACTIVATION.md'
      - 'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md'
      - 'tsconfig.p1-m3d-interactive-economic-review.json'
      - 'tsconfig.p1-m3e-operating-envelope.json'
      - 'tsconfig.p1-premium-no-ultra-prospective-readonly.json'
      - 'tsconfig.p1-m3f3b5-vsteam-identity.json'
      - 'tsconfig.p1-m5a-real-cohort-activation.json'
      - 'tsconfig.p1-m6a2-market-odds.json'
      - '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml'
      - '.github/workflows/validate-p1-m3d-interactive-economic-review.yml'
      - '.github/workflows/validate-p1-m3e-operating-envelope.yml'
      - '.github/workflows/validate-p1-premium-no-ultra-prospective-readonly.yml'
      - '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml'
      - '.github/workflows/validate-p1-m3f3b5b-statcast-certification.yml'
      - '.github/workflows/validate-p1-m4c-backend-economic-response.yml'
      - '.github/workflows/validate-p1-m5a-real-cohort-activation.yml'
      - '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml'

permissions:
  contents: read

jobs:
  validate-p1-m4c-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run P1-M4C service integration tests
        run: npx tsx --test server/mlb-p1-scientific-capture-service.test.ts
      - name: Run P1-M4A and P1-M4B regressions
        run: |
          npx tsx --test \
            server/mlb-p1-economic-decision-contract.test.ts \
            server/mlb-p1-economic-decision-adapter.test.ts
      - name: Run P1 capture and readiness regressions
        run: |
          npx tsx --test \
            server/mlb-p1-scientific-capture-contract.test.ts \
            server/mlb-p1-pregame-readiness-contract.test.ts \
            server/mlb-p1-daily-slate.test.ts \
            server/mlb-shadow-evaluation.test.ts \
            server/mlb-terminal-ledger-records.test.ts
      - name: Build production backend
        run: npm run build:backend
      - name: Run S5A real-save regression
        run: npm run test:s5a-e2e
      - name: Run complete S5B shadow regression
        run: npm run test:s5b-shadow
      - name: Verify response, persistence and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          service='server/mlb-p1-scientific-capture-service.ts'
          testfile='server/mlb-p1-scientific-capture-service.test.ts'
          docs='docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md'
          inherited='.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml'

          grep -F 'p1-m4c-backend-economic-response-2026-08-06' "$service"
          grep -F 'attachMlbP1M4bEconomicDecision(candidate, serverNow)' "$service"
          grep -F 'economicDecision: MlbP1M4bAdapterResult' "$service"
          grep -F 'P1_M4B_ADAPTER_REJECTED' "$service"
          grep -F 'P1_M4B_ENRICHED_CAPTURE_REJECTED' "$service"
          grep -F 'enrichedCandidate' "$service"
          grep -F 'layers[MLB_P1_M4B_LAYER_KEY]' "$testfile"
          grep -F 'WAIT_FOR_FINAL' "$testfile"
          grep -F 'economicDecision: MlbP1M4bAdapterResult' "$docs"
          grep -F 'Diff hygiene and protected extension scope' "$inherited"

          node <<'NODE'
          const fs = require('node:fs');
          const service = fs.readFileSync('server/mlb-p1-scientific-capture-service.ts', 'utf8');
          const inherited = fs.readFileSync('.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          assert(service.includes('toMlbP1M3aLedgerCompatibleInput(\n        enrichedCandidate,'), 'ledger does not use enriched candidate');
          assert(service.includes('validation: enrichedValidation'), 'response does not expose enriched validation');
          assert(service.includes('economicDecision,'), 'economic decision missing from response calls');
          assert(service.includes('realFinancialExposure: 0'), 'zero exposure invariant missing');
          assert(!/automaticBetPlacement:\s*true/.test(service), 'automatic betting enabled');
          assert(!/sportsbook/i.test(service), 'sportsbook integration introduced');
          assert(inherited.includes('unexpected=$(comm -23'), 'inherited scope gate is not extension-safe');
          assert(inherited.includes('server/mlb-p1-scientific-capture-service.ts'), 'service protection missing');
          NODE
      - name: Diff hygiene and protected successor scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin integration/p0-staging-secure --depth=1
          git diff --check origin/integration/p0-staging-secure...HEAD
          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)

          allowed=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3b-mlb-scientific-capture.yml' \
            '.github/workflows/validate-p1-m3d-interactive-economic-review.yml' \
            '.github/workflows/validate-p1-m3e-operating-envelope.yml' \
            '.github/workflows/validate-p1-premium-no-ultra-prospective-readonly.yml' \
            '.github/workflows/validate-p1-m3f3b5-vsteam-identity.yml' \
            '.github/workflows/validate-p1-m3f3b5b-statcast-certification.yml' \
            '.github/workflows/validate-p1-m4c-backend-economic-response.yml' \
            '.github/workflows/validate-p1-m5a-real-cohort-activation.yml' \
            '.github/workflows/validate-p1-m6a2-mlb-market-odds-universe.yml' \
            'docs/P1_M3D_INTERACTIVE_ECONOMIC_REVIEW.md' \
            'docs/P1_M3E_MLB_OPERATING_ENVELOPE_READONLY.md' \
            'docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_READONLY.md' \
            'docs/P1_M3F3B5_VSTEAM_OPPOSING_TEAM_ID.md' \
            'docs/P1_M3F3B5B_STATCAST_CERTIFICATION.md' \
            'docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md' \
            'docs/P1_M5A_REAL_COHORT_ACTIVATION.md' \
            'docs/P1_M6A2_MLB_MARKET_ODDS_UNIVERSE.md' \
            'server/mlb-market-odds-normalizer.test.ts' \
            'server/mlb-market-odds-normalizer.ts' \
            'server/mlb-market-universe-odds-routes.test.ts' \
            'server/mlb-market-universe-odds-routes.ts' \
            'server/mlb-p1-economic-review-routes.ts' \
            'server/mlb-p1-economic-review.test.ts' \
            'server/mlb-p1-economic-review.ts' \
            'server/mlb-p1-operating-envelope-routes.ts' \
            'server/mlb-premium-no-ultra-prospective-routes.ts' \
            'server/mlb-p1-real-cohort-activation.test.ts' \
            'server/mlb-p1-real-cohort-activation.ts' \
            'server/mlb-p1-scientific-capture-service.test.ts' \
            'server/mlb-p1-scientific-capture-service.ts' \
            'server/mlb-statcast-matchup-certifier.test.ts' \
            'server/mlb-statcast-matchup-certifier.ts' \
            'server/mlb-statcast-matchup-identity-routes.test.ts' \
            'server/mlb-statcast-matchup-identity-routes.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.test.ts' \
            'server/mlb-statcast-matchup-vsteam-identity.ts' \
            'server/route-contract.extensions.json' \
            'server/routes.ts' \
            'tsconfig.p1-m3d-interactive-economic-review.json' \
            'tsconfig.p1-m3e-operating-envelope.json' \
            'tsconfig.p1-premium-no-ultra-prospective-readonly.json' \
            'tsconfig.p1-m3f3b5-vsteam-identity.json' \
            'tsconfig.p1-m5a-real-cohort-activation.json' \
            'tsconfig.p1-m6a2-market-odds.json' | sort)
          unexpected=$(comm -23 <(printf '%s\n' "$changed") <(printf '%s\n' "$allowed"))
          [[ -z "$unexpected" ]]

          if grep -Fxq 'server/mlb-p1-scientific-capture-service.ts' <<< "$changed" \
            || grep -Fxq 'server/mlb-p1-scientific-capture-service.test.ts' <<< "$changed" \
            || grep -Fxq 'docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md' <<< "$changed"; then
            grep -Fxq 'server/mlb-p1-scientific-capture-service.ts' <<< "$changed"
            grep -Fxq 'server/mlb-p1-scientific-capture-service.test.ts' <<< "$changed"
            grep -Fxq 'docs/P1_M4C_BACKEND_ECONOMIC_RESPONSE.md' <<< "$changed"
          fi

          ! grep -Eq '^(server/(security|mlb-ledger|mlb-p1-scientific-capture-contract|mlb-p1-scientific-capture-routes|mlb-p1-economic-decision-contract|mlb-p1-economic-decision-adapter))' <<< "$unexpected"
