name: Bootstrap PREMIUM No ULTRA UI Clean Replacement

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/bootstrap-premium-no-ultra-ui-clean.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Copy exact validated six-file UI package
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/p1-premium-no-ultra-prospective-ui --depth=1
          git checkout FETCH_HEAD -- \
            .github/workflows/validate-p1-premium-no-ultra-prospective-ui.yml \
            docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_UI.md \
            frontend/client/src/components/mlb-premium-no-ultra-card.tsx \
            frontend/client/src/lib/mlb-premium-no-ultra-prospective.test.ts \
            frontend/client/src/lib/mlb-premium-no-ultra-prospective.ts \
            frontend/client/src/pages/mlb-economic-review-activated.tsx
          rm -f .github/workflows/bootstrap-premium-no-ultra-ui-clean.yml
          git diff --check
          current=$(git status --short | awk '{print $2}' | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/bootstrap-premium-no-ultra-ui-clean.yml' \
            '.github/workflows/validate-p1-premium-no-ultra-prospective-ui.yml' \
            'docs/P1_PREMIUM_NO_ULTRA_PROSPECTIVE_UI.md' \
            'frontend/client/src/components/mlb-premium-no-ultra-card.tsx' \
            'frontend/client/src/lib/mlb-premium-no-ultra-prospective.test.ts' \
            'frontend/client/src/lib/mlb-premium-no-ultra-prospective.ts' \
            'frontend/client/src/pages/mlb-economic-review-activated.tsx' | sort)
          [[ "$current" == "$expected" ]]
      - name: Commit clean UI package and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontend: add clean PREMIUM no ULTRA prospective tracker UI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
