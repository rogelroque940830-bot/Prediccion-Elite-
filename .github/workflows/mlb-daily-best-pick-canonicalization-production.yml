name: MLB Daily BEST PICK Canonicalization Production Candidate

on:
  push:
    branches:
      - production/mlb-daily-best-pick-canonicalization-v1
    paths:
      - "research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_CONTRACT.json"
      - "research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_RESULT.json"
      - "server/mlb-daily-best-pick-daily-canonicalization-v1.ts"
      - "server/mlb-daily-best-pick-daily-canonicalization-v1.test.ts"
      - ".github/workflows/mlb-daily-best-pick-canonicalization-production.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove exact certified blobs and narrow production diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git hash-object research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_CONTRACT.json)" = "bcd18bfd7475be7e14e1b5a9b445e5b89eacb235"
          test "$(git hash-object research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_RESULT.json)" = "76b34e19e5d6b10f5de5e3f653bd064e70cd6aa3"
          test "$(git hash-object server/mlb-daily-best-pick-daily-canonicalization-v1.ts)" = "2a2c6f8f1ab52c3f861c2e55ab6dc50500986a06"
          test "$(git hash-object server/mlb-daily-best-pick-daily-canonicalization-v1.test.ts)" = "0948b4e1cb14916a09eb48501b3dc5a9ffdafd38"
          python - <<'PY'
          import subprocess
          allowed={
            'research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_CONTRACT.json',
            'research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_RESULT.json',
            'server/mlb-daily-best-pick-daily-canonicalization-v1.ts',
            'server/mlb-daily-best-pick-daily-canonicalization-v1.test.ts',
            '.github/workflows/mlb-daily-best-pick-canonicalization-production.yml',
          }
          changed=set(filter(None, subprocess.check_output(['git','diff','--name-only','origin/main...HEAD'], text=True).splitlines()))
          assert changed==allowed, (changed,allowed)
          print('MLB_CANONICALIZATION_PRODUCTION_DIFF_EXACT_AND_CERTIFIED')
          PY

      - name: Type-check canonicalizer
        run: npx tsc --noEmit --module ESNext --moduleResolution bundler --target ES2022 --esModuleInterop --skipLibCheck --types node server/mlb-daily-best-pick-daily-canonicalization-v1.ts server/mlb-daily-best-pick-daily-canonicalization-v1.test.ts

      - name: Run frozen canonicalization tests
        run: npx tsx --test server/mlb-daily-best-pick-daily-canonicalization-v1.test.ts

      - name: Reprove read-only outcome-blind boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('server/mlb-daily-best-pick-daily-canonicalization-v1.ts').read_text()
          compact=t.replace(' ', '')
          for x in [
            'readonly: true, fileMustExist: true', 'query_only = ON',
            'createdAtMs < cutoffMs', 'captured < cutoffMs', 'generated < cutoffMs',
            'Math.min(...scheduleRows.flatMap',
            'decisionAffectsCanonicalSelection: false',
            'pickIdentityAffectsCanonicalSelection: false',
            'modelProbabilityAffectsCanonicalSelection: false',
            'routeMatchAffectsCanonicalSelection: false',
            'selectedPopulationProbabilityScoringAllowed: false',
            'crossSportProbabilityAuthorized: false',
          ]: assert x in t, x
          for x in [
            './mlb-selective-odds-acquisition','./mlb-market-edge','./mlb-operating-envelope',
            './mlb-pure-settlement','./mlb-daily-best-pick-price','./mlb-daily-best-pick-manual-price',
            'selected_win','finalScore','homeScore','awayScore','settledOutcome'
          ]: assert x not in t, x
          assert 'outcomesRead:false' in compact
          assert 'sportsbookPricesRead:false' in compact
          assert 'custodyRowsMutated:false' in compact
          print('MLB_CANONICALIZATION_PRODUCTION_OUTCOME_BLIND_BOUNDARY_INTACT')
          PY

      - name: Build backend
        run: npm run build:backend

      - name: Upload production candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-best-pick-canonicalization-production-candidate
          path: research/MLB_DAILY_BEST_PICK_DAILY_CANONICALIZATION_RESULT.json
          if-no-files-found: error
          retention-days: 90
