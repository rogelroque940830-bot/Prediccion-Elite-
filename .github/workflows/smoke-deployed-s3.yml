name: Smoke deployed S3 modular backend

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: 2945771a0746ae8af2e3d15a53df22942821200d
    steps:
      - name: Verify deployed S3 routes and persisted state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --silent --show-error "$BACKEND_URL/health" > /tmp/health.json || true
            served=$(jq -r '.commit // ""' /tmp/health.json 2>/dev/null || true)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            sleep 10
          done

          jq -e --arg commit "$EXPECTED_COMMIT" '
            .status == "healthy"
            and .commit == $commit
            and .authPersistence == true
            and .multiUserOwnership == true
            and .ledgerOwnership.immutable == true
            and .ledgerOwnership.unownedPredictions == 0
          ' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/ledger.json
          jq -e '
            .success == true
            and .data.immutable == true
            and .data.predictions >= 6
            and .data.settlementEvents >= 4
            and .data.ownership.immutable == true
            and .data.ownership.unownedPredictions == 0
            and .data.ownership.assignments == .data.predictions
          ' /tmp/ledger.json >/dev/null

          private_code=$(curl --silent --show-error --output /tmp/private.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/mlb/ledger/v1/history?limit=1")
          test "$private_code" = "401"
          jq -e '.success == false and .error == "Authentication required for private data"' /tmp/private.json >/dev/null

          api_health_code=$(curl --silent --show-error --output /tmp/api-health.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/health")
          test "$api_health_code" = "200"
          jq -e '.ok == true' /tmp/api-health.json >/dev/null

          mlb_code=$(curl --silent --show-error --output /tmp/mlb.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/mlb/ere/not-a-number")
          test "$mlb_code" = "400"
          jq -e '.success == false' /tmp/mlb.json >/dev/null

          nba_code=$(curl --silent --show-error --output /tmp/nba.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/nba/context")
          test "$nba_code" = "200"
          jq -e '.success == false' /tmp/nba.json >/dev/null

          wnba_code=$(curl --silent --show-error --output /tmp/wnba.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/wnba/shot-profile/not-a-number")
          test "$wnba_code" = "400"
          jq -e '.success == false' /tmp/wnba.json >/dev/null

          sharp_code=$(curl --silent --show-error --output /tmp/sharp.json --write-out '%{http_code}' \
            "$BACKEND_URL/api/sharp/mlb/s3-smoke-nonexistent")
          test "$sharp_code" != "401"
          test "$sharp_code" != "404"

          jq '{commit, ledgerOwnership, pickOwnership}' /tmp/health.json
          jq '.data | {predictions, settlementEvents, immutable, ownership}' /tmp/ledger.json
