name: MLB Unified Elite Production Shadow Gate V1

on:
  workflow_dispatch:
  push:
    branches:
      - production/mlb-unified-elite-live-v1
    paths:
      - "server/mlb-unified-elite-router-v1.ts"
      - "server/mlb-full-modular-live-operational-bridge.ts"
      - "server/mlb-full-modular-mechanistic-feature-builder.ts"
      - "server/mlb-unified-elite-shadow-v1.ts"
      - "server/mlb-unified-elite-visible-daily-best-pick-v1.ts"
      - "server/mlb-unified-elite-visible-daily-best-pick-v1.test.ts"
      - "server/mlb-unified-v16-ui-routes.ts"
      - "server/mlb-unified-v16-live-providers.ts"
      - "server/mlb-c4-certified-materializer.ts"
      - "server/mlb-v68-prospective-state-live-adapter.ts"
      - "server/mlb-full-modular-bullpen-live-materializer.ts"
      - "server/mlb-full-modular-team-strength-live-materializer.ts"
      - "server/mlb-unified-elite-lower-tier-live-provider.ts"
      - "server/mlb-unified-elite-shared-live-provider-bundle.ts"
      - "server/routes.ts"
      - "scripts/mlb-unified-elite-router-v1.test.ts"
      - "scripts/mlb-full-modular-live-operational-parity-v1.test.ts"
      - "scripts/mlb-full-modular-team-strength-live-materializer-v1.test.ts"
      - "scripts/mlb-full-modular-team-strength-live-smoke.ts"
      - "scripts/mlb-unified-elite-shadow-v1.test.ts"
      - "scripts/mlb-unified-elite-lower-tier-live-provider-v1.test.ts"
      - "scripts/mlb-v68-prospective-state-live-adapter-v1.test.ts"
      - "research/mlb-full-modular-pp-horizon-model-snapshot-v1.json"
      - "research/mlb-unified-elite-live-authority-v1.json"
      - ".github/workflows/mlb-unified-elite-production-shadow-gate-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/mlb-unified-elite-router-v1.ts"
      - "server/mlb-full-modular-live-operational-bridge.ts"
      - "server/mlb-full-modular-mechanistic-feature-builder.ts"
      - "server/mlb-unified-elite-shadow-v1.ts"
      - "server/mlb-unified-elite-visible-daily-best-pick-v1.ts"
      - "server/mlb-unified-elite-visible-daily-best-pick-v1.test.ts"
      - "server/mlb-unified-v16-ui-routes.ts"
      - "server/mlb-unified-v16-live-providers.ts"
      - "server/mlb-c4-certified-materializer.ts"
      - "server/mlb-v68-prospective-state-live-adapter.ts"
      - "server/mlb-full-modular-bullpen-live-materializer.ts"
      - "server/mlb-full-modular-team-strength-live-materializer.ts"
      - "server/mlb-unified-elite-lower-tier-live-provider.ts"
      - "server/mlb-unified-elite-shared-live-provider-bundle.ts"
      - "server/routes.ts"
      - "scripts/mlb-unified-elite-router-v1.test.ts"
      - "scripts/mlb-full-modular-live-operational-parity-v1.test.ts"
      - "scripts/mlb-full-modular-team-strength-live-materializer-v1.test.ts"
      - "scripts/mlb-full-modular-team-strength-live-smoke.ts"
      - "scripts/mlb-unified-elite-shadow-v1.test.ts"
      - "scripts/mlb-unified-elite-lower-tier-live-provider-v1.test.ts"
      - "scripts/mlb-v68-prospective-state-live-adapter-v1.test.ts"
      - "research/mlb-full-modular-pp-horizon-model-snapshot-v1.json"
      - "research/mlb-unified-elite-live-authority-v1.json"
      - ".github/workflows/mlb-unified-elite-production-shadow-gate-v1.yml"

permissions:
  contents: read

jobs:
  production-shadow-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove certified lower-tier authorities are unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:server/mlb-unified-elite-router-v1.ts)" = 'b99c6fec3196cdcb75fd2843e44f5ad72bc6d677'
          test "$(git rev-parse HEAD:server/mlb-full-modular-live-operational-bridge.ts)" = '291ca194ba1cf6f360adf0f9467676e550691c1c'
          test "$(git rev-parse HEAD:server/mlb-full-modular-mechanistic-feature-builder.ts)" = '2661986ebc830e7b8274b01e015d8f98bc4b2c96'
          test "sha256:$(sha256sum research/mlb-full-modular-pp-horizon-model-snapshot-v1.json | awk '{print $1}')" = 'sha256:bf51bb1d40f8b8f7f5e18686686c916457d1f9246be928191b8803c5884cc5f9'
          echo MLB_UNIFIED_ELITE_CERTIFIED_AUTHORITIES_UNCHANGED

      - name: Prove prospective embargo and visible hierarchy remain intact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          shadow=Path('server/mlb-unified-elite-shadow-v1.ts').read_text()
          visible=Path('server/mlb-unified-elite-visible-daily-best-pick-v1.ts').read_text()
          ui=Path('server/mlb-unified-v16-ui-routes.ts').read_text()
          routes=Path('server/routes.ts').read_text()
          provider=Path('server/mlb-unified-elite-lower-tier-live-provider.ts').read_text()
          bundle=Path('server/mlb-unified-elite-shared-live-provider-bundle.ts').read_text()
          test=Path('scripts/mlb-unified-elite-lower-tier-live-provider-v1.test.ts').read_text()

          assert 'PROSPECTIVE_EMBARGO_SHADOW_ONLY' in shadow
          assert 'outcomesRead: false' in shadow
          assert 'performanceMetricsRead: false' in shadow
          assert 'ppHorizonInterimOutcomesRead: false' in ui
          assert 'v68ScientificValidationChanged: false' in ui
          assert 'v80ScientificValidationChanged: false' in ui
          assert 'ppHorizonProspectiveCustodyChanged: false' in ui

          assert 'A_PLUS_PREMIUM_PP_HORIZON_FULL_MODULAR_NO_PLAY' in ui
          assert 'if (input.parentDailyBestPick.decision === "BEST_PICK")' in visible
          assert 'input.lowerTier.ppHorizon.status === "SELECTION"' in visible
          assert 'input.lowerTier.fullModular.status === "SELECTION"' in visible
          assert 'premiumAlwaysPrecedesLowerTiers: true' in visible
          assert 'ppHorizonPrecedesFullModular: true' in visible
          assert 'fullModularFallbackAfterPpNoPlayAllowed: true' in visible
          assert 'lowerTierSelectionUsesSportsbookPrice: false' in visible
          assert 'v68ScientificContractChanged: false' in visible
          assert 'v80ScientificContractChanged: false' in visible
          assert 'ppHorizonProspectiveCustodyChanged: false' in visible

          assert 'lowerTierVisiblePickPriceEvaluationEnabled: false' in ui
          assert 'finalBetRecommendationProduced: false' in ui
          assert 'stakeCalculated: false' in ui
          assert 'automaticBetPlacement: false' in ui
          assert 'automaticBetPlacement: false' in visible
          assert 'realFinancialExposure: 0' in visible

          # The same certified bundle feeds all three MLB command surfaces. The visible V16
          # command now receives the strictly-prior provisional V16 scorer explicitly so its
          # whole-slate sporting analysis can run before the price boundary.
          assert routes.count('createMlbUnifiedEliteSharedLiveProviderBundle()') == 1
          assert 'const mlbUnifiedLive = createMlbUnifiedEliteSharedLiveProviderBundle();' in routes
          assert 'registerMlbUnifiedV16UiRoutes(app, {' in routes
          assert 'registerMlbDailyOpportunityUiRoutes(app, {' in routes
          assert routes.count('liveEvidenceProviders: mlbUnifiedLive.liveEvidenceProviders') >= 3
          assert routes.count('provisionalV16Provider: mlbUnifiedLive.dailyOpportunityProvisionalV16Provider') >= 3
          assert routes.count('unifiedEliteLowerTierShadowProvider: mlbUnifiedLive.unifiedEliteLowerTierShadowProvider') >= 2
          assert 'sharedClassifierMaterializer = new MlbC4CertifiedMaterializer()' in bundle
          assert bundle.count('full13Materializer: sharedClassifierMaterializer') == 2
          assert 'MLB_UNIFIED_ELITE_FIRST_PROSPECTIVE_DATE' in provider
          assert 'DECISION_TIMESTAMP_MISSING_OR_LATE' in provider
          assert 'CERTIFIED_OPERATIONAL_LOWER_TIER_LIVE_V1' in provider
          assert 'CERTIFIED_OPERATIONAL_LOWER_TIER_LIVE_V1:1' in test
          print('MLB_UNIFIED_ELITE_PROSPECTIVE_EMBARGO_AND_VISIBLE_HIERARCHY_INTACT')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check certified source materialization modules
        shell: bash
        run: |
          set -euo pipefail
          npx tsc --noEmit \
            --module ESNext \
            --moduleResolution bundler \
            --target ES2022 \
            --esModuleInterop \
            --skipLibCheck \
            --types node \
            server/mlb-unified-elite-router-v1.ts \
            server/mlb-full-modular-live-operational-bridge.ts \
            server/mlb-unified-elite-shadow-v1.ts \
            server/mlb-unified-elite-visible-daily-best-pick-v1.ts \
            server/mlb-unified-elite-visible-daily-best-pick-v1.test.ts \
            server/mlb-c4-certified-materializer.ts \
            server/mlb-v68-prospective-state-live-adapter.ts \
            server/mlb-full-modular-bullpen-live-materializer.ts \
            server/mlb-full-modular-team-strength-live-materializer.ts \
            scripts/mlb-unified-elite-router-v1.test.ts \
            scripts/mlb-full-modular-live-operational-parity-v1.test.ts \
            scripts/mlb-full-modular-team-strength-live-materializer-v1.test.ts \
            scripts/mlb-full-modular-team-strength-live-smoke.ts \
            scripts/mlb-unified-elite-shadow-v1.test.ts \
            scripts/mlb-v68-prospective-state-live-adapter-v1.test.ts

      - name: Bundle-check shared lower-tier provider integration
        run: npx esbuild server/mlb-unified-elite-shared-live-provider-bundle.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-lower-tier-provider.mjs

      - name: Execute certified hierarchy suite
        run: npx tsx scripts/mlb-unified-elite-router-v1.test.ts

      - name: Execute visible Daily BEST PICK hierarchy suite
        run: npx tsx --test server/mlb-unified-elite-visible-daily-best-pick-v1.test.ts

      - name: Execute certified live bridge suite
        run: npx tsx scripts/mlb-full-modular-live-operational-parity-v1.test.ts

      - name: Execute official team-strength recovery regression suite
        run: npx tsx --test scripts/mlb-full-modular-team-strength-live-materializer-v1.test.ts

      - name: Execute real MLB Aug 19 team-strength smoke (diagnostic)
        continue-on-error: true
        run: npx tsx scripts/mlb-full-modular-team-strength-live-smoke.ts

      - name: Execute production shadow integration suite
        run: npx tsx scripts/mlb-unified-elite-shadow-v1.test.ts

      - name: Execute certified lower-tier live provider suite
        run: npx tsx scripts/mlb-unified-elite-lower-tier-live-provider-v1.test.ts

      - name: Execute immutable V68 state digest suite
        run: npx tsx scripts/mlb-v68-prospective-state-live-adapter-v1.test.ts

      - name: Build production backend including V16 UI route
        run: npm run build:backend

      - name: Prove no lower-tier price or wager promotion surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text='\n'.join([
              Path('server/mlb-unified-elite-shadow-v1.ts').read_text().lower(),
              Path('server/mlb-unified-elite-lower-tier-live-provider.ts').read_text().lower(),
              Path('server/mlb-unified-elite-shared-live-provider-bundle.ts').read_text().lower(),
          ])
          forbidden=['theoddsapi','hard rock','stakeamount','bet_elite','placebet','settlementworker']
          found=[x for x in forbidden if x in text]
          assert not found, found
          print('MLB_UNIFIED_ELITE_VISIBLE_LOWER_TIERS_HAVE_NO_PRICE_OR_WAGER_SURFACE')
          PY
