name: WNBA R2A2 2020 Probability Freeze

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R2A2_2020_MODEL_PROBABILITY_FREEZE_CONTRACT.json'
      - 'scripts/wnba-r2a2-2020-model-replay.mjs'
      - '.github/workflows/wnba-r2a2-2020-probability-freeze.yml'
      - 'research/wnba/WNBA_R2A2_EXECUTION_MARKER.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probability-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install prefix dependency
        run: python -m pip install --quiet pyarrow
      - name: Reproduce corrected R2A1 candidate exactly
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/wnba-r2a-2020-seed-candidate.py
          test "$(sha256sum wnba-r2a-2020-seed-candidate-rowset.jsonl | cut -d' ' -f1)" = "8e037e9a688e62952f5c323ac6d48dbe3f437c8c28d6658f8c5147e4572da863"
      - name: Verify frozen production import graph custody
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object frontend/client/src/lib/wnba-model.ts)" = "095527160535655d28e989c0cfe9638fc6681b4c"
          test "$(git hash-object frontend/client/src/lib/wnba-shadow-emission.ts)" = "7dde8303ac0bac50ea0ed60cd5d7f78b091a5131"
          test "$(git hash-object frontend/client/src/lib/queryClient.ts)" = "3f4176d17e660103db9784885400eadc54dd549c"
          test "$(git hash-object frontend/package-lock.json)" = "f104d741b427df2a7cd73ccc3bbe66207b8cbb15"
      - name: Install lockfile-frozen frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts
      - name: Compile frozen WNBA model source
        run: |
          frontend/node_modules/.bin/esbuild frontend/client/src/lib/wnba-model.ts \
            --bundle --platform=node --format=esm --target=node22 \
            --outfile=/tmp/wnba-r2a2-model.mjs \
            '--define:import.meta.env.VITE_API_BASE_URL=""' \
            --define:import.meta.env.DEV=false
      - name: Freeze 2020 outcome-blind probabilities
        env:
          WNBA_MODEL_MODULE: /tmp/wnba-r2a2-model.mjs
        run: node scripts/wnba-r2a2-2020-model-replay.mjs
      - name: Assert chronology and probability custody
        run: |
          set -euo pipefail
          jq -e '.decision == "R2A2_2020_PROBABILITY_ROWSET_FROZEN_LABEL_OPENING_MAY_PROCEED"' wnba-r2a2-2020-model-replay-evidence.json >/dev/null
          jq -e '.probabilityRowset.rows == 126' wnba-r2a2-2020-model-replay-evidence.json >/dev/null
          jq -e '.gates.targetOutcomeAttachedRows == 0 and .gates.marketAttachedRows == 0 and .gates.duplicateGameIds == 0' wnba-r2a2-2020-model-replay-evidence.json >/dev/null
          jq -e '.chronology.labelsOpenedBeforeThisFreeze == false and .chronology.calibrationFitPerformed == false and .chronology.thresholdTuningPerformed == false' wnba-r2a2-2020-model-replay-evidence.json >/dev/null
      - name: Upload frozen 2020 probability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r2a2-2020-probability-freeze-${{ github.run_id }}
          path: |
            wnba-r2a2-2020-model-replay-evidence.json
            wnba-r2a2-2020-probability-rowset.jsonl
            wnba-r2a-2020-seed-candidate-evidence.json
          if-no-files-found: warn
          retention-days: 90
