name: Smoke deployed MLB injury C1 ledger audit

on:
  push:
    branches:
      - test/smoke-mlb-injury-c1-deploy-2026-07-28
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed commit and immutable ledger compatibility
        shell: bash
        env:
          BACKEND_URL: https://web-p0-integration.up.railway.app
          EXPECTED_COMMIT: 5d82a14906fa931327ad378d8c0f37f19c685350
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/before.json
          echo 'LEDGER BEFORE'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/before.json

          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json; then
              served=$(jq -r '.commit // ""' /tmp/health.json)
              echo "Attempt $attempt: served commit $served"
              if [ "$served" = "$EXPECTED_COMMIT" ]; then break; fi
            else
              echo "Attempt $attempt: Railway temporarily unavailable"
            fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/predictions?limit=1" > /tmp/latest.json
          echo 'LATEST EXISTING RECORD'
          jq '.data[0] | {
            predictionId:.prediction.id,
            modelVersion:.prediction.model.version,
            settledResult:.settlement.result,
            hasInjuryAudit:(.prediction.payload.analysis.injuryAudit != null)
          }' /tmp/latest.json
          jq -e '
            .success == true
            and (.data | length) == 1
            and .data[0].settlement.result == "LOSS"
            and (.data[0].prediction.payload.analysis.injuryAudit == null)
          ' /tmp/latest.json >/dev/null

          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" > /tmp/after.json
          echo 'LEDGER AFTER'
          jq '.data | {predictions,settlementEvents,immutable,journalMode}' /tmp/after.json
          jq -e --slurpfile before /tmp/before.json '
            .success == true
            and .data.immutable == true
            and .data.predictions == $before[0].data.predictions
            and .data.settlementEvents == $before[0].data.settlementEvents
          ' /tmp/after.json >/dev/null
