name: Validate P0 MLB Market Model Adapters

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-mlb-market-model-adapters.yml'
      - 'server/mlb-market-model-adapters.ts'
      - 'server/mlb-market-model-adapters.test.ts'
      - 'server/mlb-market-edge.ts'
      - 'server/mlb-market-edge-integrity.test.ts'
      - 'server/mlb-market-contract.ts'
      - 'frontend/client/src/lib/mlb-model.ts'
      - 'frontend/client/src/pages/mlb-predictor.tsx'

permissions:
  contents: read

jobs:
  validate-market-model-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Falsify Step 10 adapter boundaries
        run: |
          npx tsx --test server/mlb-market-model-adapters.test.ts
          npx tsx --test server/mlb-market-edge.test.ts
          npx tsx --test server/mlb-market-edge-integrity.test.ts

      - name: Preserve modular backend
        run: |
          npm run test:s3-modularization
          npm run build:backend

      - name: Freeze no-circular-probability and fail-closed boundaries
        shell: bash
        run: |
          set -euo pipefail
          adapter='server/mlb-market-model-adapters.ts'
          tests='server/mlb-market-model-adapters.test.ts'
          edge='server/mlb-market-edge.ts'
          current_model='frontend/client/src/lib/mlb-model.ts'
          predictor='frontend/client/src/pages/mlb-predictor.tsx'

          ! grep -nE '\bfetch\s*\(|ODDS_API_KEY|api\.the-odds-api\.com|x-requests-|setInterval|setTimeout|app\.get|app\.post|router\.get|router\.post|process\.env' "$adapter"
          ! grep -F 'Math.round(value * 1e12) / 1e12' "$adapter"
          ! grep -F 'const EPS' "$adapter"
          ! grep -F 'PROBABILITY_PARITY_TOLERANCE' "$adapter"
          ! grep -F 'exactCanonicalEvidence' "$adapter"
          ! grep -F '.map(exactCanonicalEvidence)' "$adapter"

          grep -F 'courtedge-p0-mlb-market-model-adapters.v1' "$adapter"
          grep -F 'MLB_CURRENT_PREDICTOR_MODEL_VERSION = "predictor-full-snapshot-v2"' "$adapter"
          grep -F 'MLB_CURRENT_TOTAL_MODEL_SIGMA_RUNS = 3.5' "$adapter"
          grep -F 'currentReadyMarkets: ["TOTAL", "F5_TOTAL"]' "$adapter"
          grep -F 'legacyMarketRegressedProbabilityAccepted: false' "$adapter"
          grep -F 'integerLinePushMayBeInvented: false' "$adapter"
          grep -F 'evidenceDigestRecomputedBeforeReady: true' "$adapter"
          grep -F 'evidenceDigestUsesLosslessNumericSerialization: true' "$adapter"
          grep -F 'evidenceDigestRecursiveTraversalAllowed: false' "$adapter"
          grep -F 'exactEnvelopeFieldSetRequired: true' "$adapter"
          grep -F 'envelopeFieldsSnapshottedExactlyOnce: true' "$adapter"
          grep -F 'rawEnvelopeNotReadAfterSnapshot: true' "$adapter"
          grep -F 'exactCurrentPredictorProvenanceRequired: true' "$adapter"
          grep -F 'exactHalfRunIdentityRequired: true' "$adapter"
          grep -F 'positiveTotalLineRequired: true' "$adapter"
          grep -F 'priceDependenceFlagMustBeBoolean: true' "$adapter"
          grep -F 'malformedEnvelopeCanThrow: false' "$adapter"
          grep -F 'processingFailuresFailClosed: true' "$adapter"
          grep -F 'unsupportedMarketCanProduceAssessment: false' "$adapter"
          grep -F 'totalProbabilityRecomputedFromProjection: true' "$adapter"
          grep -F 'sourceReportedProbabilityMustMatchRecomputation: true' "$adapter"
          grep -F 'sourceReportedProbabilityMustMatchBitExactly: true' "$adapter"
          grep -F 'a3aExperimentalShadowCanBecomeReady: false' "$adapter"
          grep -F 'unsupportedChallengersCanBePromoted: false' "$adapter"

          grep -F 'const EVIDENCE_DIGEST_FIELDS = [' "$adapter"
          grep -F 'const EVIDENCE_ENVELOPE_FIELDS = [...EVIDENCE_DIGEST_FIELDS, "sourceEvidenceDigest"] as const;' "$adapter"
          grep -F 'function hasExactEvidenceEnvelopeFields' "$adapter"
          grep -F 'function snapshotEvidenceEnvelope' "$adapter"
          grep -F 'for (const key of EVIDENCE_ENVELOPE_FIELDS) snapshot[key] = value[key];' "$adapter"
          grep -F 'return Object.freeze(snapshot);' "$adapter"
          grep -F 'const snapshot = snapshotEvidenceEnvelope(raw);' "$adapter"
          grep -F 'if (!isSupportedMarket(snapshot.marketType))' "$adapter"
          grep -F 'gamePk: snapshot.gamePk as number' "$adapter"
          grep -F 'generatedAt: snapshot.generatedAt as string' "$adapter"
          grep -F 'if (!hasExactEvidenceEnvelopeFields(raw)) return safeInvalidResult("MODEL_EVIDENCE_FIELDS_INVALID")' "$adapter"
          grep -F 'EVIDENCE_DIGEST_FIELDS' "$adapter"
          grep -F 'exactScalarEvidence(value[key])' "$adapter"
          grep -F 'MODEL_EVIDENCE_FIELDS_INVALID' "$adapter"
          grep -F 'MODEL_EVIDENCE_PROCESSING_FAILED' "$adapter"
          grep -F 'MODEL_EVIDENCE_PROBABILITY_FIELD_INVALID' "$adapter"
          grep -F 'MODEL_EVIDENCE_PROJECTED_RUNS_FIELD_INVALID' "$adapter"
          grep -F 'MODEL_EVIDENCE_TOTAL_LINE_INVALID' "$adapter"
          grep -F 'function totalLineIsPositive' "$adapter"
          grep -F 'if (!totalLineIsPositive(snapshot.marketType, snapshot.line as number | null))' "$adapter"
          grep -F 'if (!Number.isFinite(projectedRuns) || projectedRuns < 0 || !Number.isFinite(line) || line <= 0) return null;' "$adapter"
          grep -F 'return safeInvalidResult("MODEL_EVIDENCE_PROCESSING_FAILED")' "$adapter"

          grep -F 'MODEL_EVIDENCE_ENVELOPE_INVALID' "$adapter"
          grep -F 'MODEL_EVIDENCE_MARKET_UNSUPPORTED' "$adapter"
          grep -F 'MODEL_EVIDENCE_METRIC_UNSUPPORTED' "$adapter"
          grep -F 'MODEL_EVIDENCE_NOT_CURRENT_PREDICTOR' "$adapter"
          grep -F 'if (evidence.modelVersion !== MLB_CURRENT_PREDICTOR_MODEL_VERSION)' "$adapter"
          grep -F 'number:${value.toString()};' "$adapter"
          grep -F 'return Number.isInteger(line);' "$adapter"
          grep -F 'return Number.isSafeInteger(line * 2) && !Number.isInteger(line);' "$adapter"
          grep -F 'assessment: null' "$adapter"
          grep -F 'CURRENT_ML_PROBABILITY_MARKET_REGRESSED_AND_PUSH_VECTOR_UNAVAILABLE' "$adapter"
          grep -F 'CURRENT_F5_ML_PROBABILITY_MARKET_REGRESSED_AND_PUSH_VECTOR_UNAVAILABLE' "$adapter"
          grep -F 'CURRENT_RUN_LINE_PROBABILITY_DERIVED_FROM_MARKET_REGRESSED_ML' "$adapter"
          grep -F 'MARKET_REGRESSED_PROBABILITY_REJECTED' "$adapter"
          grep -F 'INTEGER_LINE_REQUIRES_DISCRETE_PUSH_MODEL' "$adapter"
          grep -F 'NON_HALF_RUN_LINE_REQUIRES_EXPLICIT_SETTLEMENT_MODEL' "$adapter"
          grep -F 'MODEL_EVIDENCE_PRICE_DEPENDENCE_FLAG_INVALID' "$adapter"
          grep -F 'MODEL_EVIDENCE_DIGEST_MISMATCH' "$adapter"
          grep -F 'PURE_MODEL_SELECTED_SIDE_MISMATCH' "$adapter"
          grep -F 'PURE_MODEL_PROBABILITY_PARITY_MISMATCH' "$adapter"
          grep -F 'if (reproduced.probability !== evidence.probability)' "$adapter"
          grep -F 'buildMlbCurrentPredictorProbabilityEvidenceDigest(digestInput)' "$adapter"
          grep -F 'reproduceMlbCurrentPredictorTotalModelHitProbability(evidence.projectedRuns, line)' "$adapter"
          grep -F 'probabilitySemantics: "UNCONDITIONAL_SETTLEMENT"' "$adapter"
          grep -F 'buildMlbMarketProbabilityAssessmentDigest(input)' "$adapter"
          grep -F 'marketRankingProduced: false' "$adapter"
          grep -F 'operatingEnvelopeApplied: false' "$adapter"
          grep -F 'eliteLabelProduced: false' "$adapter"
          grep -F 'recommendsBet: false' "$adapter"
          grep -F 'stakeCalculated: false' "$adapter"
          grep -F 'callsTheOddsApi: false' "$adapter"
          grep -F 'theOddsApiCreditsConsumed: 0' "$adapter"
          grep -F 'automaticBetPlacement: false' "$adapter"
          grep -F 'realFinancialExposure: 0' "$adapter"

          # Freeze Step 9 predecessor integrity required by Step 10 output.
          grep -F 'losslessAssessmentIdentityKeyRequired: true' "$edge"
          grep -F 'losslessModelAssessmentDigestRequired: true' "$edge"
          grep -F 'MODEL_EXECUTION_LINE_IDENTITY_MISMATCH' "$edge"
          grep -F 'buildMlbMarketProbabilityAssessmentIdentityKey' "$edge"
          grep -F 'exactCanonicalAssessment(input)' "$edge"

          # Freeze parity with the current pure (pre-market) total probability formula.
          grep -F 'const modelOverProb = 1 - mlbNormCdf(line, estimated, 3.5);' "$current_model"
          grep -F 'const modelHitProb = side === "OVER" ? modelOverProb : (1 - modelOverProb);' "$current_model"
          # Freeze the producer/version identity that Step 10 is explicitly authorized to adapt.
          grep -F 'version: "predictor-full-snapshot-v2"' "$predictor"

          grep -F 'evidence digest is lossless for tiny numeric mutations below the old 12-decimal rounding boundary' "$tests"
          grep -F 'only the recognized current predictor model version can produce READY evidence' "$tests"
          grep -F 'market-regressed total probability is rejected' "$tests"
          grep -F 'integer totals fail closed' "$tests"
          grep -F 'nonpositive total lines are invalid evidence and can never become READY' "$tests"
          grep -F 'only exact half-run identities are accepted; quarter, near-half and near-integer lines fail closed' "$tests"
          grep -F 'current F5 ML remains unavailable' "$tests"
          grep -F 'current Run Line remains unavailable' "$tests"
          grep -F 'source-reported total probability and selected side must match deterministic recomputation' "$tests"
          grep -F 'source probability parity is bit-exact even inside the former 1e-10 tolerance' "$tests"
          grep -F 'malformed envelope, unsupported market or unsupported metric returns INVALID_EVIDENCE without throwing' "$tests"
          grep -F 'deep, cyclic and hostile envelopes fail closed without recursive digest traversal' "$tests"
          grep -F 'accessor-backed evidence fields are snapshotted exactly once before validation' "$tests"
          grep -F 'price-dependence flag must be explicitly boolean false for a READY total' "$tests"

          # Persistent validator: syntax/whitespace safety only. PR-specific scope is reviewed outside this workflow.
          git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
