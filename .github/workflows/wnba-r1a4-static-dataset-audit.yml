name: WNBA R1A.4 Static Versioned Dataset Audit

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'research/wnba/WNBA_R1A4_STATIC_VERSIONED_DATASET_AUDIT.json'
      - 'scripts/wnba-r1a4-static-dataset-audit.py'
      - '.github/workflows/wnba-r1a4-static-dataset-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audit dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pyarrow>=17,<24'

      - name: Audit pinned static WNBA datasets outcome-blind
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/wnba-r1a4-static-dataset-audit.py

      - name: Upload R1A.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a4-static-dataset-audit-${{ github.run_id }}
          path: wnba-r1a4-static-dataset-audit-evidence.json
          if-no-files-found: error
          retention-days: 90
