name: WNBA R1A.2 Historical Stats Probe

on:
  push:
    branches:
      - research/wnba-r1-historical-foundation
    paths:
      - 'scripts/wnba-r1a2-stats-historical-probe.py'
      - '.github/workflows/wnba-r1a2-stats-historical-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe historical WNBA Stats as-of inputs
        run: python scripts/wnba-r1a2-stats-historical-probe.py
      - name: Upload source-probe evidence
        uses: actions/upload-artifact@v4
        with:
          name: wnba-r1a2-stats-historical-probe-${{ github.run_id }}
          path: wnba-r1a2-stats-historical-probe.json
          if-no-files-found: error
