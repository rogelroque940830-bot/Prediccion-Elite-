name: Validate P0 Step 12V59 Lineup Starter Interaction

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v59-lineup-starter-interaction-contract.json'
      - 'scripts/p0-step12v59-lineup-starter-interaction.py'
      - '.github/workflows/validate-p0-step12v59-lineup-starter-interaction.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.17.0'

      - name: Verify V59 contract is frozen before outcome comparison
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v59-lineup-starter-interaction-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v59-lineup-starter-interaction-contract.v1'
          assert c['parentEvidence']['mainBaseSha']=='60cc5e8087c8b7e28340fa4bff4c9fc3d8be29c5'
          assert c['parentEvidence']['winnerAnatomyWorkflowRunId']==31649438822
          assert c['parentEvidence']['step12v3WorkflowRunId']==31659518059
          assert c['parentEvidence']['v16WorkflowRunId']==31704085189
          assert c['parentEvidence']['v41WorkflowRunId']==31905076013
          assert c['parentEvidence']['v58WorkflowRunId']==31918463429
          assert c['parentEvidence']['v58ArtifactId']==9255620854
          assert c['sportingTarget']['primaryTarget']=='FULL_GAME_HOME_WIN'
          assert c['sportingTarget']['winnerProbabilityIsPrimaryProjectObjective'] is True
          assert c['sportingTarget']['propOrTeamTotalPromotionIsObjective'] is False
          assert c['dataBoundary']['expectedRowsBySeason']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert c['dataBoundary']['sameDateHistoryAllowed'] is False
          assert c['dataBoundary']['scoreWholeOfficialDateBeforeUpdatingAnySameDateState'] is True
          assert c['pregameIdentityBoundary']['exactNineBattersPerTeamRequired'] is True
          assert c['pregameIdentityBoundary']['finalBoxscoreLineupBackfillAllowed'] is False
          assert c['pregameIdentityBoundary']['projectedLineupFallbackAllowed'] is False
          assert c['control']['featureSetRequired']=='C4'
          assert c['control']['featuresExactly']==['lineup_exposure_rate_adv','starter_kbb_adv','combined_team_rs10','team_rd10_diff']
          assert c['control']['featureCount']==4
          assert c['playerPriorEngineering']['batterRateShrinkagePriorPlateAppearances']==100
          assert c['playerPriorEngineering']['lineupSlotWorkloadShrinkagePriorStarts']==20
          assert len(c['playerPriorEngineering']['gameLevelMainEffectsExactly'])==5
          assert c['opposingStarterProfile']['sideSpecificPregameMetricsExactly']==['starter_erbf','starter_hrbf','starter_kbb']
          assert len(c['interactionLayer']['featuresExactly'])==15
          assert c['interactionLayer']['allFiveV58LineupMainEffectsRetained'] is True
          assert c['interactionLayer']['postResultInteractionSelectionAllowed'] is False
          assert c['challenger']['featureCount']==24
          assert c['challenger']['l2Strength']==1.0
          assert c['pairedBootstrap']['unit']=='OFFICIAL_DATE_CLUSTER'
          assert c['pairedBootstrap']['resamples']==5000
          assert c['pairedBootstrap']['seed']==20260816
          for k in ['thresholdSearchAllowed','featureSearchAllowed','modelSearchAllowed','hyperparameterSearchAllowed','subsetMiningAllowed','homeAwaySubsetMiningAllowed','seasonExclusionAfterResultsAllowed','postResultRuleChangeAllowed','postResultFeatureAdditionAllowed','postResultFeatureRemovalAllowed']:
              assert c['statistics'][k] is False,k
          for k in ['productionMarketRegistryChangeAllowed','liveLookupAuthorizationChangeAllowed','liveMarketDiscoveryChangeAllowed','rankingChangeAllowed','stakeChangeAllowed','betEliteAllowed','finalRecommendationChangeAllowed','automaticBetPlacementAllowed','positiveEvClaimAllowed']:
              assert c['policy'][k] is False,k
          assert c['policy']['v16ProductionChanged'] is False
          assert c['policy']['realFinancialExposure']==0
          print('V59_CONTRACT_FROZEN')
          PY

      - name: Syntax check V59 scorer
        run: python -m py_compile scripts/p0-step12v59-lineup-starter-interaction.py

      - name: Download frozen winner-anatomy control source
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v-winner-anatomy-walkforward
          path: artifacts/p0-step12v-control
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31649438822

      - name: Download frozen T-minus-5 lineup lineage
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download certified batter outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v41-batter-historical-custody
          path: artifacts/p0-step12v41
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31905076013

      - name: Download certified V16 pure winner model
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: artifacts/p0-step12v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Download frozen V58 additive-lineup benchmark evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v58-lineup-winner-incremental-value
          path: artifacts/p0-step12v58
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31918463429

      - name: Verify immutable parent custody before scoring
        run: |
          python - <<'PY'
          import hashlib,json
          c=json.load(open('research/p0-step12v59-lineup-starter-interaction-contract.json'))
          v16=json.load(open('artifacts/p0-step12v16/pure-settlement-probability-report.json'))
          m=json.load(open('artifacts/p0-step12v16/pure-settlement-model-manifest.json'))
          v41=json.load(open('artifacts/p0-step12v41/batter-historical-custody-certification.json'))
          v58=json.load(open('artifacts/p0-step12v58/lineup-winner-incremental-value-report.json'))
          assert v16['classification']==c['parentEvidence']['v16RequiredClassification']
          assert v16['sourceRows']==c['dataBoundary']['expectedRowsBySeason']
          raw=json.dumps(m,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          assert hashlib.sha256(raw).hexdigest()==c['parentEvidence']['v16ManifestSha256']
          assert m['modelVersion']=='rogel-pure-settlement-ml-f5-v1'
          assert m['fullGame']['featureSet']=='C4'
          assert m['fullGame']['preprocessor']['features']==c['control']['featuresExactly']
          assert v41['classification']=='BATTER_HISTORICAL_CUSTODY_CERTIFIED_FOR_FUTURE_RESEARCH_TARGETS_ONLY'
          assert v41['fiveSeasonCustodyDigest']==c['parentEvidence']['v41FiveSeasonCustodyDigest']
          assert v58['classification']==c['parentEvidence']['v58FrozenClassification']
          assert v58['candidateRubricPassed'] is False
          for s,n in c['dataBoundary']['expectedRowsBySeason'].items():
              t=json.load(open(f'artifacts/p0-step12v-control/{s}/game-anatomy-feature-table.json'))
              l=json.load(open(f'artifacts/p0-step12v3/{s}/game-anatomy-feature-table.json'))
              assert sum(r.get('t5PregameValid') is True for r in t['rows'])==n
              assert sum(r.get('t5PregameValid') is True for r in l['rows'])==n
          print('V59_PARENT_CUSTODY_VERIFIED')
          PY

      - name: Run frozen V59 winner matchup-interaction experiment
        run: |
          mkdir -p artifacts/p0-step12v59
          python scripts/p0-step12v59-lineup-starter-interaction.py \
            --control-root artifacts/p0-step12v-control \
            --lineup-root artifacts/p0-step12v3 \
            --batter-root artifacts/p0-step12v41 \
            --v16-report artifacts/p0-step12v16/pure-settlement-probability-report.json \
            --v16-manifest artifacts/p0-step12v16/pure-settlement-model-manifest.json \
            --contract research/p0-step12v59-lineup-starter-interaction-contract.json \
            --out artifacts/p0-step12v59/lineup-starter-interaction-report.json

      - name: Validate V59 evidence without requiring a favorable result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v59/lineup-starter-interaction-report.json'))
          v58=json.load(open('artifacts/p0-step12v58/lineup-winner-incremental-value-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v59-lineup-starter-interaction.v1'
          assert r['classification'] in {'LINEUP_STARTER_INTERACTION_CERTIFIED_FOR_NEXT_WINNER_MODEL_RESEARCH','LINEUP_STARTER_INTERACTION_NOT_ROBUST_ENOUGH_TO_ADVANCE'}
          assert isinstance(r['candidateRubricPassed'],bool)
          assert r['target']=='FULL_GAME_HOME_WIN'
          assert r['data']['seasonRows']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert r['controlParity']['combinedAndBySeasonMetricsReproduced'] is True
          assert r['controlParity']['manifestSha256']=='059f84a7bf644eece80b40f772d5a0c92a188849012eadf7bbf17f93532b8cbb'
          assert r['features']['controlCount']==4
          assert r['features']['lineupMainEffectCount']==5
          assert r['features']['interactionCount']==15
          assert r['features']['challengerCount']==24
          assert r['combinedEvaluation2024_2026Ytd']['rows']==6610
          # The reproduced additive benchmark must remain numerically equivalent to V58.
          a=r['combinedEvaluation2024_2026Ytd']['additiveBenchmark']
          b=v58['combinedEvaluation2024_2026Ytd']['challenger']
          assert abs(a['logLoss']-b['logLoss']) < 2e-8
          assert abs(a['brier']-b['brier']) < 2e-8
          boot=r['pairedDateBootstrap2024_2026Ytd']
          assert boot['unit']=='OFFICIAL_DATE_CLUSTER' and boot['resamples']==5000 and boot['distinctDates']>400
          p=r['policy']
          for k in ['sameDateOutcomeLeakageAllowed','futureGameDataAllowed','historicalPricesUsed','marketOddsUsedAsFeatures','featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','subsetMiningUsed','homeAwaySubsetMiningUsed','postResultRuleChangeAllowed','v16ProductionChanged','productionMarketRegistryChanged','rankingChanged','stakeChanged','betEliteAllowed','finalRecommendationChanged','automaticBetPlacementAllowed','positiveEvEstablished']:
              assert p[k] is False,k
          assert p['realFinancialExposure']==0
          print(json.dumps({'classification':r['classification'],'candidateRubricPassed':r['candidateRubricPassed'],'combinedVsControl':r['combinedEvaluation2024_2026Ytd']['improvementVsControl'],'combinedVsV58Additive':r['combinedEvaluation2024_2026Ytd']['improvementVsAdditiveBenchmark'],'bootstrap':r['pairedDateBootstrap2024_2026Ytd'],'bySeason':{s:v['improvementVsControl'] for s,v in r['evaluationBySeason'].items()},'checks':r['candidateRubricChecks']},indent=2))
          PY

      - name: Verify exact research-only scope
        shell: bash
        run: |
          set -euo pipefail
          grep -F "historicalPricesUsed':False" scripts/p0-step12v59-lineup-starter-interaction.py
          grep -F "betEliteAllowed':False" scripts/p0-step12v59-lineup-starter-interaction.py
          grep -F "realFinancialExposure':0" scripts/p0-step12v59-lineup-starter-interaction.py
          ! grep -E 'apiKey|automaticBetPlacementAllowed[^\n]*True|betEliteAllowed[^\n]*True|realFinancialExposure[^\n]*[1-9]' scripts/p0-step12v59-lineup-starter-interaction.py
          git diff --check

      - name: Upload V59 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v59-lineup-starter-interaction
          path: artifacts/p0-step12v59/
          if-no-files-found: error
          retention-days: 30
