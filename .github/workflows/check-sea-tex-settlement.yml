name: Check SEA-TEX settlement

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read ledger settlement state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-p0-integration.up.railway.app'
          curl --fail --silent --show-error "$BASE/api/mlb/ledger/v1/predictions?from=2026-07-27&to=2026-07-27&limit=20" > /tmp/predictions.json
          jq -e '.success == true' /tmp/predictions.json >/dev/null
          echo 'ALL RECORDS'
          jq '.data | map({game:.prediction.game, market:.prediction.market, settlement:.settlement})' /tmp/predictions.json
