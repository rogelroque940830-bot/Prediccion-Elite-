name: Validate P1-M3D-B Interactive Economic Review UI

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/validate-p1-m3d-b-interactive-economic-review-ui.yml'

permissions:
  contents: write

jobs:
  apply-p1-m5a-ui-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic activation UI integration once
        shell: bash
        run: |
          set -euo pipefail
          helper='frontend/client/src/lib/mlb-interactive-economic-review.ts'
          testfile='frontend/client/src/lib/mlb-interactive-economic-review.test.ts'
          page='frontend/client/src/pages/mlb-economic-review.tsx'
          app='frontend/client/src/App.tsx'

          if grep -Fq 'activation: MlbP1M5aActivation' "$helper"; then
            echo 'P1-M5A UI integration already applied.'
            exit 0
          fi

          python <<'PY'
          from pathlib import Path

          helper = Path('frontend/client/src/lib/mlb-interactive-economic-review.ts')
          test = Path('frontend/client/src/lib/mlb-interactive-economic-review.test.ts')
          page = Path('frontend/client/src/pages/mlb-economic-review.tsx')
          app = Path('frontend/client/src/App.tsx')

          def once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          source = helper.read_text()
          source = once(source,
              'export const MLB_P1_M3D_SCHEMA = "courtedge-p1-m3d-interactive-economic-review.v1" as const;\n',
              'import {\n  parseMlbP1M5aActivation,\n  type MlbP1M5aActivation,\n} from "./mlb-real-cohort-activation";\n\nexport const MLB_P1_M3D_SCHEMA = "courtedge-p1-m3d-interactive-economic-review.v1" as const;\n',
              'helper activation import')
          source = once(source,
              '  lifecycle: {\n    provisionalToFinalChains: number;\n    finalOnlyChains: number;\n    provisionalOnlyChains: number;\n  };\n  readiness: {\n',
              '  lifecycle: {\n    provisionalToFinalChains: number;\n    finalOnlyChains: number;\n    provisionalOnlyChains: number;\n  };\n  activation: MlbP1M5aActivation;\n  readiness: {\n',
              'helper activation field')
          source = once(source,
              '  if (!Array.isArray(data?.issues) || !Array.isArray(data?.rows)) fail("collections");\n  if (readiness?.conclusionsAllowed !== false) fail("conclusions_allowed");\n',
              '  if (!Array.isArray(data?.issues) || !Array.isArray(data?.rows)) fail("collections");\n\n  const activation = parseMlbP1M5aActivation(data?.activation);\n  if (activation.counts.terminalInteractiveDecisions !== sample?.uniqueAnalyticalDecisions) fail("activation_terminal_count");\n  if (activation.counts.validEconomicDecisions !== sample?.economicLayersValid) fail("activation_economic_count");\n  if (activation.counts.officiallySettledDecisions !== sample?.settledDecisions) fail("activation_settled_count");\n  if (activation.counts.clvCoveredDecisions !== sample?.clvCoveredDecisions) fail("activation_clv_count");\n\n  if (readiness?.conclusionsAllowed !== false) fail("conclusions_allowed");\n',
              'helper activation validation')
          helper.write_text(source)

          source = test.read_text()
          source = once(source,
              '} from "./mlb-interactive-economic-review";\n',
              '} from "./mlb-interactive-economic-review";\nimport { MLB_P1_M5A_RELEASE, MLB_P1_M5A_SCHEMA } from "./mlb-real-cohort-activation";\n',
              'test activation import')
          activation_fixture = '''      activation: {
        schemaVersion: MLB_P1_M5A_SCHEMA,
        release: MLB_P1_M5A_RELEASE,
        generatedAt: "2026-08-06T12:00:00.000Z",
        state: "END_TO_END_CERTIFIED",
        certified: true,
        checklist: {
          authenticatedOwnerScope: true,
          interactiveCaptureObserved: true,
          terminalDecisionObserved: true,
          validEconomicLayerObserved: true,
          officialSettlementObserved: true,
          sameDecisionEndToEndObserved: true,
          lifecycleIntegrityHealthy: true,
          analyticalIdentityProtected: true,
          finalCaptureObserved: true,
          clvEvidenceObserved: true,
        },
        counts: {
          terminalInteractiveDecisions: 2,
          validEconomicDecisions: 2,
          officiallySettledDecisions: 1,
          endToEndEligibleDecisions: 1,
          finalInteractiveDecisions: 1,
          clvCoveredDecisions: 1,
        },
        certificate: {
          predictionId: "mlb-pred-real-1",
          lifecycleKey: "824806:ML:HOME",
          recordedAt: "2026-08-05T20:30:00.000Z",
          settledAt: "2026-08-06T03:10:00.000Z",
          gameDate: "2026-08-05",
          gamePk: 824806,
          matchup: "Los Angeles Angels vs Baltimore Orioles",
          market: "ML",
          selection: "Baltimore Orioles ML",
          stage: "FINAL",
          effectiveDecision: "BET",
          actionability: "ACTIONABLE_FINAL",
          result: "WIN",
          clvObserved: true,
        },
        blockingReasons: [],
        nextAction: "REVIEW_CERTIFIED_COHORT",
        interpretation: {
          activationOnly: true,
          profitabilityConclusionAllowed: false,
          modelChangeAllowed: false,
          automaticPromotionAllowed: false,
          clvRequiredForActivation: false,
        },
        safety: {
          mode: "SHADOW_REAL_COHORT_ACTIVATION",
          realFinancialExposure: 0,
          sportsbookIntegration: false,
          automaticBetPlacement: false,
          productionWrites: false,
          settlementWrites: false,
          historicalLedgerMutation: false,
          syntheticCaptureCreation: false,
          automaticModelChangesAllowed: false,
          automaticPromotionAllowed: false,
        },
      },
'''
          source = once(source,
              '      readiness: {\n',
              activation_fixture + '      readiness: {\n',
              'test activation fixture')
          source = once(source,
              '  assert.equal(parsed.data.safety.realFinancialExposure, 0);\n});\n',
              '  assert.equal(parsed.data.safety.realFinancialExposure, 0);\n  assert.equal(parsed.data.activation.certified, true);\n  assert.equal(parsed.data.activation.certificate?.predictionId, "mlb-pred-real-1");\n});\n',
              'test activation assertions')
          source += '''\n\ntest("P1-M3D-B rejects an invalid P1-M5A activation certificate", () => {\n  const value = envelope();\n  value.data.activation.safety.syntheticCaptureCreation = true;\n  assert.throws(() => parseMlbP1M3dEconomicReviewEnvelope(value), /synthetic_capture/);\n});\n\ntest("P1-M3D-B rejects activation counts that drift from the economic review", () => {\n  const value = envelope();\n  value.data.activation.counts.officiallySettledDecisions = 2;\n  assert.throws(() => parseMlbP1M3dEconomicReviewEnvelope(value), /activation_settled_count/);\n});\n'''
          test.write_text(source)

          source = page.read_text()
          source = once(source,
              'import { Card, CardContent, CardHeader, CardTitle } from "@/components/ui/card";\n',
              'import { Card, CardContent, CardHeader, CardTitle } from "@/components/ui/card";\nimport { MlbRealCohortActivationCard } from "@/components/mlb-real-cohort-activation-card";\n',
              'page activation import')
          source = once(source,
              '      <Card className={stateMeta.className}>\n',
              '      <MlbRealCohortActivationCard activation={report.activation} />\n\n      <Card className={stateMeta.className}>\n',
              'page activation card')
          page.write_text(source)

          source = app.read_text()
          source = once(source,
              'import { MLB_P1_M3D_B_FRONTEND_RELEASE } from "@/lib/mlb-interactive-economic-review";\n',
              'import { MLB_P1_M5A_FRONTEND_RELEASE } from "@/lib/mlb-real-cohort-activation";\n',
              'app release import')
          source = once(source,
              'const FRONTEND_RELEASE = MLB_P1_M3D_B_FRONTEND_RELEASE;\n',
              'const FRONTEND_RELEASE = MLB_P1_M5A_FRONTEND_RELEASE;\n',
              'app release selection')
          source = once(source,
              'const PREVIOUS_OPERATIONAL_RELEASES = "p1-m4c-mlb-economic-decision-card-2026-08-06 ',
              'const PREVIOUS_OPERATIONAL_RELEASES = "p1-m3d-b-interactive-economic-review-ui-2026-08-06 p1-m4c-mlb-economic-decision-card-2026-08-06 ',
              'app release lineage')
          app.write_text(source)
          PY

          git diff --check
          changed=$(git diff --name-only | sort)
          expected=$(printf '%s\n' "$app" "$helper" "$testfile" "$page" | sort)
          [[ "$changed" == "$expected" ]]
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$app" "$helper" "$testfile" "$page"
          git commit -m 'P1-M5A: render real cohort activation certificate'
          git push origin HEAD:${GITHUB_HEAD_REF}
