name: MLB Phase 1 Ledger

on:
  push:
    branches:
      - integration/mlb-phase1-ledger
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-ledger.ts'
      - 'server/mlb-ledger-store.ts'
      - 'server/mlb-ledger.test.ts'
      - 'server/mlb-settlement-worker.ts'
      - 'server/mlb-settlement-worker.test.ts'
      - 'server/better-sqlite3.d.ts'
      - 'server/picks-v2.ts'
      - 'server/index.ts'
      - 'server/security.ts'
      - 'scripts/mlb-ledger-phase1-e2e-v2.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.mlb-ledger.json'
      - '.github/workflows/mlb-phase1-ledger.yml'
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-ledger.ts'
      - 'server/mlb-ledger-store.ts'
      - 'server/mlb-ledger.test.ts'
      - 'server/mlb-settlement-worker.ts'
      - 'server/mlb-settlement-worker.test.ts'
      - 'server/better-sqlite3.d.ts'
      - 'server/picks-v2.ts'
      - 'server/index.ts'
      - 'server/security.ts'
      - 'scripts/mlb-ledger-phase1-e2e-v2.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.mlb-ledger.json'
      - '.github/workflows/mlb-phase1-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Type-check MLB ledger
        id: ledger_typecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:mlb-ledger 2>&1 | tee mlb-ledger-typecheck.txt

      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-ledger-typecheck
          path: mlb-ledger-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce ledger typecheck
        if: ${{ steps.ledger_typecheck.outcome == 'failure' }}
        run: exit 1

      - name: Test immutable MLB ledger
        id: ledger_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:mlb-ledger 2>&1 | tee mlb-ledger-tests.txt

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-ledger-tests
          path: mlb-ledger-tests.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce ledger tests
        if: ${{ steps.ledger_tests.outcome == 'failure' }}
        run: exit 1

      - name: Build backend
        run: npm run build:backend

      - name: Execute isolated real-MLB Phase 1 E2E
        id: phase1_e2e
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/mlb-ledger-phase1-e2e-v2.mjs 2>&1 | tee phase1-e2e-run.log

      - name: Upload isolated E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlb-phase1-isolated-e2e-evidence
          path: |
            artifacts/mlb-phase1-e2e/
            phase1-e2e-run.log
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce isolated E2E result
        if: ${{ steps.phase1_e2e.outcome == 'failure' }}
        run: exit 1
