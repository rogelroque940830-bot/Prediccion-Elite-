name: Verify S6K Phase 5B Live

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/verify-s6k-phase5b-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Railway S6K worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          endpoint='https://web-p0-integration.up.railway.app/health/s6k-first-ten-cycles'
          expected_commit='5dd27fc80b552a4ee556daffa04fb4b89259a993'
          for attempt in $(seq 1 70); do
            code=$(curl -sS -o artifacts/s6k-health.json -w '%{http_code}' --max-time 120 "$endpoint" || true)
            schema=$(node -e "try{const x=require('./artifacts/s6k-health.json');process.stdout.write(String(x.schemaVersion||''))}catch{}")
            commit=$(node -e "try{const x=require('./artifacts/s6k-health.json');process.stdout.write(String(x.commit||''))}catch{}")
            state=$(node -e "try{const x=require('./artifacts/s6k-health.json');process.stdout.write(String(x.latest?.state||''))}catch{}")
            echo "attempt=$attempt http=$code schema=$schema commit=$commit state=$state"
            if [ "$code" = '200' ] && [ "$schema" = 'mlb-s6k-first-ten-clean-cycles.v1' ] && [ "$commit" = "$expected_commit" ]; then
              exit 0
            fi
            sleep 15
          done
          echo 'S6K Phase 5B did not become ready within the verification window.' >&2
          cat artifacts/s6k-health.json || true
          exit 1
      - name: Validate live Phase 5B state and safety
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('artifacts/s6k-health.json', 'utf8'));
          if (x.status !== 'healthy') throw new Error(`Unexpected health ${x.status}`);
          if (x.schemaVersion !== 'mlb-s6k-first-ten-clean-cycles.v1') throw new Error('Unexpected schema');
          const state = x.latest?.state;
          if (!['COLLECTING', 'READY_FOR_ANALYSIS'].includes(state)) {
            throw new Error(`Unexpected or actionable state: ${state}`);
          }
          const summary = x.latest?.summary;
          if (!summary || summary.target !== 10) throw new Error('Target count is not 10');
          if (summary.reject !== 0) throw new Error(`Rejected cycles present: ${summary.reject}`);
          if (summary.selected < 1 || summary.selected > 10) throw new Error(`Unexpected selected count: ${summary.selected}`);
          if (x.safety?.mode !== 'SHADOW') throw new Error('Not in SHADOW mode');
          if (x.safety?.realFinancialExposure !== 0) throw new Error('Financial exposure is not zero');
          if (x.safety?.automaticBetPlacement !== false) throw new Error('Automatic betting enabled');
          if (x.safety?.historicalLedgerMutation !== false) throw new Error('Historical mutation enabled');
          if (x.safety?.automaticPromotion !== false) throw new Error('Automatic promotion enabled');
          console.log(JSON.stringify({ commit: x.commit, state, summary, persistence: x.latest.persistence, safety: x.safety }, null, 2));
          NODE
      - name: Verify backend session and frontend availability
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 60 'https://web-p0-integration.up.railway.app/api/auth/session' -o artifacts/session.json
          node - <<'NODE'
          const x = require('./artifacts/session.json');
          if (x.success !== true) throw new Error('Session endpoint failed');
          NODE
          curl -sS --fail --max-time 60 'https://prediccion-elite-p0-integration.up.railway.app/' -o artifacts/frontend.html
          grep -qi '<!doctype html' artifacts/frontend.html
      - uses: actions/upload-artifact@v4
        with:
          name: s6k-phase5b-live-verification
          path: artifacts/
          retention-days: 14
