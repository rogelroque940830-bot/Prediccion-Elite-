name: Smoke MLB injuries after hydration fix

on:
  push:
    branches:
      - test/smoke-mlb-injuries-after-fix-2026-07-27
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: 8354c906620c673ed2e4627cbc7819cb7cf873f0
    steps:
      - name: Verify deployed commit and compact injury evidence
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/all?date=2026-07-27" > /tmp/mlb.json
          jq -e '.success == true and any(.games[]; .gamePk == 822868)' /tmp/mlb.json >/dev/null

          jq -r '.games[] | select(.gamePk == 822868) |
            "DEPLOYED_COMMIT=" + $commit +
            "\nHOME=" + .homeTeam.name +
            " VERIFIED=" + ((.homeInjuryData.count // 0)|tostring) +
            " REJECTED=" + ((.homeInjuryData.rejectedCount // 0)|tostring) +
            " NAMES=" + ([.homeInjuries[].name] | join(" | ")) +
            "\nAWAY=" + .awayTeam.name +
            " VERIFIED=" + ((.awayInjuryData.count // 0)|tostring) +
            " REJECTED=" + ((.awayInjuryData.rejectedCount // 0)|tostring) +
            " NAMES=" + ([.awayInjuries[].name] | join(" | "))' \
            --arg commit "$EXPECTED_COMMIT" /tmp/mlb.json

          combined_verified=$(jq -r '[.games[] | select(.gamePk == 822868) | (.homeInjuryData.count // 0), (.awayInjuryData.count // 0)] | add' /tmp/mlb.json)
          combined_total=$(jq -r '[.games[] | select(.gamePk == 822868) | (.homeInjuryData.count // 0), (.awayInjuryData.count // 0), (.homeInjuryData.rejectedCount // 0), (.awayInjuryData.rejectedCount // 0)] | add' /tmp/mlb.json)
          test "$combined_total" -gt 0
          test "$combined_verified" -gt 0
          echo "COMBINED_VERIFIED=$combined_verified COMBINED_TOTAL=$combined_total"
