name: Research P1-M6A3B2B1 2025 Starting Pitcher History

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/research-p1-m6a3b2b1-2025-starting-pitcher-history.yml'

permissions:
  contents: read

jobs:
  research-2025-starting-pitcher-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Reproduce B1 cohort and acquire official 2025 starting-pitcher history
        run: |
          node --import tsx scripts/p1-m6a3b2b1-starting-pitcher-backfill.mjs \
            --start 2025-03-01 \
            --end 2025-10-01 \
            --concurrency 4 \
            --out artifacts/p1-m6a3b2b1-2025-starting-pitcher-history
      - name: Verify research run did not modify tracked source
        run: git diff --exit-code
      - name: Upload B2B1 official starter-history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m6a3b2b1-2025-starting-pitcher-history
          path: artifacts/p1-m6a3b2b1-2025-starting-pitcher-history/
          if-no-files-found: warn
          retention-days: 30
