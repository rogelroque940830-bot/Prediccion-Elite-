name: Validate P1-M3F3B5A Statcast Coverage Observability

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-statcast-matchup-coverage.ts'
      - 'server/mlb-statcast-matchup-coverage.test.ts'
      - 'docs/P1_M3F3B5A_STATCAST_COVERAGE_OBSERVABILITY.md'
      - '.github/workflows/validate-p1-m3f3b5a-statcast-coverage-observability.yml'

permissions:
  contents: read

jobs:
  validate-p1-m3f3b5a:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck coverage contract
        run: npx tsc --noEmit --target ES2020 --module CommonJS --moduleResolution Node --esModuleInterop --skipLibCheck server/mlb-statcast-matchup-coverage.ts server/mlb-statcast-matchup-coverage.test.ts
      - name: Run B5A falsification tests
        run: npx tsx --test server/mlb-statcast-matchup-coverage.test.ts
      - name: Preserve B5 identity and prior advanced-factor provenance contracts
        run: |
          npx tsx --test server/mlb-statcast-matchup-vsteam-identity.test.ts
          npx tsx --test server/mlb-statcast-matchup-identity-routes.test.ts
          npx tsx --test server/mlb-statcast-quality-provenance.test.ts
          npx tsx --test server/mlb-discipline-speed-provenance.test.ts
          npx tsx --test server/mlb-sos-provenance.test.ts
          npx tsx --test server/mlb-advanced-context-provenance.test.ts
          npx tsx --test server/mlb-p1-advanced-factor-provenance.test.ts
      - name: Preserve production and shadow contracts
        run: |
          npm run build:backend
          npm run test:s5a-e2e
          npm run test:s5b-shadow
      - name: Verify no certification or actionability claim
        shell: bash
        run: |
          set -euo pipefail
          source='server/mlb-statcast-matchup-coverage.ts'
          docs='docs/P1_M3F3B5A_STATCAST_COVERAGE_OBSERVABILITY.md'
          grep -F 'courtedge-mlb-statcast-matchup-coverage.v2' "$source"
          grep -F 'dataQuality' "$source"
          grep -F 'lineupSize' "$source"
          grep -F 'Array.isArray(input.matchup?.arsenal)' "$source"
          grep -F 'BLOCKED_UNOBSERVABLE_PROVENANCE' "$source"
          grep -F 'pitcherArsenalSourceObservable: false' "$source"
          grep -F 'bullpenRosterCoverageObservable: false' "$source"
          grep -F 'recentBatterStatsCoverageObservable: false' "$source"
          grep -F 'cacheObservationTimesObservable: false' "$source"
          grep -F 'There is intentionally **no `CERTIFIED` state in B5A**' "$docs"
          grep -F 'modelOutputChanged: false' "$source"
          grep -F 'probabilityChanged: false' "$source"
          grep -F 'actionabilityAllowed: false' "$source"
          grep -F 'automaticPromotionAllowed: false' "$source"
          ! grep -Ei 'placeBet|sportsbook.*write|appendPrediction|appendSettlement|automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]' "$source"
      - name: Verify exact B5A scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-m3f3b5a-statcast-coverage-observability.yml' \
            'docs/P1_M3F3B5A_STATCAST_COVERAGE_OBSERVABILITY.md' \
            'server/mlb-statcast-matchup-coverage.test.ts' \
            'server/mlb-statcast-matchup-coverage.ts' | sort)
          [[ "$changed" == "$expected" ]]
