name: Validate P0 Step 12V9 Rolling Platoon Performance

on:
  pull_request:
    branches:
      - research/p0-step12v8-a-handedness-platoon-anatomy
    paths:
      - 'research/p0-step12v9-rolling-platoon-contract.json'
      - 'scripts/p0-step12v9-acquire-hand-splits.py'
      - 'scripts/p0-step12v9-score-rolling-platoon.py'
      - '.github/workflows/validate-p0-step12v9-rolling-platoon.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate frozen V9 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v9-rolling-platoon-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v9-rolling-platoon-contract.v1'
          assert c['chronology']['sameDateOutcomeMayTrainSameDate'] is False
          assert c['chronology']['featuresComputedBeforeApplyingAnyGamesFromThatOfficialDate'] is True
          assert c['reliability']['minimumPriorPaPerRequiredHandPrimary']==50
          assert c['reliability']['highReliabilityPriorPaPerRequiredHand']==100
          assert len(c['inferentialFamily']['metrics'])==6
          assert c['inferentialFamily']['noOutcomeBasedThresholdSearch'] is True
          assert c['policy']['liveFilterChangeAllowed'] is False
          assert c['policy']['betEliteAllowed'] is False
          print('STEP12V9_CONTRACT_LOCKED')
          PY
      - name: Syntax check
        run: |
          python -m py_compile scripts/p0-step12v9-acquire-hand-splits.py
          python -m py_compile scripts/p0-step12v9-score-rolling-platoon.py

  acquire-hand-splits:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        season: ['2024','2025','2026_YTD']
    name: acquire-${{ matrix.season }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Acquire play-by-play hand aggregates
        run: |
          mkdir -p artifacts/p0-step12v9-${{ matrix.season }}
          python scripts/p0-step12v9-acquire-hand-splits.py \
            --season '${{ matrix.season }}' \
            --table 'artifacts/p0-step12v3/${{ matrix.season }}/game-anatomy-feature-table.json' \
            --out 'artifacts/p0-step12v9-${{ matrix.season }}/hand-splits-${{ matrix.season }}.json' \
            --workers 6
      - name: Validate acquisition quality
        run: |
          SEASON='${{ matrix.season }}' python - <<'PY'
          import json,os
          s=os.environ['SEASON']
          c=json.load(open('research/p0-step12v9-rolling-platoon-contract.json'))
          r=json.load(open(f'artifacts/p0-step12v9-{s}/hand-splits-{s}.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v9-game-team-hand-aggregates.v1'
          assert r['season']==s
          assert r['gamesExpected']==r['gamesFetched']
          assert not r['failures']
          denom=r['validPlateAppearances']+r['excludedPlateAppearances']
          share=(r['excludedPlateAppearances']/denom) if denom else 0.0
          assert share <= c['acquisition']['maximumExcludedPlateAppearanceShare'], (s,share,r['excludedReasons'])
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          print({'season':s,'games':r['gamesFetched'],'validPA':r['validPlateAppearances'],'excludedPA':r['excludedPlateAppearances'],'excludedShare':share})
          PY
      - name: Upload season hand-split pack
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v9-hand-splits-${{ matrix.season }}
          path: artifacts/p0-step12v9-${{ matrix.season }}/hand-splits-${{ matrix.season }}.json
          if-no-files-found: error
          retention-days: 30

  rolling-platoon-study:
    needs: acquire-hand-splits
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.18.0'
      - name: Download all season hand-split packs
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v9-hand-splits-*
          path: artifacts/p0-step12v9-splits
          merge-multiple: true
      - name: Download canonical V8 exact T-5 anatomy
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v8-handedness-platoon-anatomy
          path: artifacts/p0-step12v8
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31666193156
      - name: Validate inputs
        run: |
          for s in 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v9-splits/hand-splits-${s}.json"
          done
          test -s artifacts/p0-step12v8/handedness-platoon-report.json
      - name: Score prior-date rolling platoon family
        run: |
          mkdir -p artifacts/p0-step12v9
          python scripts/p0-step12v9-score-rolling-platoon.py \
            --split-dir artifacts/p0-step12v9-splits \
            --v8-report artifacts/p0-step12v8/handedness-platoon-report.json \
            --contract research/p0-step12v9-rolling-platoon-contract.json \
            --out artifacts/p0-step12v9/rolling-platoon-report.json
      - name: Validate chronology and evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v9/rolling-platoon-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v9-rolling-platoon-performance.v1'
          assert r['classification'] in ('ROLLING_PLATOON_DISCOVERY_NOT_CONFIRMATION','INSUFFICIENT_ROLLING_PLATOON_COVERAGE')
          assert len(r['features'])==268
          assert len(r['inferentialTests'])==12
          assert r['policy']['sameDateOutcomeLeakageAllowed'] is False
          assert r['policy']['futureSeasonStatsAllowed'] is False
          assert r['policy']['historicalPricesUsed'] is False
          assert r['policy']['liveFilterChangeAllowed'] is False
          assert r['policy']['betEliteAllowed'] is False
          for a in r['dailyChronologyAudit']:
            assert a['priorPaAfterDate'] >= a['priorPaBeforeDate']
          print(json.dumps({'classification':r['classification'],'coverage':r['coverage'],'eligibleBaselines':r['eligibleBaselines'],'highReliabilityBaselines':r['highReliabilityBaselines'],'ranking':r['ranking'],'signBins':r['signBins']},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload V9 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v9-rolling-platoon-performance
          path: artifacts/p0-step12v9/
          if-no-files-found: error
          retention-days: 30
