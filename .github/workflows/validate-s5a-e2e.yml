name: Validate S5A Real-Save E2E

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/s5a-mlb-real-save-e2e.mjs'
      - '.github/workflows/validate-s5a-e2e.yml'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: s5a-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-s5a:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout S5A branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm

      - name: Install dependencies reproducibly
        run: npm ci

      - name: Run existing regression gates
        run: |
          npm run typecheck:s1-auth
          npm run test:s1-auth
          npm run typecheck:s2-multiuser
          npm run test:s2-multiuser
          npm run typecheck:s3-modularization
          npm run test:s3-modularization
          npm run typecheck:s4-operations
          npm run test:s4-operations
          npm run typecheck:mlb-ledger
          npm run test:mlb-ledger

      - name: Build production backend bundle
        run: npm run build:backend

      - name: Execute isolated S5A real-save E2E
        shell: bash
        run: |
          set -o pipefail
          npm run test:s5a-e2e 2>&1 | tee s5a-e2e-run.log

      - name: TEMP wire verified official IL identity fallback on exact P1-M2B branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/p1-m2b-official-il-roster-identity-fallback-20260810'
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin integration/p0-staging-secure "$PR_HEAD"
          git switch -C "$PR_HEAD" "origin/$PR_HEAD"

          changed=$(git diff --name-only origin/integration/p0-staging-secure...HEAD | sort)
          two=$(printf '%s\n' \
            'server/mlb-injury-identity.test.ts' \
            'server/mlb-injury-identity.ts' | sort)
          three=$(printf '%s\n' \
            'server/mlb-core-routes.ts' \
            'server/mlb-injury-identity.test.ts' \
            'server/mlb-injury-identity.ts' | sort)
          if [[ "$changed" != "$two" && "$changed" != "$three" ]]; then
            echo 'Unexpected P1-M2B identity-fix scope; refusing write.' >&2
            printf 'Changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
          ! grep -Eq '^package(-lock)?\.json$|^\.github/workflows/' <<< "$changed"

          python <<'PY'
          from pathlib import Path

          p = Path('server/mlb-core-routes.ts')
          text = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          old_import = 'import { buildMlbPeopleSearchUrl } from "./mlb-injury-identity";\n'
          new_import = 'import { buildMlbPeopleSearchUrl, resolveMlbInjuryIdentity } from "./mlb-injury-identity";\n'
          if new_import not in text:
              replace_once(old_import, new_import, 'identity import')

          old_block = '''              const lookupUrl = buildMlbPeopleSearchUrl(MLB_BASE, name, MLB_SEASON_CURRENT);
              const lookupJson = await (await fetch(lookupUrl)).json();
              const people = lookupJson.people ?? [];
              // Verificación estricta: mismo nombre normalizado Y equipo MLB actual.
              // Nunca usar el primer resultado como fallback: eso mezclaba jugadores de otros clubes.
              const normalizePersonName = (value: string) => String(value || "")
                .normalize("NFD")
                .replace(/[\\u0300-\\u036f]/g, "")
                .replace(/[^a-z0-9]/gi, "")
                .toLowerCase();
              const targetName = normalizePersonName(name);
              const match = people.find((p: any) =>
                p.currentTeam?.id === tid && normalizePersonName(p.fullName) === targetName
              );
              const pid = match?.id;
              const positionAbbr = match?.primaryPosition?.abbreviation || (isPitcher ? "P" : pos.split(" ").map((w: string) => w[0]).join("").toUpperCase());
              if (!pid) return null;
'''
          new_block = '''              const lookupUrl = buildMlbPeopleSearchUrl(MLB_BASE, name, MLB_SEASON_CURRENT);
              const lookupJson = await (await fetch(lookupUrl)).json();
              const people = lookupJson.people ?? [];
              // Preserve the original exact-name + currentTeam path first. If MLB people/search
              // reports a conflicting currentTeam for an injured player, permit only a unique
              // exact-name match on this team's VERIFIED official MLB IL roster.
              const identity = resolveMlbInjuryIdentity({
                playerName: name,
                teamId: tid,
                people,
                officialRosterByPlayerId: officialSnapshot?.rosterByPlayerId ?? {},
                officialRosterVerified:
                  officialSnapshot?.status === "VERIFIED"
                  && (officialSnapshot?.errors?.length ?? 0) === 0,
              });
              const pid = identity?.playerId;
              const positionAbbr = identity?.position || (isPitcher ? "P" : pos.split(" ").map((w: string) => w[0]).join("").toUpperCase());
              if (!pid) return null;
'''
          if 'const identity = resolveMlbInjuryIdentity({' not in text:
              replace_once(old_block, new_block, 'injury identity resolver')

          p.write_text(text)
          PY

          git diff --check
          grep -F 'import { buildMlbPeopleSearchUrl, resolveMlbInjuryIdentity } from "./mlb-injury-identity";' server/mlb-core-routes.ts
          grep -F 'const identity = resolveMlbInjuryIdentity({' server/mlb-core-routes.ts
          grep -F 'officialSnapshot?.status === "VERIFIED"' server/mlb-core-routes.ts
          grep -F '(officialSnapshot?.errors?.length ?? 0) === 0' server/mlb-core-routes.ts
          ! grep -F 'const match = people.find' server/mlb-core-routes.ts

          npx tsx --test server/mlb-injury-identity.test.ts server/mlb-injury-phase-b.test.ts server/mlb-injury-shadow.test.ts
          npx tsx --test server/mlb-p1-pregame-readiness.test.ts
          npm run test:s3-modularization
          npm run build:backend
          npm run test:s5a-e2e
          npm run test:s5b-shadow

          effective=$(printf '%s\n%s\n' "$changed" "$(git diff --name-only)" | sed '/^$/d' | sort -u)
          [[ "$effective" == "$three" ]]
          ! git diff origin/integration/p0-staging-secure -- server/mlb-core-routes.ts server/mlb-injury-identity.ts | grep -Ei 'probabil|confidence|threshold|stake|sportsbook|placeBet|automaticBet|realFinancialExposure|appendSettlement|DELETE[[:space:]]+FROM|UPDATE[[:space:]]+[A-Za-z_]'

          if git diff --quiet -- server/mlb-core-routes.ts; then
            echo 'Core already patched; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-core-routes.ts
          [[ "$(git diff --cached --name-only)" == 'server/mlb-core-routes.ts' ]]
          git commit -m 'P1-M2B: wire official IL roster identity fallback'
          git push origin "HEAD:$PR_HEAD"

      - name: Upload S5A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s5a-real-save-e2e-evidence
          path: |
            artifacts/s5a-e2e/
            s5a-e2e-run.log
          if-no-files-found: warn
          retention-days: 30
