name: Validate P0 V18 Frozen Route Live Provider

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-unified-v16-live-providers.ts'
      - 'server/mlb-unified-v16-live-providers.test.ts'
      - '.github/workflows/validate-p0-v18-frozen-route-live-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-route-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate route provider and assembler boundary
        run: |
          npx tsx --test \
            server/mlb-unified-v16-live-providers.test.ts \
            server/mlb-unified-v16-live-input-assembler.test.ts \
            server/mlb-frozen-research-route-assessor.test.ts \
            server/mlb-frozen-a-plus-classifier.test.ts
      - name: Preserve certified upstream materializers
        run: |
          npx tsx --test \
            server/mlb-full13-certified-materializer.test.ts \
            server/mlb-frozen-matchup-certified-materializer.test.ts \
            server/mlb-v15-bullpen-d1-materializer.test.ts
      - name: Compile live provider slice
        run: npx esbuild server/mlb-unified-v16-live-providers.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-unified-v16-live-providers.cjs
      - name: Backend build
        run: npm run build:backend
      - name: Preserve no-price and no-wager boundary
        shell: bash
        run: |
          set -euo pipefail
          file='server/mlb-unified-v16-live-providers.ts'
          grep -F 'frozenRouteAssessments: createMlbUnifiedV16CertifiedFrozenRouteProvider' "$file"
          grep -F 'targetOutcomeUsed' "$file"
          grep -F 'sportsbookPriceUsed' "$file"
          grep -F 'thresholdSearchUsed' "$file"
          ! grep -E 'oddsService|TheOdds|apiKey|stake|BET_ELITE|automaticBetPlacement|appendPrediction\(|appendSettlement\(' "$file"
      - name: Verify exact slice scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
