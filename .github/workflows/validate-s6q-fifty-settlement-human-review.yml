name: Validate S6Q Fifty Settlement Human Review

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-s6q-fifty-settlement-human-review.ts'
      - 'server/mlb-s6q-fifty-settlement-human-review.test.ts'
      - 'server/mlb-s6p-first-twenty-settlements-certification.ts'
      - 'server/mlb-s6m-statistical-milestones.ts'
      - 'server/s5b-staging-entry.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.s6q-fifty-settlement-human-review.json'
      - 'tsconfig.s5b-shadow.json'
      - 'package.json'
      - 'docs/S6Q_PHASE5C6_FIFTY_SETTLEMENT_HUMAN_REVIEW.md'
      - '.github/workflows/validate-s6q-fifty-settlement-human-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-s6q:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run focused Phase 5C-6 tests
        run: npm run test:s6q-fifty-settlement-human-review
      - name: Type-check Phase 5C-6 surface
        run: npm run typecheck:s6q-fifty-settlement-human-review
      - name: Type-check complete shadow surface
        run: npm run typecheck:s5b-shadow
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify scientific and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ARMED_AND_WAITING_FOR_50' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'WAITING_FOR_MINIMUM_SAMPLE_20_CERTIFICATION' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'WAITING_FOR_TEN_CERTIFIED_CYCLES' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'OBSERVING_FIFTY_RESULT_STABILITY' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'READY_FOR_HUMAN_REVIEW' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'humanReviewReady' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'automaticModelChangesAllowed: false' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'NO_AUTOMATIC_MODEL_CHANGE' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q 'realFinancialExposure: 0' server/mlb-s6q-fifty-settlement-human-review.ts
          grep -q '/health/s6q-fifty-settlement-human-review' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6q-fifty-settlement-human-review/status' server/s5b-staging-entry.ts
          grep -q '/api/mlb/ledger/v1/s6q-fifty-settlement-human-review/evidence' server/s5b-staging-entry.ts
