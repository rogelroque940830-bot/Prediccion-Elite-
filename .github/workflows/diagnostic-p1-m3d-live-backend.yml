name: Diagnostic P1-M3D Live Backend

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/diagnostic-p1-m3d-live-backend.yml'

permissions:
  contents: read

jobs:
  verify-live-p1-m3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_BACKEND_COMMIT: fe8cd82493d595dff89de0c181298eb26a668775
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact P1-M3D backend and verify read-only protection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            health_code=$(curl -sS -o audit/health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            before_code=$(curl -sS -o audit/ledger-before.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            review_code=$(curl -sS -o audit/anonymous-review.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/p1/v1/economic-review" || true)
            after_code=$(curl -sS -o audit/ledger-after.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)

            backend_ok=false
            if [[ "${health_code}" == "200" ]] && EXPECTED_BACKEND_COMMIT="${EXPECTED_BACKEND_COMMIT}" node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('audit/health.json', 'utf8'));
          process.exit(health.status === 'healthy' && health.commit === process.env.EXPECTED_BACKEND_COMMIT ? 0 : 1);
          NODE
            then backend_ok=true; fi

            echo "Attempt ${attempt}/100: health=${health_code} before=${before_code} review=${review_code} after=${after_code} backend=${backend_ok}"

            if [[ "${backend_ok}" == "true" && "${before_code}" == "200" && "${review_code}" == "401" && "${after_code}" == "200" ]]; then
              EXPECTED_BACKEND_COMMIT="${EXPECTED_BACKEND_COMMIT}" node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('audit/health.json', 'utf8'));
          const before = JSON.parse(fs.readFileSync('audit/ledger-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('audit/ledger-after.json', 'utf8'));
          const review = JSON.parse(fs.readFileSync('audit/anonymous-review.json', 'utf8'));
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(health.commit === process.env.EXPECTED_BACKEND_COMMIT, `commit=${health.commit}`);
          assert(before.success === true && after.success === true, 'ledger status failed');
          assert(before.data?.schemaVersion === 'mlb-ledger.v1', `schema=${before.data?.schemaVersion}`);
          assert(before.data?.immutable === true && after.data?.immutable === true, 'ledger is not immutable');
          assert(before.data?.predictions === after.data?.predictions, 'prediction count changed');
          assert(before.data?.settlementEvents === after.data?.settlementEvents, 'settlement count changed');
          assert(review.success === false, 'anonymous economic review unexpectedly succeeded');
          assert(/Authentication required/i.test(String(review.error || '')), `review error=${review.error}`);

          const evidence = {
            backendCommit: health.commit,
            environment: health.environment,
            endpoint: '/api/mlb/p1/v1/economic-review',
            anonymousGetStatus: 401,
            ownerScopedReadProtected: true,
            ledger: {
              schemaVersion: before.data.schemaVersion,
              immutable: before.data.immutable,
              predictionsBefore: before.data.predictions,
              predictionsAfter: after.data.predictions,
              settlementsBefore: before.data.settlementEvents,
              settlementsAfter: after.data.settlementEvents,
            },
            authenticatedPrivateReportExercisedByDiagnostic: false,
            predictionsCreated: 0,
            settlementsCreated: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
              exit 0
            fi

            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact P1-M3D backend deployment' >&2
              for file in health.json ledger-before.json anonymous-review.json ledger-after.json; do
                echo "--- ${file}"
                cat "audit/${file}" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 10
          done
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m3d-live-backend-evidence
          path: audit
          if-no-files-found: warn
