name: Diagnose MLB injury shadow sources

on:
  push:
    branches:
      - feature/mlb-injury-shadow-automation
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official roster and transaction response shapes
        shell: bash
        run: |
          set -euo pipefail
          for team in 136 140; do
            echo "=== TEAM $team ACTIVE/40MAN STATUS SUMMARY ==="
            curl --fail --silent --show-error "https://statsapi.mlb.com/api/v1/teams/$team/roster?rosterType=40Man&date=2026-07-27" \
              | jq '{count:(.roster|length), statuses:(.roster | group_by(.status.code) | map({code:.[0].status.code,description:.[0].status.description,count:length})), injuryExamples:(.roster | map(select(.status.code|test("^D"))) | .[:4] | map({playerId:.person.id,name:.person.fullName,statusCode:.status.code,status:.status.description,position:.position.abbreviation}))}'
            echo "=== TEAM $team TRANSACTION TYPE SUMMARY ==="
            curl --fail --silent --show-error "https://statsapi.mlb.com/api/v1/transactions?teamId=$team&startDate=2026-06-27&endDate=2026-07-27" \
              | jq '{count:(.transactions|length), typeCounts:(.transactions | group_by(.typeCode) | map({typeCode:.[0].typeCode,typeDesc:.[0].typeDesc,count:length})), ilExamples:(.transactions | map(select((.typeDesc // "" | ascii_downcase | test("injured|activated|rehab")) or (.description // "" | ascii_downcase | test("injured list|activated|rehab")))) | .[:8] | map({playerId:.person.id,name:.person.fullName,date,effectiveDate,typeCode,typeDesc,description}))}'
          done
