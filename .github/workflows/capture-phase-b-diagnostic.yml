name: Capture Phase B diagnostics

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-phase-b-auto
      - name: Save focused integration excerpts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          {
            echo '=== BULLPEN ROUTE ==='
            grep -n -A180 -B20 'app.get("/api/mlb/bullpen-status' server/routes.ts || true
            echo '=== BULLPEN FRONTEND ==='
            grep -n -A120 -B20 'const bpRes = await fetch' frontend/client/src/pages/mlb-predictor.tsx || true
            echo '=== BULLPEN MODEL USE ==='
            grep -n -A80 -B20 'bullpenStatus?.away?.runsAdjustment' frontend/client/src/pages/mlb-predictor.tsx || true
          } > diagnostics/phase-b-integration.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/phase-b-integration.txt
          git commit -m 'test: save Phase B integration diagnostic [skip ci]'
          git push origin HEAD:feature/mlb-injury-phase-b-auto
