name: Apply S6E Source Patches

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - scripts/apply-s6e-source-patches.mjs
      - .github/workflows/apply-s6e-source-patches.yml

permissions:
  contents: write

jobs:
  apply-s6e-patches:
    if: github.head_ref == 'feature/s6e-wnba-evaluation-emission'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S6E feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply exact source patches
        run: node scripts/apply-s6e-source-patches.mjs
      - name: Commit deterministic patches
        run: |
          if git diff --quiet; then
            echo "S6E patches already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/client/src/lib/wnba-model.ts server/security.ts package.json tsconfig.s5b-shadow.json server/route-contract.extensions.json .gitignore
          git commit -m "S6E: instrument WNBA evaluations without model changes"
          git push origin HEAD:${{ github.head_ref }}
