name: Validate P0 V16 V15 Bullpen D1 Materializer

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-v15-bullpen-d1-materializer.ts'
      - 'server/mlb-v15-bullpen-d1-materializer.test.ts'
      - '.github/workflows/validate-p0-v16-v15-bullpen-d1-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate frozen V15 D1 semantics and custody
        run: npx tsx --test server/mlb-v15-bullpen-d1-materializer.test.ts
      - name: Compile materializer
        run: npx esbuild server/mlb-v15-bullpen-d1-materializer.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-v15-bullpen-d1-materializer.cjs
      - name: Backend build
        run: npm run build:backend
      - name: Verify scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          file='server/mlb-v15-bullpen-d1-materializer.ts'
          grep -F 'AWAY_MINUS_HOME_POSITIVE_FAVORS_HOME_FRESHNESS' "$file"
          grep -F 'FROZEN_T5_PROBABLE_PITCHER' "$file"
          grep -F 'FINAL_BOXSCORE_FIRST_PITCHER' "$file"
          grep -F 'exactHistoricalStarterIdentityParityClaimed: false' "$file"
          grep -F 'sameDateDataUsed: false' "$file"
          grep -F 'thresholdSearchUsed: false' "$file"
          ! grep -E 'automaticBetPlacement:[[:space:]]*true|realFinancialExposure:[[:space:]]*[1-9]|appendPrediction\(|appendSettlement\(' "$file"
      - name: Verify exact slice scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p0-v16-v15-bullpen-d1-materializer.yml' \
            'server/mlb-v15-bullpen-d1-materializer.test.ts' \
            'server/mlb-v15-bullpen-d1-materializer.ts' | sort)
          [[ "$changed" == "$expected" ]]
