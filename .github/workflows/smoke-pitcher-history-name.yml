name: Smoke pitcher history names

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: 915ff51240eba8ff47f4bc5e89df21dce524085d
      GAME_PK: '822868'
    steps:
      - name: Wait for Railway and verify pitcher names
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            curl --fail --silent --show-error "$BACKEND_URL/health" > /tmp/health.json
            served=$(jq -r '.commit // ""' /tmp/health.json)
            echo "Attempt $attempt: served commit $served"
            if [ "$served" = "$EXPECTED_COMMIT" ]; then
              break
            fi
            sleep 10
          done
          jq -e --arg commit "$EXPECTED_COMMIT" '.status == "healthy" and .commit == $commit and .environment == "p0-integration"' /tmp/health.json >/dev/null
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/pitcher-vs-team/$GAME_PK" > /tmp/pvt.json
          jq '{homeName:.homeVsAway.pitcherName,awayName:.awayVsHome.pitcherName,homeSignal:.homeVsAway.signal,awaySignal:.awayVsHome.signal}' /tmp/pvt.json
          jq -e '.homeVsAway.pitcherName == "Kumar Rocker"' /tmp/pvt.json >/dev/null
          jq -e '.awayVsHome.pitcherName == "George Kirby"' /tmp/pvt.json >/dev/null
          jq -e '(.homeVsAway.signal | contains("Kumar Rocker")) and (.awayVsHome.signal | contains("George Kirby"))' /tmp/pvt.json >/dev/null
