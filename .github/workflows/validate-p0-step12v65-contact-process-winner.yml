name: Validate P0 Step 12V65 Contact Process Winner

on:
  pull_request:
    branches:
      - main
    paths:
      - 'research/p0-step12v65-contact-process-matchup-winner-contract.json'
      - 'scripts/p0-step12v65-contact-process-matchup-winner.py'
      - '.github/workflows/validate-p0-step12v65-contact-process-winner.yml'

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove V65 revision 2 was frozen before winner scorer
        run: |
          set -euo pipefail
          FREEZE=f71e5b24d87786dccf0afea31b38e2a80542581b
          git merge-base --is-ancestor "$FREEZE" HEAD
          git cat-file -e "$FREEZE:research/p0-step12v65-contact-process-matchup-winner-contract.json"
          ! git cat-file -e "$FREEZE:scripts/p0-step12v65-contact-process-matchup-winner.py"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v65-contact-process-matchup-winner-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v65-contact-process-matchup-winner-contract.v1'
          assert c['contractRevision']==2
          assert c['scientificStatus']=='FROZEN_CONTACT_PROCESS_SOURCE_SEMANTICS_CORRECTED_BEFORE_V65_OUTCOME_SCORER'
          p=c['preOutcomeCorrection']
          assert p['performedBeforeV65OutcomeScorerExisted'] is True
          assert p['v65OutcomeMetricsAvailableAtCorrection'] is False
          assert p['custodyRunContainsWinnerTarget'] is False
          assert c['sportingTarget']['primaryTarget']=='FULL_GAME_HOME_WIN'
          assert c['contactProcessEngineering']['featureCount']==3
          assert c['starterQualityEngineering']['featureCount']==5
          assert c['control']['featureCount']==4
          assert c['challenger']['featureCount']==12
          assert c['pairedBootstrap']['resamples']==5000
          assert c['statistics']['featureSearchAllowed'] is False
          assert c['statistics']['modelSearchAllowed'] is False
          assert c['statistics']['postResultTelemetryDefinitionChangeAllowed'] is False
          assert c['policy']['v16ProductionChanged'] is False
          assert c['policy']['betEliteAllowed'] is False
          assert c['policy']['realFinancialExposure']==0
          print('V65_WINNER_CONTRACT_PRE_OUTCOME_FREEZE_VERIFIED')
          PY
      - name: Syntax check scorer
        run: python -m py_compile scripts/p0-step12v65-contact-process-matchup-winner.py

  score-winner:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install frozen numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'scipy==1.17.0'
      - name: Download frozen winner-anatomy control source
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v-winner-anatomy-walkforward
          path: artifacts/p0-step12v-control
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31649438822
      - name: Download frozen T-minus-5 lineup lineage
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download certified batter outcome custody for slot workload chronology
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v41-batter-historical-custody
          path: artifacts/p0-step12v41
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31905076013
      - name: Download certified V16 pure winner model
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: artifacts/p0-step12v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189
      - name: Download frozen V60 T-minus-5 starter and split custody
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v60-matchup-custody-*
          path: artifacts/p0-step12v60-custody
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31919873754
      - name: Download immutable V62 pitch-quality custody
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v62-pitch-quality-*
          path: artifacts/p0-step12v62-pitch-quality
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31925270654
      - name: Download frozen V62 winner evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v62-pitch-quality-winner
          path: artifacts/p0-step12v62
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31925270654
      - name: Download frozen V64 winner evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v64-contact-damage-winner
          path: artifacts/p0-step12v64
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31954595109
      - name: Download immutable V65 corrected contact-process custody
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v65-contact-process-*
          path: artifacts/p0-step12v65-contact-process
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31956539181
      - name: Verify immutable parent and custody files before scoring
        run: |
          set -euo pipefail
          test -s artifacts/p0-step12v16/pure-settlement-probability-report.json
          test -s artifacts/p0-step12v16/pure-settlement-model-manifest.json
          test -s artifacts/p0-step12v62/pitch-quality-winner-report.json
          test -s artifacts/p0-step12v64/contact-damage-winner-report.json
          for s in 2022 2023 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v3/${s}/game-anatomy-feature-table.json"
            test -s "artifacts/p0-step12v3/${s}/cohort/pregame-lineup-history.json"
            test -s "artifacts/p0-step12v41/${s}/batter-history.json"
            test -s "artifacts/p0-step12v60-custody/pregame-hands-${s}.json"
            test -s "artifacts/p0-step12v60-custody/batter-hand-${s}.json"
            test -s "artifacts/p0-step12v62-pitch-quality/pitch-quality-${s}.json"
            test -s "artifacts/p0-step12v65-contact-process/contact-process-${s}.json"
          done
          test -s artifacts/p0-step12v62-pitch-quality/pitch-quality-2021.json
          test -s artifacts/p0-step12v65-contact-process/contact-process-2021.json
      - name: Run frozen V65 contact-process winner experiment
        run: |
          mkdir -p artifacts/p0-step12v65
          python scripts/p0-step12v65-contact-process-matchup-winner.py \
            --control-root artifacts/p0-step12v-control \
            --lineup-root artifacts/p0-step12v3 \
            --batter-root artifacts/p0-step12v41 \
            --hands-root artifacts/p0-step12v60-custody \
            --contact-root artifacts/p0-step12v65-contact-process \
            --pitch-root artifacts/p0-step12v62-pitch-quality \
            --v16-report artifacts/p0-step12v16/pure-settlement-probability-report.json \
            --v16-manifest artifacts/p0-step12v16/pure-settlement-model-manifest.json \
            --v62-report artifacts/p0-step12v62/pitch-quality-winner-report.json \
            --v64-report artifacts/p0-step12v64/contact-damage-winner-report.json \
            --contract research/p0-step12v65-contact-process-matchup-winner-contract.json \
            --out artifacts/p0-step12v65/contact-process-matchup-winner-report.json
      - name: Validate evidence without requiring favorable result
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v65/contact-process-matchup-winner-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v65-contact-process-matchup-winner.v1'
          assert r['classification'] in {
            'CONTACT_PROCESS_WINNER_VALUE_CERTIFIED_FOR_NEXT_WINNER_MODEL_RESEARCH',
            'CONTACT_PROCESS_WINNER_VALUE_NOT_ROBUST_ENOUGH_TO_ADVANCE',
            'CONTACT_PROCESS_WINNER_CUSTODY_INSUFFICIENT'
          }
          assert isinstance(r['candidateRubricPassed'],bool)
          assert isinstance(r['coverageGatePassed'],bool)
          assert r['target']=='FULL_GAME_HOME_WIN'
          assert r['data']['seasonRows']=={'2022':2398,'2023':2399,'2024':2406,'2025':2423,'2026_YTD':1781}
          assert r['features']['controlCount']==4
          assert r['features']['contactProcessCount']==3
          assert r['features']['starterQualityCount']==5
          assert r['features']['challengerCount']==12
          assert r['combinedEvaluation2024_2026Ytd']['rows']==6610
          b=r['pairedDateBootstrapVsControl2024_2026Ytd']
          assert b['unit']=='OFFICIAL_DATE_CLUSTER' and b['resamples']==5000 and b['distinctDates']>400
          assert r['diagnostics']['frozenV62IsDiagnosticOnlyNotPromotionControl'] is True
          assert r['diagnostics']['frozenV64IsDiagnosticOnlyNotPromotionControl'] is True
          assert r['diagnostics']['diagnosticResultsMayNotChoosePromotionCandidate'] is True
          p=r['policy']
          for k in ['sameDateOutcomeLeakageAllowed','futureGameDataAllowed','historicalPricesUsed','marketOddsUsedAsFeatures','featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','subsetMiningUsed','homeAwaySubsetMiningUsed','seasonExclusionAfterResultsUsed','postResultRuleChangeAllowed','postResultFeatureAdditionAllowed','postResultFeatureRemovalAllowed','postResultShrinkageChangeAllowed','postResultLookbackChangeAllowed','postResultTelemetryDefinitionChangeAllowed','v16ProductionChanged','productionMarketRegistryChanged','rankingChanged','stakeChanged','betEliteAllowed','finalRecommendationChanged','automaticBetPlacementAllowed','positiveEvEstablished']:
            assert p[k] is False,k
          assert p['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'candidateRubricPassed':r['candidateRubricPassed'],
            'coverageGatePassed':r['coverageGatePassed'],
            'validation2023':r['validation2023']['challengerImprovementVsControl'],
            'combined':r['combinedEvaluation2024_2026Ytd']['challengerImprovementVsControl'],
            'contactProcessOnly':r['combinedEvaluation2024_2026Ytd']['contactProcessOnlyImprovementVsControl'],
            'starterQualityOnly':r['combinedEvaluation2024_2026Ytd']['starterQualityOnlyImprovementVsControl'],
            'bootstrap':r['pairedDateBootstrapVsControl2024_2026Ytd'],
            'bySeason':{s:v['challengerImprovementVsControl'] for s,v in r['evaluationBySeason'].items()},
            'vsV62':r['diagnostics']['improvementVsFrozenV62Combined'],
            'vsV64':r['diagnostics']['improvementVsFrozenV64Combined'],
            'checks':r['candidateRubricChecks']
          },indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Verify exact research-only scope
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib
          text=pathlib.Path('scripts/p0-step12v65-contact-process-matchup-winner.py').read_text()
          compact=''.join(text.split())
          assert "'historicalPricesUsed':False" in compact
          assert "'betEliteAllowed':False" in compact
          assert "'realFinancialExposure':0" in compact
          assert "'automaticBetPlacementAllowed':True" not in compact
          assert "'betEliteAllowed':True" not in compact
          print('V65_RESEARCH_ONLY_SCOPE_VERIFIED')
          PY
          git diff --check
      - name: Upload V65 winner evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v65-contact-process-winner
          path: artifacts/p0-step12v65/
          if-no-files-found: error
          retention-days: 30
