name: Validate P0 Odds Demand Live

on:
  push:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-demand-live.yml'
      - 'server/index.ts'
      - 'server/odds-demand-policy.ts'
      - 'server/odds-demand-policy.test.ts'
      - 'server/mlb-closing-line-worker.ts'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-f5-odds-routes.ts'
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p0-odds-demand-live.yml'
      - 'server/index.ts'
      - 'server/odds-demand-policy.ts'
      - 'server/odds-demand-policy.test.ts'
      - 'server/mlb-closing-line-worker.ts'
      - 'server/legacy-picks-routes.ts'
      - 'server/mlb-f5-odds-routes.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  odds-demand-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://web-p0-integration.up.railway.app
      EXPECTED_COMMIT: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.base.sha }}
    steps:
      - name: Verify deployed P0 odds-demand safety
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            health_code=$(curl -sS -o health.json -w '%{http_code}' --max-time 15 "$API_BASE/health" || true)
            if [[ "$health_code" == "200" ]]; then
              if node <<'NODE'
          const fs = require('fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const expectedCommit = String(process.env.EXPECTED_COMMIT || '').trim();

          if (health.status !== 'healthy') throw new Error('health endpoint is not healthy');
          if (expectedCommit && health.commit !== expectedCommit) {
            throw new Error(`Railway is serving ${health.commit || 'unknown'}, expected ${expectedCommit}`);
          }
          if (health.mlbClosingLineCapture !== false) {
            throw new Error(`P0 odds-demand violation: mlbClosingLineCapture=${String(health.mlbClosingLineCapture)}; expected false`);
          }

          console.log(JSON.stringify({
            health: health.status,
            commit: health.commit,
            environment: health.environment,
            mlbClosingLineCapture: health.mlbClosingLineCapture,
            oddsDemandSafety: 'PASS',
          }, null, 2));
          NODE
              then
                exit 0
              fi
            fi
            echo "Attempt $attempt/36: health=$health_code expected_commit=$EXPECTED_COMMIT"
            sleep 10
          done

          echo 'P0 odds-demand live validation failed after retries.'
          echo '--- health'; cat health.json 2>/dev/null || true
          exit 1
