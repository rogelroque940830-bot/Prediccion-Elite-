name: Validate P0 V17 Certified SLG PitchMix Materializer

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-frozen-matchup-live-feature-builder.ts'
      - 'server/mlb-frozen-matchup-live-feature-builder.test.ts'
      - 'server/mlb-frozen-matchup-canonical-seed.generated.ts'
      - 'server/mlb-frozen-matchup-canonical-seed.ts'
      - 'server/mlb-frozen-matchup-canonical-seed.test.ts'
      - 'server/mlb-frozen-matchup-certified-materializer.ts'
      - 'server/mlb-frozen-matchup-certified-materializer.test.ts'
      - 'scripts/p0-v17-generate-matchup-seed.mjs'
      - '.github/workflows/materialize-p0-v17-matchup-seed.yml'
      - '.github/workflows/validate-p0-v17-certified-matchup-materializer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate canonical V9/V12 formulas, seed custody, and incremental materializer
        run: |
          npx tsx --test \
            server/mlb-frozen-matchup-live-feature-builder.test.ts \
            server/mlb-frozen-matchup-canonical-seed.test.ts \
            server/mlb-frozen-matchup-certified-materializer.test.ts
      - name: Preserve frozen route assessor regression
        run: npx tsx --test server/mlb-frozen-research-route-assessor.test.ts
      - name: Compile V17 materializer slice
        run: |
          npx esbuild server/mlb-frozen-matchup-live-feature-builder.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-frozen-matchup-live-feature-builder.cjs
          npx esbuild server/mlb-frozen-matchup-canonical-seed.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-frozen-matchup-canonical-seed.cjs
          npx esbuild server/mlb-frozen-matchup-certified-materializer.ts --bundle --platform=node --target=node20 --format=cjs --outfile=/tmp/mlb-frozen-matchup-certified-materializer.cjs
      - name: Backend build
        run: npm run build:backend
      - name: Preserve scientific and financial boundary
        shell: bash
        run: |
          set -euo pipefail
          builder='server/mlb-frozen-matchup-live-feature-builder.ts'
          seed='server/mlb-frozen-matchup-canonical-seed.ts'
          materializer='server/mlb-frozen-matchup-certified-materializer.ts'
          grep -F 'MLB_FROZEN_MATCHUP_SLG_MIN_PRIOR_PA = 50' "$builder"
          grep -F 'MLB_FROZEN_MATCHUP_PITCHMIX_LOOKBACK_DAYS = 365' "$builder"
          grep -F 'MLB_FROZEN_MATCHUP_PITCHER_MIN_ALL_PITCHES = 250' "$builder"
          grep -F 'MLB_FROZEN_MATCHUP_PITCHER_MIN_CATEGORY_SHARE = 0.90' "$builder"
          grep -F 'MLB_FROZEN_MATCHUP_MIN_WEIGHTED_COVERAGE_SHARE = 0.80' "$builder"
          grep -F 'sameDateOutcomeLeakageAllowed: false' "$builder" "$seed" "$materializer"
          grep -F 'sportsbookPriceUsed: false' "$materializer"
          grep -F 'targetOutcomeUsed: false' "$materializer"
          ! grep -E 'stake|BET_ELITE|automaticBetPlacement|appendPrediction\(|appendSettlement\(' "$builder" "$seed" "$materializer"
      - name: Verify exact slice scope
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
