name: Validate P0 Step 12V43 Batter Hits No Retune Robustness

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v43-batter-hits-no-retune-robustness-contract.json'
      - 'scripts/p0-step12v43-batter-hits-no-retune-robustness.py'
      - '.github/workflows/validate-p0-step12v43-batter-hits-no-retune-robustness.yml'

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen research dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.4.2' 'pandas==3.0.0' 'scipy==1.18.0' 'scikit-learn==1.8.0'

      - name: Validate frozen V43 gate
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v43-batter-hits-no-retune-robustness-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v43-batter-hits-no-retune-robustness-contract.v1'
          p=c['parentEvidence']
          assert p['mainBaseSha']=='8112abcdd70634dcf6b0244002cb2a59f9be575f'
          assert p['v42Pr']==580 and p['v42MergeSha']=='8112abcdd70634dcf6b0244002cb2a59f9be575f'
          assert p['v42WorkflowRunId']==31905694360 and p['v42ArtifactId']==9252298988
          assert p['v42ArtifactName']=='p0-step12v42-batter-hits-baseline'
          assert p['v42ArtifactDigest']=='sha256:ef50f82565a013a62fcd239f464972c255acc02e57780e6b01895a44bc84f747'
          assert p['v42ClassificationRequired']=='BATTER_HITS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          assert p['v41WorkflowRunId']==31905076013 and p['v41ArtifactId']==9252168716
          assert p['v41ArtifactDigest']=='sha256:a9f493bb61259ca7a0400149fe2b79e5145c2294e8afa49f27aeed6541ca8e2a'
          assert p['step12v3WorkflowRunId']==31659518059
          assert p['step12v3ArtifactDigest']=='sha256:6d834dfd699dbb9f1ee4b50a557b6613ac0791dff41fadbd5521e189c9fc5f26'
          m=c['modelBoundary']
          assert m['sourceImplementation']=='scripts/p0-step12v42-batter-hits-baseline.py'
          assert m['unchangedV42FeatureSetRequired'] is True
          assert m['unchangedV42TrainingSeasonRequired']=='2022'
          assert m['unchangedV42PoissonAlphaRequired']==1.0
          assert m['unchangedV42FixedLinesRequired']==[0.5,1.5,2.5]
          assert m['unchangedV42BatterOnlyBaselineRequired']=='BATTER_HPA_SHRUNK_TIMES_LINEUP_SLOT_PA_PER_START_SHRUNK'
          for key in ['refitWithAdditionalSeasonsAllowed','recalibrationAllowed','coefficientChangeAllowed','featureChangeAllowed','imputationChangeAllowed','scalingChangeAllowed','dispersionChangeAllowed','lineSetChangeAllowed','baselineFormulaChangeAllowed','thresholdSearchAllowed']:
              assert m[key] is False
          assert c['replayParity']['absoluteTolerance']==1e-12
          s=c['seasonStabilityGate']
          assert s['partitions']==['2023','2024','2025','2026_YTD']
          for key in ['requireModelDevianceBeatConstantEachPartition','requireModelDevianceBeatBatterOnlyEachPartition','requireModelAverageBrierBeatConstantEachPartition','requireModelAverageBrierBeatBatterOnlyEachPartition','requireModelAbsoluteMeanBiasNoWorseThanConstantEachPartition','requireModelAbsoluteMeanBiasNoWorseThanBatterOnlyEachPartition']:
              assert s[key] is True
          assert s['noLineSpecificSubsetPromotion'] is True
          b=c['dateClusterBootstrapGate']
          assert b['clusterUnit']=='OFFICIAL_DATE' and b['replicates']==10000 and b['randomSeed']==4301 and b['confidenceLevel']==0.95
          assert len(b['metrics'])==4 and b['requireTwoSidedPercentileCiLowerBoundGreaterThanZeroForAllMetrics'] is True
          assert c['classification']['pass']=='BATTER_HITS_ROBUST_ENOUGH_FOR_PROSPECTIVE_PRICE_CAPTURE_ENGINEERING_ONLY'
          assert c['classification']['fail']=='BATTER_HITS_NOT_ROBUST_ENOUGH_FOR_PRICE_CAPTURE_CLOSE_CURRENT_MODEL'
          assert c['statistics']['postResultRuleChangeAllowed'] is False
          assert c['policy']['failureClosesCurrentBatterHitsModel'] is True
          assert c['policy']['betEliteAllowed'] is False and c['policy']['realFinancialExposure']==0
          print('STEP12V43_GATE_PREDECLARED')
          PY

      - name: Syntax check V43 scorer
        run: python -m py_compile scripts/p0-step12v43-batter-hits-no-retune-robustness.py

      - name: Download immutable V42 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v42-batter-hits-baseline
          path: artifacts/p0-step12v42
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31905694360

      - name: Download certified V41 batter custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v41-batter-historical-custody
          path: artifacts/p0-step12v41
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31905076013

      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Verify immutable V42 parent custody
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v42/batter-hits-baseline-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v42-batter-hits-baseline.v1'
          assert r['classification']=='BATTER_HITS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          assert r['candidateRubricPassed'] is True and all(r['candidateRubricChecks'].values())
          assert r['data']['scoredRows']==204480 and r['data']['featureCount']==12
          assert r['model']['trainingSeason']=='2022' and r['model']['trainingRows']==42916
          assert r['model']['fixedHalfHitLines']==[0.5,1.5,2.5]
          assert r['volumeDiagnostics']['eligibleStartingBatterOutcomes']==204480
          assert r['volumeDiagnostics']['eligibilityShare']>0.9996
          assert r['marketBoundary']['providerMarketKey']=='batter_hits'
          assert r['marketBoundary']['historicalBatterHitsPricesUsed'] is False
          assert r['marketBoundary']['positiveEvEstablished'] is False
          print('V42_PARENT_CUSTODY_VERIFIED')
          PY

      - name: Run V43 exact V42 replay and robustness gate
        run: |
          mkdir -p artifacts/p0-step12v43
          python scripts/p0-step12v43-batter-hits-no-retune-robustness.py \
            --root artifacts/p0-step12v3 \
            --batter-root artifacts/p0-step12v41 \
            --contract research/p0-step12v43-batter-hits-no-retune-robustness-contract.json \
            --v42-contract research/p0-step12v42-batter-hits-baseline-contract.json \
            --v42-script scripts/p0-step12v42-batter-hits-baseline.py \
            --v42-report artifacts/p0-step12v42/batter-hits-baseline-report.json \
            --out artifacts/p0-step12v43/batter-hits-no-retune-robustness-report.json

      - name: Validate immutable replay and safety boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v43/batter-hits-no-retune-robustness-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v43-batter-hits-no-retune-robustness.v1'
          assert r['parent']['v42Classification']=='BATTER_HITS_NO_RETUNE_ROBUSTNESS_CANDIDATE_ONLY'
          assert r['parent']['v42CandidateRubricPassed'] is True
          mb=r['modelBoundary']
          assert mb['unchangedV42ImplementationReplayed'] is True and mb['replayParityPassed'] is True and mb['replayParityTolerance']==1e-12
          for key in ['refitWithAdditionalSeasonsUsed','recalibrationUsed','coefficientChangeUsed','featureChangeUsed','imputationChangeUsed','scalingChangeUsed','dispersionChangeUsed','lineSetChangeUsed','baselineFormulaChangeUsed','thresholdSearchUsed']:
              assert mb[key] is False
          assert r['data']['scoredRows']==204480 and r['data']['featureCount']==12
          assert set(r['seasonMetrics'])=={'2023','2024','2025','2026_YTD'}
          assert set(r['seasonStabilityChecks'])=={'2023','2024','2025','2026_YTD'}
          b=r['dateClusterBootstrap']
          assert b['replicates']==10000 and b['randomSeed']==4301 and b['confidenceLevel']==0.95 and b['uniqueDates']>490
          assert set(b['metrics'])=={'devianceVsConstant','devianceVsBatterOnly','averageBrierVsConstant','averageBrierVsBatterOnly'}
          assert set(r['bootstrapChecks'])==set(b['metrics'])
          assert r['classification'] in {'BATTER_HITS_ROBUST_ENOUGH_FOR_PROSPECTIVE_PRICE_CAPTURE_ENGINEERING_ONLY','BATTER_HITS_NOT_ROBUST_ENOUGH_FOR_PRICE_CAPTURE_CLOSE_CURRENT_MODEL'}
          market=r['marketBoundary']
          assert market['providerMarketKey']=='batter_hits' and market['repositoryRegistryFamily']=='BATTER_PROP'
          assert market['historicalBatterHitsPricesUsed'] is False and market['positiveEvEstablished'] is False
          assert market['hardRockFloridaPerEventAvailabilityEstablished'] is False and market['productionPromotionAuthorized'] is False
          assert market['prospectivePriceCaptureEngineeringAuthorized']==r['robustnessGatePassed']
          p=r['policy']
          for key in ['featureSearchUsed','modelSearchUsed','hyperparameterSearchUsed','lineSearchUsed','thresholdSearchUsed','subsetMiningUsed','postResultRuleChangeUsed','productionMarketRegistryChanged','liveLookupAuthorizationChanged','liveMarketDiscoveryChanged','rankingChanged','stakeChanged','betEliteAllowed','automaticBetPlacementAllowed']:
              assert p[key] is False
          assert p['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'robustnessGatePassed':r['robustnessGatePassed'],
            'seasonStabilityGatePassed':r['seasonStabilityGatePassed'],
            'seasonStabilityChecks':r['seasonStabilityChecks'],
            'seasonMetrics':r['seasonMetrics'],
            'bootstrapGatePassed':r['bootstrapGatePassed'],
            'dateClusterBootstrap':r['dateClusterBootstrap'],
            'bootstrapChecks':r['bootstrapChecks']
          },indent=2))
          PY

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Preserve canonical MLB regressions and unchanged registry
        run: |
          npm ci
          npx tsx --test server/mlb-market-universe-registry.test.ts server/mlb-market-odds-normalizer.test.ts server/mlb-market-batter-history.test.ts
          npm run build:backend
          grep -F '["batter_hits", "Batter hits", "BATTER_PROP", "PLAYER_OVER_UNDER"]' server/mlb-market-universe-registry.ts
          grep -F 'batter_hits: ["HARD_ROCK_MLB_GUIDE_20260807"]' server/mlb-market-universe-registry.ts

      - name: Upload V43 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v43-batter-hits-no-retune-robustness
          path: artifacts/p0-step12v43/
          if-no-files-found: error
          retention-days: 30
