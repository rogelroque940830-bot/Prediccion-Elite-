name: MLB R1B Statcast xERA Historical Vintage Custody Discovery Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe.ts
      - .github/workflows/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Discover archived primary Savant historical xwOBA vintage custody
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe
          npx tsx scripts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe.ts \
            --out=artifacts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe/evidence.json

      - name: Enforce archival-custody scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe/evidence.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          if(e.status!=='HISTORICAL_SAVANT_XWOBA_VINTAGE_CUSTODY_DISCOVERY_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.discoveryPolicy?.primaryPublisherUrlsOnly!==true) throw new Error('primary only');
          if(e.discoveryPolicy?.noThirdPartyMirrors!==true) throw new Error('third-party');
          if(e.discoveryPolicy?.noInterpolationBetweenSnapshots!==true) throw new Error('interpolation');
          if(e.discoveryPolicy?.noEmpiricalFitAuthorized!==true) throw new Error('empirical fit');
          if(e.discoveryPolicy?.approximationForbidden!==true) throw new Error('approximation');
          if(e.discoveryPolicy?.xeraNotUsedToSelectOrRankCustodyCandidates!==true) throw new Error('xera leakage');
          if(e.discoveryPolicy?.archiveCaptureExistenceDoesNotEqualCompleteDailyCustody!==true) throw new Error('custody overclaim');
          if(e.scientificConclusion?.completeDailyHistoricalXwobaVintageCustodyProven!==false) throw new Error('premature daily custody');
          if(e.scientificConclusion?.exactTargetDateXeraCustodyForFullUniverseProven!==false) throw new Error('premature xera custody');
          if(e.scientificConclusion?.exactSavantProductionConversionProven!==false) throw new Error('premature mechanism');
          if(e.scientificConclusion?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('scientific boundary');
          NODE

      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe.ts
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'noInterpolationBetweenSnapshots: true' "$src"
          grep -F 'noEmpiricalFitAuthorized: true' "$src"
          grep -F 'familyPromotionAuthorized: false' "$src"

      - name: Backend build regression
        run: npm run build:backend

      - name: Upload historical-vintage custody discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe
          path: artifacts/mlb-r1b-statcast-xera-historical-vintage-custody-discovery-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
