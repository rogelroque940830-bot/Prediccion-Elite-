name: Apply P1-M6A3B2B1 Zero-Appearance Fix

on:
  push:
    branches:
      - fix/p1-m6a3b2b1-zero-appearance-starter-order
    paths:
      - '.github/workflows/apply-p1-m6a3b2b1-zero-appearance-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p1-m6a3b2b1-zero-appearance-starter-order
      - name: Apply evidence-grounded parser/test/docs/CI patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          src = Path('server/mlb-market-starting-pitcher-history.ts')
          text = src.read_text()
          old = 'export type MlbStartingPitcherIdentityMethod = "GAME_STARTED_FLAG_AND_ORDER" | "PITCHING_ORDER_FIRST";'
          new = 'export type MlbStartingPitcherIdentityMethod = "GAME_STARTED_FLAG_AND_ORDER" | "GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING" | "PITCHING_ORDER_FIRST";'
          assert old in text
          text = text.replace(old, new, 1)

          marker = '''  return [...new Set(ids)].sort((a, b) => a - b);\n}\n\nfunction parseStarter('''
          replacement = '''  return [...new Set(ids)].sort((a, b) => a - b);\n}\n\nfunction hasZeroOfficialAppearance(players: Record<string, any>, pitcherId: number): boolean {\n  const pitching = players?.[`ID${pitcherId}`]?.stats?.pitching;\n  if (!pitching || typeof pitching !== "object") return false;\n  let outsRecorded: number;\n  try {\n    outsRecorded = mlbInningsPitchedToOuts(pitching.inningsPitched);\n  } catch {\n    return false;\n  }\n  const battersFaced = nonNegativeInteger(pitching.battersFaced);\n  const numberOfPitches = nonNegativeInteger(pitching.numberOfPitches);\n  return outsRecorded === 0 && battersFaced === 0 && numberOfPitches === 0;\n}\n\nfunction parseStarter('''
          assert marker in text
          text = text.replace(marker, replacement, 1)

          old_logic = '''  if (explicit.length > 1) throw new Error(`P1_M6A3B2B1_MULTIPLE_GAME_STARTED_FLAGS:${side}`);\n  if (explicit.length === 1) {\n    if (explicit[0] !== firstPitcherId) throw new Error(`P1_M6A3B2B1_STARTER_ORDER_CONFLICT:${side}`);\n    pitcherId = explicit[0];\n    identityMethod = "GAME_STARTED_FLAG_AND_ORDER";\n  }'''
          new_logic = '''  if (explicit.length > 1) throw new Error(`P1_M6A3B2B1_MULTIPLE_GAME_STARTED_FLAGS:${side}`);\n  if (explicit.length === 1) {\n    const explicitId = explicit[0];\n    const explicitIndex = pitchingOrder.indexOf(explicitId);\n    if (explicitIndex < 0) throw new Error(`P1_M6A3B2B1_STARTER_ORDER_CONFLICT:${side}`);\n    if (explicitIndex === 0) {\n      pitcherId = explicitId;\n      identityMethod = "GAME_STARTED_FLAG_AND_ORDER";\n    } else {\n      const precedingIds = pitchingOrder.slice(0, explicitIndex);\n      if (!precedingIds.length || !precedingIds.every((id) => hasZeroOfficialAppearance(players, id))) {\n        throw new Error(`P1_M6A3B2B1_STARTER_ORDER_CONFLICT:${side}`);\n      }\n      pitcherId = explicitId;\n      identityMethod = "GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING";\n    }\n  }'''
          assert old_logic in text
          text = text.replace(old_logic, new_logic, 1)

          old_counts = '''  const identityMethodCounts: Record<MlbStartingPitcherIdentityMethod, number> = {\n    GAME_STARTED_FLAG_AND_ORDER: 0,\n    PITCHING_ORDER_FIRST: 0,\n  };'''
          new_counts = '''  const identityMethodCounts: Record<MlbStartingPitcherIdentityMethod, number> = {\n    GAME_STARTED_FLAG_AND_ORDER: 0,\n    GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING: 0,\n    PITCHING_ORDER_FIRST: 0,\n  };'''
          assert old_counts in text
          text = text.replace(old_counts, new_counts, 1)
          src.write_text(text)

          test = Path('server/mlb-market-starting-pitcher-history.test.ts')
          tests = test.read_text()
          anchor = '''test("starter identity disagreement fails closed", () => {\n  assert.throws(\n    () => parseMlbHistoricalStartingPitcherBoxscore(officialGame(), boxscore({ conflict: true })),\n    /STARTER_ORDER_CONFLICT:away/,\n  );\n});\n'''
          additions = anchor + '''\ntest("gamesStarted may override only a prior zero-appearance administrative listing", () => {\n  const delayed = boxscore({ explicitStarterFlags: false });\n  delayed.teams.away.pitchers = [101, 102, 103];\n  delayed.teams.away.players.ID101.stats.pitching = pitchingLine({\n    gamesStarted: 0, inningsPitched: "0.0", battersFaced: 0, numberOfPitches: 0, strikes: 0,\n    runs: 0, earnedRuns: 0, hits: 0, baseOnBalls: 0, strikeOuts: 0, homeRuns: 0, hitByPitch: 0,\n  });\n  delayed.teams.away.players.ID102.stats.pitching = pitchingLine({\n    gamesStarted: 1, inningsPitched: "2.0", battersFaced: 8, numberOfPitches: 33, strikes: 22,\n    runs: 0, earnedRuns: 0, hits: 2, baseOnBalls: 0, strikeOuts: 2, homeRuns: 0, hitByPitch: 0,\n  });\n  const parsed = parseMlbHistoricalStartingPitcherBoxscore(officialGame(), delayed);\n  assert.equal(parsed.awayStarter.pitcherId, 102);\n  assert.equal(parsed.awayStarter.identityMethod, "GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING");\n  assert.equal(parsed.awayStarter.outsRecorded, 6);\n});\n\ntest("zero-appearance exception fails closed when any preceding listed pitcher actually appeared", () => {\n  const invalid = boxscore({ explicitStarterFlags: false });\n  invalid.teams.away.pitchers = [101, 102, 103];\n  invalid.teams.away.players.ID101.stats.pitching = pitchingLine({\n    gamesStarted: 0, inningsPitched: "0.1", battersFaced: 1, numberOfPitches: 4, strikes: 2,\n  });\n  invalid.teams.away.players.ID102.stats.pitching = pitchingLine({ gamesStarted: 1, inningsPitched: "2.0" });\n  assert.throws(\n    () => parseMlbHistoricalStartingPitcherBoxscore(officialGame(), invalid),\n    /STARTER_ORDER_CONFLICT:away/,\n  );\n});\n'''
          assert anchor in tests
          tests = tests.replace(anchor, additions, 1)
          test.write_text(tests)

          docs = Path('docs/P1_M6A3B2B1_MLB_STARTING_PITCHER_HISTORY.md')
          doc = docs.read_text()
          old_doc = '''For each side, the parser reads the official MLB boxscore pitching order. The first pitcher in that order is the starter candidate. When the game-level `gamesStarted=1` flag is available, it must identify the same pitcher; disagreement fails closed. If the explicit game-started flag is absent, the source may use the first official pitching-order entry but records the weaker identity method separately.'''
          new_doc = '''For each side, the parser reads the official MLB boxscore pitching order and the game-level `gamesStarted=1` flag. Normally both identify the first pitcher. A narrow official exception is allowed when MLB leaves a planned pitcher ahead of the actual starter in the pitching list even though that planned pitcher recorded exactly `0.0 IP`, `0 battersFaced`, and `0 numberOfPitches`: in that case the unique `gamesStarted=1` pitcher later in the order is the effective starter and the identity method is recorded as `GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING`. If any preceding listed pitcher recorded an out, faced a batter, or threw a pitch, disagreement still fails closed. If the explicit game-started flag is absent, the source may use the first official pitching-order entry but records the weaker identity method separately.'''
          assert old_doc in doc
          docs.write_text(doc.replace(old_doc, new_doc, 1))

          wf = Path('.github/workflows/validate-p1-m6a3b2b1-starting-pitcher-history.yml')
          y = wf.read_text()
          grep_anchor = "          grep -F 'GAME_STARTED_FLAG_AND_ORDER' \"$source\"\n"
          assert grep_anchor in y
          y = y.replace(grep_anchor, grep_anchor + "          grep -F 'GAME_STARTED_FLAG_AFTER_ZERO_APPEARANCE_LISTING' \"$source\"\n", 1)
          old_scope = '''      - name: Verify exact B2B1 scope from PR base to PR head\n        shell: bash\n        run: |\n          set -euo pipefail\n          base='${{ github.event.pull_request.base.sha }}'\n          head='${{ github.event.pull_request.head.sha }}'\n          if [[ -z "$base" || -z "$head" ]]; then\n            git fetch origin integration/p0-staging-secure --depth=1\n            base='origin/integration/p0-staging-secure'\n            head='HEAD'\n          fi\n          git diff --check "$base...$head"\n          changed=$(git diff --name-only "$base...$head" | sort)\n          expected=$(printf '%s\\n' \\\n            '.github/workflows/validate-p1-m6a3b2b1-starting-pitcher-history.yml' \\\n            'docs/P1_M6A3B2B1_MLB_STARTING_PITCHER_HISTORY.md' \\\n            'scripts/p1-m6a3b2b1-starting-pitcher-backfill.mjs' \\\n            'server/mlb-market-starting-pitcher-history.test.ts' \\\n            'server/mlb-market-starting-pitcher-history.ts' \\\n            'tsconfig.p1-m6a3b2b1-starting-pitcher-history.json' | sort)\n          [[ "$changed" == "$expected" ]]'''
          new_scope = '''      - name: Verify bounded B2B1 maintenance scope from PR base to PR head\n        shell: bash\n        run: |\n          set -euo pipefail\n          base='${{ github.event.pull_request.base.sha }}'\n          head='${{ github.event.pull_request.head.sha }}'\n          if [[ -z "$base" || -z "$head" ]]; then\n            git fetch origin integration/p0-staging-secure --depth=1\n            base='origin/integration/p0-staging-secure'\n            head='HEAD'\n          fi\n          git diff --check "$base...$head"\n          mapfile -t changed < <(git diff --name-only "$base...$head" | sort)\n          allowed=(\n            '.github/workflows/validate-p1-m6a3b2b1-starting-pitcher-history.yml'\n            'docs/P1_M6A3B2B1_MLB_STARTING_PITCHER_HISTORY.md'\n            'scripts/p1-m6a3b2b1-starting-pitcher-backfill.mjs'\n            'server/mlb-market-starting-pitcher-history.test.ts'\n            'server/mlb-market-starting-pitcher-history.ts'\n            'tsconfig.p1-m6a3b2b1-starting-pitcher-history.json'\n          )\n          for file in "${changed[@]}"; do\n            printf '%s\\n' "${allowed[@]}" | grep -Fx -- "$file" >/dev/null || {\n              echo "Unexpected P1-M6A3B2B1 maintenance file: $file" >&2\n              exit 1\n            }\n          done\n          changed_text=$(printf '%s\\n' "${changed[@]}")\n          if grep -Eq '^server/mlb-market-starting-pitcher-history(\\.test)?\\.ts$' <<<"$changed_text"; then\n            grep -Fx 'server/mlb-market-starting-pitcher-history.ts' <<<"$changed_text" >/dev/null\n            grep -Fx 'server/mlb-market-starting-pitcher-history.test.ts' <<<"$changed_text" >/dev/null\n          fi'''
          assert old_scope in y
          wf.write_text(y.replace(old_scope, new_scope, 1))
          PY

          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mlb-market-starting-pitcher-history.ts \
                  server/mlb-market-starting-pitcher-history.test.ts \
                  docs/P1_M6A3B2B1_MLB_STARTING_PITCHER_HISTORY.md \
                  .github/workflows/validate-p1-m6a3b2b1-starting-pitcher-history.yml
          git commit -m 'P1-M6A3B2B1: handle zero-appearance pre-starter listing'
          git push origin HEAD:fix/p1-m6a3b2b1-zero-appearance-starter-order
