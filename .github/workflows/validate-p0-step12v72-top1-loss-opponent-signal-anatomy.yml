name: Validate P0 Step 12V72 TOP1 Loss Opponent Signal Anatomy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'research/p0-step12v72-top1-loss-opponent-signal-anatomy-contract.json'
      - 'scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py'
      - '.github/workflows/validate-p0-step12v72-top1-loss-opponent-signal-anatomy.yml'

permissions:
  contents: read
  actions: read

jobs:
  top1-loss-opponent-signal-anatomy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'

      - name: Prove V72 contract predates scorer
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- research/p0-step12v72-top1-loss-opponent-signal-anatomy-contract.json | tail -1)"
          SCORER_ADD="$(git log --diff-filter=A --format=%H -- scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py | tail -1)"
          test -n "$CONTRACT_ADD"
          test -n "$SCORER_ADD"
          test "$CONTRACT_ADD" != "$SCORER_ADD"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$SCORER_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v72-top1-loss-opponent-signal-anatomy-contract.json'))
          assert c['scientificStatus']=='FROZEN_TOP1_LOSS_OPPONENT_SIGNAL_ANATOMY_BEFORE_ANY_V72_SCORER_EXISTS'
          assert c['frozenParentPortfolio']['name']=='CONFLUENCE_LEDGER_TOP1_T0.550'
          assert c['evaluationWindows']['primary']['id']=='MAY01'
          assert c['evaluationWindows']['primary']['expectedWins']==254
          assert c['evaluationWindows']['primary']['expectedLosses']==138
          assert len(c['directionalOpponentWarningSignalsExactly'])==16
          assert c['statisticsBoundary']['thresholdSearchAllowed'] is False
          assert c['statisticsBoundary']['newLiveVetoMayBeCreatedByV72'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V72_CONTRACT_PRE_SCORER_FREEZE_PROVED')
          PY

      - name: Syntax check V72 scorer
        run: python -m py_compile scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793

      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"; done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY"
          test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Execute frozen V72 TOP1 loss anatomy
        shell: bash
        run: |
          set -euo pipefail
          python scripts/p0-step12v72-top1-loss-opponent-signal-anatomy.py \
            --root inputs/step12v3 \
            --custody '${{ steps.paths.outputs.custody }}' \
            --v16-manifest '${{ steps.paths.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v71-summary research/p0-step12v71-operational-start-window-top1-result-summary.json \
            --contract research/p0-step12v72-top1-loss-opponent-signal-anatomy-contract.json \
            --out work/v72-top1-loss-opponent-signal-anatomy.json

      - name: Validate frozen parity and scientific boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v72-top1-loss-opponent-signal-anatomy.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v72-top1-loss-opponent-signal-anatomy.v1'
          assert r['classification']=='V72_TOP1_LOSS_OPPONENT_SIGNAL_ANATOMY_RETROSPECTIVE_COMPLETE'
          assert r['fullSeasonTop1Parity']=={'opportunities':492,'decisiveRows':488,'wins':311,'losses':177,'pushes':4}
          a=r['primaryMay01']['parentParity']
          assert a=={'eligibleSlateDays':395,'pickDays':395,'wins':254,'losses':138,'pushes':3,'decisiveRows':392}
          b=r['sensitivityMay15']['parentParity']
          assert b=={'eligibleSlateDays':353,'pickDays':353,'wins':227,'losses':123,'pushes':3,'decisiveRows':350}
          assert len(r['primaryMay01']['directionalOpponentWarningSignalAnalysis'])==16
          g=r['guardrails']
          assert g['strictlyPregameSignalsOnly'] is True
          assert g['newSignalAddedAfterInspection'] is False
          assert g['newThresholdSearched'] is False
          assert g['newRouteSearched'] is False
          assert g['historicalPricesUsed'] is False
          assert g['liveVetoCreated'] is False
          assert g['prospectiveV68Changed'] is False
          assert g['productionChanged'] is False
          assert g['positiveEvEstablished'] is False
          assert g['realFinancialExposure']==0
          print(json.dumps({
            'classification':r['classification'],
            'may01RobustWarnings':r['primaryMay01']['predeclaredRobustHistoricalWarningSignals'],
            'may01TopRanking':r['primaryMay01']['directionalSignalRankingByHolmThenAuc'][:8],
            'may15RobustWarnings':r['sensitivityMay15']['predeclaredRobustHistoricalWarningSignals'],
          },indent=2))
          PY

      - name: Upload V72 report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v72-top1-loss-opponent-signal-anatomy
          path: work/v72-top1-loss-opponent-signal-anatomy.json
          if-no-files-found: error
          retention-days: 90
