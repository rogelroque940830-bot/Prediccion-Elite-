name: Temporary NFL UI Map Iterator Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-nfl-ui-map-iterator-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/nfl-manual-date-stats-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/nfl-manual-date-stats-v1
          fetch-depth: 0
      - name: Apply TypeScript compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/client/src/pages/nfl-predictor.tsx')
          text = path.read_text()
          old = 'return [...games.values()].sort((a, b) => (a.kickoff ?? "").localeCompare(b.kickoff ?? "") || a.key.localeCompare(b.key));'
          new = 'return Array.from(games.values()).sort((a, b) => (a.kickoff ?? "").localeCompare(b.kickoff ?? "") || a.key.localeCompare(b.key));'
          if old not in text:
              raise SystemExit('expected Map iterator expression not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/client/src/pages/nfl-predictor.tsx
          git commit -m 'fix(nfl-ui): avoid downlevel Map iterator'
          git push origin HEAD:feature/nfl-manual-date-stats-v1
