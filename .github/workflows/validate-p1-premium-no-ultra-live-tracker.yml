name: Validate P1 PREMIUM No ULTRA Live Tracker

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - '.github/workflows/validate-p1-premium-no-ultra-live-tracker.yml'
      - 'docs/P1_PREMIUM_NO_ULTRA_LIVE_TRACKER.md'
      - 'server/mlb-premium-no-ultra-prospective-routes.ts'
      - 'server/mlb-premium-no-ultra-prospective-routes.test.ts'
      - 'server/route-contract.extensions.json'
      - 'server/routes.ts'
      - 'tsconfig.p1-premium-no-ultra-live-tracker.json'

permissions:
  contents: read

jobs:
  validate-premium-no-ultra-live-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Typecheck owned live-tracker surface
        run: npx tsc -p tsconfig.p1-premium-no-ultra-live-tracker.json
      - name: Run live-tracker route falsification tests
        run: npx tsx --test server/mlb-premium-no-ultra-prospective-routes.test.ts
      - name: Preserve frozen prospective and upstream scientific contracts
        run: |
          npx tsx --test \
            server/mlb-premium-no-ultra-prospective.test.ts \
            server/mlb-p1-economic-review.test.ts \
            server/mlb-p1-operating-envelope.test.ts
      - name: Verify modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend required by S5A
        run: npm run build:backend
      - name: Run S5A real-save regression
        run: npm run test:s5a-e2e
      - name: Run complete S5B shadow regression
        run: npm run test:s5b-shadow
      - name: Verify authenticated owner-scoped GET-only no-money boundary
        shell: bash
        run: |
          set -euo pipefail
          route='server/mlb-premium-no-ultra-prospective-routes.ts'
          docs='docs/P1_PREMIUM_NO_ULTRA_LIVE_TRACKER.md'
          grep -F '"/api/mlb/p1/v1/premium-no-ultra-prospective"' "$route" server/route-contract.extensions.json
          grep -F 'requireInteractiveMlbCaptureSession' "$route"
          grep -F 'ownershipStore.listPredictionIds(userId)' "$route"
          grep -F 'store.getRecord(predictionId)' "$route"
          grep -F 'buildMlbP1M3dEconomicReview(records)' "$route"
          grep -F 'buildMlbPremiumNoUltraProspective(economicReview.rows, records)' "$route"
          grep -F 'PREMIUM_NO_ULTRA_SOURCE_WINDOW_TRUNCATED' "$route" "$docs"
          grep -F 'registerMlbPremiumNoUltraProspectiveRoutes(app)' server/routes.ts
          ! grep -E 'app\.(post|put|patch|delete)\(' "$route"
          ! grep -E 'appendOwnedPrediction|appendOwnedSettlement|appendPrediction|appendSettlement' "$route"
          ! grep -E 'sportsbook|automaticBet|stakeChangesAllowed:[[:space:]]*true|operationalMoneyGateAllowed:[[:space:]]*true' "$route"
      - name: Verify exact seven-file live-tracker scope
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          git diff --check "$base...$head"
          changed=$(git diff --name-only "$base...$head" | sort)
          expected=$(printf '%s\n' \
            '.github/workflows/validate-p1-premium-no-ultra-live-tracker.yml' \
            'docs/P1_PREMIUM_NO_ULTRA_LIVE_TRACKER.md' \
            'server/mlb-premium-no-ultra-prospective-routes.test.ts' \
            'server/mlb-premium-no-ultra-prospective-routes.ts' \
            'server/route-contract.extensions.json' \
            'server/routes.ts' \
            'tsconfig.p1-premium-no-ultra-live-tracker.json' | sort)
          if [[ "$changed" != "$expected" ]]; then
            echo 'PREMIUM no-ULTRA live-tracker scope rejected.' >&2
            printf 'Changed files:\n%s\n' "$changed" >&2
            exit 1
          fi
