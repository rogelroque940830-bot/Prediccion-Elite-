name: Verify NFL UI Production Live

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-nfl-ui-production-live.yml'

permissions:
  contents: read

jobs:
  production-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      FRONTEND_BASE: https://fearless-illumination-production-6d16.up.railway.app
      BACKEND_BASE: https://web-production-7067b.up.railway.app
      EXPECTED_COMMIT: 44d44520fbf9edc8af70a6f12c1519a48ca531e7
    steps:
      - name: Verify exact backend main deployment
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "${BACKEND_BASE}/health" -o /tmp/nfl-ui-health.json
          status=$(node -e "const j=require('/tmp/nfl-ui-health.json');process.stdout.write(String(j.status||''))")
          commit=$(node -e "const j=require('/tmp/nfl-ui-health.json');process.stdout.write(String(j.commit||''))")
          environment=$(node -e "const j=require('/tmp/nfl-ui-health.json');process.stdout.write(String(j.environment||''))")
          echo "status=${status} commit=${commit} environment=${environment}"
          [[ "${status}" == "healthy" && "${commit}" == "${EXPECTED_COMMIT}" && "${environment}" == "production" ]]
          echo "NFL_UI_BACKEND_EXACT_MAIN_VERIFIED"

      - name: Verify redesigned NFL frontend bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 "${FRONTEND_BASE}/" -o /tmp/nfl-ui-index.html
          asset=$(grep -oE 'src="[^"]+\.js"' /tmp/nfl-ui-index.html | head -1 | sed -E 's/^src="([^"]+)"$/\1/' || true)
          echo "asset=${asset}"
          [[ -n "${asset}" ]] || { echo "FAIL: no JS asset found" >&2; exit 1; }
          if [[ "${asset}" == http* ]]; then
            bundle_url="${asset}"
          elif [[ "${asset}" == /* ]]; then
            bundle_url="${FRONTEND_BASE}${asset}"
          else
            clean_asset="${asset#./}"
            bundle_url="${FRONTEND_BASE}/${clean_asset}"
          fi
          echo "bundle_url=${bundle_url}"
          curl --fail --silent --show-error --max-time 45 "${bundle_url}" -o /tmp/nfl-ui-bundle.js
          grep -Fq 'Mejores jugadas NFL' /tmp/nfl-ui-bundle.js
          grep -Fq 'Cartelera de la semana' /tmp/nfl-ui-bundle.js
          grep -Fq 'Detalles técnicos del motor NFL' /tmp/nfl-ui-bundle.js
          grep -Fq 'JUGADA ELITE' /tmp/nfl-ui-bundle.js
          grep -Fq 'NO BET' /tmp/nfl-ui-bundle.js
          echo "NFL_UI_REDESIGN_PRODUCTION_BUNDLE_VERIFIED"

      - name: Verify NFL engine remains FULL_READY after UI deploy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "${BACKEND_BASE}/api/nfl/elite/status" -o /tmp/nfl-ui-status.json
          node - <<'NODE'
          const fs = require('fs');
          const j = JSON.parse(fs.readFileSync('/tmp/nfl-ui-status.json','utf8'));
          if (j.success !== true || j.code !== 'NFL_ELITE_FULL_READY' || j.data?.state !== 'FULL_READY') {
            throw new Error(`NFL engine not FULL_READY after UI deployment: ${j.code}/${j.data?.state}`);
          }
          if (j.data?.coreReady !== true || j.data?.lateDownEnabled !== true) throw new Error('NFL certified routes changed');
          console.log('NFL_UI_ENGINE_UNCHANGED_FULL_READY');
          NODE

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfl-ui-production-live-verification
          path: |
            /tmp/nfl-ui-health.json
            /tmp/nfl-ui-index.html
            /tmp/nfl-ui-status.json
          if-no-files-found: warn
          retention-days: 30
