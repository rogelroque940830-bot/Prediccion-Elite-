name: Smoke frontend MLB C2D

on:
  pull_request:
    branches:
      - integration/p0-frontend-session

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public C2D bundle
        shell: bash
        env:
          FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 36); do
            # The application uses hash routing. Load the root document, then inspect
            # its compiled JavaScript assets for the C2D panel and endpoint.
            curl --fail --silent --show-error "$FRONTEND_URL/" > /tmp/index.html || true
            grep -oE 'src="[^"]+\.js"' /tmp/index.html | sed -E 's/src="([^"]+)"/\1/' > /tmp/assets.txt || true
            : > /tmp/bundle.js
            while IFS= read -r asset; do
              [ -n "$asset" ] || continue
              if [[ "$asset" == http* ]]; then url="$asset"; else url="$FRONTEND_URL$asset"; fi
              curl --fail --silent --show-error "$url" >> /tmp/bundle.js || true
            done < /tmp/assets.txt
            if grep -q 'Cuota de cierre y CLV' /tmp/bundle.js \
              && grep -q 'closing-lines?limit=10000' /tmp/bundle.js \
              && grep -q 'Pick anterior a C2D' /tmp/bundle.js \
              && grep -q 'Esperando ventana automática de captura' /tmp/bundle.js; then
              success=1
              break
            fi
            echo "Attempt $attempt: C2D bundle not visible yet"
            sleep 10
          done
          test "$success" = 1
