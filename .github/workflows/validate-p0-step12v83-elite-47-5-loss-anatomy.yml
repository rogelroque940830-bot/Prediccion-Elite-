name: Validate P0 Step 12V83 Elite 47-5 Loss Anatomy

on:
  pull_request:
    paths:
      - 'research/p0-step12v83-elite-47-5-loss-anatomy-contract.json'
      - 'scripts/p0-step12v83-elite-47-5-loss-anatomy.py'
      - '.github/workflows/validate-p0-step12v83-elite-47-5-loss-anatomy.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  historical-loss-anatomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'scipy==1.15.3'

      - name: Prove V83 plan predates V83 scorer
        shell: bash
        run: |
          set -euo pipefail
          C='research/p0-step12v83-elite-47-5-loss-anatomy-contract.json'
          S='scripts/p0-step12v83-elite-47-5-loss-anatomy.py'
          CADD="$(git log --diff-filter=A --format=%H -- "$C" | tail -1)"
          SADD="$(git log --diff-filter=A --format=%H -- "$S" | tail -1)"
          test -n "$CADD" && test -n "$SADD" && test "$CADD" != "$SADD"
          git merge-base --is-ancestor "$CADD" "$SADD"
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v83-elite-47-5-loss-anatomy-contract.json'))
          assert c['scientificStatus']=='FROZEN_47_5_LOSS_ANATOMY_PLAN_BEFORE_ANY_V83_SCORER_EXISTS'
          t=c['targetCohortExactly']
          assert (t['expectedDecisiveRows'],t['expectedWins'],t['expectedLosses'])==(52,47,5)
          assert c['predeclaredDiagnostics']['noCombinationSearch'] is True
          assert c['statisticsBoundary']['newThresholdSearchAllowed'] is False
          assert c['statisticsBoundary']['multiSignalCombinationSearchAllowed'] is False
          assert c['statisticsBoundary']['promoteRetrospectiveWarningToVetoAllowed'] is False
          assert c['decisionBoundary']['v80Changed'] is False
          assert c['decisionBoundary']['realFinancialExposure']==0
          print('V83_FREEZE_FIRST_PLAN_PROVED')
          PY

      - name: Syntax check
        run: python -m py_compile scripts/p0-step12v83-elite-47-5-loss-anatomy.py

      - name: Download immutable Step12V3 historical universe
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: inputs/step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059

      - name: Download immutable V66 pre-outcome custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v66-game-horizon-exposure-custody
          path: inputs/v66-custody
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31962659793

      - name: Download immutable V16 control manifest
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: inputs/v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Resolve immutable inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for S in 2024 2025 2026_YTD; do
            test -s "inputs/step12v3/$S/game-anatomy-feature-table.json"
            test -s "inputs/step12v3/$S/cohort/official-acquisition.json"
          done
          CUSTODY="$(find inputs/v66-custody -type f \( -name '*.jsonl.gz' -o -name '*custody*.gz' \) -print -quit)"
          V16="$(find inputs/v16 -type f -name pure-settlement-model-manifest.json -print -quit)"
          test -n "$CUSTODY" && test -n "$V16"
          echo "custody=$CUSTODY" >> "$GITHUB_OUTPUT"
          echo "v16=$V16" >> "$GITHUB_OUTPUT"

      - name: Execute frozen V83 five-loss anatomy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          python scripts/p0-step12v83-elite-47-5-loss-anatomy.py \
            --root inputs/step12v3 \
            --custody '${{ steps.inputs.outputs.custody }}' \
            --v16-manifest '${{ steps.inputs.outputs.v16 }}' \
            --v68-contract research/p0-step12v68-fg-winner-prospective-confirmation-contract.json \
            --classifier-source server/mlb-frozen-a-plus-classifier.ts \
            --router-source server/mlb-frozen-research-route-assessor.ts \
            --v69-contract research/p0-step12v69-confluence-frequency-quality-frontier-contract.json \
            --v69-scorer scripts/p0-step12v69-confluence-frequency-quality-frontier.py \
            --v79-contract research/p0-step12v79-dynamic-team-strength-route-threat-regimes-contract.json \
            --v79-scorer scripts/p0-step12v79-dynamic-team-strength-route-threat-regimes.py \
            --v82-contract research/p0-step12v82-general-x-premium-a-contract.json \
            --v82-scorer scripts/p0-step12v82-general-x-premium-a.py \
            --contract research/p0-step12v83-elite-47-5-loss-anatomy-contract.json \
            --out work/v83-elite-47-5-loss-anatomy.json

      - name: Enforce V83 integrity and print loss anatomy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('work/v83-elite-47-5-loss-anatomy.json'))
          assert r['classification']=='V83_ELITE_47_5_LOSS_ANATOMY_RETROSPECTIVE_COMPLETE'
          assert r['targetParity']=={'decisiveRows':52,'wins':47,'losses':5}
          assert len(r['lossCases'])==5
          i=r['integrity']
          assert i['retrospectiveOnly'] is True
          assert i['refitPerformed'] is False
          assert i['recalibrationPerformed'] is False
          assert i['newFeatureSearchPerformed'] is False
          assert i['newThresholdSearchPerformed'] is False
          assert i['multiSignalCombinationSearchPerformed'] is False
          assert i['warningPromotedToVeto'] is False
          assert i['v80Changed'] is False
          assert i['realFinancialExposure']==0
          print(json.dumps({
            'targetParity':r['targetParity'],
            'bySeason':r['bySeason'],
            'headline':r['headline'],
            'lossCases':[
              {
                'date':x['date'], 'gamePk':x['gamePk'],
                'selectedTeamId':x['selectedTeamId'], 'opponentTeamId':x['opponentTeamId'],
                'extremeWinReferenceTails':x['extremeWinReferenceTails'],
                'categorical':x['categorical']
              } for x in r['lossCases']
            ],
            'simpleWarningCandidates':r['simpleWarningCandidates'][:12],
            'topContinuousByLossAuc':sorted(
              [dict(signal=k,**v) for k,v in r['continuousSignalAnalysis'].items() if v.get('lossWarningAucBestOrientation') is not None],
              key=lambda x:(-x['lossWarningAucBestOrientation'],x['signal'])
            )[:12]
          },indent=2))
          PY

      - name: Upload V83 loss anatomy report
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v83-elite-47-5-loss-anatomy
          path: work/v83-elite-47-5-loss-anatomy.json
          if-no-files-found: error
          retention-days: 90
