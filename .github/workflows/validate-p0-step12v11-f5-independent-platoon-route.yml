name: Validate P0 Step 12V11 F5 Independent Platoon Route

on:
  pull_request:
    branches:
      - research/p0-step12v10-platoon-precision-volume-frontier
    paths:
      - 'research/p0-step12v11-f5-independent-platoon-route-contract.json'
      - 'scripts/p0-step12v11-f5-independent-platoon-route.py'
      - '.github/workflows/validate-p0-step12v11-f5-independent-platoon-route.yml'

permissions:
  contents: read
  actions: read

jobs:
  f5-independent-platoon-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check 'scipy==1.18.0'
      - name: Validate frozen V11 contract
        run: |
          python - <<'PY'
          import json
          c=json.load(open('research/p0-step12v11-f5-independent-platoon-route-contract.json'))
          assert c['schemaVersion']=='courtedge-p0-step12v11-f5-independent-platoon-route-contract.v1'
          assert c['population']['expectedSelectedRows']==79
          assert c['population']['expectedDecisiveRows']==67
          assert len(c['predeclaredCohorts'])==6
          assert c['rollingPlatoon']['noNumericThresholdSearch'] is True
          assert c['statistics']['noAdditionalCohortsAfterResults'] is True
          assert c['volumePolicy']['doNotChooseByHitRateAlone'] is True
          assert c['policy']['liveFilterChangeAllowed'] is False
          assert c['policy']['betEliteAllowed'] is False
          print('STEP12V11_CONTRACT_LOCKED')
          PY
      - name: Syntax check
        run: python -m py_compile scripts/p0-step12v11-f5-independent-platoon-route.py
      - name: Download canonical Step 12V3 evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v3-expanded-regimes
          path: artifacts/p0-step12v3
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31659518059
      - name: Download frozen Step 12V7 route evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v7-f5-elite-route-anatomy
          path: artifacts/p0-step12v7
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31665659665
      - name: Download Step 12V9 season hand-split packs
        uses: actions/download-artifact@v4
        with:
          pattern: p0-step12v9-hand-splits-*
          path: artifacts/p0-step12v9-splits
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31666803576
      - name: Validate parent evidence
        run: |
          for s in 2024 2025 2026_YTD; do
            test -s "artifacts/p0-step12v3/${s}/game-anatomy-feature-table.json"
            test -s "artifacts/p0-step12v3/${s}/cohort/pregame-lineup-history.json"
            test -s "artifacts/p0-step12v9-splits/hand-splits-${s}.json"
          done
          test -s artifacts/p0-step12v7/f5-route-report.json
          test -s research/p0-step12v6-a-team5-rest-cross-anatomy-contract.json
      - name: Run frozen V11 independent route study
        run: |
          mkdir -p artifacts/p0-step12v11
          python scripts/p0-step12v11-f5-independent-platoon-route.py \
            --root artifacts/p0-step12v3 \
            --v7-report artifacts/p0-step12v7/f5-route-report.json \
            --split-dir artifacts/p0-step12v9-splits \
            --a-contract research/p0-step12v6-a-team5-rest-cross-anatomy-contract.json \
            --contract research/p0-step12v11-f5-independent-platoon-route-contract.json \
            --out artifacts/p0-step12v11/f5-independent-platoon-route-report.json \
            --workers 6
      - name: Validate evidence boundary
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/p0-step12v11/f5-independent-platoon-route-report.json'))
          assert r['schemaVersion']=='courtedge-p0-step12v11-f5-independent-platoon-route.v1'
          assert r['originalFrozenBaseline']['selectedRows']==79
          assert r['originalFrozenBaseline']['decisiveRows']==67
          assert r['originalFrozenBaseline']['wins']==49
          assert r['originalFrozenBaseline']['losses']==18
          assert len(r['cohorts'])==6
          assert len(r['inferentialTests'])==6
          assert r['policy']['liveFilterChangeAllowed'] is False
          assert r['policy']['rankingChangeAllowed'] is False
          assert r['policy']['stakeChangeAllowed'] is False
          assert r['policy']['betEliteAllowed'] is False
          print(json.dumps({'classification':r['classification'],'baseline':r['originalFrozenBaseline'],'eligible':r['eligibleBaseline'],'coverage':r['coverage'],'pareto':r['paretoEfficientCohorts'],'cohorts':r['cohorts'],'tests':r['inferentialTests']},indent=2))
          PY
      - name: Preserve live regressions
        run: |
          npm ci
          npx tsx --test server/mlb-operating-envelope-calibration.test.ts
          npx tsx --test server/mlb-elite-evidence-ledger.test.ts
          npm run build:backend
      - name: Upload V11 evidence
        uses: actions/upload-artifact@v4
        with:
          name: p0-step12v11-f5-independent-platoon-route
          path: artifacts/p0-step12v11/
          if-no-files-found: error
          retention-days: 30
