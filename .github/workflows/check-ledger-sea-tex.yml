name: Check MLB ledger after SEA TEX save

on:
  push:
    branches:
      - test/check-ledger-sea-tex-2026-07-27

permissions:
  contents: read

jobs:
  inspect-ledger:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://web-p0-integration.up.railway.app
    steps:
      - name: Fetch ledger status
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$BACKEND_URL/api/mlb/ledger/v1/status" | tee /tmp/status.json
          jq -e '.success == true' /tmp/status.json >/dev/null
          echo "Predictions: $(jq -r '.data.predictions' /tmp/status.json)"
          echo "Settlement events: $(jq -r '.data.settlementEvents' /tmp/status.json)"
          echo "Latest prediction at: $(jq -r '.data.latestPredictionAt' /tmp/status.json)"
