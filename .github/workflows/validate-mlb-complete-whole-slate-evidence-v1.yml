name: Validate MLB Complete Whole-Slate Evidence V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/mlb-p1-daily-slate.ts'
      - 'server/mlb-p1-daily-slate.test.ts'
      - 'server/mlb-unified-v16-live-providers.ts'
      - 'server/mlb-unified-v16-whole-slate-evidence.test.ts'
      - 'server/mlb-shortlist.ts'
      - '.github/workflows/validate-mlb-complete-whole-slate-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Test P1 lineup custody and whole-slate evidence matrix
        run: |
          npx tsx --test \
            server/mlb-p1-daily-slate.test.ts \
            server/mlb-unified-v16-whole-slate-evidence.test.ts \
            server/mlb-whole-slate-sporting-finalization-v1.test.ts
      - name: Bundle-check evidence providers
        run: |
          npx esbuild server/mlb-p1-daily-slate.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-p1-daily-slate.mjs
          npx esbuild server/mlb-unified-v16-live-providers.ts --bundle --platform=node --format=esm --outfile=/tmp/mlb-whole-slate-evidence.mjs
      - name: Build production backend
        run: npm run build:backend
      - name: Diff integrity
        run: git diff --check origin/main...HEAD
