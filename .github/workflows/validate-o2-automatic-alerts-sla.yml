name: Validate O2 Automatic Alerts and SLA

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/operational-sla-alerts.ts'
      - 'server/operational-sla-alerts.test.ts'
      - 'server/operational-sla-alert-routes.ts'
      - 'server/operational-sla-alert-worker.ts'
      - 'server/index.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.o2-automatic-alerts-sla.json'
      - 'docs/O2_AUTOMATIC_ALERTS_AND_SLA.md'
      - '.github/workflows/validate-o2-automatic-alerts-sla.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-o2-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused O2 typecheck
        run: npx tsc -p tsconfig.o2-automatic-alerts-sla.json
      - name: Run focused O2 tests
        run: npx tsx --test server/operational-sla-alerts.test.ts
      - name: Verify backend route contract
        run: npm run test:s3-modularization
      - name: Run operations regressions
        run: npm run test:s4-operations
      - name: Run O1 incident-center regressions
        run: npx tsx --test server/operational-incident-center.test.ts
      - name: Run shadow regressions
        run: npm run test:s5b-shadow
      - name: Build production backend
        run: npm run build:backend
      - name: Verify observe-only and append-only safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mode: "OBSERVE_ONLY"' server/operational-sla-alerts.ts
          grep -F 'readOnly: true' server/operational-sla-alerts.ts
          grep -F 'realFinancialExposure: 0' server/operational-sla-alerts.ts
          grep -F 'automaticSettlementRetry: false' server/operational-sla-alerts.ts
          grep -F 'historicalLedgerMutation: false' server/operational-sla-alerts.ts
          grep -F 'fs.appendFileSync' server/operational-sla-alerts.ts
          grep -F 'app.post(' server/operational-sla-alert-routes.ts
          grep -F 'requireGlobalWorkerRole' server/operational-sla-alert-routes.ts
          ! grep -E 'appendSettlement|appendPrediction|automaticBetPlacement: true|historicalLedgerMutation: true|automaticSettlementRetry: true' server/operational-sla-alert*.ts
          ! grep -E 'fs\.(writeFileSync|renameSync|unlinkSync|rmSync)' server/operational-sla-alerts.ts
      - name: Diff hygiene
        run: git diff --check
