name: Apply MLB Full Snapshot Patch

on:
  push:
    branches:
      - integration/mlb-ledger-full-snapshot
    paths:
      - 'scripts/apply-mlb-full-snapshot.py'
      - '.github/workflows/mlb-full-snapshot-apply.yml'
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/apply-mlb-full-snapshot.py'
      - '.github/workflows/mlb-full-snapshot-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: integration/mlb-ledger-full-snapshot
          fetch-depth: 0

      - name: Detect already-applied commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[snapshot-applied\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Patch already applied on branch head"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node 20
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Apply reproducible patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/apply-mlb-full-snapshot.py

      - name: Align mapper with validated Picks V2 inference
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          mapper = Path('server/mlb-scientific-snapshot.ts')
          mapper_text = mapper.read_text(encoding='utf-8')
          old_sport = '  sport: "mlb" | "nba" | "nhl" | "wnba";'
          new_sport = '  sport?: "mlb" | "nba" | "nhl" | "wnba";'
          if old_sport in mapper_text:
              mapper_text = mapper_text.replace(old_sport, new_sport, 1)
          elif new_sport not in mapper_text:
              raise SystemExit('SavedMlbPickLike sport declaration not found')
          mapper.write_text(mapper_text, encoding='utf-8')

          picks = Path('server/picks-v2.ts')
          picks_text = picks.read_text(encoding='utf-8')
          old_call = 'getMlbLedgerStore().appendPrediction(buildMlbLedgerPredictionFromPick(pick));'
          new_call = 'getMlbLedgerStore().appendPrediction(buildMlbLedgerPredictionFromPick(pick as Parameters<typeof buildMlbLedgerPredictionFromPick>[0]));'
          if old_call in picks_text:
              picks_text = picks_text.replace(old_call, new_call, 1)
          elif new_call not in picks_text:
              raise SystemExit('Validated Picks V2 snapshot append call not found')
          picks.write_text(picks_text, encoding='utf-8')
          PY

      - name: Install backend dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Type-check ledger and snapshot mapper
        id: snapshot_typecheck
        if: steps.guard.outputs.skip != 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck:mlb-ledger 2>&1 | tee mlb-full-snapshot-typecheck.txt

      - name: Upload typecheck diagnostics
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mlb-full-snapshot-typecheck
          path: mlb-full-snapshot-typecheck.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce typecheck
        if: steps.snapshot_typecheck.outcome == 'failure'
        run: exit 1

      - name: Test ledger and snapshot mapper
        if: steps.guard.outputs.skip != 'true'
        run: npm run test:mlb-ledger

      - name: Build backend
        if: steps.guard.outputs.skip != 'true'
        run: npm run build:backend

      - name: Install frontend dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run check

      - name: Build frontend
        if: steps.guard.outputs.skip != 'true'
        working-directory: frontend
        run: npm run build

      - name: Commit validated integration
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "courtedge-ci"
          git config user.email "courtedge-ci@users.noreply.github.com"
          git add \
            frontend/client/src/lib/picks-api.ts \
            frontend/client/src/lib/context.tsx \
            frontend/client/src/pages/mlb-predictor.tsx \
            server/mlb-scientific-snapshot.ts \
            server/picks-v2.ts \
            package.json \
            tsconfig.mlb-ledger.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(mlb): connect full scientific snapshot to ledger [snapshot-applied]"
          git push origin HEAD:integration/mlb-ledger-full-snapshot
