name: Court Edge P0 Security Remediation

on:
  workflow_dispatch:
  push:
    branches:
      - security/p0-remediation
    paths:
      - 'server/**'
      - 'scripts/p0-sanitize-routes.py'
      - '.github/workflows/p0-security-remediation.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  sanitize-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout P0 branch
        uses: actions/checkout@v4
        with:
          ref: security/p0-remediation
          fetch-depth: 0

      - name: Remove hardcoded provider-key fallbacks
        run: python3 scripts/p0-sanitize-routes.py

      - name: Verify no provider-key literal remains
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path('server/routes.ts').read_text(encoding='utf-8')
          checks = {
              'Odds API key literal': r'ODDS_API_KEY(?:_BG)?\s*=.*["\'][0-9a-fA-F]{24,}["\']',
              'BDL key literal': r'BDL_KEY\s*=.*["\'][0-9a-fA-F-]{30,}["\']',
          }
          failed = [name for name, pattern in checks.items() if re.search(pattern, text)]
          if failed:
              print('FAIL:', ', '.join(failed))
              sys.exit(1)
          print('PASS: provider-key fallbacks removed from current source')
          PY

      - name: Commit sanitized source to isolated branch
        run: |
          if git diff --quiet -- server/routes.ts; then
            echo 'No routes.ts sanitation commit required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add server/routes.ts
            git commit -m 'security(p0): remove hardcoded provider credentials'
            git push origin HEAD:security/p0-remediation
          fi

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install backend dependencies reproducibly
        run: npm ci

      - name: Build backend
        run: npm run build:backend

      - name: Verify required P0 controls are present
        run: |
          grep -q 'restrictedCors' server/index.ts
          grep -q 'apiRateLimit' server/index.ts
          grep -q 'requireWriteAuth' server/index.ts
          grep -q 'COURTEDGE_WRITE_TOKEN' server/security.ts
          grep -q 'ALLOW_LEGACY_PICKS_SYNC' server/security.ts
          echo 'PASS: P0 middleware controls detected'
