name: MLB V16 C4 Selected-Side Probability Qualification

on:
  push:
    branches:
      - research/mlb-v16-selected-side-probability-v1
    paths:
      - "research/MLB_V16_C4_SELECTED_SIDE_PROBABILITY_QUALIFICATION_CONTRACT.json"
      - "research/mlb/mlb_v16_c4_selected_side_probability_qualification.py"
      - ".github/workflows/mlb-v16-c4-selected-side-probability-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CONTRACT: research/MLB_V16_C4_SELECTED_SIDE_PROBABILITY_QUALIFICATION_CONTRACT.json
  EVALUATOR: research/mlb/mlb_v16_c4_selected_side_probability_qualification.py

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout isolated qualification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned numerical dependencies
        run: python -m pip install --disable-pip-version-check "numpy==2.4.2" "scipy==1.17.0"

      - name: Prove contract freeze predates evaluator
        shell: bash
        run: |
          set -euo pipefail
          CONTRACT_ADD="$(git log --diff-filter=A --format=%H -- "$CONTRACT" | tail -1)"
          EVALUATOR_ADD="$(git log --diff-filter=A --format=%H -- "$EVALUATOR" | tail -1)"
          test "$CONTRACT_ADD" = "10bb342b7f021ebe6eb1223589de813c7654affc"
          test "$EVALUATOR_ADD" = "a32f37fcbb166e0a6eaa45d61ed55ecf2b0fc575"
          git merge-base --is-ancestor "$CONTRACT_ADD" "$EVALUATOR_ADD"
          python - <<'PY'
          import json
          c=json.load(open('research/MLB_V16_C4_SELECTED_SIDE_PROBABILITY_QUALIFICATION_CONTRACT.json'))
          assert c['schemaVersion']=='courtedge-mlb-v16-c4-selected-side-probability-qualification-contract.v1'
          assert c['frozenBeforeQualificationEvaluation'] is True
          assert c['crossSportSemantic']['marketConcept']=='FULL_GAME_WINNER_ONLY'
          assert c['crossSportSemantic']['first5Excluded'] is True
          assert c['frozenProbabilityMapping']['freeParameters']==0
          assert c['sourceCustody']['requiredCombinedEvaluationRows']==6610
          assert c['v16FrozenAuthority']['manifestCanonicalSha256']=='059f84a7bf644eece80b40f772d5a0c92a188849012eadf7bbf17f93532b8cbb'
          assert c['statisticalQualification']['calibrationInTheLarge']['twoSidedCriticalAbsZ']==1.959963984540054
          assert c['statisticalQualification']['identityAffineLikelihoodRatio']['rejectIdentityIfPValueBelow']==0.05
          assert c['statisticalQualification']['preExistingV16FrozenGates']['combinedEce10Max']==0.05
          print('MLB_V16_C4_QUALIFICATION_CONTRACT_FREEZE_PROVED')
          PY

      - name: Download immutable winner-anatomy source custody
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v-winner-anatomy-walkforward
          path: artifacts/p0-step12v
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31649438822

      - name: Download frozen V16 probability evidence
        uses: actions/download-artifact@v4
        with:
          name: p0-step12v16-pure-ml-f5-settlement-probability
          path: artifacts/p0-step12v16
          github-token: ${{ github.token }}
          repository: rogelroque940830-bot/Prediccion-Elite-
          run-id: 31704085189

      - name: Syntax check frozen evaluator
        run: python -m py_compile "$EVALUATOR"

      - name: Run frozen V16 C4 selected-side probability qualification
        run: |
          rm -rf artifacts/mlb-v16-cross-sport-qualification
          python "$EVALUATOR" \
            --root artifacts/p0-step12v \
            --v16-evidence artifacts/p0-step12v16 \
            --contract "$CONTRACT" \
            --out-dir artifacts/mlb-v16-cross-sport-qualification

      - name: Validate evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='artifacts/mlb-v16-cross-sport-qualification/mlb-v16-c4-selected-side-probability-qualification-summary.json'
          a='artifacts/mlb-v16-cross-sport-qualification/mlb-v16-c4-selected-side-probability-qualification-audit.json'
          s=json.load(open(p)); audit=json.load(open(a))
          assert s['rows']==6610
          assert s['first5CrossSportProbabilityAuthorized'] is False
          assert s['globalEliteRankerStillBlocked'] is True
          assert audit['selectionRulesChanged'] is False
          assert audit['featuresChanged'] is False
          assert audit['calibrationChanged'] is False
          assert audit['thresholdsChanged'] is False
          assert audit['routingChanged'] is False
          assert audit['rankingChanged'] is False
          assert audit['v68Changed'] is False
          assert audit['sportsbookPricesRead'] is False
          assert audit['marketOddsRead'] is False
          assert audit['historicalHitRateUsedAsProbability'] is False
          assert audit['alternativeAffineFitUsedForPrediction'] is False
          assert audit['crossSportPoolingPerformed'] is False
          assert audit['globalEliteRankingPerformed'] is False
          assert audit['realFinancialExposure']==0
          print(json.dumps({
            'classification':s['classification'],
            'allMandatoryGatesPassed':s['allMandatoryGatesPassed'],
            'rowsetSha256':s['rowsetSha256'],
            'gates':s['gates'],
            'combined':s['combined']
          },indent=2,sort_keys=True))
          PY

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-v16-c4-selected-side-probability-qualification
          path: artifacts/mlb-v16-cross-sport-qualification/
          if-no-files-found: error
          retention-days: 90
