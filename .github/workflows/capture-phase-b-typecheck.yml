name: Capture Phase B frontend typecheck

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-injury-phase-b-auto
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture exact frontend diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-mlb-injury-phase-b.py
          cd frontend
          npm ci >/dev/null 2>&1
          set +e
          npm run check > ../phase-b-frontend-typecheck.txt 2>&1
          code=$?
          set -e
          cd ..
          cat phase-b-frontend-typecheck.txt
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f phase-b-frontend-typecheck.txt
          git commit -m 'test: save Phase B frontend diagnostic [skip ci]'
          git push origin HEAD:feature/mlb-injury-phase-b-auto
          exit "$code"
