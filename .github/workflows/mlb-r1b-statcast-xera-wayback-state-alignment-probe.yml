name: MLB R1B Statcast xERA Wayback State-Alignment Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/mlb-unified-sporting-authority-r1
    paths:
      - scripts/mlb-r1b-statcast-xera-wayback-state-alignment-probe.ts
      - .github/workflows/mlb-r1b-statcast-xera-wayback-state-alignment-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - run: npm ci

      - name: Align official Savant archive anchors to date-bounded Statcast states
        run: |
          mkdir -p artifacts/mlb-r1b-statcast-xera-wayback-state-alignment-probe
          npx tsx scripts/mlb-r1b-statcast-xera-wayback-state-alignment-probe.ts \
            --out=artifacts/mlb-r1b-statcast-xera-wayback-state-alignment-probe/evidence.json

      - name: Enforce no-leakage state-alignment boundary
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/mlb-r1b-statcast-xera-wayback-state-alignment-probe/evidence.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/mlb-r1b-statcast-xera-wayback-state-alignment-probe/evidence.json';
          const e=JSON.parse(fs.readFileSync(p,'utf8'));
          if(e.status!=='WAYBACK_PRIMARY_XERA_TO_DATE_BOUNDED_STATCAST_STATE_ALIGNMENT_PROBE_ONLY_NOT_PARITY_CERTIFICATION') throw new Error('status');
          if(e.family!=='STATCAST_QUALITY') throw new Error('family');
          if(e.sourceAuthority?.canonicalPublisherHost!=='baseballsavant.mlb.com') throw new Error('publisher');
          if(e.sourceAuthority?.archiveTransportIsPublisher!==false) throw new Error('archive authority');
          if(e.sourceAuthority?.archivedPayloadIsReplayOfPrimaryPublisherSurface!==true) throw new Error('truth anchor');
          if(e.alignmentPolicy?.playerIdentityRequired!==true) throw new Error('identity');
          if(e.alignmentPolicy?.paExactRequired!==true) throw new Error('pa');
          if(e.alignmentPolicy?.displayedXwobaThreeDecimalExactRequired!==true) throw new Error('xwoba');
          if(e.alignmentPolicy?.xeraExcludedFromCutoffSelection!==true) throw new Error('xera leakage');
          if(e.alignmentPolicy?.uniqueExactCandidateRequiredForCutoffSemantics!==true) throw new Error('uniqueness');
          if(e.alignmentPolicy?.noInterpolationBetweenArchiveSnapshots!==true) throw new Error('interpolation');
          if(e.alignmentPolicy?.noEmpiricalXeraFitAuthorized!==true) throw new Error('empirical fit');
          if(e.alignmentPolicy?.approximationForbidden!==true) throw new Error('approximation');
          if(!Array.isArray(e.anchors)||e.anchors.length!==2) throw new Error('anchor coverage');
          if(e.anchors.some(a=>a.cutoffSelectionUsesXera!==false)) throw new Error('cutoff leakage');
          if(e.scientificConclusion?.xeraUsedToSelectCutoff!==false) throw new Error('conclusion leakage');
          if(e.summary?.exactSavantProductionConversionProven!==false) throw new Error('premature mechanism');
          if(e.summary?.exactTargetDateXeraCustodyForFullUniverseProven!==false) throw new Error('premature custody');
          if(e.summary?.familyPromotionAuthorized!==false) throw new Error('premature promotion');
          const b=e.scientificBoundary;
          if(b?.researchOnly!==true||b?.productionChanged!==false||b?.weightsChanged!==false||b?.routingChanged!==false||b?.stakingChanged!==false||b?.betEliteChanged!==false||b?.marketPricesRead!==false||b?.targetOutcomeReadForModeling!==false||b?.automaticBetPlacementAllowed!==false||b?.realFinancialExposure!==0||b?.r1b2Authorized!==false) throw new Error('scientific boundary');
          NODE

      - name: Static no-production-write boundary
        shell: bash
        run: |
          set -euo pipefail
          src=scripts/mlb-r1b-statcast-xera-wayback-state-alignment-probe.ts
          ! grep -E 'appendPrediction\(|appendSettlement\(|BET_ELITE|autobet|automaticBetPlacement[^\n]*true|realFinancialExposure[^\n]*[1-9]' "$src"
          grep -F 'xeraExcludedFromCutoffSelection: true' "$src"
          grep -F 'noInterpolationBetweenArchiveSnapshots: true' "$src"
          grep -F 'noEmpiricalXeraFitAuthorized: true' "$src"
          grep -F 'familyPromotionAuthorized: false' "$src"

      - name: Backend build regression
        run: npm run build:backend

      - name: Upload state-alignment evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlb-r1b-statcast-xera-wayback-state-alignment-probe
          path: artifacts/mlb-r1b-statcast-xera-wayback-state-alignment-probe/evidence.json
          if-no-files-found: error
          retention-days: 30
