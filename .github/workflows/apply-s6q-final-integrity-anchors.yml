name: Apply S6Q Final Integrity Anchors

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'scripts/patch-s6q-final-integrity-anchors.mjs'
      - '.github/workflows/apply-s6q-final-integrity-anchors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Normalize initial and refreshed worker option anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-s6q-final-integrity-anchors.mjs')
          source = path.read_text()
          start = source.index('const workerOptionsBefore =')
          end = source.index('fs.writeFileSync(servicePath, service);', start)
          replacement = r'''for (const indent of ["          ", "            "]) {
            const before = `${indent}previousBaselinePresent: previous?.stability.baselinePresent ?? false,\n${indent}previousEvidencePresent: previous?.stability.evidencePresent ?? false,\n${indent}previousReportReadError: previousArtifact.error,`;
            const after = `${indent}previousBaselinePresent: previous?.stability.baselinePresent ?? false,\n${indent}previousEvidencePresent: previous?.stability.evidencePresent ?? false,\n${indent}previousBaselineEverObserved: previous?.stability.baselineEverObserved ?? previous?.stability.baselinePresent ?? false,\n${indent}previousEvidenceEverObserved: previous?.stability.evidenceEverObserved ?? previous?.stability.evidencePresent ?? false,\n${indent}previousBaselineFirstObservedAtAnchor: previous?.stability.baselineFirstObservedAtAnchor ?? previous?.stability.firstObservedAt ?? null,\n${indent}previousBaselineDigestAnchorSha256: previous?.stability.baselineDigestAnchorSha256 ?? null,\n${indent}previousEvidenceDigestAnchorSha256: previous?.stability.evidenceDigestAnchorSha256 ?? null,\n${indent}previousReportReadError: previousArtifact.error,\n${indent}s6kReportReadError: s6kCertification.error,`;
            if (!service.includes(before)) throw new Error(`Missing worker options anchor for indent ${indent.length}`);
            service = service.replace(before, after);
          }

          '''
          path.write_text(source[:start] + replacement + source[end:])
          PY
      - name: Apply final S6Q integrity hardening
        run: node scripts/patch-s6q-final-integrity-anchors.mjs
      - name: Commit permanent hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            server/mlb-s6q-fifty-settlement-human-review.ts \
            server/mlb-s6q-fifty-settlement-human-review.test.ts
          if git diff --cached --quiet; then
            echo 'No final S6Q integrity changes required.'
            exit 0
          fi
          git commit -m 'Anchor S6Q artifacts and reconstruct evidence'
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
