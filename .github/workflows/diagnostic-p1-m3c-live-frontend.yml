name: Diagnostic P1-M3C Live Frontend

on:
  pull_request:
    branches:
      - integration/p0-frontend-session
    paths:
      - '.github/workflows/diagnostic-p1-m3c-live-frontend.yml'

permissions:
  contents: read

jobs:
  verify-live-p1-m3c:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FRONTEND_URL: https://prediccion-elite-p0-integration.up.railway.app
      BACKEND_URL: https://web-p0-integration.up.railway.app
      EXPECTED_FRONTEND_RELEASE: p1-m3c-mlb-scientific-emission-2026-08-05
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact P1-M3C frontend release and verify safety
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          for attempt in $(seq 1 100); do
            index_code=$(curl -sS -L -o audit/index.html -w '%{http_code}' --max-time 25 "${FRONTEND_URL}/" || true)
            health_code=$(curl -sS -o audit/backend-health.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/health" || true)
            ledger_code=$(curl -sS -o audit/ledger.json -w '%{http_code}' --max-time 25 "${BACKEND_URL}/api/mlb/ledger/v1/status" || true)
            capture_code=$(curl -sS -o audit/anonymous-capture.json -w '%{http_code}' --max-time 25 \
              -X POST -H 'Content-Type: application/json' --data '{}' \
              "${BACKEND_URL}/api/mlb/p1/v1/scientific-captures" || true)

            rm -f audit/bundle.js
            if [[ "${index_code}" == "200" ]]; then
              node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('audit/index.html', 'utf8');
          const sources = [...html.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map((match) => match[1]);
          fs.writeFileSync('audit/script-sources.txt', `${sources.join('\n')}\n`);
          NODE
              while IFS= read -r source || [[ -n "${source}" ]]; do
                [[ -n "${source}" ]] || continue
                if [[ "${source}" =~ ^https?:// ]]; then
                  asset_url="${source}"
                else
                  clean="${source#./}"
                  clean="${clean#/}"
                  asset_url="${FRONTEND_URL}/${clean}"
                fi
                curl -sS -L --max-time 30 "${asset_url}" >> audit/bundle.js || true
                printf '\n' >> audit/bundle.js
              done < audit/script-sources.txt
            fi

            release_ok=false
            markers_ok=false
            if [[ -s audit/bundle.js ]] && grep -Fq "${EXPECTED_FRONTEND_RELEASE}" audit/bundle.js; then
              release_ok=true
            fi
            if [[ -s audit/bundle.js ]] \
              && grep -Fq 'Registrando evaluación científica SHADOW' audit/bundle.js \
              && grep -Fq 'Evaluación científica RECHAZADA' audit/bundle.js \
              && grep -Fq 'IDEMPOTENTE' audit/bundle.js \
              && grep -Fq '/api/mlb/p1/v1/scientific-captures' audit/bundle.js \
              && grep -Fq 'SHADOW · exposición 0' audit/bundle.js; then
              markers_ok=true
            fi

            echo "Attempt ${attempt}/100: index=${index_code} health=${health_code} ledger=${ledger_code} anonymousCapture=${capture_code} release=${release_ok} markers=${markers_ok}"

            if [[ "${index_code}" == "200" && "${health_code}" == "200" && "${ledger_code}" == "200" && "${capture_code}" == "401" && "${release_ok}" == "true" && "${markers_ok}" == "true" ]]; then
              EXPECTED_FRONTEND_RELEASE="${EXPECTED_FRONTEND_RELEASE}" node <<'NODE'
          const fs = require('node:fs');
          const read = (name) => JSON.parse(fs.readFileSync(name, 'utf8'));
          const health = read('audit/backend-health.json');
          const ledger = read('audit/ledger.json');
          const capture = read('audit/anonymous-capture.json');
          const bundle = fs.readFileSync('audit/bundle.js', 'utf8');
          const assert = (condition, message) => { if (!condition) throw new Error(message); };

          assert(health.status === 'healthy', `backend health=${health.status}`);
          assert(ledger.success === true, 'ledger success=false');
          assert(ledger.data?.schemaVersion === 'mlb-ledger.v1', `ledger schema=${ledger.data?.schemaVersion}`);
          assert(ledger.data?.immutable === true, 'ledger immutable=false');
          assert(capture.success === false, 'anonymous capture unexpectedly succeeded');
          assert(/Authentication required/i.test(String(capture.error || '')), `capture error=${capture.error}`);
          for (const marker of [
            process.env.EXPECTED_FRONTEND_RELEASE,
            'Registrando evaluación científica SHADOW',
            'Evaluación científica RECHAZADA',
            'IDEMPOTENTE',
            '/api/mlb/p1/v1/scientific-captures',
            'SHADOW · exposición 0',
          ]) {
            assert(bundle.includes(marker), `missing bundle marker: ${marker}`);
          }

          const evidence = {
            frontendRelease: process.env.EXPECTED_FRONTEND_RELEASE,
            backendCommit: health.commit,
            environment: health.environment,
            endpoint: '/api/mlb/p1/v1/scientific-captures',
            visibleStates: ['CAPTURING', 'REGISTRADA', 'IDEMPOTENTE', 'RECHAZADA'],
            anonymousPostStatus: 401,
            anonymousWriteProtected: true,
            ledger: {
              schemaVersion: ledger.data.schemaVersion,
              immutable: ledger.data.immutable,
              predictions: ledger.data.predictions,
              settlementEvents: ledger.data.settlementEvents,
            },
            syntheticCapturesCreatedByDiagnostic: 0,
            canonicalPicksCreatedByDiagnostic: 0,
            betsPlaced: 0,
            realFinancialExposure: 0,
          };
          fs.writeFileSync('audit/result.json', JSON.stringify(evidence, null, 2));
          console.log(JSON.stringify(evidence, null, 2));
          NODE
              exit 0
            fi

            if [[ "${attempt}" == "100" ]]; then
              echo 'Timed out waiting for exact P1-M3C frontend deployment' >&2
              for file in index.html backend-health.json ledger.json anonymous-capture.json script-sources.txt; do
                echo "--- ${file}"
                cat "audit/${file}" 2>/dev/null || true
              done
              exit 1
            fi
            sleep 10
          done
      - name: Upload read-only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-m3c-live-frontend-evidence
          path: audit
          if-no-files-found: warn
