name: Validate ledger-backed MLB history

on:
  pull_request:
    branches:
      - integration/p0-staging-secure

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mlb-history-ledger-source
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Run MLB regression suite
        run: npm run test:mlb-ledger
      - name: Type-check backend
        run: npm run typecheck:mlb-ledger
      - name: Build backend
        run: npm run build:backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Type-check frontend
        working-directory: frontend
        run: npm run check
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify immutable history UI markers
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '/api/mlb/ledger/v1/history?limit=10000' frontend/client/src/pages/mlb-history.tsx
          grep -Fq 'Inmutable' frontend/client/src/pages/mlb-history.tsx
          grep -Fq 'Respaldo local' frontend/client/src/pages/mlb-history.tsx
          if grep -Fq 'DELETE_MLB_PICK' frontend/client/src/pages/mlb-history.tsx; then
            echo 'Ledger history must not expose delete controls'
            exit 1
          fi
          if grep -Fq 'UPDATE_MLB_PICK' frontend/client/src/pages/mlb-history.tsx; then
            echo 'Ledger history must not expose manual settlement controls'
            exit 1
          fi
