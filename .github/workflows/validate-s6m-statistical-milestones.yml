name: Validate S6M Statistical Milestones

on:
  pull_request:
    branches:
      - integration/p0-staging-secure
    paths:
      - 'server/mlb-s6m-statistical-milestones.ts'
      - 'server/mlb-s6m-statistical-milestones.test.ts'
      - 'server/s5b-staging-entry.ts'
      - 'server/route-contract.extensions.json'
      - 'tsconfig.s6m-statistical-milestones.json'
      - 'tsconfig.s5b-shadow.json'
      - 'package.json'
      - 'docs/S6M_PHASE5C2_STATISTICAL_MILESTONES.md'
      - '.github/workflows/validate-s6m-statistical-milestones.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-s6m:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies reproducibly
        run: npm ci
      - name: Run focused Phase 5C-2 tests
        run: npx tsx --test server/mlb-s6m-statistical-milestones.test.ts
      - name: Type-check Phase 5C-2 surface
        run: npx tsc -p tsconfig.s6m-statistical-milestones.json
      - name: Type-check complete shadow surface
        run: npx tsc -p tsconfig.s5b-shadow.json
      - name: Preserve modular route contract
        run: npm run test:s3-modularization
      - name: Build production backend bundle
        run: npm run build:backend
      - name: Verify milestone and safety boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'mlb-s6m-statistical-milestones.v1' server/mlb-s6m-statistical-milestones.ts
          grep -F 'MLB_S6M_MILESTONES = [1, 5, 20, 50]' server/mlb-s6m-statistical-milestones.ts
          grep -F 'S6L_INDEPENDENT_RECOMPUTATION_MISMATCH' server/mlb-s6m-statistical-milestones.ts
          grep -F 'certificatesAppendOnly: true' server/mlb-s6m-statistical-milestones.ts
          grep -F 'automaticModelChangesAllowed: false' server/mlb-s6m-statistical-milestones.ts
          grep -F 'realFinancialExposure: 0' server/mlb-s6m-statistical-milestones.ts
          grep -F 'automaticBetPlacement: false' server/mlb-s6m-statistical-milestones.ts
          grep -F 'historicalLedgerMutation: false' server/mlb-s6m-statistical-milestones.ts
          grep -F 'startMlbS6mStatisticalMilestoneWorker' server/s5b-staging-entry.ts
          grep -F '/health/s6m-statistical-milestones' server/s5b-staging-entry.ts
          grep -F '/api/mlb/ledger/v1/s6m-statistical-milestones/status' server/route-contract.extensions.json
          grep -F 'mlb-s6m-statistical-milestones.v1' dist/index.cjs
